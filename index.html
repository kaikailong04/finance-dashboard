    { id:'acc_cash', name:'Cash', type:'cash', institution:'', icon:'dollar', color:'#84cc16',
      order:5, hidden:false, archived:false, notes:'', linked:null, manualBalance:0, createdAt:now },
  ];
}

// Live balance for ANY account, resolved from whichever store actually owns
// the number. Linked accounts read the exact same field every other page
// already reads, so an account can never drift from a figure shown elsewhere.
function accountBalance(acct, ctx) {
  if (!acct) return 0;
  const { settings, goals, netWorth } = ctx;
  const acc = (netWorth && netWorth.accounts) || {};
  switch (acct.linked) {
    case 'checking':   return safeNum(acc.checking);
    case 'hysa':       return safeNum(goals.hysaBalance);
    case 'roth':       return currentRothBal(settings, goals);
    case '401k':       return round2(safeNum(goals.k401Employee) + safeNum(goals.k401Employer));
    case 'creditCard': return safeNum(acc.creditCard);
    default:           return safeNum(acct.manualBalance);
  }
}
function writeAccountBalance(acct, newBalance, ctx) {
  const { setGoals, setNetWorth, setAccounts } = ctx;
  const v = round2(newBalance);
  switch (acct.linked) {
    case 'checking':   setNetWorth(s => ({ ...s, accounts:{ ...s.accounts, checking:v } })); return;
    case 'hysa':       setGoals(g => ({ ...g, hysaBalance:v })); return;
    case 'roth':       setGoals(g => ({ ...g, rothIRAOverride:v })); return;
    case '401k':                                    // split proportionally so a
      setGoals(g => {                               // manual edit never zeroes
        const emp = safeNum(g.k401Employee), empr = safeNum(g.k401Employer), total = emp+empr;
        const empShare = total > 0 ? emp/total : 1;  // one side's contribution history
        return { ...g, k401Employee: round2(v*empShare), k401Employer: round2(v*(1-empShare)) };
      });
      return;
    case 'creditCard': setNetWorth(s => ({ ...s, accounts:{ ...s.accounts, creditCard:v } })); return;
    default:            setAccounts(list => list.map(a => a.id===acct.id ? { ...a, manualBalance:v } : a)); return;
  }
}
// `delta` is signed the way the ACCOUNT's own number moves — positive always
// means "this account's balance/amount-owed went up." Callers translate real-
// world direction (a purchase, a deposit, a transfer) into that sign once, in
// applyTransactionToAccounts, so this primitive never has to know which.
function adjustAccountBalance(acct, delta, ctx) {
  if (!acct || !delta) return;
  writeAccountBalance(acct, accountBalance(acct, ctx) + delta, ctx);
}

// The ONE place a transaction is allowed to move money between accounts.
// `sign` is +1 to apply (save) or -1 to reverse (delete/undo) — always the
// exact inverse, so nothing can leave a stray balance behind after a delete.
function applyTransactionToAccounts(tx, sign, ctx) {
  const byId = id => (ctx.accounts || []).find(a => a.id === id);
  const amt  = safeNum(tx.amount) * sign;
  if (!amt) return;
  if (tx.type === 'transfer') {
    // Transfers never count as spending — only balances move.
    const from = byId(tx.accountId), to = byId(tx.toAccountId);
    if (from) adjustAccountBalance(from, isLiabilityType(from.type) ?  amt : -amt, ctx);
    if (to)   adjustAccountBalance(to,   isLiabilityType(to.type)   ? -amt :  amt, ctx);
    return;
  }
  const acct = byId(tx.accountId);
  if (!acct) return;
  if (tx.type === 'expense') adjustAccountBalance(acct, isLiabilityType(acct.type) ?  amt : -amt, ctx);
  if (tx.type === 'income')  adjustAccountBalance(acct, isLiabilityType(acct.type) ? -amt :  amt, ctx);
}

// Category → reward bucket. Only categories with an obvious match get their
// own bucket — everything else (gas, shopping, travel, utilities…) falls to
// "Other" rather than being force-fit into "Entertainment"/"Streaming",
// which would misleadingly label things like a flight as entertainment.
function rewardBucketForCategory(category) {
  if (category === 'dining')    return 'dining';
  if (category === 'groceries') return 'groceries';
  return 'other';
}
// Falls back to the card's flat "other" rate. Configured value is a percent
// for cash back (rate 3 = 3% back) but a per-dollar multiplier for
// miles/points (rate 3 = 3 miles/points per $1) — matches how each program
// is actually advertised.
function rewardRateForCategory(card, category) {
  if (!card) return 0;
  return safeNum((card.rewards || {})[rewardBucketForCategory(category)]);
}
function rewardEarnAmount(card, amount, category) {
  const rate = rewardRateForCategory(card, category);
  if (!rate) return 0;
  return round2(safeNum(amount) * (card && card.rewardType !== 'cashback' ? rate : rate/100));
}
// Tracks lifetime + current-calendar-month cashback on the card itself, both
// as a flat total (existing UI) and broken out by category (Rewards Dashboard).
function applyCardRewards(acct, tx, sign, ctx) {
  if (!acct || acct.type !== 'credit' || tx.type !== 'expense') return;
  const bucket = rewardBucketForCategory(tx.category);
  const rate   = rewardRateForCategory(acct.card, tx.category);
  if (!rate) return;
  const earn = round2(rewardEarnAmount(acct.card, tx.amount, tx.category)) * sign;
  const monthKey = (tx.date || '').slice(0, 7);
  ctx.setAccounts(list => list.map(a => {
    if (a.id !== acct.id) return a;
    const card = a.card || defaultCardFields();
    const sameMonth  = card.cashbackMonthKey === monthKey;
    const monthBase  = sameMonth ? (card.rewardsEarnedMonth || zeroRewardBuckets()) : zeroRewardBuckets();
    const lifeBase   = card.rewardsEarnedLifetime || zeroRewardBuckets();
    const byMonth    = card.rewardsByMonth || {};
    return { ...a, card: { ...card,
      cashbackLifetime: round2(safeNum(card.cashbackLifetime) + earn),
      cashbackMonth:    round2((sameMonth ? safeNum(card.cashbackMonth) : 0) + earn),
      cashbackMonthKey: monthKey,
      rewardsEarnedMonth:    { ...monthBase, [bucket]: round2(safeNum(monthBase[bucket]) + earn) },
      rewardsEarnedLifetime: { ...lifeBase,  [bucket]: round2(safeNum(lifeBase[bucket]) + earn) },
      // Order-independent, keyed by the transaction's own month — unlike
      // cashbackMonth above, this stays correct even if a backdated
      // transaction is added after a more recent one.
      rewardsByMonth: { ...byMonth, [monthKey]: round2(safeNum(byMonth[monthKey]) + earn) },
    } };
  }));
}

// Build + save a new transaction, applying every downstream effect
// (account balance, net worth, budget, credit utilization, rewards, cash
// flow, recent transactions) in one atomic step — nothing above this layer
// is allowed to touch a balance directly.
function recordTransaction(partial, ctx) {
  const tx = { id: String(Date.now()) + Math.random().toString(36).slice(2,6), ...partial };
  // Stamp the Phase 1 classification at creation time so every new
  // transaction is born already correctly bucketed (expense vs. savings
  // vs. investment vs. credit-card purchase/payment vs. refund) — the
  // migration below only has to backfill rows that predate this.
  if (!tx.kind) tx.kind = FinCalc.classifyTransaction(tx, FinCalc.accountsById(ctx.accounts));
  applyTransactionToAccounts(tx, +1, ctx);
  const acct = (ctx.accounts || []).find(a => a.id === tx.accountId);
  applyCardRewards(acct, tx, +1, ctx);
  ctx.setTransactions(prev => [tx, ...prev]);
  // A light confirm tick — every save flow (Add Transaction, Mark Paid, Log
  // Now, Payment Center) funnels through here, so one haptic covers all of them.
  if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(8);
  return tx;
}
// Reverses every effect a recordTransaction call applied, then removes it.
function deleteAccountAwareTransaction(tx, ctx) {
  applyTransactionToAccounts(tx, -1, ctx);
  const acct = (ctx.accounts || []).find(a => a.id === tx.accountId);
  applyCardRewards(acct, tx, -1, ctx);
  ctx.setTransactions(prev => prev.filter(t => t.id !== tx.id));
}
// Undo for the above — re-applies the SAME transaction object (same id),
// rather than routing back through recordTransaction, which would mint a
// new id and orphan anything (splits, tags) that referenced the old one.
function restoreDeletedTransaction(tx, ctx) {
  applyTransactionToAccounts(tx, +1, ctx);
  const acct = (ctx.accounts || []).find(a => a.id === tx.accountId);
  applyCardRewards(acct, tx, +1, ctx);
  ctx.setTransactions(prev => [tx, ...prev]);
}

// ── Credit-card math (shared by Add Transaction's live snapshot and the
// Accounts detail dashboard) ────────────────────────────────────────────
function creditUtilization(balance, limit) { return limit > 0 ? (balance/limit)*100 : 0; }
function utilizationColor(pct) {
  if (pct <= 10) return '#00C805';
  if (pct <= 30) return '#F5A623';
  if (pct <= 50) return '#f97316';
  return '#FF5000';
}
// A card with nothing owed has no minimum payment — full stop. Before this
// guard, Math.max(minPaymentFlat, balance*pct) floored the result at the
// flat minimum (defaults to $35) even at balance=0, so a paid-off card
// still showed a "$35 due" bill every cycle with nothing to actually pay.
function minPaymentFor(card, balance) {
  if (!card || !(balance > 0)) return 0;
  return round2(Math.max(card.minPaymentFlat || 0, balance * ((card.minPaymentPct||0)/100)));
}
// Next calendar occurrence of a day-of-month (statement close / due date),
// rolling into next month once this month's has passed.
function nextOccurrenceOfDay(day, ref) {
  ref = ref || new Date();
  const clamped = Math.min(Math.max(day||1,1), 28);
  let d = new Date(ref.getFullYear(), ref.getMonth(), clamped);
  if (d < new Date(ref.getFullYear(), ref.getMonth(), ref.getDate())) d = new Date(ref.getFullYear(), ref.getMonth()+1, clamped);
  return d;
}
function fmtShortDate(d) { return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

// Transactions posted to a given account — matched by the new accountId
// when present, falling back to the legacy free-text `account` name so
// pre-redesign transactions still show up on the right account's page.
function transactionsForAccount(transactions, acct) {
  if (!acct) return [];
  return (transactions||[]).filter(t => t.accountId ? (t.accountId===acct.id || t.toAccountId===acct.id) : t.account===acct.name);
}

// ── Credit Card Dashboard (Priority 3) ──────────────────────────────────
// Most recent PAST (or today's) occurrence of a day-of-month — the mirror
// image of nextOccurrenceOfDay, used to find when the current billing
// cycle started.
function lastOccurrenceOfDay(day, ref) {
  ref = ref || new Date();
  const clamped = Math.min(Math.max(day||1,1), 28);
  let d = new Date(ref.getFullYear(), ref.getMonth(), clamped);
  if (d > new Date(ref.getFullYear(), ref.getMonth(), ref.getDate())) d = new Date(ref.getFullYear(), ref.getMonth()-1, clamped);
  return d;
}
// Payments made toward a card — any transfer whose destination is this account.
function paymentHistoryForCard(transactions, acct) {
  return (transactions||[])
    .filter(t => t.type === 'transfer' && t.toAccountId === acct.id)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
}
function hasPaidThisCycle(transactions, acct, card) {
  const since = lastOccurrenceOfDay(card.statementCloseDay);
  return paymentHistoryForCard(transactions, acct).some(t => txDateKey(t) >= ymd(since));
}
// Recommended payment to reach a target utilization percentage.
function suggestedEarlyPayment(balance, limit, targetPct) {
  const target = round2(limit * (targetPct/100));
  return round2(Math.max(balance - target, 0));
}
// Six-step visual timeline explaining how a purchase becomes a reported
// balance — the PRD's core "utilization mostly matters before you apply
// for new credit" education, made concrete with this card's real dates.
function statementTimelineSteps(card, balance, paidThisCycle) {
  const today = new Date();
  const nextClose = nextOccurrenceOfDay(card.statementCloseDay, today);
  const dueDate   = nextOccurrenceOfDay(card.dueDay, today);
  const daysToClose = Math.round((nextClose - today) / 86400000);
  const daysToDue    = Math.round((dueDate - today) / 86400000);
  return [
    { key:'purchases', label:'Purchases', status:'done', sub:'Ongoing',
      desc:'Every purchase adds to your current balance right away.' },
    { key:'current', label:'Current Balance', status:'done', sub:currency(balance,2),
      desc:`${currency(balance,2)} owed right now — what you'd pay to zero out the card today.` },
    { key:'close', label:'Statement Closes', status: daysToClose<=5?'active':'upcoming', sub:fmtShortDate(nextClose),
      desc:'Your balance on this date becomes the statement balance.' },
    { key:'reported', label:'Reported Balance', status: daysToClose<=5?'active':'upcoming', sub:'To the bureaus',
      desc:'Only the statement balance is typically reported — not your current balance or any early payment made before it closes.' },
    { key:'due', label:'Payment Due', status: paidThisCycle?'done':(daysToDue<=5?'active':'upcoming'), sub:fmtShortDate(dueDate),
      desc:'Pay at least the statement balance by this date to avoid interest.' },
    { key:'paid', label:'Paid', status: paidThisCycle?'done':'upcoming', sub: paidThisCycle?'Posted':'Not yet',
      desc:'Early payments reduce reported utilization but are optional — paying the statement balance by the due date is all that’s required to avoid interest.' },
  ];
}
// Never-shaming, plain-language reads of this card's numbers — the same
// shape of sentence the fuller AI Spending Coach (a later pass) will use
// app-wide.
function creditSmartInsights(acct, ctx) {
  const card = acct.card || defaultCardFields();
  const balance = accountBalance(acct, ctx);
  const util = creditUtilization(balance, card.creditLimit);
  const out = [];
  if (balance <= 0) {
    out.push('No balance carried — nothing to pay down.');
  } else if (util <= 10) {
    out.push(`You're already below 10% utilization (${util.toFixed(0)}%). No early payment needed.`);
  } else {
    const early = suggestedEarlyPayment(balance, card.creditLimit, 10);
    const close = nextOccurrenceOfDay(card.statementCloseDay);
    out.push(`You're at ${util.toFixed(0)}% utilization. If you're applying for new credit soon, paying ${currency(early)} before ${fmtShortDate(close)} would reduce utilization to 10%.`);
  }
  if (safeNum(card.cashbackMonth) > 0) out.push(`You've earned ${formatRewardAmount(card, card.cashbackMonth)} in rewards this month.`);
  out.push(card.autopay
    ? 'Autopay is on — your statement balance will be paid automatically by the due date.'
    : 'Autopay is off — turn it on, or set a reminder, so you never miss the due date.');
  return out;
}
// Computed, in-app alerts — this is a PWA with no push-notification backend,
// so these surface on the dashboard itself rather than as OS notifications.
function creditNotifications(acct, ctx, transactions) {
  const card = acct.card || defaultCardFields();
  const balance = accountBalance(acct, ctx);
  const today = new Date();
  const nextClose = nextOccurrenceOfDay(card.statementCloseDay, today);
  const dueDate   = nextOccurrenceOfDay(card.dueDay, today);
  const daysToClose = Math.round((nextClose - today) / 86400000);
  const daysToDue    = Math.round((dueDate - today) / 86400000);
  const util = creditUtilization(balance, card.creditLimit);
  const notes = [];
  if (daysToClose <= 5) notes.push({ icon:'archive', text:`Statement closes in ${daysToClose} day${daysToClose===1?'':'s'} (${fmtShortDate(nextClose)}).` });
  if (daysToDue <= 5)   notes.push({ icon:'lock', text:`Payment due in ${daysToDue} day${daysToDue===1?'':'s'} (${fmtShortDate(dueDate)}).` });
  if (util > 10)        notes.push({ icon:'trending', text:'A suggested early payment is available below to bring utilization under 10%.' });
  if (safeNum(card.cashbackMonth) > 0) notes.push({ icon:'dollar', text:`${formatRewardAmount(card, card.cashbackMonth)} in rewards earned this month.` });
  const lastPayment = paymentHistoryForCard(transactions, acct)[0];
  if (lastPayment) {
    // Calendar-day difference, not a raw ms/24h divide — comparing midnight
    // to midnight so a same-day payment always reads "today" regardless of
    // what time it is right now.
    const daysAgo = Math.round((parseLocalDate(ymd(today)) - parseLocalDate(txDateKey(lastPayment))) / 86400000);
    if (daysAgo <= 3) notes.push({ icon:'check', text:`Payment of ${currency(lastPayment.amount,2)} posted ${daysAgo<=0?'today':daysAgo+' day'+(daysAgo===1?'':'s')+' ago'}.` });
  }
  if (!notes.length) notes.push({ icon:'check', text:'Nothing needs your attention right now.' });
  return notes;
}

// ══════════════════════════════════════════════════════════════════════
// BILLS (Priority 4) — a bill is either something the user tracks by hand
// (rent, utilities, insurance, internet, phone, subscriptions) or, for
// every credit card account, synthesized automatically from that card's
// own due day and minimum payment. Nothing here is hardcoded per bill —
// new credit cards get a bill row the same way new accounts get a
// dashboard, with zero extra UI work.
// ══════════════════════════════════════════════════════════════════════
const BILL_CATEGORIES = [
  { id:'rent',         label:'Rent',          icon:'bank' },
  { id:'utilities',    label:'Utilities',     icon:'zap'  },
  { id:'insurance',    label:'Insurance',     icon:'shield' },
  { id:'internet',     label:'Internet',      icon:'wallet' },
  { id:'phone',        label:'Phone',         icon:'wallet' },
  { id:'subscription', label:'Subscription',  icon:'receipt' },
  { id:'creditCard',   label:'Credit Card',   icon:'creditCard' },
  { id:'other',        label:'Other',         icon:'dollar' },
];
const billCategoryInfo = id => BILL_CATEGORIES.find(c => c.id===id) || BILL_CATEGORIES[BILL_CATEGORIES.length-1];
// Bill category → spending category, used only when a bill is paid (the
// resulting transaction still has to land in a real CATEGORIES bucket so
// Budget/Spending/Calendar keep counting it correctly).
const BILL_SPEND_CATEGORY = { rent:'housing', utilities:'utilities', insurance:'other', internet:'utilities', phone:'utilities', subscription:'other', creditCard:'other', other:'other' };

function defaultBillFields() {
  return { id:'', name:'', category:'other', amount:0, recurring:true, dueDay:1, dueDate:'', accountId:null, autopay:false, notes:'', paidPeriods:[], paidDate:null, createdAt:Date.now() };
}
function currentPeriodKey(ref) { ref = ref || new Date(); return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}`; }
function billDueDateThisPeriod(bill, ref) {
  ref = ref || new Date();
  if (!bill.recurring) return bill.dueDate ? parseLocalDate(bill.dueDate) : ref;
  const day = Math.min(Math.max(bill.dueDay||1,1), 28);
  return new Date(ref.getFullYear(), ref.getMonth(), day);
}
// 'paid' | 'overdue' | 'upcoming' — computed fresh from today, never stored.
function billStatus(bill, today) {
  today = today || new Date();
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (!bill.recurring) {
    if (bill.paidDate) return 'paid';
    return parseLocalDate(bill.dueDate) < todayMidnight ? 'overdue' : 'upcoming';
  }
  if ((bill.paidPeriods||[]).includes(currentPeriodKey(today))) return 'paid';
  return billDueDateThisPeriod(bill, today) < todayMidnight ? 'overdue' : 'upcoming';
}
// Every credit card becomes a read-only bill row: due day + whatever is
// actually owed toward the minimum this cycle. Paying it routes through the
// same transfer flow as the Payment Center — never a plain expense, since a
// card payment moves money between accounts rather than consuming it.
function creditCardBills(accounts, ctx) {
  return (accounts||[])
    .filter(a => a.type === 'credit' && !a.archived)
    .map(a => {
      const card = a.card || defaultCardFields();
      const balance = accountBalance(a, ctx);
      return {
        id: 'cc_'+a.id, name: a.name, category:'creditCard', icon:a.icon, color:a.color,
        amount: minPaymentFor(card, balance), recurring:true, dueDay: card.dueDay,
        autopay: card.autopay, isCreditCardBill:true, accountRef:a,
        paid: hasPaidThisCycle(ctx.transactions, a, card),
      };
    })
    // Nothing owed → nothing due. A paid-off card doesn't get a bill row
    // at all this cycle, rather than a $0.00 one cluttering the list.
    .filter(cc => cc.amount > 0);
}
// Records a real expense (paid from the bill's linked account, or the
// default checking-like account) and stamps the bill as paid for this
// period — the one place "marking a bill paid" is allowed to happen.
function markBillPaid(bill, ctx) {
  const source = bill.accountId ? (ctx.accounts||[]).find(a=>a.id===bill.accountId) : defaultPaymentSourceAccount(ctx.accounts);
  if (source) {
    recordTransaction({
      date: ymd(new Date()), type:'expense', amount: round2(safeNum(bill.amount)),
      category: BILL_SPEND_CATEGORY[bill.category] || 'other',
      description: bill.name, merchant: bill.name, notes: `Bill payment · ${billCategoryInfo(bill.category).label}`,
      paymentMethod:'Bank Transfer', accountId: source.id, account: source.name,
    }, ctx);
  }
  ctx.setBills(list => list.map(b => b.id!==bill.id ? b : {
    ...b,
    paidPeriods: bill.recurring ? [...(b.paidPeriods||[]), currentPeriodKey()] : b.paidPeriods,
    paidDate: bill.recurring ? b.paidDate : ymd(new Date()),
  }));
}

// ══════════════════════════════════════════════════════════════════════
// RECURRING TRANSACTIONS (Priority 8) — templates for the money movements
// Bills doesn't cover: paychecks, Roth/HYSA contributions, subscription
// charges, or anything else that repeats on a schedule. A browser PWA has
// no reliable way to run code while it's closed (no background sync on
// iOS Safari), so nothing here silently posts a transaction on its own —
// a due template surfaces on the Dashboard and logs on one tap, the same
// trust model the existing paycheck flow already uses.
// ══════════════════════════════════════════════════════════════════════
const RECURRING_FREQUENCIES = [
  { id:'weekly',    label:'Weekly'     },
  { id:'biweekly',  label:'Every 2 weeks' },
  { id:'monthly',   label:'Monthly'    },
  { id:'yearly',    label:'Yearly'     },
];
function defaultRecurringFields() {
  return { id:'', name:'', type:'expense', amount:0, category:'other', accountId:null, toAccountId:null,
    frequency:'monthly', nextDate: ymd(new Date()), active:true, lastLoggedDate:null, notes:'' };
}
function advanceRecurringDate(dateStr, frequency) {
  const d = parseLocalDate(dateStr);
  if (frequency === 'weekly')   return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()+7));
  if (frequency === 'biweekly') return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate()+14));
  if (frequency === 'yearly')   return ymd(new Date(d.getFullYear()+1, d.getMonth(), d.getDate()));
  return ymd(new Date(d.getFullYear(), d.getMonth()+1, d.getDate()));                    // monthly
}
function recurringIsDue(r, today) {
  return !!r.active && parseLocalDate(r.nextDate) <= (today || new Date());
}
// Logs the transaction (expense/income/transfer, through the same engine as
// everything else) and rolls the template forward to its next occurrence —
// the one place a recurring template is allowed to touch a balance.
function logRecurringTransaction(r, ctx) {
  const nameOf = id => ((ctx.accounts||[]).find(a=>a.id===id) || {}).name || '';
  const partial = r.type === 'transfer' ? {
    date: ymd(new Date()), type:'transfer', amount: round2(safeNum(r.amount)), category:'transfer',
    description: r.name, merchant:'', notes: r.notes||'', paymentMethod:'Recurring',
    accountId: r.accountId, account: nameOf(r.accountId), toAccountId: r.toAccountId, toAccount: nameOf(r.toAccountId),
  } : {
    date: ymd(new Date()), type: r.type, amount: round2(safeNum(r.amount)),
    category: r.type==='income' ? 'income' : r.category,
    description: r.name, merchant: r.name, notes: r.notes||'', paymentMethod:'Recurring',
    accountId: r.accountId, account: nameOf(r.accountId),
  };
  recordTransaction(partial, ctx);
  ctx.setRecurring(list => list.map(x => x.id!==r.id ? x : {
    ...x, nextDate: advanceRecurringDate(x.nextDate, x.frequency), lastLoggedDate: ymd(new Date()),
  }));
}

// ══════════════════════════════════════════════════════════════════════
// CASH FLOW FORECAST (Priority 10) — projects three buckets forward from
// today: Checking, Credit Card (owed), and Savings (HYSA/savings). Built
// entirely from events the app already knows about — the existing
// paycheck schedule, upcoming Bills (including the auto-generated credit-
// card ones), and active Recurring Transaction templates — so nothing
// here is a second, independently-maintained prediction.
// ══════════════════════════════════════════════════════════════════════
function bucketForAccountId(accounts, id) {
  const a = (accounts||[]).find(x => x.id === id);
  if (!a) return null;
  if (a.type === 'checking') return 'checking';
  if (a.type === 'credit')   return 'credit';
  if (a.type === 'hysa' || a.type === 'savings') return 'savings';
  return null;   // cash/retirement/brokerage/etc. — outside this forecast's 3 buckets
}
function currentBucketBalances(accounts, ctx) {
  const sums = { checking:0, credit:0, savings:0 };
  for (const a of (accounts||[]).filter(a => !a.archived)) {
    const b = bucketForAccountId(accounts, a.id);
    if (b) sums[b] = round2(sums[b] + accountBalance(a, ctx));
  }
  return sums;
}
// Every known future money movement between today and `days` from now,
// each already resolved to a {date, bucket, delta} the projector can just
// sum. `delta` is signed the way the bucket's OWN balance moves (credit
// bucket rising = more owed), matching adjustToAccountBalance's convention.
function buildForecastEvents({ settings, accounts, bills, recurring, transactions, goals, netWorth }, days) {
  const today = new Date(); today.setHours(0,0,0,0);
  const endDate = new Date(today); endDate.setDate(endDate.getDate() + days);
  const events = [];

  // Paychecks — always credited to the Checking bucket.
  let probeMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  for (let m = 0; m < Math.ceil(days/28) + 1; m++) {
    for (const d of paycheckDatesForMonth(probeMonth.getFullYear(), probeMonth.getMonth()))
      if (d >= today && d <= endDate) events.push({ date:d, bucket:'checking', delta:netPerCheck(settings), label:'Paycheck' });
    probeMonth = new Date(probeMonth.getFullYear(), probeMonth.getMonth()+1, 1);
  }

  // Every credit card's own due-day min payment — a transfer out of
  // Checking and down against Credit, same as an actual card payment.
  const billCtx = { accounts, settings, goals, netWorth, transactions };
  for (const cc of creditCardBills(accounts, billCtx)) {
    let probe = nextOccurrenceOfDay(cc.dueDay, today);
    while (probe <= endDate) {
      events.push({ date:new Date(probe), bucket:'checking', delta:-cc.amount, label:`${cc.name} payment` });
      events.push({ date:new Date(probe), bucket:'credit',   delta:-cc.amount, label:`${cc.name} payment` });
      probe = new Date(probe.getFullYear(), probe.getMonth()+1, probe.getDate());
    }
  }

  // User-defined bills.
  for (const b of (bills||[])) {
    const bucket = bucketForAccountId(accounts, b.accountId) || 'checking';
    if (!b.recurring) {
      if (!b.dueDate || b.paidDate) continue;
      const d = parseLocalDate(b.dueDate);
      if (d >= today && d <= endDate) events.push({ date:d, bucket, delta:-safeNum(b.amount), label:b.name });
      continue;
    }
    let probe = nextOccurrenceOfDay(b.dueDay, today);
    while (probe <= endDate) {
      events.push({ date:new Date(probe), bucket, delta:-safeNum(b.amount), label:b.name });
      probe = new Date(probe.getFullYear(), probe.getMonth()+1, probe.getDate());
    }
  }

  // Recurring transaction templates — project every occurrence in-window,
  // not just the next one, so a weekly template shows up multiple times.
  for (const r of (recurring||[])) {
    if (!r.active) continue;
    let d = parseLocalDate(r.nextDate), guard = 0;
    while (d <= endDate && guard < 40) {
      guard++;
      if (d >= today) {
        if (r.type === 'transfer') {
          const fromB = bucketForAccountId(accounts, r.accountId), toB = bucketForAccountId(accounts, r.toAccountId);
          if (fromB) events.push({ date:new Date(d), bucket:fromB, delta:-safeNum(r.amount), label:r.name });
          if (toB)   events.push({ date:new Date(d), bucket:toB,   delta: safeNum(r.amount), label:r.name });
        } else {
          const b = bucketForAccountId(accounts, r.accountId);
          if (b) events.push({ date:new Date(d), bucket:b, delta: r.type==='income' ? safeNum(r.amount) : -safeNum(r.amount), label:r.name });
        }
      }
      d = parseLocalDate(advanceRecurringDate(ymd(d), r.frequency));
    }
  }

  // User-entered future transactions — a manually-logged transaction dated
  // ahead of today (the app never restricts the date picker to today or
  // earlier) should show up in the forecast too, not just recurring
  // templates and bills. Strictly AFTER today, not >=, since today's own
  // starting balance already reflects anything dated today or earlier.
  for (const t of (transactions||[])) {
    const d = parseLocalDate(txDateKey(t));
    if (!(d > today && d <= endDate)) continue;
    if (t.type === 'transfer') {
      const fromB = bucketForAccountId(accounts, t.accountId), toB = bucketForAccountId(accounts, t.toAccountId);
      if (fromB) events.push({ date:d, bucket:fromB, delta:-safeNum(t.amount), label:t.description||'Transfer' });
      if (toB)   events.push({ date:d, bucket:toB,   delta: safeNum(t.amount), label:t.description||'Transfer' });
    } else {
      const b = bucketForAccountId(accounts, t.accountId);
      if (!b) continue;
      events.push({ date:d, bucket:b, delta: t.type==='income' ? safeNum(t.amount) : -safeNum(t.amount), label:t.description||(t.type==='income'?'Income':'Expense') });
    }
  }

  return events.sort((a,b) => a.date - b.date);
}
// Walks day-by-day from today, applying that day's events to a running
// balance per bucket — a simple, auditable simulation (every point on the
// chart traces back to a specific dated event, visible in its tooltip).
function projectBalances(events, startBalances, days) {
  const today = new Date(); today.setHours(0,0,0,0);
  const byDate = {};
  for (const e of events) { const k = ymd(e.date); (byDate[k] ||= []).push(e); }
  const labels = [], checking = [], credit = [], savings = [];
  const bal = { ...startBalances };
  for (let i = 0; i <= days; i++) {
    const d = new Date(today); d.setDate(d.getDate()+i);
    const k = ymd(d);
    for (const e of (byDate[k]||[])) bal[e.bucket] = round2((bal[e.bucket]||0) + e.delta);
    labels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    checking.push(bal.checking); credit.push(bal.credit); savings.push(bal.savings);
  }
  return { labels, checking, credit, savings };
}

// ── Chart palette ─────────────────────────────────────────────────────
// Validated for this app's dark surface (#0d0d0d): lightness band, chroma
// floor, adjacent-pair CVD separation, normal-vision floor and 3:1 contrast
// all pass. Slot ORDER is the CVD-safety mechanism — do not reorder, and do
// not generate a 9th hue. Colour is bound to category IDENTITY below, never
// to rank, so filtering never repaints the survivors.
const VIZ_SERIES = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const VIZ_OTHER  = '#6b7280';   // neutral — "Other"/uncategorized, never a series hue
const VIZ_STATUS = { under:'#0ca30c', near:'#fab219', over:'#d03b3b' };
const STATUS_LABEL = { under:'Under budget', near:'Near budget', over:'Over budget' };
const STATUS_MARK  = { under:'✓', near:'!', over:'▲' };   // never colour alone
// CATEGORIES is declared further down the file, so this must resolve lazily —
// reading it at module scope here would hit the temporal dead zone.
let _catOrder = null;
const catOrder = () => (_catOrder ||= CATEGORIES.map(c => c.id));
function vizColor(catId) {
  if (catId === 'other' || catId === 'uncategorized' || catId === '__other__') return VIZ_OTHER;
  const i = catOrder().indexOf(catId);
  return i >= 0 ? VIZ_SERIES[i % VIZ_SERIES.length] : VIZ_OTHER;
}
const catLabel = id => (CATEGORIES.find(c => c.id === id) || {}).label
  || (id === 'uncategorized' ? 'Uncategorized' : id ? id.charAt(0).toUpperCase()+id.slice(1) : 'Uncategorized');

function Bar({ value, max, color='var(--blue)', lg=false, label }) {
  const p = max ? Math.min((value/max)*100, 100) : 0;
  return (
    <div className={'track'+(lg?' track-lg':'')} role="progressbar"
      aria-label={label} aria-valuenow={round2(safeNum(value))} aria-valuemin={0} aria-valuemax={safeNum(max)}>
      <div className="fill" style={{width:`${p}%`,background:color}} />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// ANIMATION PRIMITIVES (Priority 13) — reused across the app rather than
// hand-rolled per screen. All three respect prefers-reduced-motion.
// ══════════════════════════════════════════════════════════════════════
const prefersReducedMotion = () => typeof window !== 'undefined' && window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Eases a displayed number from its previous value to `value` — used on the
// handful of hero figures (Dashboard take-home, Net Worth, account
// balances) where a jump actually means something just changed.
function CountUp({ value, duration=600, format }) {
  const numeric = safeNum(value);
  const [display, setDisplay] = useState(numeric);
  const prevRef = useRef(numeric);
  const rafRef  = useRef(null);
  useEffect(() => {
    const from = prevRef.current, to = numeric;
    if (from === to || prefersReducedMotion()) { setDisplay(to); prevRef.current = to; return; }
    const start = performance.now();
    cancelAnimationFrame(rafRef.current);
    const step = now => {
      const t = Math.min((now-start)/duration, 1);
      const eased = 1 - Math.pow(1-t, 3);            // ease-out cubic
      setDisplay(from + (to-from)*eased);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
      else prevRef.current = to;
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [numeric, duration]);
  return format ? format(display) : Math.round(display);
}

// Smooth-height expand/collapse — a CSS grid-rows animation, so it never
// needs to measure the content's pixel height in JS.
function Collapse({ open, children }) {
  return (
    <div style={{ display:'grid', gridTemplateRows: open ? '1fr' : '0fr',
      transition: prefersReducedMotion() ? 'none' : 'grid-template-rows .25s cubic-bezier(.4,0,.2,1)' }}>
      <div style={{ overflow:'hidden', minHeight:0 }}>{children}</div>
    </div>
  );
}

// Swipe-left-to-reveal-delete, iOS Mail style — reveals a red action rather
// than deleting on release, so a swipe is never itself the destructive act.
function SwipeableRow({ onDelete, deleteLabel='Delete', children }) {
  const [dragX, setDragX]       = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX   = useRef(null);
  const baseX    = useRef(0);
  const onDown = e => { startX.current = e.clientX; baseX.current = dragX; setDragging(true); };
  const onMove = e => {
    if (startX.current == null) return;
    const dx = Math.min(0, Math.max(baseX.current + (e.clientX - startX.current), -84));
    setDragX(dx);
  };
  const endDrag = () => {
    if (startX.current == null) return;
    startX.current = null; setDragging(false);
    setDragX(dragX < -40 ? -84 : 0);
  };
  return (
    <div style={{ position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', right:0, top:0, bottom:0, width:84, display:'flex' }}>
        <button className="swipe-del" onClick={onDelete} aria-label={deleteLabel}>
          <Icon name="trash" size={16} color="#fff"/>
        </button>
      </div>
      <div
        onPointerDown={onDown} onPointerMove={dragging?onMove:undefined} onPointerUp={endDrag} onPointerLeave={dragging?endDrag:undefined}
        style={{ transform:`translateX(${dragX}px)`, transition: dragging ? 'none' : 'transform .2s cubic-bezier(.4,0,.2,1)',
          background:'var(--s1)', touchAction:'pan-y', position:'relative' }}>
        {children}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// CHART PRIMITIVES — plain SVG, matching the app's existing hand-rolled
// charts. Deliberately no chart library: the app already renders SVG this
// way and adding one would be a second, redundant dependency.
// Shared rules: 2px strokes, 4px rounded data-ends anchored to the baseline,
// recessive grid, values in text tokens (never the series colour), a legend
// whenever there are 2+ series, and a table fallback for screen readers.
// ══════════════════════════════════════════════════════════════════════
const money0 = n => currency(safeNum(n));
const money2 = n => currency(safeNum(n), 2);

function VizEmpty({ message, hint }) {
  return (
    <div className="viz-empty" role="status">
      <Icon name="chart" size={22} color="var(--t3)" strokeWidth={1.5}/>
      <div className="viz-empty-msg">{message}</div>
      {hint && <div className="viz-empty-hint">{hint}</div>}
    </div>
  );
}

function VizLegend({ items, onSelect }) {
  if (!items || items.length < 2) return null;   // one series needs no legend
  return (
    <div className="viz-legend">
      {items.map(it => (
        <button key={it.key} type="button" className="viz-legend-item"
          onClick={onSelect ? () => onSelect(it.key) : undefined}
          disabled={!onSelect}
          aria-label={`${it.label}${it.value != null ? ', '+money2(it.value) : ''}`}>
          <span className="viz-swatch" style={{background:it.color}} aria-hidden="true"/>
          <span className="viz-legend-label">{it.label}</span>
          {it.value != null && <span className="viz-legend-val">{money0(it.value)}</span>}
        </button>
      ))}
    </div>
  );
}

// Screen-reader / no-colour fallback for any chart.
function VizTable({ caption, cols, rows }) {
  if (!rows || !rows.length) return null;
  return (
    <details className="viz-table">
      <summary>View as table</summary>
      <table>
        <caption className="sr-only">{caption}</caption>
        <thead><tr>{cols.map(c => <th key={c} scope="col">{c}</th>)}</tr></thead>
        <tbody>{rows.map((r,i) => <tr key={i}>{r.map((c,j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </details>
  );
}

// ── Line trend chart (spending over time, net worth over time) ────────
// Multi-series with a shared crosshair. One y-axis only — never a second
// scale, even when series differ in magnitude.
function LineTrendChart({ series, labels, height=190, formatY=money0, emptyMsg }) {
  const [hover, setHover] = useState(null);
  const svgRef = React.useRef(null);
  const live = (series || []).filter(s => s.points && s.points.length);
  const n = labels ? labels.length : 0;
  if (!live.length || n < 2) {
    return <VizEmpty message={emptyMsg || 'Not enough data to chart yet.'} hint="At least two months of activity are needed." />;
  }
  const W = 720, H = height, PL = 52, PR = 14, PT = 14, PB = 26;
  const all = live.flatMap(s => s.points.map(p => safeNum(p)));
  const rawMax = Math.max(...all, 0), rawMin = Math.min(...all, 0);
  const max = rawMax === rawMin ? rawMax + 1 : rawMax;
  const min = Math.min(rawMin, 0);
  const x = i => PL + (i / (n - 1)) * (W - PL - PR);
  const y = v => H - PB - ((safeNum(v) - min) / (max - min)) * (H - PT - PB);
  const ticks = 4;
  const tickVals = [...Array(ticks+1)].map((_,i) => min + ((max-min)/ticks)*i);

  const move = e => {
    const r = svgRef.current.getBoundingClientRect();
    const cx = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
    let idx = Math.round(((cx - PL) / (W - PL - PR)) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    setHover(isFinite(idx) ? idx : null);
  };

  return (
    <div className="viz-wrap">
      <div className="viz-svg-box">
        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"
          className="viz-svg" role="img"
          aria-label={`Line chart: ${live.map(s=>s.label).join(', ')}`}
          onMouseMove={move} onMouseLeave={()=>setHover(null)}
          onTouchStart={move} onTouchMove={move} onTouchEnd={()=>setHover(null)}>
          {tickVals.map((v,i) => (
            <g key={i}>
              <line x1={PL} x2={W-PR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1"/>
              <text x={PL-8} y={y(v)+4} textAnchor="end" className="viz-axis-txt">{formatY(v)}</text>
            </g>
          ))}
          {labels.map((l,i) => (
            (n <= 8 || i % Math.ceil(n/6) === 0) &&
              <text key={i} x={x(i)} y={H-8} textAnchor="middle" className="viz-axis-txt">{l}</text>
          ))}
          {hover != null && <line x1={x(hover)} x2={x(hover)} y1={PT} y2={H-PB} stroke="var(--border2)" strokeWidth="1"/>}
          {live.map(s => (
            <polyline key={s.key} fill="none" stroke={s.color} strokeWidth="2"
              strokeLinejoin="round" strokeLinecap="round"
              points={s.points.map((p,i) => `${x(i)},${y(p)}`).join(' ')}/>
          ))}
          {hover != null && live.map(s => (
            <circle key={s.key} cx={x(hover)} cy={y(s.points[hover])} r="4.5"
              fill={s.color} stroke="var(--s1)" strokeWidth="2"/>
          ))}
        </svg>
        {hover != null && (
          <div className="viz-tip" style={{left:`${(x(hover)/W)*100}%`}}>
            <div className="viz-tip-hd">{labels[hover]}</div>
            {live.map(s => (
              <div key={s.key} className="viz-tip-row">
                <span className="viz-swatch" style={{background:s.color}} aria-hidden="true"/>
                <span className="viz-tip-lbl">{s.label}</span>
                <span className="viz-tip-val">{money2(s.points[hover])}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <VizLegend items={live.map(s => ({ key:s.key, label:s.label, color:s.color }))}/>
      <VizTable caption="Chart data" cols={['Period', ...live.map(s=>s.label)]}
        rows={labels.map((l,i) => [l, ...live.map(s => money2(s.points[i]))])}/>
    </div>
  );
}

// ── Ranked horizontal bars ────────────────────────────────────────────
// Used for Top Merchants, Budget vs Actual, and as the automatic fallback
// when a donut would have too many slices to read.
function RankedBars({ rows, formatVal=money0, onSelect, showCompare=false, emptyMsg }) {
  if (!rows || !rows.length) return <VizEmpty message={emptyMsg || 'Nothing to show for this period.'} />;
  const max = Math.max(...rows.map(r => Math.max(safeNum(r.value), safeNum(r.compare))), 1);
  return (
    <div className="viz-wrap">
      <div className="viz-bars">
        {rows.map(r => {
          const w  = Math.max(safePct(safeNum(r.value), max), r.value > 0 ? 1.5 : 0);
          const cw = showCompare ? Math.max(safePct(safeNum(r.compare), max), r.compare > 0 ? 1.5 : 0) : 0;
          const Tag = onSelect ? 'button' : 'div';
          return (
            <Tag key={r.key} className={'viz-bar-row'+(onSelect?' viz-bar-click':'')}
              onClick={onSelect ? () => onSelect(r.key) : undefined}
              type={onSelect ? 'button' : undefined}
              aria-label={`${r.label}: ${formatVal(r.value)}${showCompare?`, budget ${formatVal(r.compare)}`:''}${r.statusLabel?`, ${r.statusLabel}`:''}`}>
              <div className="viz-bar-head">
                <span className="viz-bar-lbl">
                  {r.label}
                  {r.statusLabel && (
                    <span className="viz-status" style={{color:r.color}}>
                      <span aria-hidden="true">{r.statusMark}</span> {r.statusLabel}
                    </span>
                  )}
                </span>
                <span className="viz-bar-val">
                  {formatVal(r.value)}
                  {showCompare && <span className="viz-bar-sub"> / {formatVal(r.compare)}</span>}
                </span>
              </div>
              {showCompare && (
                <div className="viz-track viz-track-ghost" title={`Budget ${formatVal(r.compare)}`}>
                  <div className="viz-fill-ghost" style={{width:`${cw}%`}}/>
                </div>
              )}
              <div className="viz-track">
                <div className="viz-fill" style={{width:`${w}%`, background:r.color}}/>
              </div>
              {r.sub && <div className="viz-bar-meta">{r.sub}</div>}
            </Tag>
          );
        })}
      </div>
      <VizTable caption="Ranked data"
        cols={showCompare ? ['Item','Actual','Budget','Status'] : ['Item','Value','Detail']}
        rows={rows.map(r => showCompare
          ? [r.label, formatVal(r.value), formatVal(r.compare), r.statusLabel||'—']
          : [r.label, formatVal(r.value), r.sub||'—'])}/>
    </div>
  );
}

// ── Donut ─────────────────────────────────────────────────────────────
// Caps at MAX_SLICES; anything beyond folds into a neutral "Other" so no
// 9th generated hue is ever needed. The caller switches to RankedBars when
// even the capped donut would be unreadable.
const MAX_SLICES = 7;
function DonutChart({ rows, total, onSelect, emptyMsg }) {
  const [active, setActive] = useState(null);
  if (!rows || !rows.length || !(total > 0)) {
    return <VizEmpty message={emptyMsg || 'No spending recorded for this period.'} />;
  }
  const sorted = [...rows].sort((a,b) => b.value - a.value);
  let slices = sorted;
  if (sorted.length > MAX_SLICES) {
    const head = sorted.slice(0, MAX_SLICES - 1);
    const tail = sorted.slice(MAX_SLICES - 1);
    slices = [...head, {
      key:'__other__', label:`Other (${tail.length})`,
      value: round2(tail.reduce((s,r)=>s+r.value,0)), color: VIZ_OTHER,
    }];
  }
  const R = 78, SW = 26, C = 100, circ = 2*Math.PI*R;
  let acc = 0;
  const arcs = slices.map(s => {
    const frac = safePct(s.value, total)/100;
    const seg = { ...s, frac, offset: acc };
    acc += frac;
    return seg;
  });
  const shown = active != null ? arcs.find(a=>a.key===active) : null;
  return (
    <div className="viz-wrap">
      <div className="viz-donut-box">
        <svg viewBox="0 0 200 200" className="viz-donut" role="img"
          aria-label={`Donut chart of spending by category, total ${money2(total)}`}>
          <circle cx={C} cy={C} r={R} fill="none" stroke="var(--s3)" strokeWidth={SW}/>
          {arcs.map(a => (
            <circle key={a.key} cx={C} cy={C} r={R} fill="none"
              stroke={a.color} strokeWidth={active===a.key?SW+4:SW}
              strokeDasharray={`${Math.max(a.frac*circ - 2, 0)} ${circ}`}
              strokeDashoffset={-a.offset*circ}
              transform={`rotate(-90 ${C} ${C})`}
              style={{cursor:onSelect?'pointer':'default', transition:'stroke-width .12s'}}
              tabIndex={0} role="button"
              aria-label={`${a.label}: ${money2(a.value)}, ${safePct(a.value,total).toFixed(1)} percent`}
              onMouseEnter={()=>setActive(a.key)} onMouseLeave={()=>setActive(null)}
              onFocus={()=>setActive(a.key)} onBlur={()=>setActive(null)}
              onClick={onSelect&&a.key!=='__other__'?()=>onSelect(a.key):undefined}
              onKeyDown={e=>{if((e.key==='Enter'||e.key===' ')&&onSelect&&a.key!=='__other__'){e.preventDefault();onSelect(a.key);}}}/>
          ))}
          <text x={C} y={C-6} textAnchor="middle" className="viz-donut-lbl">
            {shown ? shown.label : 'Total'}
          </text>
          <text x={C} y={C+18} textAnchor="middle" className="viz-donut-val">
            {money0(shown ? shown.value : total)}
          </text>
          {shown && (
            <text x={C} y={C+34} textAnchor="middle" className="viz-donut-pct">
              {safePct(shown.value,total).toFixed(1)}%
            </text>
          )}
        </svg>
      </div>
      <VizLegend items={arcs.map(a => ({ key:a.key, label:a.label, color:a.color, value:a.value }))}
        onSelect={onSelect ? k => k!=='__other__' && onSelect(k) : undefined}/>
      <VizTable caption="Spending by category" cols={['Category','Amount','Share']}
        rows={arcs.map(a => [a.label, money2(a.value), safePct(a.value,total).toFixed(1)+'%'])}/>
    </div>
  );
}

// ── Projected Net Worth Chart ─────────────────────────────────────
function ProjectedChart({ settings }) {
  // Build month-by-month projection from start date through 12 months
  const start = parseLocalDate(settings.startDate);

  const points = [];

  // Point 0 = one month before start (e.g. June 2026 when start = July 2026)
  const d0 = new Date(start.getFullYear(), start.getMonth() - 1, 1);
  points.push({ date: d0, nw: 0 });

  let hysa = 0, roth = 0, k401Emp = 0, k401Empr = 0, checking = 0;
  // Employer allowance consumed per calendar year; resets automatically at Jan 1.
  const matchByYear = {};

  for (let i = 1; i <= 12; i++) {
    const eb = settings.earlyBudget;
    const lb = settings.laterBudget;
    const d  = new Date(start.getFullYear(), start.getMonth() + i - 1, 1);
    // Rent alternates in 2026; every 2027 month is a rent month.
    const isEarly = d.getFullYear() <= 2026 && ((i - 1) % 2 === 1);   // rent-free (Aug, Oct, …)
    const b = isEarly ? eb : lb;

    hysa    += b.hysa    || 0;
    roth    += b.rothIRA || 0;
    // 401(k) is withheld BEFORE the net paycheck lands, so it never adds to
    // checking — not even in months before contributions start. The employer
    // match grows retirement only and is likewise never spendable cash.
    const k = project401kMonth(settings, d, matchByYear);
    k401Emp  = round2(k401Emp  + k.employee);
    k401Empr = round2(k401Empr + k.employer);

    // Surplus = take-home minus all budget line items (HYSA & Roth already included in total)
    const totalBudget = isEarly
      ? (eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)
        +(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0)
      : (lb.rentAndFee||0)+(lb.utilities||0)+(lb.rentersInsurance||0)+(lb.rothIRA||0)+(lb.hysa||0)
        +(lb.groceries||0)+(lb.gas||0)+(lb.funTravel||0)+(lb.outToEat||0)+(lb.shopping||0);
    const surplus = Math.max(monthlyNetIncome(settings) - totalBudget, 0);
    checking += surplus;

    points.push({ date: d, nw: hysa + roth + k401Emp + k401Empr + checking });
  }

  // ── SVG layout ────────────────────────────────────────────────────
  const VW = 580, VH = 185, PL = 58, PR = 14, PT = 8, PB = 30;
  const IW = VW - PL - PR, IH = VH - PT - PB;

  const maxNW   = points[points.length - 1].nw || 1;
  const yMax    = Math.ceil(maxNW / 5000) * 5000;
  const toX     = i  => PL + (i / (points.length - 1)) * IW;
  const toY     = v  => PT + IH - (v / yMax) * IH;

  const coords  = points.map((p, i) => [toX(i), toY(p.nw)]);
  const linePts = coords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L ');
  const linePath = 'M ' + linePts;
  const areaPath = linePath
    + ` L ${coords[coords.length-1][0].toFixed(1)},${(PT+IH).toFixed(1)}`
    + ` L ${PL},${(PT+IH).toFixed(1)} Z`;

  // Y-axis: 4 ticks from 0 to yMax
  const yTicks = [0, yMax/4, yMax/2, (yMax*3)/4, yMax];
  const fmtY = v => {
    if (v === 0) return '$0';
    return `$${(v/1000).toFixed(0)}k`;
  };

  // X-axis: label every other point to avoid crowding
  const fmtX = d => d.toLocaleDateString('en-US', { month:'short' }) + " '" + String(d.getFullYear()).slice(2);

  const [fx, fy] = coords[coords.length - 1];
  const finalNW  = points[points.length - 1].nw;

  return (
    <div className="card-flush" style={{padding:'16px 0 8px'}}>
      {/* Title */}
      <div style={{padding:'0 20px 10px'}}>
        <div style={{fontSize:'.88rem',fontWeight:700,color:'var(--t1)',letterSpacing:'-.02em'}}>
          Projected Net Worth
        </div>
        <div style={{fontSize:'.65rem',color:'var(--t3)',marginTop:3}}>
          Base salary only · commission not included
        </div>
      </div>

      {/* SVG chart */}
      <svg width="100%" viewBox={`0 0 ${VW} ${VH}`} style={{display:'block',overflow:'visible'}}>
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style={{stopColor:'var(--accent)'}} stopOpacity="0.18"/>
            <stop offset="100%" style={{stopColor:'var(--accent)'}} stopOpacity="0"/>
          </linearGradient>
        </defs>

        {/* Horizontal grid lines */}
        {yTicks.map((v, i) => (
          <line key={i}
            x1={PL} y1={toY(v)} x2={VW - PR} y2={toY(v)}
            style={{stroke:'var(--wash-2)'}} strokeWidth="1"
            strokeDasharray={v === 0 ? 'none' : '3,6'}/>
        ))}

        {/* Y-axis labels */}
        {yTicks.map((v, i) => (
          <text key={i} x={PL - 6} y={toY(v) + 4} textAnchor="end"
            style={{fill:'var(--t3)'}} fontSize="13" fontFamily="Inter,system-ui,sans-serif">
            {fmtY(v)}
          </text>
        ))}

        {/* Area fill */}
        <path d={areaPath} fill="url(#pg)"/>

        {/* Line */}
        <path d={linePath} fill="none" style={{stroke:'var(--accent)'}} strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round"/>

        {/* X-axis month labels */}
        {points.map((p, i) => {
          if (i % 2 !== 0) return null;
          const x = toX(i);
          const anchor = i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle';
          return (
            <text key={i} x={x} y={VH - 4} textAnchor={anchor}
              style={{fill:'var(--t3)'}} fontSize="13" fontFamily="Inter,system-ui,sans-serif">
              {fmtX(p.date)}
            </text>
          );
        })}

        {/* Dots at each data point */}
        {coords.map(([x, y], i) => (
          <circle key={i} cx={x} cy={y} r="2.5" style={{fill:'var(--accent)'}} opacity={i === 0 ? 0.4 : 0.7}/>
        ))}

        {/* Final dot + glow */}
        <circle cx={fx} cy={fy} r="4.5" style={{fill:'var(--accent)'}}/>
        <circle cx={fx} cy={fy} r="9"   style={{fill:'var(--accent)'}} opacity="0.15"/>

        {/* Final value label — above the last dot */}
        <text x={fx} y={fy - 12} textAnchor="end"
          style={{fill:'var(--accent)'}} fontSize="14" fontWeight="700" fontFamily="Inter,system-ui,sans-serif">
          {currency(finalNW)}
        </text>
      </svg>

      {/* Disclaimer */}
      <div style={{padding:'6px 20px 4px',fontSize:'.6rem',color:'var(--t4)',textAlign:'center'}}>
        Projection assumes base salary only. Commission is tracked separately.
      </div>
    </div>
  );
}
