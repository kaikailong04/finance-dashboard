// ── Dashboard ─────────────────────────────────────────────────────────
function Dashboard({ settings, transactions, goals, commissions, setGoals, setTransactions }) {
  const phase = getPhaseInfo(settings.startDate);
  const now   = new Date();

  const budget     = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const eb         = settings.earlyBudget;
  const netMonthly = monthlyNetIncome(settings);   // 2 × net paycheck
  // Savings rate = HYSA + Roth IRA out of take-home. The 401(k) is already
  // deducted before the paycheck lands, so it is NOT subtracted again here.
  const monthlyContrib = (budget.hysa||0) + (budget.rothIRA||0);
  const savingsRate    = netMonthly > 0 ? (monthlyContrib / netMonthly) * 100 : 0;

  const totalBudgeted = phase.isEarly || phase.isPreEmployment
    ? (eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0)
    : (budget.rentAndFee||0)+(budget.utilities||0)+(budget.rentersInsurance||0)+(budget.rothIRA||0)+(budget.hysa||0)+(budget.groceries||0)+(budget.gas||0)+(budget.funTravel||0)+(budget.outToEat||0)+(budget.shopping||0);
  const surplus = netMonthly - totalBudgeted;

  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthTx  = transactions.filter(t=>t.date.startsWith(monthStr)&&t.type==='expense');
  const totalSpent = monthTx.reduce((s,t)=>s+t.amount, 0);
  const byCategory = {};
  for (const t of monthTx) byCategory[t.category]=(byCategory[t.category]||0)+t.amount;
  const recentTx = [...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  // ── Paycheck logging — 1st & 3rd Thursday, exactly 2 per month ──────
  const perMonth    = checksPerMonth(settings);
  const payDates    = paycheckDatesForMonth(now.getFullYear(), now.getMonth());
  const paychecksThisMonth = transactions.filter(t=>t.kind==='paycheck' && t.date && t.date.startsWith(monthStr));
  const checkCount  = Math.min(paychecksThisMonth.length, perMonth);
  const monthName   = now.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const baseDeposit = netPerCheck(settings);          // $1,713 take-home
  const nextPayDate = payDates[Math.min(checkCount, perMonth-1)];
  // 401(k): employee amount is fixed per check; employer match is 50% of it,
  // capped for the calendar year (never exceeds employerMatchAnnualCap).
  const empContrib  = k401Active(settings, nextPayDate) ? employee401kPerCheck(settings) : 0;
  const matchYTD    = ytdEmployerMatch(transactions, now.getFullYear());
  const emprContrib = employerMatchForPaycheck(settings, empContrib, matchYTD);
  const [payOpen, setPayOpen] = useState(false);
  const [payAmt,  setPayAmt]  = useState(baseDeposit);
  const baseAlloc   = perCheckAllocations(settings);   // ordered [{key,label,amount}] for this month
  const payScale    = baseDeposit>0 ? (parseFloat(payAmt)||0)/baseDeposit : 1;
  const scaledAlloc = baseAlloc.map(a => ({ ...a, amount: +(a.amount*payScale).toFixed(2) }));
  const allocOf     = key => (scaledAlloc.find(a=>a.key===key)||{}).amount || 0;
  const allocSum    = +scaledAlloc.reduce((s,a)=>s+a.amount,0).toFixed(2);
  // "Funded this month" — how much of each monthly budget line the logged
  // paychecks have covered so far (each check funds ~half; two checks = 100%).
  const fundedByKey = {};
  for (const p of paychecksThisMonth)
    for (const [k,v] of Object.entries(p.allocations||{})) fundedByKey[k] = (fundedByKey[k]||0) + v;
  const fundedRows  = baseAlloc.map(a => ({
    key:a.key, label:a.label,
    target: round2(a.amount*perMonth),         // full monthly budget line (per-check × 2)
    funded: round2(fundedByKey[a.key]||0),
  }));
  const fundedTotal = +fundedRows.reduce((s,r)=>s+r.funded,0).toFixed(2);
  const targetTotal = +fundedRows.reduce((s,r)=>s+r.target,0).toFixed(2);
  const openPay = () => { setPayAmt(baseDeposit); setPayOpen(true); };
  const confirmPay = () => {
    const amt = round2(parseFloat(payAmt)||0);
    if (!(amt>0)) return;
    const checkNo  = checkCount+1;
    const payDate  = payDates[Math.min(checkNo-1, perMonth-1)];   // 1st / 3rd Thursday
    const dateStr  = ymd(payDate);
    const allocObj = Object.fromEntries(scaledAlloc.map(a=>[a.key,a.amount]));
    setTransactions(prev=>[{
      id:String(Date.now()), date:dateStr, type:'income', kind:'paycheck', category:'income',
      description:`Paycheck ${checkNo} of ${perMonth}`, amount:amt, allocations:allocObj, month:monthStr,
      // 401(k) is withheld BEFORE this deposit — recorded, never subtracted from `amount`
      employee401k: empContrib, employer401k: emprContrib,
    }, ...prev]);
    // Add this check's savings to the goals (auto-syncs to Net Worth).
    // Employer match is retirement-only — never added to cash/checking.
    setGoals(g=>({
      ...g,
      hysaBalance:     round2((g.hysaBalance||0) + allocOf('hysa')),
      rothIRAOverride: round2(currentRothBal(settings,g) + allocOf('rothIRA')),
      k401Employee:    round2((g.k401Employee||0) + empContrib),
      k401Employer:    round2((g.k401Employer||0) + emprContrib),
      ira401kBalance:  round2((g.ira401kBalance||0) + empContrib + emprContrib),
    }));
    setPayOpen(false);
  };

  // Paycheck breakdown — built around the actual net paycheck. The 401(k) rows
  // are informational (already withheld); they are NOT deducted from take-home.
  const empMonthly  = round2(empContrib  * perMonth);
  const emprMonthly = round2(emprContrib * perMonth);
  const paycheckRows = [
    { icon:'check',  iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Net Paycheck',         sub:`1st & 3rd Thursday · ${perMonth}× / mo`,                       val:currency(baseDeposit,2),   vc:'var(--green)' },
    { icon:'dollar', iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Monthly Take-Home',    sub:currency(annualNetIncome(settings))+' / yr · '+checksPerYear(settings)+' checks', val:currency(netMonthly,2), vc:'var(--t1)' },
    { icon:'bank',   iconBg:'rgba(245,166,35,.1)', iconClr:'#F5A623', name:'401(k) — You',         sub:`${currency(empContrib,2)}/check · already withheld`,           val:currency(empMonthly,2),    vc:'var(--yellow)'},
    { icon:'shield', iconBg:'rgba(123,116,255,.12)',iconClr:'#7B74FF',name:'401(k) — Employer',    sub:`${currency(emprContrib,2)}/check · not spendable`,             val:currency(emprMonthly,2),   vc:'var(--purple)'},
  ];

  // Category bars for "This Month" (only show if transactions exist)
  const catSpendRows = phase.isEarly || phase.isPreEmployment ? [
    { label:'Utilities',  cat:'utilities', budget:budget.utilitiesAndFee },
    { label:'Savings',    cat:'savings',   budget:(budget.rothIRA||0)+(budget.hysa||0) },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ] : [
    { label:'Housing',    cat:'housing',   budget:budget.rentAndFee },
    { label:'Utilities',  cat:'utilities', budget:budget.utilities },
    { label:'Savings',    cat:'savings',   budget:(budget.rothIRA||0)+(budget.hysa||0) },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ];

  let phaseBadge;
  if (phase.isPreEmployment)   phaseBadge = <span className="badge badge-purple">Pre-Employment</span>;
  else if (phase.isRentFree)   phaseBadge = <span className="badge badge-green">Rent-Free Month</span>;
  else                         phaseBadge = <span className="badge badge-blue">Rent Month</span>;

  return (
    <div className="page">

      {/* Hero ─ take-home */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Monthly Take-Home</div>
        <div className="mega" style={{color:'var(--t1)'}}>{currency(netMonthly)}</div>
        <div style={{fontSize:'.85rem',color:'var(--accent)',marginTop:10,fontWeight:500,display:'flex',alignItems:'center',gap:5}}>
          <Icon name="trendUp" size={14} color="var(--accent)" strokeWidth={2}/>
          {currency(settings.grossOTE*12-settings.grossBase*12)} OTE upside / yr
        </div>
      </div>

      {/* Projected Net Worth chart */}
      <ProjectedChart settings={settings} />

      {/* Stat strip */}
      <div style={{display:'flex',gap:0}}>
        {[
          { lbl:'Base',         val:currency(settings.grossBase), sub:currency(settings.grossBase*12)+'/yr', c:'var(--t1)' },
          { lbl:'OTE',          val:currency(settings.grossOTE),  sub:currency(settings.grossOTE*12)+'/yr',  c:'var(--accent)' },
          { lbl:'Savings Rate', val:pct(savingsRate,0),           sub:currency(monthlyContrib)+'/mo saved',   c:'var(--accent)' },
        ].map((s,i,arr) => (
          <div key={s.lbl} style={{
            flex:1, paddingRight:i<arr.length-1?16:0, marginRight:i<arr.length-1?16:0,
            borderRight: i<arr.length-1 ? '1px solid var(--border)' : 'none',
          }}>
            <div style={{fontSize:'.6rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:5}}>{s.lbl}</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums',color:s.c}}>{s.val}</div>
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:2}}>{s.sub}</div>
          </div>
        ))}
      </div>

      {/* Paycheck Breakdown */}
      <div>
        <div className="section-head">Paycheck Breakdown</div>
        <div className="card-flush">
          {paycheckRows.map(r => (
            <div key={r.name} className="v-row">
              <div className="v-row-left">
                <div className="v-row-icon" style={{background:r.iconBg}}>
                  <Icon name={r.icon} size={16} color={r.iconClr} strokeWidth={1.7}/>
                </div>
                <div>
                  <div className="v-row-name">{r.name}</div>
                  <div className="v-row-sub">{r.sub}</div>
                </div>
              </div>
              <div className="v-row-val" style={{color:r.vc}}>{r.val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Monthly surplus */}
      {!phase.isPreEmployment && (
        <div style={{
          background:surplus>=0?'var(--accent-lt)':'rgba(255,80,0,.08)',
          border:'1px solid '+(surplus>=0?'rgba(0,200,5,.2)':'rgba(255,80,0,.2)'),
          borderRadius:'var(--r)', padding:'18px 20px',
          display:'flex', alignItems:'center', justifyContent:'space-between',
        }}>
          <div>
            <div className="eyebrow" style={{marginBottom:6}}>Monthly Surplus</div>
            <div style={{fontSize:'1.75rem',fontWeight:800,letterSpacing:'-.04em',fontVariantNumeric:'tabular-nums',
              color:surplus>=0?'var(--green)':'var(--red)',lineHeight:1}}>
              {surplus>=0?'+':''}{currency(surplus)}
            </div>
            <div style={{fontSize:'.72rem',color:'var(--t3)',marginTop:5}}>
              {currency(netMonthly)} − {currency(totalBudgeted)} budgeted
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            {phaseBadge}
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:6}}>
              {phase.isEarly ? 'No rent — HYSA accelerated' : 'Rent due this month'}
            </div>
          </div>
        </div>
      )}

      {/* Log Paycheck */}
      <div>
        {checkCount>=2
          ? <button className="btn btn-ghost btn-full" disabled style={{opacity:.55,cursor:'default'}}>
              ✓ Paychecks logged for {monthName}
            </button>
          : <button className="btn btn-primary btn-full" onClick={openPay}>
              Log Paycheck {checkCount+1} of 2
            </button>}
        {checkCount===1 && (
          <div style={{fontSize:'.68rem',color:'var(--t3)',textAlign:'center',marginTop:6}}>
            Check 1 logged · {currency(paychecksThisMonth[0].amount,2)} deposited · 1 more to fully fund {now.toLocaleDateString('en-US',{month:'long'})}
          </div>
        )}
      </div>

      {/* Funded This Month — fills as each paycheck half lands */}
      {!phase.isPreEmployment && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
            <div className="section-head" style={{padding:0,marginBottom:0}}>Funded This Month</div>
            <div style={{fontSize:'.72rem',color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
              {currency(fundedTotal)} / {currency(targetTotal)} · {checkCount} of 2 checks
            </div>
          </div>
          <div className="card-flush">
            {fundedRows.map(r => {
              const p_  = r.target>0 ? Math.min((r.funded/r.target)*100,100) : 0;
              const done = p_>=100;
              return (
                <div key={r.key} className="sp-cat">
                  <div className="sp-top">
                    <span className="sp-name">{r.label}{done && <span style={{color:'var(--accent)',marginLeft:6}}>✓</span>}</span>
                    <span className="sp-nums">
                      <span className="sp-spent">{currency(r.funded)}</span>
                      <span className="sp-bgt"> / {currency(r.target)}</span>
                    </span>
                  </div>
                  <div className="bar"><div className="bar-in" style={{width:`${p_}%`}}/></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* This Month spending bars */}
      {!phase.isPreEmployment && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
            <div className="section-head" style={{padding:0,marginBottom:0}}>This Month</div>
            <div style={{fontSize:'.78rem',color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
              {currency(totalSpent)} spent
            </div>
          </div>
          <div className="card-flush">
            {catSpendRows.filter(r=>r.budget>0).map(r => {
              const s = byCategory[r.cat]||0;
              const p_ = r.budget>0 ? Math.min((s/r.budget)*100,100) : 0;
              const cls = p_>=100?'over':p_>=80?'warn':'';
              return (
                <div key={r.cat} className="sp-cat">
                  <div className="sp-top">
                    <span className="sp-name">{r.label}</span>
                    <span className="sp-nums">
                      <span className="sp-spent">{currency(s)}</span>
                      <span className="sp-bgt"> / {currency(r.budget)}</span>
                    </span>
                  </div>
                  <div className="bar"><div className={`bar-in ${cls}`} style={{width:`${p_||0}%`}}/></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Pre-employment placeholder */}
      {phase.isPreEmployment && (
        <div className="card" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--t1)',marginBottom:8}}>Pre-Employment Setup</div>
          <div style={{color:'var(--t3)',fontSize:'.8rem',maxWidth:360,margin:'0 auto',lineHeight:1.6}}>
            Financial tracking starts July 2026. Use this time to configure your settings, open your HYSA, and set up your Roth IRA.
          </div>
        </div>
      )}

      {/* Recent activity */}
      {recentTx.length > 0 && (
        <div>
          <div className="section-head">Recent Activity</div>
          <div className="card-flush">
            <div className="tx-list">
              {recentTx.map(t => {
                const cat = CATEGORIES.find(c=>c.id===t.category);
                return (
                  <div key={t.id} className="tx-row">
                    <div className="tx-icon">{t.kind==='paycheck' ? 'PAY' : (cat?.abbr||'OTH')}</div>
                    <div className="tx-body">
                      <div className="tx-desc">{t.description}</div>
                      <div className="tx-meta">{(t.kind==='paycheck' ? 'Paycheck' : (cat?.label||'Other'))} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                    </div>
                    <div className="tx-amt" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>
                      {t.type==='income'?'+':'-'}{currency(t.amount)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
      {/* Paycheck confirmation modal */}
      {payOpen && (
        <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) setPayOpen(false); }}>
          <div className="modal-card">
            <div style={{padding:'20px 22px',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:'1.05rem',fontWeight:700,color:'var(--t1)'}}>Log Paycheck {checkCount+1} of 2</div>
              <div style={{fontSize:'.72rem',color:'var(--t3)',marginTop:3}}>{monthName} · semi-monthly deposit</div>
            </div>
            <div style={{padding:'18px 22px'}}>
              <div className="eyebrow" style={{marginBottom:8}}>Deposit Amount</div>
              <div style={{position:'relative',marginBottom:6}}>
                <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',fontSize:'1.15rem',fontWeight:600}}>$</span>
                <input type="number" step="0.01" min="0" value={payAmt} onChange={e=>setPayAmt(e.target.value)}
                  style={{width:'100%',background:'var(--s2)',border:'1px solid var(--border2)',borderRadius:'var(--r-s)',color:'var(--t1)',padding:'12px 12px 12px 32px',fontSize:'1.35rem',fontWeight:700,outline:'none',fontVariantNumeric:'tabular-nums'}} />
              </div>
              <div style={{fontSize:'.68rem',color:'var(--t4)',marginBottom:16}}>Default {currency(baseDeposit,2)} · edit to scale all allocations proportionally</div>

              <div className="eyebrow" style={{marginBottom:4}}>This Check's Allocation</div>
              {scaledAlloc.map(a=>(
                <div key={a.key} className="alloc-row">
                  <span className="alloc-name">{a.label}</span>
                  <span className="alloc-val" style={{color:(a.key==='hysa'||a.key==='rothIRA')?'var(--accent)':'var(--t1)'}}>{currency(a.amount,2)}</span>
                </div>
              ))}
              {((parseFloat(payAmt)||0) - allocSum) > 0.005 && (
                <div className="alloc-row" style={{borderTop:'1px solid var(--border2)'}}>
                  <span className="alloc-name" style={{color:'var(--t3)'}}>Surplus → Checking</span>
                  <span className="alloc-val" style={{color:'var(--green)'}}>{currency((parseFloat(payAmt)||0)-allocSum,2)}</span>
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',marginTop:12,fontSize:'.82rem',fontWeight:700}}>
                <span style={{color:'var(--t2)'}}>Total Deposit</span>
                <span style={{color:'var(--green)',fontVariantNumeric:'tabular-nums'}}>{currency(parseFloat(payAmt)||0,2)}</span>
              </div>
            </div>
            <div style={{display:'flex',gap:10,padding:'0 22px 20px'}}>
              <button className="btn btn-ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>setPayOpen(false)}>Cancel</button>
              <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={confirmPay}>Confirm Deposit</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Budget Tab ─────────────────────────────────────────────────────────
function Budget({ settings, transactions }) {
  const phase = getPhaseInfo(settings.startDate);
  // Default the toggle to whichever phase is currently active
  const [sel, setSel] = useState(phase.isFull ? 1 : 0);

  const now      = new Date();
  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthTx  = transactions.filter(t=>t.date.startsWith(monthStr)&&t.type==='expense');
  const spent = {};
  for (const t of monthTx) spent[t.category]=(spent[t.category]||0)+t.amount;

  const eb = settings.earlyBudget;
  const lb = settings.laterBudget;

  const earlyRows = [
    { label:'Utilities & Fee',   limit:eb.utilitiesAndFee,  cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:eb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Roth IRA',          limit:eb.rothIRA,          cat:'savings',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:eb.hysa,             cat:'savings',   icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:eb.groceries,        cat:'groceries', icon:'cart',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Gas',               limit:eb.gas,              cat:'gas',       icon:'fuel',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Travel',            limit:eb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Dining',            limit:eb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Shopping',          limit:eb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
  ];
  const laterRows = [
    { label:'Rent & Fee',        limit:lb.rentAndFee,       cat:'housing',   icon:'home',    iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Utilities',         limit:lb.utilities,        cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:lb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Roth IRA',          limit:lb.rothIRA,          cat:'savings',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:lb.hysa,             cat:'savings',   icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:lb.groceries,        cat:'groceries', icon:'cart',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Gas',               limit:lb.gas,              cat:'gas',       icon:'fuel',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Travel',            limit:lb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Dining',            limit:lb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Shopping',          limit:lb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
  ];

  const rows    = sel === 0 ? earlyRows : laterRows;
  const total   = rows.reduce((s,r)=>s+r.limit, 0);
  const surplus = monthlyNetIncome(settings) - total;

  const isEarlyActive = phase.isEarly || phase.isPreEmployment;
  const isLaterActive = phase.isFull;
  const currentlyActive = sel===0 ? isEarlyActive : isLaterActive;

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Budget</h2>
          <div className="page-sub">
            {sel===0 ? 'Rent-free months · Aug, Oct, Dec — HYSA accelerated' : 'Rent months · Jul, Sep, Nov'}
          </div>
        </div>
        {currentlyActive && <span className="badge badge-green">Active</span>}
      </div>

      {/* Phase toggle */}
      <div className="phase-pill-row">
        <button
          className={'phase-pill '+(sel===0?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(0)}
        >
          Rent-Free
          {isEarlyActive && sel!==0 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
        <button
          className={'phase-pill '+(sel===1?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(1)}
        >
          With Rent
          {isLaterActive && sel!==1 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
      </div>

      {/* Budget rows */}
      <div className="card-flush">
        {rows.map(row => {
          const s   = spent[row.cat]||0;
          const rem = row.limit - s;
          const over = rem < 0;
          return (
            <div key={row.label} className="b-row">
              <div className="b-left">
                <div className="b-icon" style={{background:row.iconBg}}>
                  <Icon name={row.icon} size={16} color={row.iconClr} strokeWidth={1.7}/>
                </div>
                <div>
                  <div className="b-name">{row.label}</div>
                  {s > 0 && (
                    <div style={{fontSize:'.68rem',marginTop:2,color:over?'var(--red)':'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
                      {currency(s)} spent · {over ? currency(Math.abs(rem))+' over' : currency(rem)+' left'}
                    </div>
                  )}
                </div>
              </div>
              <span className="b-amt">{currency(row.limit)}</span>
            </div>
          );
        })}

        {/* Total + surplus footer */}
        <div className="b-total-row">
          <div>
            <div className="b-total-lbl">Monthly Total</div>
            {surplus >= 0
              ? <div className="b-surplus">+{currency(surplus)} surplus</div>
              : <div style={{fontSize:'.78rem',color:'var(--red)',fontWeight:600}}>{currency(Math.abs(surplus))} over budget</div>
            }
          </div>
          <div className="large-num" style={{color:'var(--t1)'}}>{currency(total)}</div>
        </div>
      </div>

      {/* Quick info note */}
      <div style={{fontSize:'.72rem',color:'var(--t3)',textAlign:'center',marginTop:-8}}>
        {currency(monthlyNetIncome(settings))} take-home ({checksPerMonth(settings)} × {currency(netPerCheck(settings),2)}) · edit amounts in Settings
      </div>
    </div>
  );
}

// ── Spending ──────────────────────────────────────────────────────────
function Spending({ settings, transactions, setTransactions }) {
  const now   = new Date();
  const [viewMonth, setViewMonth] = useState({y:now.getFullYear(),m:now.getMonth()});
  const [showForm, setShowForm]   = useState(false);
  const [form, setForm]           = useState({
    date:now.toISOString().split('T')[0], description:'', amount:'', category:'groceries', type:'expense',
  });

  const monthStr  = `${viewMonth.y}-${String(viewMonth.m+1).padStart(2,'0')}`;
  const monthTx   = transactions.filter(t=>t.date.startsWith(monthStr));
  const expenses  = monthTx.filter(t=>t.type==='expense');
  const totalSpent= expenses.reduce((s,t)=>s+t.amount, 0);
  // Phase is based on the MONTH BEING VIEWED, not today — so each month is
  // compared against the right budget. Rent-free = pre-employment + Months 1-3
  // (with Start Date = Jul 1 2026 that is Jun/Jul/Aug/Sep 2026); rest = Month 4-12.
  const phase     = getPhaseInfo(settings.startDate, new Date(viewMonth.y, viewMonth.m, 1));
  const isRentFree= phase.isEarly || phase.isPreEmployment;
  const budget    = isRentFree ? settings.earlyBudget : settings.laterBudget;

  const byCategory = {};
  for (const t of expenses) byCategory[t.category]=(byCategory[t.category]||0)+t.amount;

  const catBudget = isRentFree ? {
    housing:   budget.utilitiesAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilitiesAndFee||0,
    savings:   (budget.rothIRA||0)+(budget.hysa||0), other:0,
  } : {
    housing:   budget.rentAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilities||0,
    savings:   (budget.rothIRA||0)+(budget.hysa||0), other:0,
  };

  const totalBudget = Object.values(catBudget).reduce((s,v)=>s+v, 0);

  const handleAdd = e => {
    e.preventDefault();
    const amt = parseFloat(form.amount);
    if (!amt||isNaN(amt)) return;
    setTransactions(prev=>[{
      id:String(Date.now()), date:form.date,
      description:form.description.trim()||form.category,
      amount:amt, category:form.category, type:form.type,
    },...prev]);
    setForm(f=>({...f,description:'',amount:''}));
    setShowForm(false);
  };

  const del    = id => { if(window.confirm('Delete this transaction?')) setTransactions(p=>p.filter(t=>t.id!==id)); };
  const sorted = [...monthTx].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const monthLabel = new Date(viewMonth.y,viewMonth.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Categories that have either spending or a budget allocation
  const activeCats = CATEGORIES.filter(c=>byCategory[c.id]>0||catBudget[c.id]>0);

  return (
    <div className="page">

      {/* Hero header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>Spent This Month</div>
          <div className="mega" style={{color:totalSpent>totalBudget&&totalBudget>0?'var(--red)':'var(--t1)'}}>
            {currency(totalSpent)}
          </div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {totalBudget>0 ? `of ${currency(totalBudget)} budget` : 'no budget yet'}
          </div>
        </div>
        <button className="add-btn" onClick={()=>setShowForm(s=>!s)}>
          {showForm
            ? <><Icon name="chevronLeft" size={14} color="#000" strokeWidth={2.5}/>Cancel</>
            : <><Icon name="plus"        size={14} color="#000" strokeWidth={2.5}/>Add</>
          }
        </button>
      </div>

      {/* Month nav */}
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})}>
          <Icon name="chevronLeft" size={14} color="var(--t2)"/>
        </button>
        <div className="month-name">{monthLabel}</div>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1})}>
          <Icon name="chevronRight" size={14} color="var(--t2)"/>
        </button>
      </div>

      {/* Add transaction form */}
      {showForm && (
        <div className="card" style={{borderColor:'rgba(0,200,5,.2)',background:'rgba(0,200,5,.03)'}}>
          <div className="card-label">New Transaction</div>
          <form onSubmit={handleAdd}>
            <div className="fgrid">
              <div className="fg"><label>Date</label>
                <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} required />
              </div>
              <div className="fg"><label>Type</label>
                <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
              <div className="fg fspan"><label>Description</label>
                <input type="text" placeholder="What was it?" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} />
              </div>
              <div className="fg"><label>Amount</label>
                <input type="number" step="0.01" min="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} required />
              </div>
              <div className="fg"><label>Category</label>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                  {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
              <div className="factions">
                <button type="button" className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      )}

      {/* Category bars */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>By Category</div>
        <div className="card-flush">
          {activeCats.length === 0
            ? <p className="empty">No expenses logged yet.</p>
            : activeCats.map(cat => {
                const s   = byCategory[cat.id]||0;
                const lim = catBudget[cat.id]||0;
                const p_  = lim>0 ? Math.min((s/lim)*100,100) : 0;
                const cls = p_>=100?'over':p_>=80?'warn':'';
                return (
                  <div key={cat.id} className="sp-cat">
                    <div className="sp-top">
                      <span className="sp-name">{cat.label}</span>
                      <span className="sp-nums">
                        <span className="sp-spent">{currency(s)}</span>
                        {lim>0 && <span className="sp-bgt"> / {currency(lim)}</span>}
                      </span>
                    </div>
                    {lim>0 && <div className="bar"><div className={`bar-in ${cls}`} style={{width:`${p_||0}%`}}/></div>}
                  </div>
                );
              })
          }
        </div>
      </div>

      {/* Transaction list */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>
          Transactions {sorted.length>0 && <span style={{color:'var(--t4)',marginLeft:6}}>({sorted.length})</span>}
        </div>
        <div className="card-flush">
          {sorted.length===0
            ? <p className="empty">No transactions this month.</p>
            : <div className="tx-list">
                {sorted.map(t=>{
                  const cat=CATEGORIES.find(c=>c.id===t.category);
                  return (
                    <div key={t.id} className="tx-row">
                      <div className="tx-icon">{cat?.abbr||'OTH'}</div>
                      <div className="tx-body">
                        <div className="tx-desc">{t.description}</div>
                        <div className="tx-meta">
                          {cat?.label} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
                        </div>
                      </div>
                      <div className="tx-amt" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>
                        {t.type==='income'?'+':'-'}{currency(t.amount)}
                      </div>
                      <button className="tx-del btn-icon-del" onClick={()=>del(t.id)}>×</button>
                    </div>
                  );
                })}
              </div>
          }
        </div>
      </div>

    </div>
  );
}

// ── Goals ─────────────────────────────────────────────────────────────
function Goals({ settings, goals, setGoals, commissions, transactions }) {
  const now   = new Date();
  const phase = getPhaseInfo(settings.startDate);

  // ── HYSA ──────────────────────────────────────────────────────────────
  const hysaBal    = goals.hysaBalance || 0;
  const hysaPct_   = settings.hysaGoal > 0 ? Math.min((hysaBal / settings.hysaGoal) * 100, 100) : 0;
  const hysaRem    = Math.max(settings.hysaGoal - hysaBal, 0);
  // HYSA alternates ($1,800 rent-free months, $500 rent months) — blended avg for the ETA
  const hysaRate   = blendedRate(settings, 'hysa');
  const hysaMonths = hysaRate > 0 && hysaRem > 0 ? Math.ceil(hysaRem / hysaRate) : 0;
  const hysaETA    = hysaMonths ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + hysaMonths);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── Roth IRA (counts only logged contributions — no month-based auto-fill) ──
  // Blended across both scenarios for the long-range ETA. With Rent and
  // Without Rent hold their own rothIRA value — neither is read as the other's.
  const rothRate    = blendedRate(settings, 'rothIRA');
  const rothBal   = goals.rothIRAOverride != null ? goals.rothIRAOverride : 0;
  const rothPct_  = settings.rothIRAYearlyLimit > 0 ? Math.min((rothBal / settings.rothIRAYearlyLimit) * 100, 100) : 0;
  const rothRem   = Math.max(settings.rothIRAYearlyLimit - rothBal, 0);
  const rothMonthsLeft = rothRate > 0 && rothRem > 0
    ? Math.ceil(rothRem / rothRate) : 0;
  const rothETA   = rothMonthsLeft ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + rothMonthsLeft);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── 401(k) — employee and employer tracked separately ─────────────────
  const k401Emp   = goals.k401Employee || 0;
  const k401Empr  = goals.k401Employer || 0;
  // Combined is DERIVED from the two sources — never an independently editable
  // number, so the split and the total can never disagree.
  const k401Bal   = round2(k401Emp + k401Empr);
  const k401Pct_ = settings.ira401kYearlyMax > 0 ? Math.min((k401Bal / settings.ira401kYearlyMax) * 100, 100) : 0;
  const k401Rem  = Math.max(settings.ira401kYearlyMax - k401Bal, 0);
  const matchCap    = settings.employerMatchAnnualCap != null ? settings.employerMatchAnnualCap : 0;
  const matchUsed   = ytdEmployerMatch(transactions, now.getFullYear());
  const matchCapped = matchCap > 0 && matchUsed >= matchCap;
  const empPerCheck   = k401Active(settings) ? employee401kPerCheck(settings) : 0;
  const matchPerCheck = employerMatchForPaycheck(settings, empPerCheck, matchUsed);
  const k401Started   = !settings.contribution401kStart || new Date() >= parseLocalDate(settings.contribution401kStart);
  const k401StartLabel = settings.contribution401kStart
    ? parseLocalDate(settings.contribution401kStart).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '';

  // ── Savings rate ──────────────────────────────────────────────────────
  // Only HYSA + Roth IRA count — 401k is pre-tax and deducted before take-home
  const activeBudget   = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const monthlyContrib = (activeBudget.hysa||0) + (activeBudget.rothIRA||0);
  const savingsRate    = monthlyNetIncome(settings) > 0 ? (monthlyContrib / monthlyNetIncome(settings)) * 100 : 0;
  const totalComm      = commissions.reduce((s,c) => s+c.amount, 0);

  // ── Form state ────────────────────────────────────────────────────────
  const [hysaIn, setHysaIn]   = useState('');
  const [k401EmpIn,  setK401EmpIn]  = useState('');
  const [k401EmprIn, setK401EmprIn] = useState('');
  const [rothIn, setRothIn] = useState('');

  const updHYSA = e => { e.preventDefault(); const v=parseFloat(hysaIn); if(!isNaN(v)) setGoals(g=>({...g,hysaBalance:v})); setHysaIn(''); };
  // Each source is corrected on its own; `ira401kBalance` is kept in step purely
  // as the back-compat mirror of the derived combined figure.
  const upd401kEmp = e => { e.preventDefault(); const v=parseFloat(k401EmpIn);
    if(!isNaN(v)) setGoals(g=>({...g,k401Employee:v,ira401kBalance:round2(v+(g.k401Employer||0))}));
    setK401EmpIn(''); };
  const upd401kEmpr = e => { e.preventDefault(); const v=parseFloat(k401EmprIn);
    if(!isNaN(v)) setGoals(g=>({...g,k401Employer:v,ira401kBalance:round2((g.k401Employee||0)+v)}));
    setK401EmprIn(''); };
  const updRoth = e => { e.preventDefault(); const v=parseFloat(rothIn); setGoals(g=>({...g,rothIRAOverride:isNaN(v)?null:v})); setRothIn(''); };

  // "Moved up" highlights are detected app-wide (see App); just read them here.
  const [etaHl] = useState(() => loadSess('fd_eta_hl', {}));

  return (
    <div className="page">

      {/* Hero — savings rate */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Savings Rate</div>
        <div className="mega" style={{color:'var(--accent)'}}>{pct(savingsRate, 0)}</div>
        <div style={{fontSize:'.85rem',color:'var(--t3)',marginTop:10,fontVariantNumeric:'tabular-nums'}}>
          {currency(monthlyContrib)}/mo this month
          {phase.isRentFree && <span style={{color:'var(--t4)'}}> · rent-free, HYSA accelerated</span>}
          {phase.isRentMonth && <span style={{color:'var(--t4)'}}> · rent month</span>}
        </div>
      </div>

      {/* Commission earned pill */}
      {totalComm > 0 && (
        <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'var(--accent-lt)',border:'1px solid rgba(0,200,5,.2)',borderRadius:'var(--r-s)',padding:'8px 14px'}}>
          <Icon name="dollar" size={14} color="var(--accent)" strokeWidth={2}/>
          <span style={{fontSize:'.78rem',fontWeight:600,color:'var(--accent)'}}>{currency(totalComm)} commission earned</span>
        </div>
      )}

      <div className="eyebrow" style={{marginBottom:4}}>Active Goals</div>

      {/* ── HYSA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Emergency Fund</div>
            <div className="gc-sub">HYSA · alternating · ~{currency(hysaRate)}/mo avg</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--accent)'}}>{pct(hysaPct_, 0)}</div>
            <div className="gc-of">{currency(hysaBal)} of {currency(settings.hysaGoal)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${hysaPct_}%`, background:'linear-gradient(90deg,#00C805,#00ff08)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(hysaRem)} remaining</span>
          <span className="gc-date">
            {etaHl.hysa && hysaBal < settings.hysaGoal && (
              <span className="eta-up">↑ Moved up {fmtImprove(etaHl.hysa.days)}</span>
            )}
            {hysaBal >= settings.hysaGoal ? '🎉 Goal reached!'
              : hysaETA ? `${hysaETA} · ${hysaMonths}mo` : '—'}
          </span>
        </div>
        <form onSubmit={updHYSA} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(hysaBal)})`}
            value={hysaIn} onChange={e=>setHysaIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      {/* ── Roth IRA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Roth IRA</div>
            <div className="gc-sub">{now.getFullYear()} limit · resets Jan 1</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--purple)'}}>{pct(rothPct_, 0)}</div>
            <div className="gc-of">{currency(rothBal)} of {currency(settings.rothIRAYearlyLimit)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${rothPct_}%`, background:'linear-gradient(90deg,#7B74FF,#9C94FF)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(rothRate)}/mo · from paychecks</span>
          <span className="gc-date">
            {etaHl.roth && rothBal < settings.rothIRAYearlyLimit && (
              <span className="eta-up">↑ Moved up {fmtImprove(etaHl.roth.days)}</span>
            )}
            {rothBal >= settings.rothIRAYearlyLimit ? '🎉 Maxed out!'
              : rothETA ? `${rothETA} · ${rothMonthsLeft}mo` : '—'}
          </span>
        </div>
        <form onSubmit={updRoth} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(rothBal)})`}
            value={rothIn} onChange={e=>setRothIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      {/* ── 401(k) Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">401(k)</div>
            <div className="gc-sub">Pre-tax · IRS max {now.getFullYear()}: {currency(settings.ira401kYearlyMax)}</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--yellow)'}}>
              {pct(k401Pct_, 0)}
            </div>
            <div className="gc-of">{currency(k401Bal)} of {currency(settings.ira401kYearlyMax)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${k401Pct_}%`, background:'linear-gradient(90deg,#F5A623,#FFD27A)'}}/>
        </div>
        {/* Employee vs employer — tracked and shown as distinct sources.
            The combined figure above is their sum, never a merged balance. */}
        <div style={{display:'flex',gap:0,marginTop:14,marginBottom:2}}>
          {[
            { lbl:'You (employee)', val:k401Emp,  c:'var(--yellow)',
              sub:`${currency(empPerCheck,2)}/check` },
            { lbl:'Employer match', val:k401Empr, c:'var(--purple)',
              sub:matchCapped ? 'annual cap reached'
                              : `${currency(matchPerCheck,2)}/check` },
            { lbl:'Combined',       val:k401Bal,  c:'var(--t1)',
              sub:`${currency(k401Rem)} to IRS max` },
          ].map((x,i,arr)=>(
            <div key={x.lbl} style={{
              flex:1, paddingRight:i<arr.length-1?14:0, marginRight:i<arr.length-1?14:0,
              borderRight:i<arr.length-1?'1px solid var(--border)':'none',
            }}>
              <div style={{fontSize:'.58rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>{x.lbl}</div>
              <div style={{fontSize:'.95rem',fontWeight:700,color:x.c,fontVariantNumeric:'tabular-nums'}}>{currency(x.val,2)}</div>
              <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:2}}>{x.sub}</div>
            </div>
          ))}
        </div>

        {/* Employer annual allowance — the cap that bounds the match */}
        {matchCap > 0 && (
          <div style={{marginTop:12}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.62rem',color:'var(--t3)',marginBottom:5}}>
              <span>Employer match used · {now.getFullYear()}</span>
              <span style={{fontVariantNumeric:'tabular-nums',color:matchCapped?'var(--yellow)':'var(--t3)'}}>
                {currency(matchUsed,2)} / {currency(matchCap)}{matchCapped && ' · capped'}
              </span>
            </div>
            <div className="track">
              <div className="fill" style={{width:`${Math.min((matchUsed/matchCap)*100,100)}%`,background:'var(--purple)'}}/>
            </div>
          </div>
        )}

        <div className="gc-foot">
          <span className="gc-rate">{currency(empPerCheck,2)} + {currency(matchPerCheck,2)} employer / check</span>
          <span className="gc-date">
            {!k401Started ? `Starts ${k401StartLabel}`
              : k401Bal > 0 ? `${currency(k401Rem)} to IRS max` : 'Capturing employer match'}
          </span>
        </div>
        <form onSubmit={upd401kEmp} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Employee balance (${currency(k401Emp)})`}
            value={k401EmpIn} onChange={e=>setK401EmpIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
        <form onSubmit={upd401kEmpr} className="goal-update" style={{marginTop:8}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Employer balance (${currency(k401Empr)})`}
            value={k401EmprIn} onChange={e=>setK401EmprIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      <div style={{fontSize:'.68rem',color:'var(--t4)',textAlign:'center'}}>
        HYSA &amp; Roth IRA balances sync with Net Worth page
      </div>

    </div>
  );
}

// ── Commission ─────────────────────────────────────────────────────────
function Commission({ settings, commissions, setCommissions, setGoals }) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:new Date().toISOString().split('T')[0],amount:'',note:''});
  const hysaPct=settings.commissionHYSAPct/100;
  const personalPct=settings.commissionPersonalPct/100;
  const preview=form.amount&&!isNaN(parseFloat(form.amount))?{hysa:parseFloat(form.amount)*hysaPct,personal:parseFloat(form.amount)*personalPct}:null;

  const handleAdd=e=>{
    e.preventDefault();const amt=parseFloat(form.amount);
    if(!amt||isNaN(amt))return;
    const hysaAdd=+(amt*hysaPct).toFixed(2);
    setCommissions(prev=>[{id:String(Date.now()),date:form.date,amount:amt,note:form.note.trim(),hysaPortion:hysaAdd,personalPortion:+(amt*personalPct).toFixed(2)},...prev]);
    // 60% HYSA split flows into the Emergency Fund balance (syncs Goals + Net Worth)
    setGoals(g=>({...g,hysaBalance:+(((g.hysaBalance||0)+hysaAdd)).toFixed(2)}));
    setForm(f=>({...f,amount:'',note:''}));setShowForm(false);
  };
  const del=id=>{
    if(!window.confirm('Delete this commission?'))return;
    const c=commissions.find(x=>x.id===id);
    setCommissions(p=>p.filter(t=>t.id!==id));
    if(c) setGoals(g=>({...g,hysaBalance:+(Math.max((g.hysaBalance||0)-(c.hysaPortion||0),0)).toFixed(2)}));
  };
  const sorted=[...commissions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=commissions.reduce((s,c)=>s+c.amount,0);
  const totHYSA=commissions.reduce((s,c)=>s+c.hysaPortion,0);
  const totPers=commissions.reduce((s,c)=>s+c.personalPortion,0);

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Commission</h2>
          <div className="page-sub">Log and split your commissions</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'Cancel':'+ Log'}</button>

// Isolated input: holds its own string state so typing never re-renders
// the parent Settings component (stops mobile keyboard from dismissing).
function SettingsInput({ value, onCommit, type='number', prefix, extraStyle, id, name }) {
  const [str, setStr] = useState(String(value ?? ''));
  // Sync if the committed value changes underneath us (e.g. Reset button)
  useEffect(() => { setStr(String(value ?? '')); }, [value]);
  // Commit the input's OWN value, not `str`. setStr from onChange is async, so
  // if a keystroke and the blur land in the same tick (paste, or tapping Save
  // right after typing) `str` is still the previous value and the edit is lost.
  const commit = e => onCommit(e && e.target ? e.target.value : str);
  return (
    <div style={{position:'relative'}}>
      {prefix && (
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
          color:'var(--t3)',fontSize:'.78rem',pointerEvents:'none'}}>{prefix}</span>
      )}
      <input
        id={id}
        name={name}
        type={type==='number' ? 'text' : type}
        inputMode={type==='number' ? 'decimal' : undefined}
        value={str}
        style={{...(prefix ? {paddingLeft:22} : {}), ...extraStyle}}
        onChange={e => setStr(e.target.value)}
        onBlur={commit}
        onKeyDown={e => e.key==='Enter' && e.target.blur()}
      />
    </div>
  );
}

// Declared at module scope ON PURPOSE. When this lived inside Settings() it was
// a brand-new component type on every render, so React unmounted and remounted
// every input after each commit — which dropped the edit you were part-way
// through and bounced focus. Keeping the type stable keeps each field's state
// (and the caret) intact. `name` is unique per scenario+key, so the two
// scenarios' Roth/HYSA inputs are distinct controls.
function SettingField({ label, name, val, type='number', prefix='$', onCommit, hint }) {
  return (
    <div className="settings-group">
      <label htmlFor={name}>{label}</label>
      <SettingsInput
        id={name} name={name} value={val} type={type} prefix={prefix} onCommit={onCommit}
      />
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

// Read-only derived figure — shown so the schedule math is visible but not
// editable (it is computed from the per-paycheck amount).
function SettingDerived({ label, value, hint }) {
  return (
    <div className="settings-group">

        background:'rgba(255,255,255,.02)',color:'var(--t2)',fontSize:'.82rem',
        fontVariantNumeric:'tabular-nums'}}>{value}</div>
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

function Settings({ settings, setSettings }) {
  const [local,setLocal]=useState(settings);

  // Mirrors `local` SYNCHRONOUSLY. Tapping Save blurs the field you were in, so
  // its commit and the click land in the same tick — reading `local` there would
  // save the value from the previous render and silently drop that last edit.
  const localRef=useRef(settings);
  useEffect(()=>{setLocal(settings);localRef.current=settings;},[settings]);

  const commitLocal=next=>{localRef.current=next;setLocal(next);};
  // Immutable updates off the ref, so consecutive edits compose instead of
  // clobbering each other. Writing one scenario always preserves the other.
  const set   =(k,v)=>commitLocal({...localRef.current,[k]:typeof v==='string'?parseFloat(v)||0:v});
  const setStr=(k,v)=>commitLocal({...localRef.current,[k]:v});

function HBar({ label, value, max, color }) {
  const w = max > 0 ? Math.min((value/max)*100,100) : 0;
  return (
    <div className="hbar-row">
      <div className="hbar-label">{label}</div>
      <div className="hbar-track"><div className="hbar-fill" style={{width:`${w}%`,background:color}} /></div>
      <div className="hbar-val">{currency(value)}</div>
    </div>
  );
}

function SvgLine({ history }) {
  if (history.length < 2) return (
    <div className="chart-wrap" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:100}}>
      <span style={{color:'var(--t3)',fontSize:'.75rem'}}>Save 2+ monthly snapshots to see the trend</span>
    </div>
  );

  // Layout constants
  const VW=560, VH=160, PL=58, PR=10, PT=10, PB=32;
  const IW = VW-PL-PR, IH = VH-PT-PB;

  const vals = history.map(h=>h.netWorth);
  const rawMin = Math.min(...vals);
  const rawMax = Math.max(...vals);
  // Always include 0 so the zero line is visible
  const minV = Math.min(rawMin, 0);
  const maxV = Math.max(rawMax, 0) || 1;
  const range = maxV - minV || 1;

  const toX = i  => PL + (history.length > 1 ? (i/(history.length-1)) : 0.5) * IW;
  const toY = v  => PT + IH - ((v - minV) / range) * IH;

  const pts = history.map((h,i) => ({ x:toX(i), y:toY(h.netWorth), month:h.month, val:h.netWorth }));
  const lineStr  = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const fillStr  = `${pts[0].x},${toY(0)} ${lineStr} ${pts[pts.length-1].x},${toY(0)}`;

  const up = vals[vals.length-1] >= vals[0];
  const stroke   = up ? '#22c55e' : '#ef4444';
  const fillClr  = up ? 'rgba(34,197,94,.08)' : 'rgba(239,68,68,.08)';

  // Y-axis: 3 evenly spaced labels
  const yTicks = [maxV, (maxV+minV)/2, minV];
  const fmtY = v => {
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1000000) return `${sign}$${(abs/1000000).toFixed(1)}M`;
    if (abs >= 1000)    return `${sign}$${(abs/1000).toFixed(0)}k`;
    return `${sign}$${abs.toFixed(0)}`;
  };

  // X-axis labels — skip every other if crowded
  const fmtX = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short'})+" '"+String(+y).slice(2);
  };

  // Zero line (only if range spans positive and negative)
  const showZero = minV < 0 && maxV > 0;

  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:'100%',display:'block'}}>
        {/* Horizontal grid lines at each y-tick */}
        {yTicks.map((v,i) => (
          <line key={i} x1={PL} y1={toY(v)} x2={VW-PR} y2={toY(v)}
            stroke="#222" strokeWidth="1" strokeDasharray="3,5" />
        ))}
        {/* Zero line (bolder when range crosses zero) */}
        {showZero && (
          <line x1={PL} y1={toY(0)} x2={VW-PR} y2={toY(0)}
            stroke="#3f3f46" strokeWidth="1.5" />
        )}
        {/* Y-axis labels */}
        {yTicks.map((v,i) => (
          <text key={i} x={PL-6} y={toY(v)+5} textAnchor="end"
            fill="#52525b" fontSize="17" fontFamily="Inter,system-ui,sans-serif">
            {fmtY(v)}
          </text>
        ))}
        {/* Fill area */}
        <polygon points={fillStr} fill={fillClr} />
        {/* Line */}
        <polyline points={lineStr} fill="none" stroke={stroke} strokeWidth="2" />
        {/* Dots */}
        {pts.map((p,i) => (
          <circle key={i} cx={p.x} cy={p.y} r="4.5" fill={stroke} />
        ))}
        {/* X-axis labels */}
        {pts.map((p,i) => {
          if (history.length > 8 && i % 2 !== 0) return null;
          const anchor = i===0 ? 'start' : i===pts.length-1 ? 'end' : 'middle';
          return (
            <text key={i} x={p.x} y={VH-4} textAnchor={anchor}
              fill="#52525b" fontSize="17" fontFamily="Inter,system-ui,sans-serif">
              {fmtX(p.month)}
            </text>
          );
        })}
      </svg>
    </div>
  );
}

function NetWorth({ netWorth, setNetWorth, transactions, goals, setGoals, settings }) {
  const acc  = netWorth.accounts || {};
  const hist = netWorth.history  || [];

  // Balances — HYSA / Roth / 401k come from fd_goals (single source of truth).
  // Each account stays its own category: HYSA is cash savings, Roth is
  // retirement investments, and the 401(k) is split employee vs employer.
  const hysaBal  = goals.hysaBalance   || 0;
  const rothBal  = goals.rothIRAOverride != null ? goals.rothIRAOverride : 0;
  const k401Emp  = goals.k401Employee  || 0;
  const k401Empr = goals.k401Employer  || 0;
  const k401Bal  = round2(k401Emp + k401Empr);          // derived, not editable

  const setHYSA = v => setGoals(g => ({ ...g, hysaBalance:     v }));
  const setRoth = v => setGoals(g => ({ ...g, rothIRAOverride: v }));
  const set401kEmp  = v => setGoals(g => ({ ...g, k401Employee: v, ira401kBalance: round2(v + (g.k401Employer||0)) }));
  const set401kEmpr = v => setGoals(g => ({ ...g, k401Employer: v, ira401kBalance: round2((g.k401Employee||0) + v) }));
  const setAcc  = (key, val) => setNetWorth(s => ({ ...s, accounts: { ...s.accounts, [key]: val } }));

  const totalAssets = (acc.checking||0) + hysaBal + rothBal + k401Bal + (acc.brokerage||0);
  const totalLiab   = (acc.creditCard||0) + (acc.loans||0);
  const nw          = totalAssets - totalLiab;
  const isPos       = nw >= 0;

  // Snapshot logic
  const now      = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const hasMonth = hist.some(h => h.month === monthKey);

  const saveSnapshot = () => {
    const entry = { month:monthKey, netWorth:nw, assets:totalAssets, liabilities:totalLiab };
    setNetWorth(s => ({
      ...s,
      history: [...s.history.filter(h=>h.month!==monthKey), entry]
        .sort((a,b) => a.month.localeCompare(b.month)),
    }));
  };
  const delSnapshot = m => setNetWorth(s => ({ ...s, history: s.history.filter(h=>h.month!==m) }));

  // Spending by category (all-time)
  const catSpend = {};
  for (const t of transactions.filter(t=>t.type==='expense'))
    catSpend[t.category] = (catSpend[t.category]||0) + t.amount;
  const topCats     = Object.entries(catSpend).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCatSpend = topCats[0]?.[1] || 1;
  const CAT_COLOR   = {
    housing:'var(--accent)',groceries:'var(--accent)',gas:'var(--yellow)',
    dining:'#f97316',shopping:'var(--purple)',travel:'#06b6d4',
    utilities:'var(--yellow)',savings:'var(--accent)',other:'var(--t3)',
  };

  // History deltas
  const histWithDelta = hist.map((h,i) => {
    const prev     = hist[i-1];
    const delta    = prev ? h.netWorth - prev.netWorth : null;
    const deltaPct = prev && prev.netWorth !== 0 ? (delta/Math.abs(prev.netWorth))*100 : null;
    return { ...h, delta, deltaPct };
  });

  const fmtMonth = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
  };

  // Asset rows for display
  const assetRows = [
    { label:'Checking',              color:'var(--accent)', val:acc.checking||0,   onChange:v=>setAcc('checking',v),   synced:false },
    { label:'HYSA / Emergency Fund', color:'var(--accent)', val:hysaBal,            onChange:setHYSA,                   synced:true  },
    { label:'Roth IRA',              color:'var(--purple)', val:rothBal,            onChange:setRoth,                   synced:true  },
    { label:'401(k) — Employee',     color:'var(--yellow)', val:k401Emp,            onChange:set401kEmp,                synced:true  },
    { label:'401(k) — Employer',     color:'var(--purple)', val:k401Empr,           onChange:set401kEmpr,               synced:true  },
    { label:'Taxable Brokerage',     color:'#06b6d4',       val:acc.brokerage||0,  onChange:v=>setAcc('brokerage',v),  synced:false },
  ];
  const liabRows = [
    { label:'Credit Card',        color:'var(--red)',  val:acc.creditCard||0, onChange:v=>setAcc('creditCard',v) },
    { label:'Loans / Other Debt', color:'#f97316',    val:acc.loans||0,      onChange:v=>setAcc('loans',v)      },
  ];

  return (
    <div className="page">

      {/* Hero */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>
            Net Worth · {now.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
          </div>
          <div className="mega" style={{color:isPos?'var(--accent)':'var(--red)'}}>{currency(nw)}</div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {currency(totalAssets)} assets — {currency(totalLiab)} liabilities
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={saveSnapshot}>
          {hasMonth ? 'Update' : 'Snapshot'}
        </button>
      </div>

      {/* Assets vs liabilities stat strip */}
      <div style={{display:'flex',gap:0}}>
        {[
          { lbl:'Assets',      val:currency(totalAssets), c:'var(--accent)' },
          { lbl:'Liabilities', val:currency(totalLiab),   c:totalLiab>0?'var(--red)':'var(--t3)' },
          { lbl:'Net',         val:currency(nw),           c:isPos?'var(--accent)':'var(--red)' },
        ].map((s,i,arr) => (
          <div key={s.lbl} style={{
            flex:1, paddingRight:i<arr.length-1?16:0, marginRight:i<arr.length-1?16:0,
            borderRight:i<arr.length-1?'1px solid var(--border)':'none',
          }}>
            <div style={{fontSize:'.6rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:5}}>{s.lbl}</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums',color:s.c}}>{s.val}</div>
          </div>
        ))}
      </div>

      {/* Assets */}
      <div>
        <div className="eyebrow" style={{marginBottom:10}}>Assets</div>
        <div className="card-flush">
          {assetRows.map(row => (
            <div key={row.label} className="nw-row">
              <div className="nw-row-left">
                <div className="nw-dot" style={{background:row.color, opacity:row.val>0?1:0.3}}/>
                <div>
                  <span className="nw-label">{row.label}</span>
                  {row.synced && <span style={{fontSize:'.6rem',color:'var(--t4)',marginLeft:6}}>synced</span>}
                </div>
              </div>
              <input className="nw-input" type="number" min="0" step="0.01"
                value={row.val||''}
                onChange={e => row.onChange(parseFloat(e.target.value)||0)}
                onBlur={e  => row.onChange(parseFloat(e.target.value)||0)}
                onKeyDown={e => e.key==='Enter' && e.target.blur()}
              />
            </div>
          ))}
        </div>
      </div>

      {/* Liabilities */}
      <div>
        <div className="eyebrow" style={{marginBottom:10}}>Liabilities</div>
        <div className="card-flush">
          {liabRows.map(row => (
            <div key={row.label} className="nw-row">
              <div className="nw-row-left">
                <div className="nw-dot" style={{background:row.color, opacity:row.val>0?1:0.3}}/>
                <span className="nw-label">{row.label}</span>
              </div>
              <input className="nw-input" type="number" min="0" step="0.01"
                value={row.val||''}
                onChange={e => row.onChange(parseFloat(e.target.value)||0)}
                onBlur={e  => row.onChange(parseFloat(e.target.value)||0)}
                onKeyDown={e => e.key==='Enter' && e.target.blur()}
              />
            </div>
          ))}
          {totalLiab === 0 && (
            <div style={{padding:'14px 20px',fontSize:'.8rem',color:'var(--t4)'}}>Zero debt. 🎉</div>
          )}
        </div>
      </div>

      {/* Net Worth Over Time chart */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div className="card-label" style={{margin:0}}>Net Worth Over Time</div>
          {hist.length > 0 && (
            <span style={{fontSize:'.65rem',color:'var(--t3)'}}>{hist.length} snapshot{hist.length!==1?'s':''}</span>
          )}
        </div>
        <SvgLine history={hist} />
        {hist.length > 0 && (
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            {[...hist].reverse().slice(0,6).map(h => (
              <div key={h.month} style={{
                background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'var(--r-s)',
                padding:'7px 12px',flex:'1',minWidth:72,
              }}>
                <div style={{fontSize:'.58rem',color:'var(--t3)',fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:3}}>
                  {fmtMonth(h.month)}
                </div>
                <div style={{fontSize:'.88rem',fontWeight:700,fontVariantNumeric:'tabular-nums',
                  color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                  {currency(h.netWorth)}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Asset breakdown (bar chart) */}
      {totalAssets > 0 && (
        <div className="card">
          <div className="card-label">Asset Breakdown</div>
          {assetRows.filter(a=>a.val>0).map(a => (
            <HBar key={a.label} label={a.label} value={a.val} max={totalAssets} color={a.color}/>
          ))}
        </div>
      )}

      {/* Goal progress */}
      <div className="card">
        <div className="card-label">Goal Progress</div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {[
            { label:`HYSA — ${currency(hysaBal)} / ${currency(settings.hysaGoal)}`,              val:hysaBal, max:settings.hysaGoal,          color:'var(--accent)' },
            { label:`Roth IRA — ${currency(rothBal)} / ${currency(settings.rothIRAYearlyLimit)}`, val:rothBal, max:settings.rothIRAYearlyLimit, color:'var(--purple)' },
            { label:`401(k) — ${currency(k401Bal)} / ${currency(settings.ira401kYearlyMax)}`,     val:k401Bal, max:settings.ira401kYearlyMax,   color:'var(--yellow)' },
          ].map(g => (
            <div key={g.label}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
                <span style={{fontSize:'.78rem',color:'var(--t2)'}}>{g.label}</span>
                <span style={{fontSize:'.78rem',fontWeight:600,color:g.color}}>
                  {g.max>0 ? pct(Math.min((g.val/g.max)*100,100)) : '0.0%'}
                </span>
              </div>
              <Bar value={g.val} max={g.max} color={g.color} lg/>
            </div>
          ))}
        </div>
      </div>

      {/* Spending by category */}
      {topCats.length > 0 && (
        <div className="card">
          <div className="card-label">All-Time Spending</div>
          {topCats.map(([cat,amt]) => (
            <HBar key={cat} label={cat.charAt(0).toUpperCase()+cat.slice(1)}
              value={amt} max={maxCatSpend} color={CAT_COLOR[cat]||'var(--t3)'}/>
          ))}
        </div>
      )}

      {/* Monthly history table */}
      {histWithDelta.length > 0 && (
        <div className="card">
          <div className="card-label">Monthly History</div>
          <div className="hist-row" style={{paddingBottom:8}}>
            <span className="hist-head">Month</span>
            <span className="hist-head" style={{textAlign:'right'}}>Net Worth</span>
            <span className="hist-head" style={{textAlign:'right'}}>Change</span>
            <span/>
          </div>
          {[...histWithDelta].reverse().map(h => (
            <div key={h.month} className="hist-row">
              <span style={{fontSize:'.8rem',fontWeight:500,color:'var(--t1)'}}>{fmtMonth(h.month)}</span>
              <span className="hist-mono" style={{textAlign:'right',color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                {currency(h.netWorth)}
              </span>
              <span className="hist-mono" style={{textAlign:'right',fontSize:'.72rem',
                color:h.delta==null?'var(--t3)':h.delta>=0?'var(--accent)':'var(--red)'}}>
                {h.delta==null ? '—' : `${h.delta>=0?'+':''}${currency(h.delta)}`}
                {h.deltaPct!=null && (
                  <span style={{color:'var(--t3)',marginLeft:3}}>
                    ({h.deltaPct>=0?'+':''}{h.deltaPct.toFixed(1)}%)
                  </span>
                )}
              </span>
              <button className="btn-icon btn-icon-del" style={{justifySelf:'end'}}
                onClick={()=>delSnapshot(h.month)} title="Delete">✕</button>
            </div>
          ))}
        </div>
      )}

    </div>
  );
}

function App() {
  const [tab,setTab]           = useState('dashboard');
  const [settings,setSettings] = usePersist('fd_settings',    DEFAULT_SETTINGS, migrateSettings);
  const [transactions,setTx]   = usePersist('fd_transactions', []);
  const [goals,setGoals]       = usePersist('fd_goals',        DEFAULT_GOALS,    migrateGoals);
  const [commissions,setComm]  = usePersist('fd_commissions',  []);
  const [nwData,setNwData]     = usePersist('fd_networth',     DEFAULT_NETWORTH);

  // ── App-wide goal-ETA tracking ────────────────────────────────────────
  // Runs on ANY balance change (paycheck, commission split, manual update).
  // Records each goal's precise days-to-target and, when the ETA moves sooner,
  // writes a session-scoped "moved up X" highlight the Goals tab reads.
  useEffect(() => {
    let prev = {}; try { prev = JSON.parse(localStorage.getItem('fd_eta_prev')||'{}'); } catch {}
    let hl = {};   try { hl   = JSON.parse(sessionStorage.getItem('fd_eta_hl')||'{}'); } catch {}
    const next = { ...prev };
    // Blended across BOTH scenarios — never read one scenario's figure as if
    // it applied to the other (that is what made the two look linked).
    const hysaRate = blendedRate(settings, 'hysa');
    const rothRate = blendedRate(settings, 'rothIRA');
    const hysaBal  = goals.hysaBalance || 0;
    const rothBal  = currentRothBal(settings, goals);
    const track = (key, rem, rate, done) => {
      if (done) { next[key] = 0; delete hl[key]; return; }
      if (!(rate > 0)) return;
      const days = rem > 0 ? (rem / rate) * 30.44 : 0;
      if (prev[key] == null) { next[key] = days; return; }          // baseline only
      if (days < prev[key] - 2) { hl[key] = { days: prev[key]-days }; next[key] = days; }
      else if (days > prev[key] + 2) { next[key] = days; delete hl[key]; }
    };
    track('hysa', Math.max(settings.hysaGoal - hysaBal, 0), hysaRate, hysaBal >= settings.hysaGoal);
    track('roth', Math.max(settings.rothIRAYearlyLimit - rothBal, 0), rothRate, rothBal >= settings.rothIRAYearlyLimit);
    localStorage.setItem('fd_eta_prev', JSON.stringify(next));
    try { sessionStorage.setItem('fd_eta_hl', JSON.stringify(hl)); } catch {}
  }, [goals, settings]);

  const pages = {
    dashboard:  <Dashboard  settings={settings} transactions={transactions} goals={goals} commissions={commissions} setGoals={setGoals} setTransactions={setTx} />,
    budget:     <Budget     settings={settings} transactions={transactions} />,
    spending:   <Spending   settings={settings} transactions={transactions} setTransactions={setTx} />,
    goals:      <Goals      settings={settings} goals={goals} setGoals={setGoals} commissions={commissions} transactions={transactions} />,
    commission: <Commission settings={settings} commissions={commissions} setCommissions={setComm} setGoals={setGoals} />,
    networth:   <NetWorth   netWorth={nwData} setNetWorth={setNwData} transactions={transactions} goals={goals} setGoals={setGoals} settings={settings} />,
    settings:   <Settings   settings={settings} setSettings={useCallback(s=>setSettings(s),[])} />,
  };

  return (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <div className="logo"><div className="logo-dot" />Finance</div>
          <nav className="nav">
            {TABS.map(t=>(
              <button key={t.id} className={'nav-btn'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
                {t.label}
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="main">{pages[tab]}</main>
      <nav className="mobile-nav">
        {TABS.map(t=>(
          <button key={t.id} className={'mnav-btn'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
            <NavIcon name={t.icon} active={tab===t.id} />
            {tab===t.id && <div className="nav-pip" />}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  function run(){
    var src=document.getElementById('app-src').textContent;
    var compiled=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
    eval(compiled);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
// Register service worker for PWA / offline support
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
