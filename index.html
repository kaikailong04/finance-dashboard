function HBar({ label, value, max, color }) {
  const w = max > 0 ? Math.min((value/max)*100,100) : 0;
  return (
    <div className="hbar-row">
      <div className="hbar-label">{label}</div>
      <div className="hbar-track"><div className="hbar-fill" style={{width:`${w}%`,background:color}} /></div>
      <div className="hbar-val">{currency(value)}</div>
    </div>
  );
}

function SvgLine({ history }) {
  if (history.length < 2) return (
    <div className="chart-wrap" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:100}}>
      <span style={{color:'var(--t3)',fontSize:'.75rem'}}>Save 2+ monthly snapshots to see the trend</span>
    </div>
  );

  // Layout constants
  const VW=560, VH=160, PL=58, PR=10, PT=10, PB=32;
  const IW = VW-PL-PR, IH = VH-PT-PB;

  const vals = history.map(h=>h.netWorth);
  const rawMin = Math.min(...vals);
  const rawMax = Math.max(...vals);
  // Always include 0 so the zero line is visible
  const minV = Math.min(rawMin, 0);
  const maxV = Math.max(rawMax, 0) || 1;
  const range = maxV - minV || 1;

  const toX = i  => PL + (history.length > 1 ? (i/(history.length-1)) : 0.5) * IW;
  const toY = v  => PT + IH - ((v - minV) / range) * IH;

  const pts = history.map((h,i) => ({ x:toX(i), y:toY(h.netWorth), month:h.month, val:h.netWorth }));
  const lineStr  = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const fillStr  = `${pts[0].x},${toY(0)} ${lineStr} ${pts[pts.length-1].x},${toY(0)}`;

  const up = vals[vals.length-1] >= vals[0];
  const stroke   = up ? '#22c55e' : '#ef4444';
  const fillClr  = up ? 'rgba(34,197,94,.08)' : 'rgba(239,68,68,.08)';

  // Y-axis: 3 evenly spaced labels
  const yTicks = [maxV, (maxV+minV)/2, minV];
  const fmtY = v => {
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1000000) return `${sign}$${(abs/1000000).toFixed(1)}M`;
    if (abs >= 1000)    return `${sign}$${(abs/1000).toFixed(0)}k`;
    return `${sign}$${abs.toFixed(0)}`;
  };

  // X-axis labels — skip every other if crowded
  const fmtX = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short'})+" '"+String(+y).slice(2);
  };

  // Zero line (only if range spans positive and negative)
  const showZero = minV < 0 && maxV > 0;

  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:'100%',display:'block'}}>
        {/* Horizontal grid lines at each y-tick */}
        {yTicks.map((v,i) => (
          <line key={i} x1={PL} y1={toY(v)} x2={VW-PR} y2={toY(v)}
            style={{stroke:'var(--chart-grid)'}} strokeWidth="1" strokeDasharray="3,5" />
        ))}
        {/* Zero line (bolder when range crosses zero) */}
        {showZero && (
          <line x1={PL} y1={toY(0)} x2={VW-PR} y2={toY(0)}
            style={{stroke:'var(--chart-zero)'}} strokeWidth="1.5" />
        )}
        {/* Y-axis labels */}
        {yTicks.map((v,i) => (
          <text key={i} x={PL-6} y={toY(v)+5} textAnchor="end"
            style={{fill:'var(--chart-axis)'}} fontSize="17" fontFamily="Inter,system-ui,sans-serif">
            {fmtY(v)}
          </text>
        ))}
        {/* Fill area */}
        <polygon points={fillStr} fill={fillClr} />
        {/* Line */}
        <polyline points={lineStr} fill="none" stroke={stroke} strokeWidth="2" />
        {/* Dots */}
        {pts.map((p,i) => (
          <circle key={i} cx={p.x} cy={p.y} r="4.5" fill={stroke} />
        ))}
        {/* X-axis labels */}
        {pts.map((p,i) => {
          if (history.length > 8 && i % 2 !== 0) return null;
          const anchor = i===0 ? 'start' : i===pts.length-1 ? 'end' : 'middle';
          return (
            <text key={i} x={p.x} y={VH-4} textAnchor={anchor}
              style={{fill:'var(--chart-axis)'}} fontSize="17" fontFamily="Inter,system-ui,sans-serif">
              {fmtX(p.month)}
            </text>
          );
        })}
      </svg>
    </div>
  );
}

// ── Net Worth page ────────────────────────────────────────────────────────
function NetWorth({ netWorth, setNetWorth, transactions, goals, setGoals, settings, accounts }) {
  const acc  = netWorth.accounts || {};
  const hist = netWorth.history  || [];

  // Balances — HYSA / Roth / 401k come from fd_goals (single source of truth).
  // Each account stays its own category: HYSA is cash savings, Roth is
  // retirement investments, and the 401(k) is split employee vs employer.
  const hysaBal  = goals.hysaBalance   || 0;
  const rothBal  = goals.rothIRAOverride != null ? goals.rothIRAOverride : 0;
  const k401Emp  = goals.k401Employee  || 0;
  const k401Empr = goals.k401Employer  || 0;
  const k401Bal  = round2(k401Emp + k401Empr);          // derived, not editable
  // This year's contributions — for the IRS-limit "Goal Progress" card
  // below, never the all-time balance above (PRD §15).
  const rothYTD    = ytdRothContributions(transactions, new Date().getFullYear());
  const k401EmpYTD = ytd401kEmployeeContributions(transactions, new Date().getFullYear());

  const setHYSA = v => setGoals(g => ({ ...g, hysaBalance:     v }));
  const setRoth = v => setGoals(g => ({ ...g, rothIRAOverride: v }));
  const set401kEmp  = v => setGoals(g => ({ ...g, k401Employee: v, ira401kBalance: round2(v + (g.k401Employer||0)) }));
  const set401kEmpr = v => setGoals(g => ({ ...g, k401Employer: v, ira401kBalance: round2((g.k401Employee||0) + v) }));
  const setAcc  = (key, val) => setNetWorth(s => ({ ...s, accounts: { ...s.accounts, [key]: val } }));

  // Net worth is computed from STORED BALANCES ONLY. Contribution history
  // (paycheck 401(k) rows, HYSA allocations) explains how these balances grew —
  // adding it on top of the balances would double-count, so it never is.
  const snap        = getNetWorthSnapshot(acc, goals, accounts, { settings, goals, netWorth });
  const totalAssets = snap.assets;
  const totalLiab   = snap.liabilities;
  const nw          = snap.netWorth;
  const isPos       = nw >= 0;

  // Dynamic/custom accounts (Cash, Crypto, an extra card, ...) aren't part of
  // the legacy 4-field nwData.accounts object — fold them into the breakdown
  // list too so it stays consistent with the snapshot total above.
  const acctCtx      = { settings, goals, netWorth };
  const dynamicRows  = (accounts||[]).filter(a => !a.archived && !a.linked).map(a => {
    const val      = Math.abs(accountBalance(a, acctCtx));
    const liability = isLiabilityType(a.type);
    return { key:'dyn-'+a.id, label:a.name, val, tag: accountTypeInfo(a.type).label, prev:null, neg:liability };
  });

  // Snapshot logic
  const now      = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const hasMonth = hist.some(h => h.month === monthKey);
  const [nwRange, setNwRange] = useState(12);

  const saveSnapshot = () => {
    // Records the composition too, so the trend can show cash vs retirement.
    const entry = {
      month:monthKey, netWorth:nw, assets:totalAssets, liabilities:totalLiab,
      cash:snap.cash, retirement:snap.retirement, other:snap.other,
    };
    setNetWorth(s => ({
      ...s,
      history: [...(s.history||[]).filter(h=>h.month!==monthKey), entry]
        .sort((a,b) => a.month.localeCompare(b.month)),
    }));
  };
  const delSnapshot = m => setNetWorth(s => ({ ...s, history: (s.history||[]).filter(h=>h.month!==m) }));

  // Older snapshots stored only {netWorth, assets, liabilities}. Read them
  // defensively rather than rewriting them — migrating in place would invent
  // a cash/retirement split that was never actually recorded.
  const histSorted = [...hist].filter(h => h && h.month).sort((a,b)=>a.month.localeCompare(b.month));
  const prevSnap   = histSorted.filter(h => h.month < monthKey).slice(-1)[0] || null;
  const yearStart  = histSorted.filter(h => h.month <= `${now.getFullYear()}-01`).slice(-1)[0]
                     || histSorted.find(h => h.month.startsWith(String(now.getFullYear()))) || null;

  const deltaMonth   = prevSnap ? round2(nw - safeNum(prevSnap.netWorth)) : null;
  const deltaMonthPct= prevSnap && safeNum(prevSnap.netWorth) !== 0
    ? (nw - safeNum(prevSnap.netWorth)) / Math.abs(safeNum(prevSnap.netWorth)) * 100 : null;
  const deltaYTD     = yearStart ? round2(nw - safeNum(yearStart.netWorth)) : null;
  const deltaYTDPct  = yearStart && safeNum(yearStart.netWorth) !== 0
    ? (nw - safeNum(yearStart.netWorth)) / Math.abs(safeNum(yearStart.netWorth)) * 100 : null;

  // Trend series. Current (unsaved) month is appended so the chart always
  // reflects what the page is showing.
  const nwTrend = (() => {
    const rows = [...histSorted.filter(h => h.month !== monthKey),
                  { month:monthKey, netWorth:nw, cash:snap.cash, retirement:snap.retirement }];
    const cut = nwRange === 'all' ? rows
      : nwRange === 'ytd' ? rows.filter(h => h.month.startsWith(String(now.getFullYear())))
      : rows.slice(-nwRange);
    return {
      labels: cut.map(h => {
        const [y,m] = h.month.split('-');
        return `${MONTH_NAMES[+m-1].slice(0,3)} '${y.slice(2)}`;
      }),
      net:   cut.map(h => safeNum(h.netWorth)),
      cash:  cut.map(h => safeNum(h.cash)),
      ret:   cut.map(h => safeNum(h.retirement)),
      hasComposition: cut.some(h => h.cash != null || h.retirement != null),
      count: cut.length,
    };
  })();

  const prevOf = key => prevSnap && prevSnap[key] != null ? safeNum(prevSnap[key]) : null;

  // Spending by category (all-time)
  const catSpend = {};
  for (const t of transactions.filter(t=>t.type==='expense'))
    catSpend[t.category] = (catSpend[t.category]||0) + t.amount;
  const topCats     = Object.entries(catSpend).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCatSpend = topCats[0]?.[1] || 1;
  const CAT_COLOR   = {
    housing:'var(--accent)',groceries:'var(--accent)',gas:'var(--yellow)',
    dining:'#f97316',shopping:'var(--purple)',travel:'#06b6d4',
    utilities:'var(--yellow)',savings:'var(--accent)',other:'var(--t3)',
  };

  // History deltas
  const histWithDelta = hist.map((h,i) => {
    const prev     = hist[i-1];
    const delta    = prev ? h.netWorth - prev.netWorth : null;
    const deltaPct = prev && prev.netWorth !== 0 ? (delta/Math.abs(prev.netWorth))*100 : null;
    return { ...h, delta, deltaPct };
  });

  const fmtMonth = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
  };

  // Asset rows for display
  const assetRows = [
    { label:'Checking',              color:'var(--accent)', val:acc.checking||0,   onChange:v=>setAcc('checking',v),   synced:false },
    { label:'HYSA / Emergency Fund', color:'var(--accent)', val:hysaBal,            onChange:setHYSA,                   synced:true  },
    { label:'Roth IRA',              color:'var(--purple)', val:rothBal,            onChange:setRoth,                   synced:true  },
    { label:'401(k) — Employee',     color:'var(--yellow)', val:k401Emp,            onChange:set401kEmp,                synced:true  },
    { label:'401(k) — Employer',     color:'var(--purple)', val:k401Empr,           onChange:set401kEmpr,               synced:true  },
    { label:'Taxable Brokerage',     color:'#06b6d4',       val:acc.brokerage||0,  onChange:v=>setAcc('brokerage',v),  synced:false },
  ];
  const liabRows = [
    { label:'Credit Card',        color:'var(--red)',  val:acc.creditCard||0, onChange:v=>setAcc('creditCard',v) },
    { label:'Loans / Other Debt', color:'#f97316',    val:acc.loans||0,      onChange:v=>setAcc('loans',v)      },
  ];

  return (
    <div className="page">

      {/* Hero */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>
            Net Worth · {now.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
          </div>
          <div className="mega" style={{color:isPos?'var(--accent)':'var(--red)'}}><CountUp value={nw} format={v=>currency(v)}/></div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {currency(totalAssets)} assets — {currency(totalLiab)} liabilities
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={saveSnapshot}>
          {hasMonth ? 'Update' : 'Snapshot'}
        </button>
      </div>

      {/* Composition + change cards */}
      <div className="ins-cards">
        <div className="ins-card">
          {/* "Cash" implied all of this was immediately spendable, but HYSA
              — while liquid — isn't quite the same as checking cash on
              hand (PRD §15: "replace 'Cash · spendable' with 'Liquid
              assets'"). */}
          <span className="ins-card-lbl">Liquid Assets</span>
          <span className="ins-card-val">{money2(snap.cash)}</span>
          <span className="ins-card-sub">checking + HYSA</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Retirement</span>
          <span className="ins-card-val" style={{color:'var(--purple)'}}>{money2(snap.retirement)}</span>
          <span className="ins-card-sub">Roth + 401(k) · not spendable</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Other Investments</span>
          <span className="ins-card-val">{money2(snap.other)}</span>
          <span className="ins-card-sub">taxable brokerage</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Liabilities</span>
          <span className="ins-card-val" style={{color:totalLiab>0?'var(--red)':'var(--t1)'}}>{money2(totalLiab)}</span>
          <span className="ins-card-sub">cards + loans</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Change vs. Last Month</span>
          <span className="ins-card-val" style={{color:deltaMonth==null?'var(--t1)':deltaMonth>=0?'var(--accent)':'var(--red)'}}>
            {deltaMonth==null?'—':`${deltaMonth>=0?'+':'−'}${money2(Math.abs(deltaMonth))}`}
          </span>
          <span className="ins-card-sub">
            {deltaMonth==null ? 'no earlier snapshot yet'
              : deltaMonthPct==null ? `was ${money2(prevSnap.netWorth)}`
              : `${deltaMonthPct>=0?'+':''}${deltaMonthPct.toFixed(1)}% · was ${money2(prevSnap.netWorth)}`}
          </span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Change YTD</span>
          <span className="ins-card-val" style={{color:deltaYTD==null?'var(--t1)':deltaYTD>=0?'var(--accent)':'var(--red)'}}>
            {deltaYTD==null?'—':`${deltaYTD>=0?'+':'−'}${money2(Math.abs(deltaYTD))}`}
          </span>
          <span className="ins-card-sub">
            {deltaYTD==null ? 'no snapshot this year yet'
              : deltaYTDPct==null ? `since ${yearStart.month}`
              : `${deltaYTDPct>=0?'+':''}${deltaYTDPct.toFixed(1)}% since ${yearStart.month}`}
          </span>
        </div>
      </div>

      {/* Net worth trend */}
      <div>
        <div className="cal-head">
          <div className="section-head" style={{padding:0,marginBottom:0}}>Net Worth Over Time</div>
          <div className="seg" role="group" aria-label="Net worth range">
            {[[3,'3M'],[6,'6M'],[12,'12M'],['ytd','YTD'],['all','All']].map(([v,l]) => (
              <button key={l} className={nwRange===v?'on':''} onClick={()=>setNwRange(v)}>{l}</button>
            ))}
          </div>
        </div>
        <div className="card">
          {nwTrend.count < 2 ? (
            <VizEmpty
              message={histSorted.length===0
                ? 'Add account balances to begin tracking net worth.'
                : 'Only one snapshot so far — take another next month to see a trend.'}
              hint="Tap Snapshot above to record this month's totals."/>
          ) : (
            <LineTrendChart
              labels={nwTrend.labels}
              series={[
                { key:'net',  label:'Net worth',  color:VIZ_SERIES[0], points:nwTrend.net },
                ...(nwTrend.hasComposition ? [
                  { key:'cash', label:'Cash',       color:VIZ_SERIES[2], points:nwTrend.cash },
                  { key:'ret',  label:'Retirement', color:VIZ_SERIES[6], points:nwTrend.ret },
                ] : []),
              ]}/>
          )}
          {histSorted.length > 0 && !nwTrend.hasComposition && (
            <div style={{fontSize:'.64rem',color:'var(--t3)',marginTop:8}}>
              Earlier snapshots pre-date cash/retirement tracking, so only total net worth is plotted for those months.
            </div>
          )}
        </div>
      </div>

      {/* Assets vs liabilities stat strip */}
      <div style={{display:'flex',gap:0}}>
        {[
          { lbl:'Assets',      val:currency(totalAssets), c:'var(--accent)' },
          { lbl:'Liabilities', val:currency(totalLiab),   c:totalLiab>0?'var(--red)':'var(--t3)' },
          { lbl:'Net',         val:currency(nw),           c:isPos?'var(--accent)':'var(--red)' },
        ].map((s,i,arr) => (
          <div key={s.lbl} style={{
            flex:1, paddingRight:i<arr.length-1?16:0, marginRight:i<arr.length-1?16:0,
            borderRight:i<arr.length-1?'1px solid var(--border)':'none',
          }}>
            <div style={{fontSize:'.6rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:5}}>{s.lbl}</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums',color:s.c}}>{s.val}</div>
          </div>
        ))}
      </div>

      {/* Assets */}
      <div>
        <div className="eyebrow" style={{marginBottom:10}}>Assets</div>
        <div className="card-flush">
          {assetRows.map(row => (
            <div key={row.label} className="nw-row">
              <div className="nw-row-left">
                <div className="nw-dot" style={{background:row.color, opacity:row.val>0?1:0.3}}/>
                <div>
                  <span className="nw-label">{row.label}</span>
                  {row.synced && <span style={{fontSize:'.6rem',color:'var(--t4)',marginLeft:6}}>synced</span>}
                </div>
              </div>
              <input className="nw-input" type="number" min="0" step="0.01"
                value={row.val||''}
                onChange={e => row.onChange(parseFloat(e.target.value)||0)}
                onBlur={e  => row.onChange(parseFloat(e.target.value)||0)}
                onKeyDown={e => e.key==='Enter' && e.target.blur()}
              />
            </div>
          ))}
        </div>
      </div>

      {/* Account breakdown — share of net worth + month-over-month change */}
      <div>
        <div className="eyebrow" style={{marginBottom:10}}>Account Breakdown</div>
        <div className="card-flush">
          {[
            { key:'checking',   label:'Checking',          val:safeNum(acc.checking),  tag:'Cash',       prev:prevOf('cash') },
            { key:'hysa',       label:'HYSA',              val:hysaBal,                tag:'Cash',       prev:null },
            { key:'roth',       label:'Roth IRA',          val:rothBal,                tag:'Retirement', prev:null },
            { key:'k401e',      label:'401(k) — Employee', val:k401Emp,                tag:'Retirement', prev:null },
            { key:'k401r',      label:'401(k) — Employer', val:k401Empr,               tag:'Employer',   prev:null },
            { key:'brokerage',  label:'Taxable Brokerage', val:safeNum(acc.brokerage), tag:'Investment', prev:null },
            { key:'cc',         label:'Credit Card',       val:safeNum(acc.creditCard),tag:'Liability',  prev:null, neg:true },
            { key:'loans',      label:'Loans / Other Debt',val:safeNum(acc.loans),     tag:'Liability',  prev:null, neg:true },
            ...dynamicRows,
          ].filter(r => r.val !== 0).map(r => (
            <div key={r.key} className="nwa-row">
              <div style={{minWidth:0}}>
                <div>
                  <span className="nwa-name">{r.label}</span>
                  <span className="nwa-tag">{r.tag}</span>
                </div>
                <div className="nwa-meta">
                  {r.neg ? 'reduces net worth' : `${safePct(r.val, totalAssets).toFixed(1)}% of assets`}
                  {r.key==='k401r' && ' · employer money, not spendable cash'}
                </div>
              </div>
              <div className="nwa-val">
                <div className="nwa-amt" style={{color:r.neg?'var(--red)':'var(--t1)'}}>
                  {r.neg?'−':''}{money2(r.val)}
                </div>
                <div className="nwa-chg" style={{color:'var(--t3)'}}>
                  {nw !== 0 ? `${safePct(r.val, Math.abs(nw)).toFixed(1)}% of net worth` : '—'}
                </div>
              </div>
            </div>
          ))}
          {totalAssets === 0 && totalLiab === 0 && (
            <div style={{padding:'22px 15px'}}>
              <VizEmpty message="Add account balances to begin tracking net worth."
                hint="Enter balances in the Assets section above."/>
            </div>
          )}
        </div>
        {!prevSnap && (
          <div style={{fontSize:'.64rem',color:'var(--t3)',marginTop:8}}>
            Per-account month-over-month change appears once you have snapshots from two different months.
          </div>
        )}
      </div>

      {/* Liabilities */}
      <div>
        <div className="eyebrow" style={{marginBottom:10}}>Liabilities</div>
        <div className="card-flush">
          {liabRows.map(row => (
            <div key={row.label} className="nw-row">
              <div className="nw-row-left">
                <div className="nw-dot" style={{background:row.color, opacity:row.val>0?1:0.3}}/>
                <span className="nw-label">{row.label}</span>
              </div>
              <input className="nw-input" type="number" min="0" step="0.01"
                value={row.val||''}
                onChange={e => row.onChange(parseFloat(e.target.value)||0)}
                onBlur={e  => row.onChange(parseFloat(e.target.value)||0)}
                onKeyDown={e => e.key==='Enter' && e.target.blur()}
              />
            </div>
          ))}
          {totalLiab === 0 && (
            <div style={{padding:'14px 20px',fontSize:'.8rem',color:'var(--t4)'}}>Zero debt. 🎉</div>
          )}
        </div>
      </div>

      {/* Net Worth Over Time chart */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div className="card-label" style={{margin:0}}>Net Worth Over Time</div>
          {hist.length > 0 && (
            <span style={{fontSize:'.65rem',color:'var(--t3)'}}>{hist.length} snapshot{hist.length!==1?'s':''}</span>
          )}
        </div>
        <SvgLine history={hist} />
        {hist.length > 0 && (
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            {[...hist].reverse().slice(0,6).map(h => (
              <div key={h.month} style={{
                background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'var(--r-s)',
                padding:'7px 12px',flex:'1',minWidth:72,
              }}>
                <div style={{fontSize:'.58rem',color:'var(--t3)',fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:3}}>
                  {fmtMonth(h.month)}
                </div>
                <div style={{fontSize:'.88rem',fontWeight:700,fontVariantNumeric:'tabular-nums',
                  color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                  {currency(h.netWorth)}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Asset breakdown (bar chart) */}
      {totalAssets > 0 && (
        <div className="card">
          <div className="card-label">Asset Breakdown</div>
          {assetRows.filter(a=>a.val>0).map(a => (
            <HBar key={a.label} label={a.label} value={a.val} max={totalAssets} color={a.color}/>
          ))}
        </div>
      )}

      {/* Goal progress */}
      <div className="card">
        <div className="card-label">Goal Progress</div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {[
            { label:`HYSA — ${currency(hysaBal)} / ${currency(settings.hysaGoal)}`,                    val:hysaBal,     max:settings.hysaGoal,           color:'var(--accent)' },
            { label:`Roth IRA (this year) — ${currency(rothYTD)} / ${currency(settings.rothIRAYearlyLimit)}`,    val:rothYTD,     max:settings.rothIRAYearlyLimit, color:'var(--purple)' },
            { label:`401(k) employee (this year) — ${currency(k401EmpYTD)} / ${currency(settings.ira401kYearlyMax)}`, val:k401EmpYTD, max:settings.ira401kYearlyMax,   color:'var(--yellow)' },
          ].map(g => (
            <div key={g.label}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
                <span style={{fontSize:'.78rem',color:'var(--t2)'}}>{g.label}</span>
                <span style={{fontSize:'.78rem',fontWeight:600,color:g.color}}>
                  {g.max>0 ? pct(Math.min((g.val/g.max)*100,100)) : '0.0%'}
                </span>
              </div>
              <Bar value={g.val} max={g.max} color={g.color} lg/>
            </div>
          ))}
        </div>
      </div>

      {/* Spending by category */}
      {topCats.length > 0 && (
        <div className="card">
          <div className="card-label">All-Time Spending</div>
          {topCats.map(([cat,amt]) => (
            <HBar key={cat} label={cat.charAt(0).toUpperCase()+cat.slice(1)}
              value={amt} max={maxCatSpend} color={CAT_COLOR[cat]||'var(--t3)'}/>
          ))}
        </div>
      )}

      {/* Monthly history table */}
      {histWithDelta.length > 0 && (
        <div className="card">
          <div className="card-label">Monthly History</div>
          <div className="hist-row" style={{paddingBottom:8}}>
            <span className="hist-head">Month</span>
            <span className="hist-head" style={{textAlign:'right'}}>Net Worth</span>
            <span className="hist-head" style={{textAlign:'right'}}>Change</span>
            <span/>
          </div>
          {[...histWithDelta].reverse().map(h => (
            <div key={h.month} className="hist-row">
              <span style={{fontSize:'.8rem',fontWeight:500,color:'var(--t1)'}}>{fmtMonth(h.month)}</span>
              <span className="hist-mono" style={{textAlign:'right',color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                {currency(h.netWorth)}
              </span>
              <span className="hist-mono" style={{textAlign:'right',fontSize:'.72rem',
                color:h.delta==null?'var(--t3)':h.delta>=0?'var(--accent)':'var(--red)'}}>
                {h.delta==null ? '—' : `${h.delta>=0?'+':''}${currency(h.delta)}`}
                {h.deltaPct!=null && (
                  <span style={{color:'var(--t3)',marginLeft:3}}>
                    ({h.deltaPct>=0?'+':''}{h.deltaPct.toFixed(1)}%)
                  </span>
                )}
              </span>
              <button className="btn-icon btn-icon-del" style={{justifySelf:'end'}}
                onClick={()=>delSnapshot(h.month)} aria-label={`Delete ${h.month} snapshot`} title="Delete">✕</button>
            </div>
          ))}
        </div>
      )}

    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// ADD TRANSACTION (v2) — the heart of the app. One sheet, three transaction
// types, a payment method that filters the account list down to the
// accounts that method could actually touch, and a live credit-card
// snapshot that expands automatically once a credit account is selected.
// ══════════════════════════════════════════════════════════════════════
const PAYMENT_METHODS = ['Debit Card','Credit Card','Cash','Bank Transfer','Apple Pay','Venmo','PayPal'];
const QUICK_ADD_PRESETS = [
  { label:'Coffee',    icon:'coffee', category:'dining',    merchant:'Coffee Shop' },
  { label:'Dining',    icon:'fork',   category:'dining',    merchant:'' },
  { label:'Groceries', icon:'cart',   category:'groceries', merchant:'' },
  { label:'Gas',       icon:'fuel',   category:'gas',       merchant:'' },
  { label:'Shopping',  icon:'bag',    category:'shopping',  merchant:'' },
];
// Long-press the FAB — the same five quick chips plus the three
// transaction-type shortcuts that don't fit "expense + category".
const QUICK_ADD_MENU = [
  { label:'Coffee',    icon:'coffee',     preset:{ type:'expense', category:'dining', merchant:'Coffee Shop' } },
  { label:'Dining',    icon:'fork',       preset:{ type:'expense', category:'dining' } },
  { label:'Groceries', icon:'cart',       preset:{ type:'expense', category:'groceries' } },
  { label:'Gas',       icon:'fuel',       preset:{ type:'expense', category:'gas' } },
  { label:'Shopping',  icon:'bag',        preset:{ type:'expense', category:'shopping' } },
  { label:'Transfer',  icon:'swap',       preset:{ type:'transfer' } },
  { label:'Income',    icon:'trendUp',    preset:{ type:'income' } },
  { label:'Credit Card Payment', icon:'creditCard', preset:{ type:'transfer', isCardPayment:true } },
];
function accountsMatchingPaymentMethod(accounts, method) {
  const list = accounts || [];
  if (method === 'Credit Card') return list.filter(a => a.type === 'credit');
  if (method === 'Debit Card')  return list.filter(a => ['checking','savings','hysa'].includes(a.type));
  if (method === 'Cash')        return list.filter(a => a.type === 'cash');
  return list;   // Bank Transfer / Apple Pay / Venmo / PayPal can draw from any account
}
// The account a card payment should draw from by default — the checking
// account if there is one, otherwise whatever non-credit account exists.
function defaultPaymentSourceAccount(accounts, excludeAcct) {
  const list = (accounts||[]).filter(a => !a.archived && a.type!=='credit' && (!excludeAcct || a.id!==excludeAcct.id));
  return list.find(a => a.type==='checking') || list[0] || null;
}

function UtilizationRing({ pct, size=132, label='Utilization' }) {
  const clamped = Math.max(0, Math.min(safeNum(pct), 100));
  const r = (size-22)/2, c = 2*Math.PI*r;
  const color = utilizationColor(safeNum(pct));
  return (
    <div className="util-ring-wrap" style={{width:size,height:size}}>
      <svg className="util-ring-svg" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle className="util-ring-track" cx={size/2} cy={size/2} r={r}/>
        <circle className="util-ring-fill" cx={size/2} cy={size/2} r={r}
          stroke={color} strokeDasharray={c} strokeDashoffset={c*(1-clamped/100)}/>
      </svg>
      <div className="util-ring-center">
        <div className="util-ring-pct" style={{color}}>{safeNum(pct).toFixed(0)}%</div>
        <div className="util-ring-lbl">{label}</div>
      </div>
    </div>
  );
}

function AccountPickList({ accounts, ctx, selectedId, onSelect, excludeId }) {
  const list = excludeId ? accounts.filter(a=>a.id!==excludeId) : accounts;
  if (!list.length) return <div className="empty" style={{padding:'12px 0'}}>No eligible accounts yet — add one from the Accounts tab.</div>;
  return (
    <div className="acct-pick-grid">
      {list.map(a => (
        <button key={a.id} type="button" className={'acct-pick'+(selectedId===a.id?' on':'')} onClick={()=>onSelect(a.id)}>
          <span className="acct-pick-icon" style={{background:a.color+'22'}}><Icon name={a.icon} size={15} color={a.color}/></span>
          <span className="acct-pick-name">{a.name}</span>
          <span className="acct-pick-bal">{currency(accountBalance(a,ctx))}</span>
        </button>
      ))}
    </div>
  );
}

function AddTransactionModal({ onClose, accounts, transactions, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions, defaultAccountId, preset }) {
  const visibleAccounts = useMemo(() => (accounts||[]).filter(a=>!a.archived).sort((a,b)=>(a.order||0)-(b.order||0)), [accounts]);
  const defaultAcct = defaultAccountId ? visibleAccounts.find(a=>a.id===defaultAccountId) : null;
  const inferredMethod = defaultAcct
    ? (defaultAcct.type==='credit' ? 'Credit Card' : defaultAcct.type==='cash' ? 'Cash' : 'Debit Card')
    : 'Debit Card';

  const [type, setType]               = useState((preset && preset.type) || 'expense');
  const [amount, setAmount]           = useState((preset && preset.amount != null) ? String(preset.amount) : '');
  const [merchant, setMerchant]       = useState((preset && preset.merchant) || '');
  const [category, setCategory]       = useState((preset && preset.category) || 'other');
  const [date, setDate]               = useState(ymd(new Date()));
  const [notes, setNotes]             = useState('');
  const [paymentMethod, setPaymentMethod] = useState((preset && preset.paymentMethod) || inferredMethod);
  const [accountId, setAccountId]     = useState(defaultAcct ? defaultAcct.id : '');
  const [toAccountId, setToAccountId] = useState((preset && preset.toAccountId) || '');

  // ── Tags (Bonus) — free-text labels, separate from category. A grocery
  // run tagged "vacation" shows up under Groceries in Budget/Spending as
  // always, but can also be pulled out later by tag (Search & Filters).
  const [tags, setTags]         = useState([]);
  const [tagInput, setTagInput] = useState('');
  const addTag = () => {
    const t = tagInput.trim().replace(/^#/,'');
    if (t && !tags.some(x=>x.toLowerCase()===t.toLowerCase())) setTags(ts=>[...ts, t]);
    setTagInput('');
  };
  const removeTag = t => setTags(ts=>ts.filter(x=>x!==t));

  // ── Split Transactions (Bonus) — one purchase, multiple categories (e.g.
  // a Target run that's half Groceries, half Shopping). Splits are saved as
  // separate transaction rows sharing a splitGroupId, each its own
  // recordTransaction call so Budget/Spending total them per-category
  // exactly like any other transaction — no separate "split" code path
  // anywhere else in the app.
  const [splitMode, setSplitMode]   = useState(false);
  const [splits, setSplits]         = useState([{ category:'groceries', amount:'' }, { category:'shopping', amount:'' }]);
  const splitTotal = splits.reduce((s,r)=>s+(parseFloat(r.amount)||0), 0);
  const updateSplit = (i, patch) => setSplits(rows => rows.map((r,idx)=>idx===i?{...r,...patch}:r));
  const addSplitRow = () => setSplits(rows => [...rows, { category:'other', amount:'' }]);
  const removeSplitRow = i => setSplits(rows => rows.filter((_,idx)=>idx!==i));

  // ── Receipt Scanner (Priority 15) + receipt photo (Bonus) — the same scan
  // flow now also keeps a downscaled copy of the image on the saved
  // transaction, viewable later, not just used transiently for OCR.
  const [scanState, setScanState]     = useState('idle');   // idle | loading | scanning | done | error
  const [scanError, setScanError]     = useState('');
  const [scanPreview, setScanPreview] = useState(null);
  const [receiptImage, setReceiptImage] = useState(null);   // downscaled data URL, saved with the transaction
  const receiptInputRef = useRef(null);
  const handleReceiptFile = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setScanPreview(URL.createObjectURL(file));
    fileToReceiptDataURL(file).then(setReceiptImage).catch(()=>{});
    setScanState('loading'); setScanError('');
    try {
      const Tesseract = await loadTesseract();
      setScanState('scanning');
      const { data } = await Tesseract.recognize(file, 'eng');
      const parsed = parseReceiptText(data && data.text);
      setType('expense');
      if (parsed.merchant) setMerchant(parsed.merchant);
      if (parsed.amount != null) setAmount(String(parsed.amount));
      if (parsed.date) setDate(parsed.date);
      setCategory(suggestCategoryFromMerchant(parsed.merchant || ''));
      setPaymentMethod(suggestPaymentMethodFromReceiptText(data && data.text));
      if (parsed.tax != null) setNotes(n => n || `Tax: ${currency(parsed.tax,2)}`);
      setScanState('done');
    } catch (err) {
      setScanState('error');
      setScanError((err && err.message) || "Couldn't read that receipt — you can still fill the form in by hand.");
    }
  };

  const eligible = useMemo(() => accountsMatchingPaymentMethod(visibleAccounts, paymentMethod), [visibleAccounts, paymentMethod]);
  useEffect(() => {
    if (type === 'transfer') return;
    if (!eligible.find(a => a.id === accountId)) setAccountId(eligible[0] ? eligible[0].id : '');
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [paymentMethod, type]);

  const ctx = { accounts, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions };
  const selectedAccount = visibleAccounts.find(a => a.id === accountId) || null;
  const toAccount        = visibleAccounts.find(a => a.id === toAccountId) || null;
  const card             = selectedAccount && selectedAccount.type === 'credit' ? (selectedAccount.card || defaultCardFields()) : null;
  const amt              = parseFloat(amount) || 0;

  const balanceNow      = selectedAccount ? accountBalance(selectedAccount, ctx) : 0;
  const previewBalance  = card && type === 'expense' ? balanceNow + amt : balanceNow;
  const limit            = card ? safeNum(card.creditLimit) : 0;
  const utilNow           = card ? creditUtilization(balanceNow, limit) : 0;
  const utilStmt          = card ? creditUtilization(previewBalance, limit) : 0;
  const rewardEarn        = card && type === 'expense' ? rewardEarnAmount(card, amt, category) : 0;
  const closeDate         = card ? nextOccurrenceOfDay(card.statementCloseDay) : null;
  const dueDate            = card ? nextOccurrenceOfDay(card.dueDay) : null;

  const merchantOptions = useMemo(() => {
    const seen = new Set();
    for (const t of transactions || []) {
      const m = (t.merchant || t.description || '').trim();
      if (m) seen.add(m);
    }
    return [...seen].slice(0, 40);
  }, [transactions]);

  const isSplitting  = splitMode && type === 'expense';
  const splitRowsOk  = splits.every(r => r.category && (parseFloat(r.amount)||0) > 0);
  const splitMatches = Math.abs(round2(splitTotal) - round2(amt)) < 0.01;
  const valid = amt > 0
    && (type === 'transfer' ? (accountId && toAccountId && accountId !== toAccountId) : !!accountId)
    && (!isSplitting || (splits.length >= 2 && splitRowsOk && splitMatches));

  const handleSave = () => {
    if (!valid) return;
    if (isSplitting) {
      // Each split is its own real transaction (own category, own amount) —
      // Budget/Spending/Insights total them per-category automatically,
      // with zero split-aware code anywhere else in the app. splitGroupId
      // just lets the transaction list visually group them back together.
      const splitGroupId = 'split_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const merch = merchant.trim();
      splits.forEach((row, i) => {
        recordTransaction({
          date, type:'expense', amount: round2(parseFloat(row.amount)||0), category: row.category,
          description: (merch || catLabel(row.category)) + ` (split ${i+1}/${splits.length})`,
          merchant: merch, notes: notes.trim(), paymentMethod,
          accountId, account: selectedAccount ? selectedAccount.name : '',
          tags, splitGroupId, splitIndex: i, splitCount: splits.length,
          ...(i===0 && receiptImage ? { receiptImage } : {}),
        }, ctx);
      });
      onClose();
      return;
    }
    const partial = type === 'transfer' ? {
      date, type:'transfer', amount: round2(amt), category:'transfer',
      description: `Transfer · ${selectedAccount ? selectedAccount.name : ''} → ${toAccount ? toAccount.name : ''}`,
      merchant:'', notes: notes.trim(), paymentMethod:'Transfer',
      accountId, account: selectedAccount ? selectedAccount.name : '',
      toAccountId, toAccount: toAccount ? toAccount.name : '',
    } : {
      date, type, amount: round2(amt), category: type==='income' ? 'income' : category,
      description: merchant.trim() || (type==='income' ? 'Income' : catLabel(category)),
      merchant: merchant.trim(), notes: notes.trim(), paymentMethod,
      accountId, account: selectedAccount ? selectedAccount.name : '',
      ...(type==='expense' && tags.length ? { tags } : {}),
      ...(type==='expense' && receiptImage ? { receiptImage } : {}),
    };
    recordTransaction(partial, ctx);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">Add Transaction</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">

          <div className="type-toggle" role="group" aria-label="Transaction type">
            <button type="button" className={type==='expense'?'on':''} onClick={()=>setType('expense')}>Expense</button>
            <button type="button" className={'income'+(type==='income'?' on':'')} onClick={()=>setType('income')}>Income</button>
            <button type="button" className={'transfer'+(type==='transfer'?' on':'')} onClick={()=>setType('transfer')}>Transfer</button>
          </div>

          {type === 'expense' && (
            <div className="scan-box">
              <input ref={receiptInputRef} type="file" accept="image/*" capture="environment" style={{display:'none'}} onChange={handleReceiptFile}/>
              <button type="button" className="btn btn-ghost btn-full" disabled={scanState==='loading'||scanState==='scanning'}
                onClick={()=>receiptInputRef.current && receiptInputRef.current.click()}>
                <Icon name="receipt" size={14}/>
                {scanState==='loading' ? 'Loading scanner…' : scanState==='scanning' ? 'Reading receipt…' : 'Scan Receipt'}
              </button>
              {scanPreview && (
                <div className="scan-status">
                  <img src={scanPreview} alt="Receipt preview"/>
                  <div className={'scan-status-text'+(scanState==='error'?' err':'')}>
                    {scanState==='done'  && 'Detected merchant, amount, date & category below — review before saving.'}
                    {scanState==='error' && scanError}
                    {(scanState==='loading'||scanState==='scanning') && 'This can take a few seconds on the first scan.'}
                  </div>
                </div>
              )}
            </div>
          )}

          <div className="amt-hero">
            <span className="amt-hero-sign">$</span>
            <input type="number" inputMode="decimal" step="0.01" min="0" placeholder="0.00"
              value={amount} onChange={e=>setAmount(e.target.value)} autoFocus/>
          </div>

          {type !== 'transfer' && (
            <div className="quick-row">
              {QUICK_ADD_PRESETS.map(q => (
                <button key={q.label} type="button" className="quick-chip"
                  onClick={()=>{ setType('expense'); setCategory(q.category); if (q.merchant) setMerchant(q.merchant); }}>
                  <Icon name={q.icon} size={14} color="var(--t2)"/>{q.label}
                </button>
              ))}
            </div>
          )}

          {type === 'transfer' ? (
            <>
              <div className="fg"><label>From Account</label>
                <AccountPickList accounts={visibleAccounts} ctx={ctx} selectedId={accountId} onSelect={setAccountId}/>
              </div>
              <div className="fg"><label>To Account</label>
                <AccountPickList accounts={visibleAccounts} ctx={ctx} selectedId={toAccountId} onSelect={setToAccountId} excludeId={accountId}/>
              </div>
            </>
          ) : (
            <>
              <div className="fg">
                <label>{type==='income' ? 'Source' : 'Merchant'}</label>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  {type==='expense' && merchant.trim() && <MerchantLogo description={merchant} size={30}/>}
                  <input type="text" placeholder={type==='income' ? 'Paycheck, refund…' : 'Where did you spend?'}
                    value={merchant} onChange={e=>setMerchant(e.target.value)} list="merchant-suggestions" style={{flex:1}}/>
                </div>
                <datalist id="merchant-suggestions">
                  {merchantOptions.map(m => <option key={m} value={m}/>)}
                </datalist>
              </div>

              {type === 'expense' && (
                <div className="fg">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <label style={{marginBottom:0}}>Category</label>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setSplitMode(s=>!s)}>
                      <Icon name="swap" size={12}/>{splitMode ? 'Single category' : 'Split into categories'}
                    </button>
                  </div>
                  {!splitMode && (
                    <div className="cat-grid">
                      {CATEGORIES.filter(c => c.id!=='hysa' && c.id!=='rothIRA').map(c => (
                        <button key={c.id} type="button" className={'cat-chip'+(category===c.id?' on':'')} onClick={()=>setCategory(c.id)}>
                          <span className="cat-chip-dot" style={{background:c.color}}>{c.abbr.slice(0,2)}</span>
                          {c.label}
                        </button>
                      ))}
                    </div>
                  )}
                  {splitMode && (
                    <div className="split-rows">
                      {splits.map((row, i) => (
                        <div key={i} className="split-row">
                          <select value={row.category} onChange={e=>updateSplit(i,{category:e.target.value})}>
                            {CATEGORIES.filter(c => c.id!=='hysa' && c.id!=='rothIRA').map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                          </select>
                          <div className="split-amt">
                            <span>$</span>
                            <input type="number" inputMode="decimal" step="0.01" min="0" placeholder="0.00"
                              value={row.amount} onChange={e=>updateSplit(i,{amount:e.target.value})}/>
                          </div>
                          {splits.length > 2 && (
                            <button type="button" className="btn-icon" aria-label="Remove split" onClick={()=>removeSplitRow(i)}><Icon name="x" size={14}/></button>
                          )}
                        </div>
                      ))}
                      <button type="button" className="btn btn-ghost btn-sm" onClick={addSplitRow}>+ Add split</button>
                      <div className="split-total" style={{color: splitMatches ? 'var(--t3)' : 'var(--red)'}}>
                        Splits total {currency(splitTotal,2)} {amt>0 && `of ${currency(amt,2)}`}
                        {!splitMatches && amt>0 && ' — must match the amount above'}
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div className="fg"><label>Payment Method</label>
                <div className="pm-grid">
                  {PAYMENT_METHODS.map(m => (
                    <button key={m} type="button" className={'pm-chip'+(paymentMethod===m?' on':'')} onClick={()=>setPaymentMethod(m)}>{m}</button>
                  ))}
                </div>
              </div>

              <div className="fg"><label>Account</label>
                <AccountPickList accounts={eligible} ctx={ctx} selectedId={accountId} onSelect={setAccountId}/>
              </div>
            </>
          )}

          <div className="fgrid">
            <div className="fg"><label>Date</label>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
            </div>
            <div className="fg fspan"><label>Notes</label>
              <input type="text" placeholder="Optional" value={notes} onChange={e=>setNotes(e.target.value)}/>
            </div>
          </div>

          {type === 'expense' && (
            <div className="fg">
              <label>Tags</label>
              <div className="tag-input-row">
                {tags.map(t => (
                  <span key={t} className="tag-chip">#{t}<button type="button" aria-label={`Remove tag ${t}`} onClick={()=>removeTag(t)}>×</button></span>
                ))}
                <input type="text" placeholder={tags.length ? '' : 'vacation, work, reimbursable…'}
                  value={tagInput} onChange={e=>setTagInput(e.target.value)}
                  onKeyDown={e=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); addTag(); } }}
                  onBlur={addTag}/>
              </div>
            </div>
          )}

          {card && (
            <div className="cc-snapshot">
              <div className="cc-snapshot-hd"><Icon name="creditCard" size={14} color="var(--purple)"/>{selectedAccount.name}</div>
              <div className="cc-grid">
                <div className="cc-item"><div className="cc-item-lbl">Current Balance</div><div className="cc-item-val">{currency(balanceNow,2)}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Statement Balance</div><div className="cc-item-val">{currency(safeNum(card.statementBalance),2)}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Credit Limit</div><div className="cc-item-val">{currency(limit,2)}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Available Credit</div><div className="cc-item-val">{currency(Math.max(limit-previewBalance,0),2)}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Current Utilization</div><div className="cc-item-val" style={{color:utilizationColor(utilNow)}}>{utilNow.toFixed(1)}%</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Est. Statement Utilization</div><div className="cc-item-val" style={{color:utilizationColor(utilStmt)}}>{utilStmt.toFixed(1)}%</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Statement Closes</div><div className="cc-item-val">{closeDate?fmtShortDate(closeDate):'—'}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Payment Due</div><div className="cc-item-val">{dueDate?fmtShortDate(dueDate):'—'}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Minimum Payment</div><div className="cc-item-val">{currency(minPaymentFor(card,previewBalance),2)}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Autopay</div><div className="cc-item-val" style={{color:card.autopay?'var(--accent)':'var(--t3)'}}>{card.autopay?'On':'Off'}</div></div>
                <div className="cc-item"><div className="cc-item-lbl">Rewards Earned</div><div className="cc-item-val" style={{color:'var(--accent)'}}>{rewardEarn>0?`+${formatRewardAmount(card,rewardEarn)}`:'—'}</div></div>

// ACCOUNTS — dynamic account list + per-account dashboard. Nothing here
// is keyed off a hardcoded name; every row comes from fd_accounts.
// ══════════════════════════════════════════════════════════════════════
function monthlyAccountChange(transactions, acct, monthKey) {
  let delta = 0;
  for (const t of transactions || []) {
    if (!(t.date||'').startsWith(monthKey)) continue;
    const amt = safeNum(t.amount);
    if (t.type === 'transfer') {
      if (t.accountId === acct.id)   delta += isLiabilityType(acct.type) ?  amt : -amt;
      if (t.toAccountId === acct.id) delta += isLiabilityType(acct.type) ? -amt :  amt;
    } else if (t.accountId === acct.id) {
      if (t.type === 'expense') delta += isLiabilityType(acct.type) ?  amt : -amt;
      if (t.type === 'income')  delta += isLiabilityType(acct.type) ? -amt :  amt;
    }
  }
  return round2(delta);
}
function accountBalanceHistory(transactions, acct, ctx, months=6) {
  const now = new Date();
  const monthKeys = Array.from({length:months}, (_,i) => {
    const d = new Date(now.getFullYear(), now.getMonth()-(months-1-i), 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });
  const changes  = monthKeys.map(mk => monthlyAccountChange(transactions, acct, mk));
  const current  = accountBalance(acct, ctx);
  const balances = new Array(months);
  balances[months-1] = current;
  for (let i=months-2; i>=0; i--) balances[i] = round2(balances[i+1] - changes[i+1]);
  return {
    labels: monthKeys.map(mk => { const [y,m] = mk.split('-'); return `${MONTH_NAMES[+m-1].slice(0,3)} '${y.slice(2)}`; }),
    points: balances,
  };
}
// Lightweight rule-based insight — not a real model, but the same shape of
// sentence the fuller AI Spending Coach (a later pass) will replace this with.
function accountInsight(acct, ctx, stats) {
  if (acct.type === 'credit') {
    const card = acct.card || defaultCardFields();
    const bal  = accountBalance(acct, ctx);
    const util = creditUtilization(bal, card.creditLimit);
    if (bal <= 0) return 'No balance carried — nothing to pay down.';
    if (util <= 10) return `You're already under 10% utilization (${util.toFixed(0)}%). No early payment needed.`;
    const target = card.creditLimit * 0.10;
    const early   = Math.max(bal - target, 0);
    return `You're at ${util.toFixed(0)}% utilization. Paying ${currency(early)} before your statement closes would bring it to 10%. Utilization mostly matters right before you apply for new credit.`;
  }
  if (stats.avgMonthlySpend > 0 && stats.outFlow > stats.avgMonthlySpend * 1.15)
    return `Spending from this account is running about ${Math.round((stats.outFlow/stats.avgMonthlySpend-1)*100)}% above its average month.`;
  if (stats.inFlow > 0 || stats.outFlow > 0)
    return stats.inFlow >= stats.outFlow
      ? `Net positive this month — ${currency(stats.inFlow-stats.outFlow)} more in than out.`
      : `Net negative this month — ${currency(stats.outFlow-stats.inFlow)} more out than in.`;
  return 'No activity logged on this account yet.';
}

  const history    = paymentHistoryForCard(transactions, acct);

// ══════════════════════════════════════════════════════════════════════
// REWARDS SUMMARY (Priority 7) — rolls every credit card's rewards up into
// one view: lifetime total, by card, by category, by month. Cash back,
// miles, and points all convert to a comparable dollar estimate here (each
// card still shows its own native unit everywhere else in the app).
// ══════════════════════════════════════════════════════════════════════
function aggregateRewardsAcrossCards(accounts) {
  const cards = (accounts||[]).filter(a => a.type==='credit' && !a.archived).map(a => ({ acct:a, card:a.card || defaultCardFields() }));
  const byCard = cards.map(({acct,card}) => ({
    id:acct.id, name:acct.name, icon:acct.icon, color:acct.color,
    monthNative:formatRewardAmount(card,card.cashbackMonth), lifetimeNative:formatRewardAmount(card,card.cashbackLifetime),
    lifetimeValue: estimatedRewardValue(card, card.cashbackLifetime),
  })).sort((a,b) => b.lifetimeValue - a.lifetimeValue);
  const byCategory = {};
  for (const { card } of cards) {
    const monthly = card.rewardsEarnedMonth || zeroRewardBuckets();
    for (const k of REWARD_BUCKETS) byCategory[k] = round2((byCategory[k]||0) + estimatedRewardValue(card, monthly[k]));
  }
  const monthKeys = Array.from({length:6}, (_,i) => { const d=new Date(); d.setMonth(d.getMonth()-(5-i)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; });
  return {
    hasCards: cards.length > 0,
    totalLifetimeValue: round2(cards.reduce((s,{card}) => s+estimatedRewardValue(card,card.cashbackLifetime), 0)),
    totalMonthValue:    round2(cards.reduce((s,{card}) => s+estimatedRewardValue(card,card.cashbackMonth), 0)),
    byCard, byCategory,
    monthLabels: monthKeys.map(mk => { const [y,m]=mk.split('-'); return `${MONTH_NAMES[+m-1].slice(0,3)} '${y.slice(2)}`; }),
    monthPoints: monthKeys.map(mk => round2(cards.reduce((s,{card}) => s+estimatedRewardValue(card,(card.rewardsByMonth||{})[mk]), 0))),
  };
}
function RewardsSummary({ accounts, onOpenAccount }) {
  const agg = aggregateRewardsAcrossCards(accounts);
  if (!agg.hasCards) return null;
  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12,marginBottom:16}}>
        <div>
          <div className="card-label" style={{marginBottom:6}}>Lifetime Rewards — All Cards</div>
          <div className="large-num" style={{color:'var(--accent)'}}>{currency(agg.totalLifetimeValue,2)}</div>
          <div style={{fontSize:'.7rem',color:'var(--t3)',marginTop:4}}>{currency(agg.totalMonthValue,2)} earned this month · miles/points estimated in $</div>
        </div>
      </div>

      <div className="card-label">Rewards by Card</div>
      {agg.byCard.map(c => (
        <button key={c.id} className="v-row" style={{width:'100%',textAlign:'left',background:'none',border:0,cursor:'pointer',fontFamily:'inherit',color:'inherit'}} onClick={()=>onOpenAccount && onOpenAccount(c.id)}>
          <div className="v-row-left">
            <div className="v-row-icon" style={{background:c.color+'20'}}><Icon name={c.icon} size={17} color={c.color}/></div>
            <div><div className="v-row-name">{c.name}</div><div className="v-row-sub">{c.monthNative} this month</div></div>
          </div>
          <div className="v-row-val">{c.lifetimeNative}</div>
        </button>
      ))}

      <div className="card-label" style={{marginTop:16}}>Rewards by Category (est. $, this month)</div>
      {REWARD_BUCKETS.map(k => (
        <div key={k} className="reward-row">
          <div className="reward-name">{REWARD_BUCKET_LABEL[k]}</div>
          <div className="reward-bar-track"><div className="reward-bar-fill" style={{width:`${Math.min(safePct(agg.byCategory[k], Math.max(...REWARD_BUCKETS.map(b=>agg.byCategory[b]),0.01)),100)}%`}}/></div>
          <div className="reward-val">{currency(agg.byCategory[k],2)}</div>
        </div>
      ))}

      {agg.monthPoints.some(p=>p>0) && (
        <div style={{marginTop:16}}>
          <div className="card-label">Rewards by Month (est. $, all cards)</div>
          <LineTrendChart labels={agg.monthLabels} formatY={money0}
            series={[{ key:'rewards', label:'Rewards', color:'var(--accent)', points:agg.monthPoints }]}/>
        </div>
      )}
    </div>
  );
}

function AccountsPage({ accounts, setAccounts, transactions, settings, goals, netWorth, setGoals, setNetWorth, setTransactions, openAddTx, deepLinkAccountId, onConsumeDeepLink }) {
  const ctx = { accounts, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions };
  const [openId, setOpenId]   = useState(deepLinkAccountId || null);
  const [showAdd, setShowAdd] = useState(false);
  const [showArchived, setShowArchived] = useState(false);
  const [showRewards, setShowRewards] = useState(false);

  useEffect(() => {
    if (deepLinkAccountId) { setOpenId(deepLinkAccountId); onConsumeDeepLink && onConsumeDeepLink(); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [deepLinkAccountId]);

  const sorted = [...(accounts||[])].sort((a,b)=>(a.order||0)-(b.order||0));
  const shown = showArchived ? sorted.filter(a=>a.archived) : sorted.filter(a=>!a.archived);

  const openAcct = shown.find(a => a.id === openId) || sorted.find(a=>a.id===openId);
  if (openAcct) {
    return <AccountDetail acct={openAcct} accounts={accounts} transactions={transactions} settings={settings} goals={goals}
      netWorth={netWorth} setGoals={setGoals} setNetWorth={setNetWorth} setAccounts={setAccounts} setTransactions={setTransactions}
      onBack={()=>setOpenId(null)} onOpenAdd={(id,preset)=>openAddTx(id,preset)}/>;
  }

  const move = (id, dir) => {
    const ids = sorted.map(a=>a.id);
    const i = ids.indexOf(id), j = i+dir;
    if (j<0 || j>=ids.length) return;
    const reordered = [...sorted];
    [reordered[i], reordered[j]] = [reordered[j], reordered[i]];
    setAccounts(reordered.map((a,idx)=>({ ...a, order:idx })));
  };

  const GROUPS = [
    { label:'Cash & Banking',        types:['checking','savings','hysa','cash'] },
    { label:'Credit Cards',          types:['credit'] },
    { label:'Retirement & Investing',types:['roth','401k','brokerage','hsa','cd','crypto'] },
    { label:'Other',                 types:['business','loan','other'] },
  ];

  const netTotal = shown.filter(a=>!a.hidden).reduce((s,a) => {
    const bal = accountBalance(a, ctx);
    return s + (isLiabilityType(a.type) ? -bal : bal);
  }, 0);

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>{showArchived?'Archived Accounts':'Total Across Accounts'}</div>
          <div className="mega" style={{color:netTotal>=0?'var(--t1)':'var(--red)'}}><CountUp value={netTotal} format={v=>currency(v)}/></div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-end'}}>
          {accounts.some(a=>a.type==='credit'&&!a.archived) &&
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowRewards(s=>!s)}><Icon name="trendUp" size={13}/>Rewards</button>}
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowArchived(s=>!s)}>{showArchived?'Active':'Archived'}</button>
          <button className="add-btn" onClick={()=>setShowAdd(true)}><Icon name="plus" size={14} color="#000" strokeWidth={2.5}/>Add Account</button>
        </div>
      </div>

      {showRewards && (
        <div>
          <div className="section-head" style={{padding:'0 0 10px'}}>Rewards Summary</div>
          <RewardsSummary accounts={accounts} onOpenAccount={id=>{ setOpenId(id); setShowRewards(false); }}/>
        </div>
      )}

      {shown.length === 0 ? (
        <div className="empty">{showArchived ? 'No archived accounts.' : 'No accounts yet — add your first one.'}</div>
      ) : GROUPS.map(g => {
        const rows = shown.filter(a => g.types.includes(a.type));
        if (!rows.length) return null;
        return (
          <div key={g.label}>
            <div className="acct-group-label">{g.label}</div>
            <div className="acct-list">
              {rows.map(a => {
                const bal = accountBalance(a, ctx);
                const liability = isLiabilityType(a.type);
                const chg = monthlyAccountChange(transactions, a, ymd(new Date()).slice(0,7));
                return (
                  <div key={a.id} style={{display:'flex',alignItems:'center',gap:6}}>
                    <button className={'acct-card'+(a.hidden?' hidden-acct':'')} onClick={()=>setOpenId(a.id)} title={a.name}>
                      <span className="acct-icon" style={{background:a.color+'20'}}><Icon name={a.icon} size={20} color={a.color}/></span>
                      <span className="acct-body">
                        <span className="acct-name">{a.name}</span>
                        <span className="acct-sub">{accountTypeInfo(a.type).label}{a.institution?` · ${a.institution}`:''}</span>
                      </span>
                      <span className="acct-right">
                        <span className="acct-bal" style={{color:liability&&bal>0?'var(--red)':'var(--t1)'}}>{liability&&bal>0?'−':''}{currency(bal,2)}</span>
                        {chg !== 0 && <span className="acct-chg" style={{color:chg>=0?'var(--accent)':'var(--red)'}}>{chg>=0?'+':'−'}{currency(Math.abs(chg))} this mo</span>}
                      </span>
                    </button>
                    {!showArchived && (
                      <div style={{display:'flex',flexDirection:'column'}}>
                        <button className="btn-icon" style={{padding:2}} onClick={()=>move(a.id,-1)} aria-label="Move up"><Icon name="chevronUp" size={14}/></button>
                        <button className="btn-icon" style={{padding:2}} onClick={()=>move(a.id,1)} aria-label="Move down"><Icon name="chevronDown" size={14}/></button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {showAdd && <AccountFormModal accounts={accounts} onClose={()=>setShowAdd(false)} onSave={acc=>setAccounts(list=>[...list, acc])}/>}
    </div>
  );
}

function RecurringFormModal({ onClose, onSave, onDelete, accounts, template }) {
  const r = template || defaultRecurringFields();
  const [name, setName]           = useState(r.name);
  const [type, setType]           = useState(r.type);
  const [amount, setAmount]       = useState(r.amount ? String(r.amount) : '');
  const [category, setCategory]   = useState(r.category);
  const [accountId, setAccountId] = useState(r.accountId || '');
  const [toAccountId, setToAccountId] = useState(r.toAccountId || '');
  const [frequency, setFrequency] = useState(r.frequency);
  const [nextDate, setNextDate]   = useState(r.nextDate);
  const [notes, setNotes]         = useState(r.notes || '');

  const visibleAccounts = (accounts||[]).filter(a=>!a.archived);
  const valid = name.trim() && parseFloat(amount) > 0 && accountId && (type!=='transfer' || (toAccountId && toAccountId!==accountId));

  const save = () => {
    if (!valid) return;
    onSave({
      ...r, id: r.id || ('rec_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      name: name.trim(), type, amount: round2(parseFloat(amount)||0),
      category: type==='transfer' ? 'transfer' : category,
      accountId, toAccountId: type==='transfer' ? toAccountId : null,
      frequency, nextDate, active: r.active != null ? r.active : true, notes: notes.trim(),
    });
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">{template ? 'Edit Recurring' : 'Add Recurring Transaction'}</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          <div className="type-toggle" role="group" aria-label="Type">
            <button type="button" className={type==='expense'?'on':''} onClick={()=>setType('expense')}>Expense</button>
            <button type="button" className={'income'+(type==='income'?' on':'')} onClick={()=>setType('income')}>Income</button>
            <button type="button" className={'transfer'+(type==='transfer'?' on':'')} onClick={()=>setType('transfer')}>Transfer</button>
          </div>
          <div className="fgrid">
            <div className="fg fspan"><label>Name</label>
              <input type="text" placeholder="e.g. Netflix, Paycheck, Roth Contribution" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
            </div>
            <div className="fg"><label>Amount</label>
              <input type="number" min="0" step="0.01" placeholder="0.00" value={amount} onChange={e=>setAmount(e.target.value)}/>
            </div>
            <div className="fg"><label>Frequency</label>
              <select value={frequency} onChange={e=>setFrequency(e.target.value)}>

              </select>

              </div>
            )}
            <div className="fg"><label>{type==='transfer' ? 'From Account' : 'Account'}</label>
              <select value={accountId} onChange={e=>setAccountId(e.target.value)}>
                <option value="">Choose account</option>
                {visibleAccounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            {type === 'transfer' && (
              <div className="fg"><label>To Account</label>
                <select value={toAccountId} onChange={e=>setToAccountId(e.target.value)}>
                  <option value="">Choose account</option>
                  {visibleAccounts.filter(a=>a.id!==accountId).map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
            )}
            <div className="fg"><label>Next Date</label>
              <input type="date" value={nextDate} onChange={e=>setNextDate(e.target.value)}/>
            </div>
            <div className="fg fspan"><label>Notes</label>
              <input type="text" placeholder="Optional" value={notes} onChange={e=>setNotes(e.target.value)}/>
            </div>
          </div>
          <button className="btn btn-primary btn-full" disabled={!valid} onClick={save}>{template?'Save Changes':'Add Recurring Transaction'}</button>
          {template && onDelete && (
            <button className="btn btn-ghost btn-full" style={{color:'var(--red)'}}
              onClick={()=>{ if(window.confirm(`Delete "${r.name}"?`)){ onDelete(r.id); onClose(); } }}>
              Delete
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function RecurringRow({ r, accounts, isDue, onEdit, onToggleActive, onLogNow }) {
  const acctName = id => ((accounts||[]).find(a=>a.id===id) || {}).name || '—';
  const freqLabel = (RECURRING_FREQUENCIES.find(f=>f.id===r.frequency) || {}).label || r.frequency;
  return (
    <div className="v-row">
      <div className="v-row-left">
        <div className="v-row-icon" style={{background:r.type==='income'?'rgba(0,200,5,.12)':r.type==='transfer'?'rgba(59,130,246,.12)':'var(--s3)'}}>
          <Icon name={r.type==='income'?'trendUp':r.type==='transfer'?'swap':'receipt'} size={16}
            color={r.type==='income'?'var(--accent)':r.type==='transfer'?'var(--blue)':'var(--t2)'}/>
        </div>
        <div>
          <div className="v-row-name">{r.name}{!r.active && <span className="bill-recur-tag">Paused</span>}</div>
          <div className="v-row-sub">{freqLabel} · {r.type==='transfer' ? `${acctName(r.accountId)} → ${acctName(r.toAccountId)}` : acctName(r.accountId)} · next {r.nextDate}</div>
        </div>
      </div>
      <div className="bill-actions">
        <span className="v-row-val">{currency(r.amount,2)}</span>

        <button className="btn btn-ghost btn-sm" onClick={onToggleActive}>{r.active?'Pause':'Resume'}</button>

}

function RecurringSection({ recurring, setRecurring, accounts, ctxBase }) {
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const today = new Date();
  const ctx = { ...ctxBase, accounts, setRecurring };
  const sorted = [...(recurring||[])].sort((a,b) => a.nextDate.localeCompare(b.nextDate));
  return (
    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div className="card-label" style={{marginBottom:0}}>Recurring Transactions</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowAdd(true)}><Icon name="plus" size={13}/>Add</button>
      </div>
      {sorted.length === 0
        ? <p className="empty">Nothing set up yet — paychecks, rent, subscriptions, Roth/HYSA contributions, credit card payments…</p>
        : sorted.map(r => (
            <RecurringRow key={r.id} r={r} accounts={accounts} isDue={recurringIsDue(r, today)}
              onEdit={()=>setEditing(r)}
              onToggleActive={()=>setRecurring(list => list.map(x => x.id===r.id ? { ...x, active:!x.active } : x))}
              onLogNow={()=>logRecurringTransaction(r, ctx)}/>
          ))}
      {showAdd && (
        <RecurringFormModal accounts={accounts} onClose={()=>setShowAdd(false)}
          onSave={t => setRecurring(list => [...list, t])}/>
      )}
      {editing && (
        <RecurringFormModal accounts={accounts} template={editing} onClose={()=>setEditing(null)}
          onSave={t => setRecurring(list => list.map(x => x.id===t.id ? t : x))}
          onDelete={id => setRecurring(list => list.filter(x => x.id!==id))}/>
      )}
    </div>
  );
}

// Compact "needs your attention" card for the Dashboard — only renders when
// something is actually due, and every log-now action is one explicit tap.
function DueRecurringCard({ recurring, accounts, ctxBase }) {
  const today = new Date();
  const due = (recurring||[]).filter(r => recurringIsDue(r, today));

  const ctx = { ...ctxBase, accounts, setRecurring: ctxBase.setRecurring };
  return (
    <div className="card" style={{borderColor:'rgba(59,130,246,.25)',background:'rgba(59,130,246,.04)'}}>
      <div className="card-label">Due Recurring ({due.length})</div>
      {due.map(r => (
        <div key={r.id} className="v-row">
          <div className="v-row-left">
            <div className="v-row-icon" style={{background:'var(--s3)'}}>
              <Icon name={r.type==='income'?'trendUp':r.type==='transfer'?'swap':'receipt'} size={16} color="var(--t2)"/>

            <div><div className="v-row-name">{r.name}</div><div className="v-row-sub">was due {r.nextDate}</div></div>

function AddBillModal({ onClose, onSave, onDelete, accounts, bill }) {
  const b = bill || defaultBillFields();
  const [name, setName]           = useState(b.name);
  const [category, setCategory]   = useState(b.category);
  const [amount, setAmount]       = useState(b.amount ? String(b.amount) : '');
  const [recurring, setRecurring] = useState(b.recurring);
  const [dueDay, setDueDay]       = useState(b.dueDay || 1);
  const [dueDate, setDueDate]     = useState(b.dueDate || ymd(new Date()));
  const [accountId, setAccountId] = useState(b.accountId || '');
  const [autopay, setAutopay]     = useState(b.autopay);
  const [notes, setNotes]         = useState(b.notes || '');

  const payAccounts = (accounts||[]).filter(a => !a.archived && a.type !== 'credit');
  const valid = name.trim() && parseFloat(amount) > 0;

  const save = () => {
    if (!valid) return;
    onSave({
      ...b, id: b.id || ('bill_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      name: name.trim(), category, amount: round2(parseFloat(amount)||0), recurring,
      dueDay: Math.min(Math.max(parseInt(dueDay)||1,1),28), dueDate,
      accountId: accountId || null, autopay, notes: notes.trim(),
      paidPeriods: b.paidPeriods || [], paidDate: b.paidDate || null,
    });

  };

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">{bill ? 'Edit Bill' : 'Add Bill'}</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          <div className="fgrid">
            <div className="fg fspan"><label>Bill Name</label>
              <input type="text" placeholder="e.g. Rent, Comcast Internet" value={name} onChange={e=>setName(e.target.value)} autoFocus/>

            <div className="fg"><label>Category</label>
              <select value={category} onChange={e=>setCategory(e.target.value)}>

            <div className="fg"><label>Amount</label>
              <input type="number" min="0" step="0.01" placeholder="0.00" value={amount} onChange={e=>setAmount(e.target.value)}/>
            </div>
            <div className="fg"><label>Recurring</label>
              <select value={recurring?'yes':'no'} onChange={e=>setRecurring(e.target.value==='yes')}>

            </div>
