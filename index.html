<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / theme -->
  <meta name="theme-color" content="#060606" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.json" />

  <!-- iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Home-screen icons. These MUST be static files, not canvas-generated data:
       URLs — iOS reads apple-touch-icon when you tap Add to Home Screen, often
       before scripts run, and commonly rejects data: URLs, leaving a generic
       screenshot tile instead of the app icon. Relative paths keep this working
       from the GitHub Pages subdirectory. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <title>Finance</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Shared financial calculation engine (Phase 1) — plain JS, no JSX, no
       Babel needed. Loaded as a real global (window.FinCalc) before the
       app script runs, and independently `require()`-able from
       test/calc.test.js for unit tests. -->
  <script src="calc.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:      #060606;
  --s1:      #0d0d0d;
  --s2:      #111111;
  --s3:      #171717;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);

  /* Primary accent — Robinhood green */
  --accent:    #00C805;
  --accent-dk: #00a004;
  --accent-lt: rgba(0,200,5,.08);

  /* Blue kept only for form focus rings */
  --blue:    #3b82f6;
  --blue-dk: #2563eb;
  --blue-lt: rgba(59,130,246,.1);

  --green:    #00C805;
  --green-lt: rgba(0,200,5,.08);
  --red:      #FF5000;
  --red-lt:   rgba(255,80,0,.1);
  --yellow:   #F5A623;
  --yellow-lt:rgba(245,166,35,.1);
  --purple:   #7B74FF;
  --purple-lt:rgba(123,116,255,.12);

  --t1: #ffffff;
  --t2: #c0c0c0;
  --t3: #484848;
  --t4: #2a2a2a;

  --r:   14px;
  --r-s: 10px;

  --shadow: 0 0 0 1px var(--border);

  /* Blurred sticky chrome (header / bottom nav) — a touch more opaque than
     the page background so content doesn't show through the blur seam. */
  --header-bg: rgba(6,6,6,.96);
  --navbar-bg: rgba(6,6,6,.98);

  /* Hand-drawn SVG charts (net worth trend, etc.) set fill/stroke via
     inline style={{...}} using these rather than literal hex, so they stay
     legible in both themes. */
  --chart-grid: #222222;
  --chart-axis: #52525b;
  --chart-zero: #3f3f46;

  /* Subtle neutral "wash" fills (icon badge backgrounds, thin progress
     tracks, faint hairlines) — white-on-dark by default, flipped to
     black-on-light below so they stay visible instead of vanishing. */
  --wash-1: rgba(255,255,255,.02);
  --wash-2: rgba(255,255,255,.05);
  --wash-3: rgba(255,255,255,.09);

  /* Mobile bottom tab bar's own height (icon + label padding, excluding
     the safe-area inset) — one named value everything else derives page
     bottom-padding from, instead of separately-guessed magic numbers per
     page. Keep in sync with .mnav-btn's actual rendered height if that
     ever changes. */
  --bottom-nav-height: 64px;
}

/* ── Light theme (Settings → Appearance) — same tokens, light values.
   Every component already reads var(--bg)/var(--s1)/var(--t1)/etc., so
   this block is the entire light theme; nothing else needs to change. ── */
:root[data-theme="light"] {
  --bg:      #f5f6f7;
  --s1:      #ffffff;
  --s2:      #ffffff;
  --s3:      #eef0f2;
  --border:  rgba(0,0,0,0.09);
  --border2: rgba(0,0,0,0.14);

  --accent-lt: color-mix(in srgb, var(--accent) 10%, transparent);

  --t1: #0a0a0a;
  --t2: #43454a;
  --t3: #8a8d93;
  --t4: #c2c4c9;

  --header-bg: rgba(255,255,255,.92);
  --navbar-bg: rgba(255,255,255,.96);

  --chart-grid: #e2e4e8;
  --chart-axis: #8a8d93;
  --chart-zero: #c2c4c9;

  --wash-1: rgba(0,0,0,.02);
  --wash-2: rgba(0,0,0,.04);
  --wash-3: rgba(0,0,0,.07);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv01','cv02','ss01','cv11';
}
button{cursor:pointer;font-family:inherit;transition:background .1s,color .1s,opacity .1s,transform .08s}
input,select,textarea{font-family:inherit}
/* Remove iOS blue tap flash */
button,a,input,select{-webkit-tap-highlight-color:transparent}
/* Prevent iOS text-size adjustment on rotate */
html{-webkit-text-size-adjust:100%}

/* ── Shell ──────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100dvh}

.header{
  position:sticky;top:0;z-index:100;
  background:var(--header-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  /* Extend into the notch / Dynamic Island area */
  padding-top:env(safe-area-inset-top);
}
.header-inner{
  max-width:1040px;margin:0 auto;padding:0 28px;
  height:50px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  transition:height .18s ease;
}
/* Collapsing header — a small compact state past a short scroll threshold.
   Deliberately subtle (6px of height, not a hide/reveal) so it never reads
   as a jump or flicker; the sticky bar was already minimal (50px), so this
   is a refinement, not a rescue from an oversized header. */
.header-scrolled .header-inner{height:44px}
.header-scrolled{box-shadow:0 1px 0 rgba(0,0,0,.3)}
.logo{
  font-size:.875rem;font-weight:700;letter-spacing:-.03em;color:var(--t1);
  white-space:nowrap;user-select:none;display:flex;align-items:center;gap:7px;
  transition:font-size .18s ease;
}
.header-scrolled .logo{font-size:.8rem}
.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}

/* Nav — underline style like Robinhood */
.nav{display:flex;align-items:center;gap:0;border-bottom:none}
.nav-btn{
  background:none;border:none;
  padding:0 14px;height:50px;
  font-size:.775rem;font-weight:500;color:var(--t3);
  white-space:nowrap;letter-spacing:.01em;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
  position:relative;top:1px;
}
.nav-btn:hover{color:var(--t2)}
.nav-btn.active{color:var(--t1);font-weight:600;border-bottom-color:var(--accent)}

.main{flex:1;padding-bottom:64px}

.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  min-height:var(--bottom-nav-height);
  background:var(--navbar-bg);
  border-top:1px solid var(--border);z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.mnav-btn{
  flex:1;background:none;border:none;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--t3);transition:color .12s;
}
.mnav-btn.active{color:var(--accent)}
.nav-pip{width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* ── Page ───────────────────────────────────────────────────────────── */
.page{
  max-width:1040px;margin:0 auto;
  padding:36px 28px 56px;
  display:flex;flex-direction:column;gap:24px;
}
/* Flex items default to min-width:auto, so a section with any unshrinkable
   content (a nowrap toggle group, a long unbroken label) refuses to shrink
   below its own content width and silently overflows .page's edge — same
   root cause .v-row-left/.v-row-name already guard against locally, just
   missing here at the top level where every page section lives. (PRD §6:
   "Horizontal clipping.") */
.page > *{min-width:0}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{font-size:1.25rem;font-weight:700;letter-spacing:-.035em;color:var(--t1);line-height:1.1}
.page-sub{font-size:.72rem;color:var(--t3);margin-top:4px;letter-spacing:.01em}

/* ── Badges ─────────────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:var(--r-s);
  font-size:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.badge-blue  {background:var(--blue-lt);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.badge-green {background:var(--green-lt);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge-yellow{background:var(--yellow-lt);color:var(--yellow);border:1px solid rgba(234,179,8,.2)}
.badge-purple{background:var(--purple-lt);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.badge-red   {background:var(--red-lt);color:var(--red);border:1px solid rgba(239,68,68,.2)}

/* ── Section label ──────────────────────────────────────────────────── */
.slabel{
  font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);
  padding-bottom:12px;display:flex;align-items:center;gap:10px;
}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Cards ──────────────────────────────────────────────────────────── */
.card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 24px;
}
.card-label{
  font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);margin-bottom:14px;
}

/* ── Grids ───────────────────────────────────────────────────────────── */
/* minmax(0,1fr), not bare 1fr — a bare 1fr track's implicit min size is
   auto (its widest cell's min-content), so one cell with unshrinkable
   content (e.g. a nowrap balance figure) inflates every track sharing that
   column, pushing unrelated sibling cards past the viewport edge. */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* ── Stat cards ──────────────────────────────────────────────────────── */
.stat{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 22px;
}
.stat-label{
  font-size:.58rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);margin-bottom:10px;
}
.stat-val{
  font-size:1.85rem;font-weight:700;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;color:var(--t1);line-height:1;
}
.stat-sub{font-size:.68rem;color:var(--t3);margin-top:6px}
.stat-blue  .stat-val{color:var(--blue)}
.stat-green .stat-val{color:var(--green)}
.stat-red   .stat-val{color:var(--red)}

/* ── Income equation ─────────────────────────────────────────────────── */
.income-eq{
  display:flex;align-items:stretch;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
}
.eq-item{flex:1;padding:20px 20px 18px;border-right:1px solid var(--border)}
.eq-item:last-child{border-right:none;background:var(--accent-lt)}
.eq-label{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.eq-num{font-size:1.5rem;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.eq-note{font-size:.62rem;color:var(--t3);margin-top:5px;line-height:1.4}
.eq-op{
  display:flex;align-items:center;justify-content:center;
  padding:0 2px;color:var(--t4);font-size:.9rem;flex-shrink:0;
}
.c-blue  {color:var(--blue)}
.c-green {color:var(--green)}
.c-red   {color:var(--red)}
.c-yellow{color:var(--yellow)}
.c-muted {color:var(--t3)}

/* ── Surplus ─────────────────────────────────────────────────────────── */
.surplus{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;
}
.surplus-ok {border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.04)}
.surplus-over{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04)}
.surplus-label{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.surplus-num{font-size:2.5rem;font-weight:700;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:1}
.surplus-eq{font-size:.68rem;color:var(--t3);margin-top:6px}
.surplus-right{text-align:right}
.surplus-phase{font-size:.68rem;color:var(--t3);margin-top:6px}

/* ── Budget rows ─────────────────────────────────────────────────────── */
.brow{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:.84rem;
}
.brow:last-child{border-bottom:none}
.brow-label{color:var(--t2);font-weight:400}
.brow-val{font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}
.brow-full{padding:12px 0;border-bottom:1px solid var(--border)}
.brow-full:last-child{border-bottom:none}
.brow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.84rem}

/* ── Progress ────────────────────────────────────────────────────────── */
.track{height:3px;background:var(--s3);border-radius:99px;overflow:hidden}
.track-lg{height:6px}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── Buttons ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--r-s);
  font-size:.775rem;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent-dk)}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-sm{padding:5px 11px;font-size:.72rem}
.btn-full{width:100%;padding:11px;font-size:.85rem;justify-content:center;margin-top:6px}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--s2);color:var(--t1)}
.btn-icon{background:none;border:none;color:var(--t3);padding:5px;border-radius:var(--r-s);font-size:.8rem}
.btn-icon:hover{background:var(--s3);color:var(--t2)}
.btn-icon-del:hover{background:var(--red-lt);color:var(--red)}
.btn-link{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0}

/* ── Month nav ───────────────────────────────────────────────────────── */
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px}
.month-arrow{
  background:var(--s1);border:1px solid var(--border);color:var(--t2);
  width:30px;height:30px;border-radius:var(--r-s);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
}
.month-arrow:hover{border-color:var(--border2);color:var(--t1)}
.month-name{font-size:.875rem;font-weight:600;letter-spacing:-.02em;min-width:160px;text-align:center;color:var(--t1)}

/* ── Forms ───────────────────────────────────────────────────────────── */
.form-card{border-color:rgba(59,130,246,.2)!important;background:rgba(59,130,246,.04)!important}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fspan{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.fg input,.fg select,.fg textarea{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:8px 12px;font-size:.84rem;
  outline:none;width:100%;transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
.fg select{appearance:none;cursor:pointer}
.factions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;padding-top:4px}

/* ── Transaction rows ─────────────────────────────────────────────────── */
.tx-list{display:flex;flex-direction:column}
.tx-row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-icon{
  width:32px;height:32px;border-radius:var(--r-s);
  background:var(--s3);display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;color:var(--t2);flex-shrink:0;letter-spacing:.04em;
}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:.84rem;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.tx-meta{font-size:.68rem;color:var(--t3);margin-top:2px}
.tx-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tx-tag{font-size:.6rem;font-weight:600;color:var(--accent);background:var(--accent-lt);border-radius:99px;padding:1px 7px}
.tx-amt{font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--t4);padding:4px;border-radius:var(--r-s);cursor:pointer}
.tx-del:hover{background:var(--red-lt);color:var(--red)}

/* ── Commission ──────────────────────────────────────────────────────── */
.split-banner{
  display:flex;align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;
}
.split-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--r-s);font-size:.75rem;font-weight:600;
}
.split-hysa    {background:var(--green-lt);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.split-personal{background:var(--blue-lt);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.split-div{color:var(--t4);font-size:.85rem}

.comm-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.comm-row:last-child{border-bottom:none}
.comm-amt{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.comm-note{font-size:.72rem;color:var(--t2);margin-top:2px}
.comm-date{font-size:.68rem;color:var(--t3);margin-top:2px}
.comm-splits{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.comm-s{font-size:.68rem;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:var(--r-s)}
.comm-s-green{background:var(--green-lt);color:var(--green)}
.comm-s-blue {background:var(--blue-lt);color:var(--blue)}

/* ── Goals ───────────────────────────────────────────────────────────── */
.goal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.goal-title{font-size:.95rem;font-weight:600;letter-spacing:-.02em;color:var(--t1)}
.goal-sub{font-size:.68rem;color:var(--t3);margin-top:3px}
.goal-amounts{text-align:right;flex-shrink:0}
.goal-curr{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.goal-max{font-size:.68rem;color:var(--t3);margin-top:3px}
.goal-stats{display:flex;justify-content:space-between;font-size:.68rem;color:var(--t3);margin-top:8px}
.goal-proj{font-size:.7rem;color:var(--t3);margin-top:10px;padding:9px 12px;background:var(--s2);border-radius:var(--r-s);line-height:1.5}
.goal-update{display:flex;gap:8px;margin-top:14px}
.goal-update input{
  flex:1;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:7px 11px;font-size:.78rem;outline:none;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.goal-update input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* ── Net Worth ───────────────────────────────────────────────────────── */
.nw-bar-wrap{margin:12px 0}
.nw-bar{height:5px;border-radius:99px;background:var(--s3);overflow:hidden;display:flex}
.nw-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Account input rows */
.nw-row{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border)}
.nw-row:last-child{border-bottom:none}
.nw-row-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.nw-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nw-label{font-size:.84rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-input{
  width:120px;background:var(--s2);border:1px solid var(--border2);
  border-radius:var(--r-s);color:var(--t1);padding:5px 9px;
  font-size:.84rem;text-align:right;outline:none;flex-shrink:0;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.nw-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* Horizontal bar chart */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar-row:last-child{margin-bottom:0}
.hbar-label{width:110px;flex-shrink:0;color:var(--t2);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{flex:1;height:5px;background:var(--s3);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:3px}
.hbar-val{width:72px;text-align:right;flex-shrink:0;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums;font-size:.75rem}

/* SVG line chart */
.chart-wrap{background:var(--s2);border-radius:var(--r-s);padding:14px 10px 6px;overflow:hidden}
.chart-empty{height:80px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.75rem}

/* History table */
.hist-row{
  display:grid;grid-template-columns:58px 1fr 1fr 28px;
  padding:9px 0;border-bottom:1px solid var(--border);align-items:center;
}
.hist-row:last-child{border-bottom:none}
.hist-head{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.hist-mono{font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:500}

/* ── Settings ────────────────────────────────────────────────────────── */
.settings-group{display:flex;flex-direction:column;gap:5px}
.settings-group label{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.settings-group input{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:8px 12px;font-size:.84rem;outline:none;width:100%;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.settings-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.settings-remaining{padding:8px 12px;border-radius:var(--r-s);font-size:.72rem;font-weight:600}
.rem-ok  {background:var(--green-lt);color:var(--green)}
.rem-over{background:var(--red-lt);color:var(--red)}

/* ── Budget tab ──────────────────────────────────────────────────────── */
.budget-col-header{
  font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--t1);
  margin-bottom:2px;
}
.budget-col-sub{font-size:.65rem;color:var(--t3);margin-bottom:16px}
.budget-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.budget-row:last-child{border-bottom:none}
.budget-cat{font-size:.8rem;color:var(--t2);font-weight:400}
.budget-right{text-align:right}
.budget-limit{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}
.budget-rem{font-size:.65rem;color:var(--t3);margin-top:2px;font-variant-numeric:tabular-nums}
.budget-over{color:var(--red)}
.budget-total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0 0;margin-top:4px;border-top:1px solid var(--border2);
}
.budget-total-label{font-size:.72rem;font-weight:600;color:var(--t2);letter-spacing:.03em}
.budget-total-val{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}

/* ── Empty state ─────────────────────────────────────────────────────── */
.empty{text-align:center;padding:36px 0;color:var(--t3);font-size:.8rem}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media(max-width:700px){
  .header-inner{padding:0 18px}
  .nav{display:none}
  .mobile-nav{display:flex}
  .page{
    gap:18px;
    padding-top:20px;
    padding-left:max(18px,env(safe-area-inset-left));
    padding-right:max(18px,env(safe-area-inset-right));
    /* Nav bar height + a little breathing room + safe area inset, so the
       last item on every page can scroll fully clear of the bar. */
    padding-bottom:calc(var(--bottom-nav-height) + 16px + env(safe-area-inset-bottom));
  }
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .income-eq{flex-direction:column}
  .eq-item{border-right:none;border-bottom:1px solid var(--border)}
  .eq-item:last-child{border-bottom:none}
  .eq-op{display:none}
  .surplus{flex-direction:column;gap:14px}
  .surplus-right{text-align:left}
  .fgrid{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .split-banner{flex-wrap:wrap}

  /* Minimum 44pt touch targets (iOS HIG) */
  .btn{min-height:44px;padding-left:18px;padding-right:18px}
  .btn-sm{min-height:38px}
  .btn-full{min-height:48px}
  .fg input,.fg select,.fg textarea,
  .settings-group input,
  .goal-update input{min-height:44px;font-size:16px!important}/* 16px prevents iOS auto-zoom */
  .mnav-btn{min-height:48px}
  .month-arrow{width:40px;height:40px}
}

/* ── V3 Typography ───────────────────────────────────────────────── */
.eyebrow{
  font-size:.7rem;font-weight:600;color:var(--t3);
  text-transform:uppercase;letter-spacing:.09em;
}
.mega{
  font-size:3.2rem;font-weight:800;letter-spacing:-.05em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.large-num{
  font-size:2rem;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.section-head{
  font-size:1.15rem;font-weight:700;letter-spacing:-.03em;
  padding:20px 0 8px;
}

/* ── Generic list rows (paycheck breakdown, etc.) ────────────────── */
.v-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);
}
.v-row:last-child{border-bottom:none}
/* flex:1;min-width:0 here (+ nowrap/ellipsis below) is the same fix as
   .acct-body: without it, a long label (an account name, a merchant) had
   no bounded box to truncate against and could run into .v-row-val. */
.v-row-left{display:flex;align-items:center;gap:13px;flex:1;min-width:0}
.v-row-icon{
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.v-row-name{font-size:.9rem;font-weight:500;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
.v-row-sub{font-size:.72rem;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
.v-row-val{
  font-size:.9rem;font-weight:700;
  font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0;
}

/* ── Flush card (no inner padding, rows self-pad) ────────────────── */
.card-flush{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
}

/* ── Budget rows (V3 style) ──────────────────────────────────────── */
.b-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);
}
.b-row:last-of-type{border-bottom:none}
.b-left{display:flex;align-items:center;gap:12px}
.b-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.b-name{font-size:.9rem;color:var(--t2);font-weight:400}
.b-amt{font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}
.b-total-row{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:16px 20px;
  background:var(--accent-lt);
  border-top:1px solid rgba(0,200,5,.15);
}
.b-total-lbl{font-size:.6rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.b-surplus{font-size:.78rem;color:var(--accent);font-weight:600}

/* ── Spending category bars (V3 style) ───────────────────────────── */
.sp-cat{padding:14px 20px;border-bottom:1px solid var(--border)}
.sp-cat:last-child{border-bottom:none}
.sp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sp-name{font-size:.85rem;color:var(--t2)}
.sp-nums{font-size:.78rem;font-variant-numeric:tabular-nums}
.sp-spent{color:var(--t1);font-weight:600}
.sp-bgt{color:var(--t4)}
.bar{height:2px;background:var(--wash-2);border-radius:99px;overflow:hidden}
.bar-in{height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-in.warn{background:var(--yellow)}
.bar-in.over{background:var(--red)}

/* ── Goal cards (V3 style) ───────────────────────────────────────── */
.gc{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
}
.gc-head{display:flex;justify-content:space-between;margin-bottom:14px}
.gc-name{font-size:.95rem;font-weight:700;color:var(--t1)}
.gc-sub{font-size:.72rem;color:var(--t3);margin-top:3px}
.gc-pct{font-size:1.6rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.gc-of{font-size:.68rem;color:var(--t3);text-align:right;margin-top:3px}
.gc-bar{height:3px;background:var(--wash-2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.gc-fill{height:100%;border-radius:99px}
.gc-foot{display:flex;justify-content:space-between;align-items:center}
.gc-rate{font-size:.72rem;color:var(--t3)}
.gc-date{font-size:.72rem;color:var(--t2);font-weight:600}

/* ── Phase pills ─────────────────────────────────────────────────── */
.phase-pill-row{display:flex;gap:8px}
.phase-pill{
  flex:1;padding:11px;border-radius:10px;text-align:center;
  font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;
  border:none;font-family:inherit;
}
.phase-pill-on{background:var(--accent);color:#000}
.phase-pill-off{background:var(--wash-2);color:var(--t3)}
.phase-pill-off:hover{background:var(--wash-3);color:var(--t2)}

/* ── Group sub-nav (Phase 3) — switches between the pages grouped under one
   of the 5 top-level tab-bar destinations (e.g. Plan: Budget/Bills/Goals/
   Commission). Deliberately its own classes, not .phase-pill-row — a page
   like Budget already uses that name for its own Rent-Free/With Rent
   toggle, and stacking two identical-looking pill rows would be confusing.
   Auto-width (not flex:1) since this row can hold up to 4 items. ──────── */
.subnav-row{display:flex;gap:8px;flex-wrap:wrap}
.subnav-pill{
  padding:8px 15px;border-radius:10px;text-align:center;
  font-size:.76rem;font-weight:700;cursor:pointer;transition:all .15s;
  border:none;font-family:inherit;white-space:nowrap;
}
.subnav-pill-on{background:var(--accent);color:#000}
.subnav-pill-off{background:var(--wash-2);color:var(--t3)}
.subnav-pill-off:hover{background:var(--wash-3);color:var(--t2)}

/* ── Add button (green pill) ─────────────────────────────────────── */
.add-btn{
  background:var(--accent);color:#000;border:none;
  border-radius:99px;padding:9px 20px;
  font-size:.82rem;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  font-family:inherit;white-space:nowrap;
  transition:background .1s,transform .08s;
}
.add-btn:hover{background:var(--accent-dk)}
.add-btn:active{transform:scale(.96)}

/* ── Paycheck modal ──────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;animation:modal-fade .15s ease;
}
.modal-card{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:var(--r);width:100%;max-width:420px;
  max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.6);
  animation:modal-pop .18s cubic-bezier(.2,.8,.2,1);
}
@keyframes modal-fade{from{opacity:0}to{opacity:1}}
@keyframes modal-pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .modal-overlay,.modal-card{animation:none}
}
.alloc-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:.82rem;
}
.alloc-row:last-child{border-bottom:none}
.alloc-name{color:var(--t2)}
.alloc-val{font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}

/* ── ETA "moved up" highlight ────────────────────────────────────── */
.eta-up{
  display:inline-flex;align-items:center;gap:2px;
  color:var(--accent);font-size:.6rem;font-weight:700;
  background:var(--accent-lt);border:1px solid rgba(0,200,5,.3);
  border-radius:99px;padding:2px 7px;margin-right:8px;
  vertical-align:middle;white-space:nowrap;
}
/* ══════════════════════════════════════════════════════════════════
   SPENDING INSIGHTS / CHARTS / NET WORTH
   Everything below reuses the existing tokens (--s1, --border, --t1…)
   so it inherits the app's theme rather than hard-coding surfaces.
   ══════════════════════════════════════════════════════════════════ */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Chart shell ── */
.viz-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.viz-svg-box{position:relative;width:100%;min-width:0}
.viz-svg{width:100%;height:190px;display:block;overflow:visible}
.viz-axis-txt{fill:var(--t3);font-size:11px;font-variant-numeric:tabular-nums}
.viz-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:30px 16px;text-align:center;background:var(--s1);
  border:1px dashed var(--border2);border-radius:var(--r);
}
.viz-empty-msg{font-size:.82rem;color:var(--t2);font-weight:500}
.viz-empty-hint{font-size:.7rem;color:var(--t3)}

/* ── Legend (identity is never colour-alone: swatch + text label) ── */
.viz-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.viz-legend-item{
  display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;
  color:inherit;font:inherit;cursor:pointer;border-radius:6px;
}
.viz-legend-item:disabled{cursor:default}
.viz-legend-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viz-swatch{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.viz-legend-label{font-size:.7rem;color:var(--t2)}
.viz-legend-val{font-size:.7rem;color:var(--t3);font-variant-numeric:tabular-nums}

/* ── Tooltip ── */
.viz-tip{
  position:absolute;top:0;transform:translateX(-50%);pointer-events:none;
  background:var(--s3);border:1px solid var(--border2);border-radius:var(--r-s);
  padding:8px 10px;min-width:132px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.viz-tip-hd{font-size:.66rem;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.viz-tip-row{display:flex;align-items:center;gap:6px;font-size:.72rem;margin-top:3px}
.viz-tip-lbl{color:var(--t2);flex:1}
.viz-tip-val{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums}

/* ── Ranked bars ── */
.viz-bars{display:flex;flex-direction:column;gap:12px}
.viz-bar-row{
  display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  color:inherit;font:inherit;
}
.viz-bar-click{cursor:pointer;border-radius:var(--r-s)}
.viz-bar-click:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.viz-bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.viz-bar-lbl{font-size:.78rem;color:var(--t1);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-bar-val{font-size:.78rem;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.viz-bar-sub{color:var(--t3);font-weight:500}
.viz-bar-meta{font-size:.66rem;color:var(--t3);margin-top:4px}
.viz-status{font-size:.62rem;font-weight:700;margin-left:7px;white-space:nowrap}
.viz-track{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}
.viz-track-ghost{height:5px;margin-bottom:3px;background:transparent}
.viz-fill{height:100%;border-radius:99px;transition:width .25s ease}
.viz-fill-ghost{height:100%;border-radius:99px;background:var(--border2)}

/* ── Donut ── */
.viz-donut-box{display:flex;justify-content:center}
.viz-donut{width:100%;max-width:210px;height:auto}
.viz-donut circle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viz-donut-lbl{fill:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.viz-donut-val{fill:var(--t1);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.viz-donut-pct{fill:var(--t3);font-size:11px;font-variant-numeric:tabular-nums}

/* ── Table fallback ── */
.viz-table{font-size:.7rem;color:var(--t3)}
.viz-table summary{cursor:pointer;padding:4px 0;color:var(--t3)}
.viz-table summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viz-table table{width:100%;border-collapse:collapse;margin-top:6px}
.viz-table th,.viz-table td{
  text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums;color:var(--t2);
}
.viz-table th{color:var(--t3);font-weight:600}

/* ── Calendar ── */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-btn{
  display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  color:var(--t2);cursor:pointer;padding:0 10px;font-size:.72rem;font-weight:600;
}
.cal-btn:hover{background:var(--s3);color:var(--t1)}
.cal-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal-title{font-size:.95rem;font-weight:700;color:var(--t1);min-width:150px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{
  font-size:.6rem;font-weight:700;color:var(--t3);text-align:center;
  text-transform:uppercase;letter-spacing:.06em;padding:4px 0;
}
.cal-cell{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  min-height:66px;padding:6px 6px 5px;background:var(--s1);
  border:1px solid transparent;border-radius:var(--r-s);
  cursor:pointer;text-align:left;color:inherit;font:inherit;overflow:hidden;
}
.cal-cell:hover{background:var(--s2)}
.cal-cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.cal-cell-empty{background:transparent;cursor:default;border-color:transparent}
.cal-cell-quiet{background:transparent}          /* no spending — stays minimal */
.cal-cell-today{border-color:var(--accent)}
.cal-cell-sel{background:var(--s3);border-color:var(--border2);box-shadow:0 0 0 1px var(--border2)}
.cal-cell-peak{background:rgba(216,89,38,.07)}   /* highest-spend day, subtle */
.cal-daynum{font-size:.72rem;font-weight:600;color:var(--t2);line-height:1}
.cal-cell-today .cal-daynum{color:var(--accent)}
.cal-amt{font-size:.66rem;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-all}
.cal-cnt{font-size:.58rem;color:var(--t3);line-height:1}
.cal-dot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-peak-tag{position:absolute;bottom:4px;right:5px;font-size:.55rem;color:var(--t3)}

/* ── Filters ── */
.flt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.flt-field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 132px}
.flt-field label{font-size:.6rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em}
.flt-field select,.flt-field input{
  width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  color:var(--t1);padding:8px 10px;font-size:.78rem;font-family:inherit;
}
.flt-field select:focus,.flt-field input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ── Compact filter bar (PRD §12) — search + a Filter button that opens
   the full field set in a sheet, instead of ~10 fields always expanded
   inline on a phone screen. ─────────────────────────────────────────── */
.filter-summary-row{display:flex;gap:8px;align-items:center}
.filter-btn{
  position:relative;display:flex;align-items:center;gap:6px;flex-shrink:0;
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:9px 13px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;
}
.filter-btn:hover{background:var(--s3)}
.filter-btn-count{
  background:var(--accent);color:#000;border-radius:99px;
  min-width:17px;height:17px;padding:0 4px;font-size:.62rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.filter-chips{display:flex;flex-wrap:wrap;gap:7px}
.filter-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-lt);border:1px solid rgba(0,200,5,.25);border-radius:99px;
  color:var(--accent);padding:5px 6px 5px 11px;font-size:.72rem;font-weight:600;font-family:inherit;cursor:pointer;
}
.filter-chip:hover{background:rgba(0,200,5,.14)}
.filter-chip-x{
  width:16px;height:16px;border-radius:50%;background:rgba(0,200,5,.18);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.filter-clear-all{background:none;border:none;color:var(--t3);font-size:.72rem;font-weight:600;font-family:inherit;cursor:pointer;padding:5px 2px}
.filter-clear-all:hover{color:var(--t1)}

/* ── Stat cards ── */
.ins-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px}
.ins-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 13px;display:flex;flex-direction:column;gap:5px;min-width:0;
  text-align:left;color:inherit;font:inherit;
}
button.ins-card{cursor:pointer}
button.ins-card:hover{background:var(--s2)}
button.ins-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ins-card-lbl{font-size:.58rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.ins-card-val{font-size:1.08rem;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;letter-spacing:-.02em;word-break:break-word}
.ins-card-sub{font-size:.65rem;color:var(--t3);word-break:break-word}
.ins-card-link{font-size:.6rem;color:var(--accent);font-weight:600;margin-top:auto}

/* ── Day detail drawer ── */
.day-panel{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.day-panel-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 15px;border-bottom:1px solid var(--border)}
.day-tx{display:flex;justify-content:space-between;gap:12px;padding:11px 15px;border-bottom:1px solid var(--border)}
.day-tx:last-child{border-bottom:0}
.day-tx-name{font-size:.8rem;color:var(--t1);font-weight:500;word-break:break-word}
.day-tx-meta{font-size:.64rem;color:var(--t3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px}
.day-tx-amt{font-size:.82rem;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.55rem;font-weight:700;padding:2px 6px;border-radius:99px;border:1px solid var(--border2);color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.pill-pending{color:var(--yellow);border-color:rgba(245,166,35,.35)}
.pill-refund{color:var(--accent);border-color:rgba(0,200,5,.3)}

/* ── Segmented control ── */
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{
  background:none;border:0;border-radius:99px;padding:5px 12px;
  font-size:.68rem;font-weight:600;color:var(--t3);cursor:pointer;font-family:inherit;white-space:nowrap;
}
.seg button.on{background:var(--s3);color:var(--t1)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── Toggle rows (Settings → Notifications) ── */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);cursor:pointer}
.toggle-row:last-child{border-bottom:0}
.toggle-row-lbl{font-size:.82rem;font-weight:600;color:var(--t1)}
.toggle-row-sub{font-size:.66rem;color:var(--t3);margin-top:2px}
input.switch{
  appearance:none;-webkit-appearance:none;flex-shrink:0;
  width:38px;height:22px;border-radius:99px;background:var(--wash-3);
  border:1px solid var(--border2);position:relative;cursor:pointer;
  transition:background .15s;
}
input.switch::before{
  content:'';position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;
  background:var(--t2);transition:transform .15s,background .15s;
}
input.switch:checked{background:var(--accent-lt);border-color:var(--accent)}
input.switch:checked::before{transform:translateX(16px);background:var(--accent)}
input.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Undo-delete toast (Bonus) ── */
.undo-toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:250;display:flex;align-items:center;gap:12px;
  background:var(--s3);border:1px solid var(--border2);border-radius:99px;
  padding:10px 10px 10px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35);
  font-size:.78rem;color:var(--t1);max-width:calc(100vw - 32px);
  animation:undo-toast-in .18s ease;
}
.undo-toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.undo-toast button{background:none;border:0;font-family:inherit;cursor:pointer}
.undo-toast>button:not(.undo-toast-x){color:var(--accent);font-weight:700;font-size:.78rem;padding:4px 8px}
.undo-toast-x{color:var(--t3);display:flex;padding:4px}
@keyframes undo-toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:700px){ .undo-toast{ bottom:calc(72px + env(safe-area-inset-bottom)); } }

/* ── Tags (Bonus) ── */
.tag-input-row{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  padding:8px 10px;
}
.tag-input-row input{flex:1;min-width:100px;background:none;border:none;padding:2px 0}
.tag-input-row input:focus{outline:none}
.tag-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--accent-lt);color:var(--accent);
  border-radius:99px;padding:3px 4px 3px 10px;font-size:.7rem;font-weight:600;white-space:nowrap;
}
.tag-chip button{background:none;border:0;color:inherit;font-size:.9rem;line-height:1;padding:2px 4px;cursor:pointer}

/* ── Split transactions (Bonus) ── */
.split-rows{display:flex;flex-direction:column;gap:8px}
.split-row{display:flex;gap:8px;align-items:center}
.split-row select{flex:1.3}
.split-amt{position:relative;flex:1}
.split-amt span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.78rem;pointer-events:none}
.split-amt input{padding-left:20px;width:100%}
.split-total{font-size:.68rem;margin-top:2px}

/* ── Achievements (Bonus) ── */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ach-badge{
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r-s);
  padding:12px 6px;opacity:.45;filter:grayscale(1);
}
.ach-badge.on{opacity:1;filter:none;border-color:var(--accent)}
.ach-badge-icon{
  width:34px;height:34px;border-radius:50%;background:var(--wash-3);
  display:flex;align-items:center;justify-content:center;
}
.ach-badge.on .ach-badge-icon{background:var(--accent)}
.ach-badge-lbl{font-size:.6rem;font-weight:600;color:var(--t2);line-height:1.3}

/* ── Net worth account rows ── */
.nwa-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border)}
.nwa-row:last-child{border-bottom:0}
.nwa-name{font-size:.8rem;color:var(--t1);font-weight:500}
.nwa-tag{font-size:.55rem;color:var(--t3);border:1px solid var(--border2);border-radius:99px;padding:1px 6px;margin-left:7px;text-transform:uppercase;letter-spacing:.05em}
.nwa-meta{font-size:.64rem;color:var(--t3);margin-top:3px}
.nwa-val{text-align:right;white-space:nowrap}
.nwa-amt{font-size:.85rem;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.nwa-chg{font-size:.64rem;font-variant-numeric:tabular-nums;margin-top:2px}

@media(max-width:560px){
  .cal-cell{min-height:52px;padding:4px 4px 3px}
  .cal-amt{font-size:.58rem}
  .cal-cnt{display:none}                 /* abbreviated cells; full detail on select */
  .cal-grid{gap:3px}
  .cal-title{min-width:0;flex:1}
  .ins-cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .viz-svg{height:170px}
  .flt-field{flex:1 1 100%}
}

/* ══════════════════════════════════════════════════════════════════
   ACCOUNTS + ADD TRANSACTION (v2 redesign)
   ══════════════════════════════════════════════════════════════════ */

/* ── Floating add button — the persistent entry point to Add Transaction ── */
.fab{
  position:fixed;right:24px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:150;
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#000;border:none;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 28px color-mix(in srgb, var(--accent) 35%, transparent),0 2px 8px rgba(0,0,0,.5);
  transition:transform .12s,box-shadow .12s,opacity .18s ease;
}
.fab:hover{box-shadow:0 12px 32px color-mix(in srgb, var(--accent) 45%, transparent),0 2px 8px rgba(0,0,0,.5)}
.fab:active{transform:scale(.92)}
/* Minimizes (not unmounts, so it stays reachable the instant scrolling
   stops) while actively scrolling down past the top of the page — keeps
   it from riding over a row the user is trying to read/tap mid-scroll. */
.fab-minimized{transform:scale(.72);opacity:.55}
@media(prefers-reduced-motion:reduce){ .fab{transition:none} }
@media(max-width:700px){ .fab{ right:18px; bottom:calc(80px + env(safe-area-inset-bottom)); } }

/* ── Account list ── */
.acct-list{display:flex;flex-direction:column;gap:10px}
.acct-card{
  display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,background .15s;
}
.acct-card:hover{background:var(--s2);border-color:var(--border2)}
.acct-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acct-card.hidden-acct{opacity:.5}
.acct-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
/* display:flex here (not just flex:1) is load-bearing — without it these were
   plain inline spans, so a long name + subtitle just ran together as one
   inline run of text instead of stacking, and acct-name's nowrap/ellipsis
   had no block box to truncate against, so a long account name (e.g.
   "Capital One 360 High Yield Savings") visually overlapped the balance
   instead of ellipsizing. */
.acct-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
/* Two-line wrap, not single-line ellipsis (PRD §8: "prefer two-line
   wrapping... ellipsis only as a last resort") — a long account name gets
   a second line before anything is cut off; -webkit-line-clamp then
   ellipsizes only if it's STILL too long even wrapped. The account's full,
   untruncated name is always one tap away on its own detail page
   (.acct-hero-name, no truncation there), and a title attribute on the
   row itself covers hover on desktop. */
.acct-name{
  font-size:.92rem;font-weight:600;color:var(--t1);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  line-height:1.25;word-break:break-word;
}
.acct-sub{font-size:.7rem;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* Same bug/fix as .acct-body above, mirrored on the right side — .acct-bal
   and .acct-chg were plain inline spans with no display set, so a balance
   and its "this month" change ran together on one line with no separation
   ("$659.06-$33.73 this mo") instead of stacking. */
.acct-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.acct-bal{font-size:.98rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t1);display:block;white-space:nowrap}
.acct-chg{font-size:.66rem;margin-top:2px;font-variant-numeric:tabular-nums;display:block;white-space:nowrap}
.acct-group-label{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:4px 2px 2px}

/* ── Account detail ── */
.acct-hero{display:flex;align-items:center;gap:16px}
.acct-hero-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acct-hero-name{font-size:1.05rem;font-weight:700;color:var(--t1)}
.acct-hero-sub{font-size:.72rem;color:var(--t3);margin-top:3px}
.acct-menu-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── Utilization ring ── */
.util-ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:132px;height:132px;flex-shrink:0}
.util-ring-svg{transform:rotate(-90deg)}
.util-ring-track{fill:none;stroke:var(--s3);stroke-width:10}
.util-ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1),stroke .3s}
.util-ring-center{position:absolute;display:flex;flex-direction:column;align-items:center}
.util-ring-pct{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.util-ring-lbl{font-size:.6rem;color:var(--t3);margin-top:3px;text-transform:uppercase;letter-spacing:.07em}

/* ── Credit card details grid ── */
.cc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
.cc-item{padding:12px 0;border-bottom:1px solid var(--border)}
.cc-item:nth-last-child(-n+2){border-bottom:none}
.cc-item-lbl{font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.cc-item-val{font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t1)}
@media(max-width:520px){ .cc-grid{grid-template-columns:1fr} .cc-item:nth-last-child(-n+2){border-bottom:1px solid var(--border)} .cc-item:last-child{border-bottom:none} }

/* ── Add Transaction modal ── */
.modal-card-lg{max-width:520px}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
.modal-title{font-size:1rem;font-weight:700;color:var(--t1);letter-spacing:-.02em}
.modal-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.amt-hero{display:flex;align-items:center;justify-content:center;gap:2px;padding:14px 0 4px}
.amt-hero-sign{font-size:1.6rem;font-weight:700;color:var(--t3)}
.amt-hero input{
  background:none;border:none;outline:none;color:var(--t1);
  font-size:2.6rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  width:100%;max-width:220px;text-align:center;font-family:inherit;
}
.type-toggle{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
.type-toggle button{
  flex:1;background:none;border:0;border-radius:99px;padding:9px 6px;
  font-size:.78rem;font-weight:700;color:var(--t3);cursor:pointer;font-family:inherit;
}
.type-toggle button.on{background:var(--accent);color:#000}
.type-toggle button.on.income{background:var(--accent)}
.type-toggle button.on.transfer{background:var(--blue);color:#fff}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cat-chip{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  padding:10px 4px;cursor:pointer;font-family:inherit;color:var(--t2);font-size:.66rem;font-weight:600;
}
.cat-chip.on{border-color:var(--accent);background:var(--accent-lt);color:var(--t1)}
.cat-chip-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;color:#000}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pm-chip{
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  padding:10px 8px;cursor:pointer;font-family:inherit;color:var(--t2);font-size:.72rem;font-weight:600;text-align:center;
}
.pm-chip.on{border-color:var(--accent);background:var(--accent-lt);color:var(--t1)}
.acct-pick-grid{display:flex;flex-direction:column;gap:8px}
.acct-pick{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
  padding:10px 12px;cursor:pointer;font-family:inherit;color:var(--t1);
}
.acct-pick.on{border-color:var(--accent);background:var(--accent-lt)}
.acct-pick-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acct-pick-name{font-size:.82rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-pick-bal{font-size:.72rem;color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0}
.cc-snapshot{
  background:rgba(123,116,255,.05);border:1px solid rgba(123,116,255,.2);border-radius:var(--r);
  padding:16px 18px;animation:modal-pop .18s cubic-bezier(.2,.8,.2,1);
}
.cc-snapshot-hd{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.quick-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.quick-chip{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  background:var(--s2);border:1px solid var(--border);border-radius:99px;
  padding:8px 14px;font-size:.74rem;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;white-space:nowrap;
}
.quick-chip:hover{border-color:var(--border2);color:var(--t1)}

/* ── Icon / color pickers (account customization) ── */
.picker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icon-pick{
  aspect-ratio:1;border-radius:var(--r-s);background:var(--s2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-pick.on{border-color:var(--accent);background:var(--accent-lt)}
.color-pick{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent}
.color-pick.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}

/* ── Sheet action row (rename/hide/archive/delete) ── */
.sheet-action{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--border);
  padding:13px 4px;color:var(--t1);font-size:.85rem;font-family:inherit;cursor:pointer;
}
.sheet-action:last-child{border-bottom:none}
.sheet-action:hover{color:var(--accent)}
.sheet-action.danger{color:var(--red)}
.sheet-action.danger:hover{color:var(--red)}

@media(max-width:700px){
  .modal-overlay{align-items:flex-end;padding:0}
  .modal-card-lg{max-width:100%;border-radius:20px 20px 0 0;max-height:92vh;animation:sheet-up .22s cubic-bezier(.2,.8,.2,1)}
}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ══════════════════════════════════════════════════════════════════
   CREDIT CARD DASHBOARD (Priority 3): statement timeline, payment
   center, early payment assistant, rewards breakdown, notifications.
   ══════════════════════════════════════════════════════════════════ */

/* ── Statement timeline ── */
.timeline{display:flex;overflow-x:auto;gap:0;padding-bottom:4px}
.timeline-step{
  flex:1 0 128px;min-width:128px;position:relative;padding:0 10px 0 0;
}
.timeline-step::before{
  content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border2);z-index:0;
}
.timeline-step:first-child::before{display:none}
.timeline-dot{
  width:26px;height:26px;border-radius:50%;background:var(--s2);border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin-bottom:10px;
}
.timeline-step.done .timeline-dot{background:var(--accent);border-color:var(--accent)}
.timeline-step.active .timeline-dot{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,200,5,.15)}
.timeline-step.done::before{background:var(--accent)}
.timeline-lbl{font-size:.72rem;font-weight:700;color:var(--t1)}
.timeline-sub{font-size:.68rem;color:var(--t3);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.timeline-desc{font-size:.64rem;color:var(--t3);line-height:1.45}
@media(max-width:700px){ .timeline{gap:14px} }
/* Below ~560px the 3 fixed-width (128px) horizontal steps no longer fit
   the card even with horizontal scroll enabled — and a scrollable region
   with no visible affordance just reads as the last step being clipped/
   missing (PRD §9: "Fix the Statement Timeline overflow... the third
   timeline stage is clipped on mobile"). Switch to a vertical layout
   instead: dot + connecting line on the left, label/sub/desc stacked on
   the right — every step fits, nothing to scroll to find. */
@media(max-width:560px){
  .timeline{display:block;overflow-x:visible}
  .timeline-step{
    display:grid;grid-template-columns:26px 1fr;column-gap:12px;
    flex:none;min-width:0;width:100%;position:relative;
    padding:0 0 22px 0;
  }
  .timeline-step:last-child{padding-bottom:0}
  .timeline-dot{grid-column:1;grid-row:1/4;align-self:start;margin-bottom:0}
  .timeline-lbl{grid-column:2;grid-row:1}
  .timeline-sub{grid-column:2;grid-row:2}
  .timeline-desc{grid-column:2;grid-row:3}
  /* Vertical connector: below this step's dot down to the next one's. */
  .timeline-step::before{display:none}
  .timeline-step:not(:last-child)::after{
    content:'';position:absolute;left:12px;top:26px;
    width:2px;height:calc(100% - 22px);background:var(--border2);
  }
  .timeline-step.done:not(:last-child)::after{background:var(--accent)}
}

/* ── Payment center ── */
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.pay-actions{display:flex;gap:8px;flex-wrap:wrap}
.early-pay-box{
  margin-top:16px;padding:16px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-s);
}
.early-pay-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ep-chip{
  background:var(--s3);border:1px solid var(--border);border-radius:99px;
  padding:7px 14px;font-size:.74rem;font-weight:700;color:var(--t2);cursor:pointer;font-family:inherit;
}
.ep-chip.on{background:var(--accent);color:#000;border-color:var(--accent)}
.early-pay-preview{display:flex;align-items:center;gap:14px;margin:14px 0}
.ep-before,.ep-after{text-align:center;flex:1}
.ep-arrow{color:var(--t3)}
.ep-preview-val{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.ep-preview-lbl{font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.pay-history-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.78rem}
.pay-history-row:last-child{border-bottom:none}

/* ── Rewards breakdown ── */
.reward-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.reward-row:last-child{border-bottom:none}
.reward-name{flex:0 0 118px;font-size:.78rem;color:var(--t2)}
.reward-bar-track{flex:1;height:6px;background:var(--s3);border-radius:99px;overflow:hidden}
.reward-bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.reward-val{flex:0 0 64px;text-align:right;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}

/* ── Notifications ── */
.notif-row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.notif-row:last-child{border-bottom:none}
.notif-icon{
  width:30px;height:30px;border-radius:9px;background:var(--accent-lt);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.notif-text{font-size:.8rem;color:var(--t1);line-height:1.4}

/* ── Insight list ── */
.insight-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,200,5,.12);font-size:.82rem;color:var(--t1);line-height:1.5}
.insight-row:last-child{border-bottom:none}

/* ── Bills ── */
.bill-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
/* A bill row packs a lot in: icon, name, a Recurring tag, a status badge,
   the amount, and one or two buttons — more than fits on one line at
   phone width even with .v-row-left free to shrink. Rather than let
   .bill-actions' flex-shrink:0 content run out of room and visually cram
   into .v-row-left (the status badge/amount overlapping the name/Recurring
   tag), give the row its own line to drop onto below the icon/name. */
@media(max-width:560px){
  /* flex-wrap:wrap alone doesn't force this onto two lines — .v-row-left's
     min-width:0 lets it shrink arbitrarily, so the browser considers
     everything "fits" on one line and never wraps, squeezing the name +
     Recurring tag into a sliver of space instead. flex-direction:column
     sidesteps that ambiguity entirely: always two lines here, not
     "wrap only if it doesn't fit". */
  .v-row:has(.bill-actions){flex-direction:column;align-items:stretch;row-gap:8px}
  .v-row:has(.bill-actions) .v-row-left{flex:initial}
  .v-row:has(.bill-actions) .bill-actions{width:100%;justify-content:space-between}
}
.bill-recur-tag{font-size:.55rem;color:var(--t3);border:1px solid var(--border2);border-radius:99px;padding:1px 6px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}

/* ── Goal celebration confetti (Priority 16) ── */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:1}
.confetti-piece{position:absolute;top:-12px;width:7px;height:12px;opacity:0;animation:confetti-fall 1.7s ease-in forwards;border-radius:1px}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(220px) rotate(560deg);opacity:0}
}
@media(prefers-reduced-motion:reduce){ .confetti-piece{animation:none;display:none} }
.gc-relative{position:relative;overflow:hidden}

/* ── Receipt Scanner (Priority 15) ── */
.scan-box{display:flex;flex-direction:column;gap:10px}
.scan-status{display:flex;align-items:center;gap:10px;padding:2px 2px}
.scan-status img{width:40px;height:40px;object-fit:cover;border-radius:9px;border:1px solid var(--border2);flex-shrink:0}
.scan-status-text{font-size:.72rem;color:var(--t3);line-height:1.4}
.scan-status-text.err{color:var(--red)}

/* ── Swipe-to-delete (Priority 13) ── */
.swipe-del{
  width:84px;height:100%;background:var(--red);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.swipe-del:hover{background:#e04600}

/* ── Dashboard Quick Actions ── */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:10px}
.qa-btn{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 8px;cursor:pointer;font-family:inherit;color:var(--t2);
}
.qa-btn:hover{background:var(--s2);border-color:var(--border2)}
.qa-icon{width:40px;height:40px;border-radius:12px;background:var(--accent-lt);display:flex;align-items:center;justify-content:center}
.qa-label{font-size:.68rem;font-weight:600;color:var(--t2);text-align:center}

/* ── Quick Add (long-press the FAB) ── */
.quick-menu-overlay{position:fixed;inset:0;z-index:149;background:transparent}
.quick-menu{
  position:fixed;right:24px;bottom:calc(28px + 56px + 14px + env(safe-area-inset-bottom));z-index:150;
  background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);
  box-shadow:0 12px 40px rgba(0,0,0,.5);padding:8px;min-width:216px;
  animation:modal-pop .15s cubic-bezier(.2,.8,.2,1);
}
.quick-menu-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--r-s);padding:9px 10px;
  color:var(--t1);font-size:.82rem;font-family:inherit;cursor:pointer;
}
.quick-menu-item:hover{background:var(--s2)}
.quick-menu-icon{width:30px;height:30px;border-radius:9px;background:var(--s3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:700px){ .quick-menu{ right:18px; bottom:calc(80px + 56px + 14px + env(safe-area-inset-bottom)); } }

/* ── Monthly Review ── */
.grade-badge{
  width:76px;height:76px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:800;border:3px solid currentColor;
}
.mr-bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.mr-bar-row{display:flex;align-items:center;gap:10px}
.mr-bar-lbl{width:76px;flex-shrink:0;font-size:.7rem;color:var(--t3)}
.mr-bar-track{flex:1;height:10px;background:var(--s3);border-radius:99px;overflow:hidden}
.mr-bar-fill{height:100%;border-radius:99px}
.mr-bar-val{width:84px;flex-shrink:0;text-align:right;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<div id="root"></div>
<script id="app-src" type="text/jsx-source">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ── Helpers ────────────────────────────────────────────────────────────
function parseLocalDate(str) {
  if (!str) return new Date();
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
// Cents everywhere by default — every currency(x) / money0(x) call in the
// app now shows the hundredths place unless a caller explicitly asks for
// fewer (none currently do; the old whole-dollar callers were switched to
// this default rather than passing dec=0).
// Negative zero is normalized HERE, once, for every caller — not with
// per-call-site `bal>0` guards scattered around the app. A value that
// rounds to 0 at the requested precision (exact -0, or a tiny negative
// float left over from floating-point drift after enough add/subtract
// operations, e.g. paying a card down to "$0" can leave -0.0000000001)
// must never display as the confusing "-$0.00".
const currency = (n, dec=2) => {
  n = (typeof n === 'number' && isFinite(n)) ? n : 0;
  const factor = Math.pow(10, dec);
  if (Math.round(Math.abs(n) * factor) === 0) n = 0;
  return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:dec}).format(n);
};
const pct = (n,d=1) => (n||0).toFixed(d)+'%';

function getPhaseInfo(startDateStr, ref) {
  const start = parseLocalDate(startDateStr);
  const now   = ref || new Date();
  const idx   = (now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())+1;
  // Rent alternates every other month during 2026 (Jul=rent, Aug free, Sep rent…).
  // From Jan 2027 onward every month is a rent month (no rent-free months).
  const alternating = now.getFullYear() <= 2026;
  const rentMonth = idx >= 1 && (!alternating || ((idx - 1) % 2 === 0));   // 2026: Jul/Sep/Nov · 2027+: all
  const rentFree  = idx >= 1 && alternating && ((idx - 1) % 2 === 1);      // 2026 only: Aug/Oct/Dec
  return {
    idx,
    isPreEmployment: idx <= 0,
    isRentMonth:     rentMonth,
    isRentFree:      rentFree,
    // Back-compat aliases: "early" = rent-free (earlyBudget), "full" = rent month (laterBudget)
    isEarly:         rentFree,
    isFull:          rentMonth,
  };
}

// ── Defaults ───────────────────────────────────────────────────────────
const DEFAULT_SETTINGS = {
  schemaVersion:        3,
  startDate:            '2026-07-01',
  grossBase:            5000,
  grossOTE:             6667,
  federalTax:           946,

  // ── Income ──────────────────────────────────────────────────────────
  // Paid on the 1st and 3rd THURSDAY of every month → always exactly
  // 2 checks/month, 24/year (4th & 5th Thursdays never count).
  // netPerPaycheck is TAKE-HOME, already net of the 401(k) deduction —
  // never subtract employee401kPerPaycheck from it again.
  netPerPaycheck:       1713,       // × 2 = $3,426/mo · × 24 = $41,112/yr
  paychecksPerMonth:    2,
  paychecksPerYear:     24,
  takeHome:             3426,       // derived: netPerPaycheck × paychecksPerMonth

  // ── 401(k) ──────────────────────────────────────────────────────────
  employee401kPerPaycheck: 138.48,  // × 2 = $276.96/mo · × 24 = $3,323.52/yr
  employerMatchRate:       0.5,     // employer matches 50% …
  employerMatchPct:        6,       // … of the first 6% of eligible pay
  employerMatchAnnualCap:  2400,    // hard cap per CALENDAR year
  contribution401kStart:'2026-08-01',   // 401(k) contributions begin this month
  contribution401k:     276.96,     // monthly employee contribution (legacy field)
  commissionHYSAPct:    60,
  commissionPersonalPct:40,
  hysaGoal:             11000,
  rothIRAYearlyLimit:   7500,
  ira401kYearlyMax:     24500,
  earlyBudget: {
    utilitiesAndFee:   100,
    rentersInsurance:  15,
    rothIRA:           625,
    hysa:              1800,
    groceries:         400,
    gas:               150,
    funTravel:         250,
    outToEat:          250,
    shopping:          150,
  },
  laterBudget: {
    rentAndFee:        1400,
    utilities:         50,
    rentersInsurance:  15,
    rothIRA:           625,
    hysa:              500,
    groceries:         400,
    gas:               130,
    funTravel:         250,
    outToEat:          200,
    shopping:          150,
  },

  // ── Personalization (Priority 18) ──────────────────────────────────
  accentColor: '#00C805',
  theme:       'dark',      // 'dark' | 'light'
  notifPrefs: {
    creditCardAlerts: true,   // per-card Notifications feed on Account Detail
    billReminders:    true,   // "due soon" cards on Dashboard / Bills
    budgetAlerts:     true,   // over-budget callouts on Spending / Dashboard
  },

  // ── Bonus features ──────────────────────────────────────────────────
  taxDeductibleCategories: [],   // category ids the user has flagged as tax-deductible
  budgetRollover: false,         // unspent budget carries into next month, per category
};

const DEFAULT_GOALS = {
  schemaVersion:    2,
  hysaBalance:      0,
  ira401kBalance:   0,   // combined 401(k) — kept for back-compat / manual override
  k401Employee:     0,   // employee contributions only
  k401Employer:     0,   // employer match only (NOT spendable income)
  rothIRAOverride:  null,
};

const DEFAULT_NETWORTH = {
  accounts: {
    checking:   0,   // editable here
    brokerage:  0,   // editable here
    creditCard: 0,   // editable here
    loans:      0,   // editable here
    // hysa / rothIRA / ira401k come from fd_goals (single source of truth)
  },
  history: [],
};

// Deep clone — callers must never receive a live reference into DEFAULT_*,
// otherwise two scenarios (or two sessions) can end up aliasing one object.
function cloneDeep(v) {
  if (Array.isArray(v)) return v.map(cloneDeep);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) out[k] = cloneDeep(v[k]);
    return out;
  }
  return v;
}

function deepMerge(def, stored) {
  if (Array.isArray(def)) return cloneDeep(Array.isArray(stored) ? stored : def);
  if (!stored || typeof stored !== 'object') return cloneDeep(def);
  const out = {};
  for (const k of Object.keys(def)) {
    if (!(k in stored)) {
      out[k] = cloneDeep(def[k]);                       // fresh copy, never the default itself
    } else if (Array.isArray(def[k])) {
      out[k] = cloneDeep(Array.isArray(stored[k]) ? stored[k] : def[k]);
    } else if (def[k] && typeof def[k] === 'object') {
      out[k] = deepMerge(def[k], stored[k]);            // recurse → earlyBudget and laterBudget
    } else {                                            // get independent objects
      out[k] = stored[k];
    }
  }
  // Keep any user data the current defaults don't describe.
  for (const k of Object.keys(stored)) if (!(k in out)) out[k] = cloneDeep(stored[k]);
  return out;
}

// ── Schema migrations ─────────────────────────────────────────────────
// Run ONCE on load, then the record is stamped with its version. They must
// never re-sync the two budget scenarios on subsequent loads.
const SETTINGS_SCHEMA_VERSION = 3;
const GOALS_SCHEMA_VERSION    = 2;

function migrateSettings(raw) {
  if (!raw || typeof raw !== 'object') return raw;
  const s = { ...raw };
  if ((s.schemaVersion || 0) >= SETTINGS_SCHEMA_VERSION) return s;

  // v1 → v2 · savings split.
  // v1 kept ONE shared Roth/HYSA figure (top-level, or inside a single
  // `budget` object) that both scenarios read. Seed each scenario from it
  // once so no data is lost, then leave them permanently independent.
  const early  = { ...(s.earlyBudget || {}) };
  const later  = { ...(s.laterBudget || {}) };
  const legacy = (s.budget && typeof s.budget === 'object') ? s.budget : s;
  for (const key of ['rothIRA', 'hysa']) {
    const shared = legacy[key];
    if (typeof shared === 'number') {
      if (early[key] == null) early[key] = shared;
      if (later[key] == null) later[key] = shared;
    }
  }
  s.earlyBudget = early;
  s.laterBudget = later;
  delete s.rothIRA;                     // drop the shared fields so nothing
  delete s.hysa;                        // can read them again

  // v1 → v2 · income. v1 stored income as a single monthly lump; re-express
  // it as a per-paycheck amount so the 2×/month schedule drives everything.
  if (s.netPerPaycheck == null && typeof s.takeHome === 'number' && s.takeHome > 0)
    s.netPerPaycheck = round2(s.takeHome / (s.paychecksPerMonth || 2));

  // v2 → v3 · stale placeholder income. Any browser that saved settings
  // before the paycheck-schedule fix has the OLD hardcoded default
  // (takeHome: 3755, no netPerPaycheck) rather than a value the user
  // actually entered. The v1→v2 step above dutifully derived
  // netPerPaycheck = 3755/2 = 1877.50 from it — which is why the Dashboard
  // could still show $3,755/mo (2 × 1877.50) on a device that never touched
  // Settings, even after every other fix had deployed. Both values match
  // the exact pre-fix placeholder, so this is safe to correct once.
  if (s.netPerPaycheck === 1877.5 && s.takeHome === 3755) {
    s.netPerPaycheck = 1713;
    s.takeHome = 3426;
  }
  // Same collision, cosmetic only: 'employerMatchPct' existed pre-fix with a
  // different meaning (a flat 4%) and is now "match applies to the first N%
  // of pay" (6%). It was never read by the match dollar calculation (that
  // uses employerMatchRate/employerMatchAnnualCap, both new keys), so this
  // only ever affected the Settings label, never a real number.
  if (s.employerMatchPct === 4) s.employerMatchPct = 6;

  s.schemaVersion = SETTINGS_SCHEMA_VERSION;
  return s;
}

function migrateGoals(raw) {
  if (!raw || typeof raw !== 'object') return raw;
  const g = { ...raw };
