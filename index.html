  if ((g.schemaVersion || 0) >= GOALS_SCHEMA_VERSION) return g;
  // v1 tracked only a combined 401(k) balance. Attribute the existing total to
  // employee contributions (the employer split was never recorded) so the
  // combined figure is preserved rather than doubled or zeroed.
  const combined = +g.ira401kBalance || 0;
  if (combined > 0 && !g.k401Employee && !g.k401Employer) g.k401Employee = combined;
  g.schemaVersion = GOALS_SCHEMA_VERSION;
  return g;
}

function usePersist(key, def, migrate) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return cloneDeep(def);
      const parsed = JSON.parse(raw);
      return deepMerge(def, migrate ? migrate(parsed) : parsed);
    } catch { return cloneDeep(def); }
  });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
  return [val, setVal];
}

// ── Backup / restore ───────────────────────────────────────────────────
// This app has no server and no account — each browser/device holds its
// own completely separate copy of localStorage. Export/import is the
// manual bridge between devices: read the raw persisted JSON directly
// (what's actually saved, not any unsaved in-memory form state), bundle it
// into one file, and on the other end write it back verbatim. Writing
// raw + reloading (rather than pushing into React state) means the normal
// usePersist/migrate path runs exactly as it would for any other load, so
// an export from an older build still migrates correctly on import.
const BACKUP_KEYS = ['fd_settings', 'fd_transactions', 'fd_goals', 'fd_commissions', 'fd_networth', 'fd_accounts', 'fd_bills', 'fd_recurring', 'fd_customgoals', 'fd_customcategories'];

function exportBackup() {
  const data = {};
  for (const k of BACKUP_KEYS) {
    const raw = localStorage.getItem(k);
    if (raw == null) continue;
    try { data[k] = JSON.parse(raw); } catch { /* skip anything unreadable */ }
  }
  const payload = { app: 'finance-dashboard', exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finance-backup-${dateKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Reads and validates the file; the actual write only happens after the
// caller confirms, since this replaces whatever is currently on THIS device.
function readBackupFile(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch { cb({ ok:false, error:'That file is not valid JSON.' }); return; }
    const data = parsed && typeof parsed.data === 'object' ? parsed.data : null;
    if (!data || !BACKUP_KEYS.some(k => k in data)) {
      cb({ ok:false, error:'That file does not look like a Finance backup.' });
      return;
    }
    cb({ ok:true, data });
  };
  reader.onerror = () => cb({ ok:false, error:'Could not read that file.' });

function applyBackup(data) {

// ── CSV export / import ────────────────────────────────────────────────
// Separate from the JSON backup above: this is a plain spreadsheet-friendly
// transaction ledger — for opening in Excel/Sheets or importing history from
// a bank export, not a full-fidelity copy of every screen's settings.
const CSV_COLUMNS = ['Date','Type','Category','Description','Merchant','Amount','Account','Payment Method','Notes'];
function csvEscape(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportTransactionsCSV(transactions, filename) {
  const rows = [CSV_COLUMNS.join(',')];
  for (const t of [...(transactions||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''))) {
    rows.push([
      t.date||'', t.type||'', catLabel(categoryOf(t)), t.description||'', t.merchant||'',
      t.amount!=null?t.amount:'', accountOf(t), t.paymentMethod||'', t.notes||'',

  }
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || `finance-transactions-${dateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();

}
// One line of CSV → array of fields, respecting quoted commas/newlines.
// Small hand-rolled parser rather than a split(',') — bank exports and
// Excel both quote fields that contain commas (e.g. "Amazon, Inc").
function parseCSVLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i=0;i<line.length;i++){
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur+='"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { out.push(cur); cur=''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function parseTransactionsCSV(text, accounts) {
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
  if (!lines.length) return { rows:[], errors:['File is empty.'] };
  const header = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const idx = name => header.indexOf(name);
  const iDate=idx('date'), iType=idx('type'), iCat=idx('category'), iDesc=idx('description'),
        iMerch=idx('merchant'), iAmt=idx('amount'), iAcct=idx('account'), iPm=idx('payment method'), iNotes=idx('notes');
  if (iDate === -1 || iAmt === -1) {
    return { rows:[], errors:[`Missing required column${iDate===-1&&iAmt===-1?'s':''}: ${[iDate===-1&&'Date',iAmt===-1&&'Amount'].filter(Boolean).join(', ')}.`] };
  }
  const rows = [], errors = [];
  const acctByName = new Map((accounts||[]).filter(a=>!a.archived).map(a => [a.name.trim().toLowerCase(), a]));
  const catByLabel  = new Map(CATEGORIES.map(c => [c.label.toLowerCase(), c.id]));
  for (let li=1; li<lines.length; li++) {
    const f = parseCSVLine(lines[li]);
    const rawDate = (f[iDate]||'').trim();
    const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate
      : (() => { const d = new Date(rawDate); return isNaN(d) ? null : ymd(d); })();
    const amt = parseFloat((f[iAmt]||'').replace(/[$,]/g,''));
    if (!parsedDate) { errors.push(`Row ${li+1}: unrecognized date "${rawDate}".`); continue; }
    if (!isFinite(amt)) { errors.push(`Row ${li+1}: unrecognized amount "${f[iAmt]}".`); continue; }
    const rawType = (iType>=0 ? f[iType] : '').trim().toLowerCase();
    const type = rawType === 'income' ? 'income' : rawType === 'transfer' ? 'expense' /* transfers need two accounts — import as a plain expense rather than silently move money */ : 'expense';
    const rawCat = (iCat>=0 ? f[iCat] : '').trim();
    const category = type==='income' ? 'income' : (catByLabel.get(rawCat.toLowerCase()) || (CATEGORIES.some(c=>c.id===rawCat)?rawCat:'other'));
    const acctName = (iAcct>=0 ? f[iAcct] : '').trim();
    const matchedAcct = acctByName.get(acctName.toLowerCase());
    rows.push({
      id: String(Date.now())+Math.random().toString(36).slice(2,6)+li,
      date: parsedDate, type, amount: round2(Math.abs(amt)), category,
      description: (iDesc>=0 ? f[iDesc] : '').trim() || (iMerch>=0 ? f[iMerch] : '').trim() || catLabel(category),
      merchant: (iMerch>=0 ? f[iMerch] : '').trim(),
      notes: (iNotes>=0 ? f[iNotes] : '').trim(),
      paymentMethod: (iPm>=0 ? f[iPm] : '').trim() || 'Imported',
      accountId: matchedAcct ? matchedAcct.id : null,
      account: matchedAcct ? matchedAcct.name : (acctName || 'Unspecified'),
      importedFromCSV: true,
    });
  }
  return { rows, errors };
}

// ── Income / paycheck-schedule helpers ────────────────────────────────
const round2 = n => Math.round(((+n||0) + Number.EPSILON) * 100) / 100;

// Nth Thursday of a month (monthIdx 0-based). n=1 → 1st Thursday, n=3 → 3rd.
function nthThursdayOfMonth(year, monthIdx, n) {
  const first  = new Date(year, monthIdx, 1);
  const offset = (4 - first.getDay() + 7) % 7;        // 4 = Thursday
  return new Date(year, monthIdx, 1 + offset + (n - 1) * 7);
}
// Pay dates for a month = 1st and 3rd Thursday. ALWAYS exactly two — a month
// with 4 or 5 Thursdays never produces an extra paycheck.
function paycheckDatesForMonth(year, monthIdx) {
  return [nthThursdayOfMonth(year, monthIdx, 1), nthThursdayOfMonth(year, monthIdx, 3)];
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function checksPerMonth(s) { return s.paychecksPerMonth || 2; }
function checksPerYear(s)  { return s.paychecksPerYear  || 24; }
// Take-home per check — already NET of the 401(k) deduction.
function netPerCheck(s) {
  return s.netPerPaycheck != null ? s.netPerPaycheck : round2((s.takeHome || 0) / checksPerMonth(s));
}
function monthlyNetIncome(s) { return round2(netPerCheck(s) * checksPerMonth(s)); }   // $3,426
function annualNetIncome(s)  { return round2(netPerCheck(s) * checksPerYear(s));  }   // $41,112

// ── 401(k) ────────────────────────────────────────────────────────────
function employee401kPerCheck(s) { return s.employee401kPerPaycheck || 0; }           // $138.48
// Employer matches 50% of the employee contribution, capped for the CALENDAR year.
function employerMatchForPaycheck(s, employeeContrib, ytdMatch) {
  const cap       = s.employerMatchAnnualCap != null ? s.employerMatchAnnualCap : Infinity;
  const remaining = Math.max(cap - (ytdMatch || 0), 0);
  const rate      = s.employerMatchRate != null ? s.employerMatchRate : 0.5;
  return round2(Math.max(Math.min((employeeContrib || 0) * rate, remaining), 0));
}
// Employer match already banked in a given calendar year (from logged paychecks).
function ytdEmployerMatch(transactions, year) {
  return round2((transactions || [])
    .filter(t => t.kind === 'paycheck' && t.date && Number(t.date.slice(0,4)) === year)
    .reduce((s, t) => s + (t.employer401k || 0), 0));
}
// This calendar year's employEE 401(k) contributions — the IRS employee
// deferral limit is a per-YEAR figure, never a lifetime one, so it must be
// measured against contributions made since Jan 1, not the all-time
// cumulative total goals.k401Employee holds (PRD §15: "Reset contribution
// progress each January 1. Do not reset the actual account balance.").
function ytd401kEmployeeContributions(transactions, year) {
  return round2((transactions || [])
    .filter(t => t.kind === 'paycheck' && t.date && Number(t.date.slice(0,4)) === year)

}

// but Roth has no dedicated ledger field the way 401(k) contributions do
// (goals.rothIRAOverride is a market-value BALANCE, not a running
// contribution count, so it inflates with investment growth and is never
// safe to compare against the annual IRS limit). Reconstructed from the
// same transaction history everything else already reads: paycheck
// allocations plus any Roth IRA contribution logged directly.
function ytdRothContributions(transactions, year) {
  let total = 0;
  for (const t of (transactions || [])) {
    if (!t.date || Number(t.date.slice(0,4)) !== year) continue;
    if (t.kind === 'paycheck' && t.allocations && t.allocations.rothIRA) total += safeNum(t.allocations.rothIRA);

function k401Active(s, ref) {

}
// Project one month of 401(k) activity. `matchByYear` is a running
// {year: matchSoFar} ledger the caller carries across months, so the employer
// allowance is consumed per CALENDAR year and resets automatically each Jan 1.
function project401kMonth(s, monthDate, matchByYear) {
  const year = monthDate.getFullYear();
  let employee = 0, employer = 0;
  for (const payDate of paycheckDatesForMonth(year, monthDate.getMonth())) {
    if (!k401Active(s, payDate)) continue;
    const emp   = employee401kPerCheck(s);
    const match = employerMatchForPaycheck(s, emp, matchByYear[year] || 0);
    matchByYear[year] = round2((matchByYear[year] || 0) + match);
    employee = round2(employee + emp);
    employer = round2(employer + match);
  }

}

// ── Budget-scenario helpers ───────────────────────────────────────────
// "With Rent" (laterBudget) and "Without Rent" (earlyBudget) are INDEPENDENT
// scenarios. Always resolve the scenario for the month in question — never read
// one scenario's Roth/HYSA figure while the other scenario is active.
function budgetForRef(settings, ref) {
  const ph = getPhaseInfo(settings.startDate, ref);
  return ph.isRentMonth ? settings.laterBudget : settings.earlyBudget;
}
function rothRateFor(settings, ref) { return (budgetForRef(settings, ref) || {}).rothIRA || 0; }

function blendedRate(settings, key) {
  const e = (settings.earlyBudget || {})[key] || 0;
  const l = (settings.laterBudget || {})[key] || 0;
  return new Date().getFullYear() >= 2027 ? l : (e + l) / 2;
}
// Which monthly budget is active right now (rent-free early vs full later)
function activeBudgetFor(settings) {

}

function currentRothBal(settings, goals) {

}

// the lower HYSA; rent-free months drop Rent and use the accelerated HYSA.
function perCheckAllocations(settings, ref) {
  const ph = getPhaseInfo(settings.startDate, ref);
  const rentMonth = ph.isRentMonth;
  const b = budgetForRef(settings, ref) || {};
  const n = checksPerMonth(settings);          // 2 checks per month
  const half = x => round2((x || 0) / n);
  const rows = [];
  if (rentMonth) rows.push({ key:'rentAndFee', label:'Rent & Fee', amount:half(b.rentAndFee) });
  rows.push({ key:'hysa',             label:'HYSA',             amount:half(b.hysa) });
  rows.push({ key:'rothIRA',          label:'Roth IRA',         amount:half(b.rothIRA) });
  rows.push({ key:'groceries',        label:'Groceries',        amount:half(b.groceries) });
  rows.push({ key:'gas',              label:'Gas',              amount:half(b.gas) });
  rows.push({ key:'funTravel',        label:'Travel',           amount:half(b.funTravel) });
  rows.push({ key:'outToEat',         label:'Dining',           amount:half(b.outToEat) });
  rows.push({ key:'shopping',         label:'Shopping',         amount:half(b.shopping) });
  rows.push({ key:'utilities',        label:'Utilities',        amount:half(rentMonth ? b.utilities : b.utilitiesAndFee) });
  rows.push({ key:'rentersInsurance', label:'Renters Insurance',amount:half(b.rentersInsurance) });

// Session-scoped store for "ETA improved" highlights — clears on next app session
function loadSess(k, d) { try { const r = sessionStorage.getItem(k); return r ? JSON.parse(r) : d; } catch { return d; } }

// Format an ETA improvement (in days) as a short human phrase
function fmtImprove(days) {
  days = Math.max(0, Math.round(days));
  if (days >= 45) return Math.round(days/30.44)+' months';
  if (days >= 25) return '1 month';
  if (days >= 11) return Math.round(days/7)+' weeks';
  if (days >= 6)  return '1 week';
  return Math.max(1, days)+' days';

// ══════════════════════════════════════════════════════════════════════
// ANALYTICS LAYER — single source of truth for every derived number.
// Classification lives here and ONLY here; no chart or card re-implements
// "is this spending?". Amounts are stored POSITIVE with `type` carrying the
// sign, so nothing below should ever compare amount < 0.
// ══════════════════════════════════════════════════════════════════════

// Safe local-date handling. Dates are 'YYYY-MM-DD' strings; parsing them with

function txDateKey(t) {

// Categories that represent moving money into the user's own accounts

const SAVINGS_CATEGORIES    = ['savings', 'hysa', 'rothIRA'];
const RETIREMENT_KEYWORDS   = ['401k', '401(k)', 'roth', 'ira', 'retirement', 'employer match', 'vanguard', 'fidelity'];
const SAVINGS_KEYWORDS      = ['hysa', 'savings', 'emergency fund', 'ally bank', 'marcus', 'transfer to savings'];
const TRANSFER_KEYWORDS     = ['transfer', 'xfer', 'zelle to self', 'to checking', 'from checking', 'internal transfer', 'balance transfer'];
const CC_PAYMENT_KEYWORDS   = ['credit card payment', 'card payment', 'autopay', 'payment thank you', 'payment - thank you', 'chase payment', 'amex payment', 'discover payment', 'capital one payment'];

  return hasKeyword(t, RETIREMENT_KEYWORDS);
}

  if (!t) return false;

  if (!t) return false;

  s = s.toLowerCase()
    .replace(/^(sq|tst|pos|pp|paypal|sp|ach|pmnt|dbt|crd|visa|mc)\s*[\*#:\-]\s*/i, '') // processor prefixes
    .replace(/\s*[\*#]\s*[a-z0-9]{3,}\b/gi, ' ')      // "UBER *TRIP", "SQ *COFFEE"
    .replace(/\b\d{4,}\b/g, ' ')                       // long transaction / store ids
    .replace(/\b(store|str|#)\s*\d+\b/gi, ' ')         // "STORE 1234"
    .replace(/\b[a-z]{2}\s+\d{5}(-\d{4})?\b/gi, ' ')   // trailing "GA 30303"
    .replace(/\b(purchase|payment|recurring|debit|card)\b/gi, ' ')
    .replace(/[^\w\s&'\-\.]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  for (const [re, name] of MERCHANT_ALIASES) if (re.test(s)) return name;
  if (!s) return 'Unknown';
  // Title-case what's left; keep short tokens like "BP" uppercase.
  return s.split(' ').slice(0, 4)
    .map(w => w.length <= 2 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

// ══════════════════════════════════════════════════════════════════════
// RECEIPT SCANNER (Priority 15) — real OCR via tesseract.js, loaded from a
// CDN on first use rather than bundled (this is a single static HTML file
// with no build step). The parsing below is plain regex/keyword heuristics
// over the raw OCR text — good enough for a typical printed receipt, never
// silently wrong: the user always reviews every pre-filled field before
// saving, exactly like every other Add Transaction flow in the app.
// ══════════════════════════════════════════════════════════════════════
let _tesseractLoadPromise = null;
function loadTesseract() {
  if (typeof window !== 'undefined' && window.Tesseract) return Promise.resolve(window.Tesseract);
  if (_tesseractLoadPromise) return _tesseractLoadPromise;
  _tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js';
    s.onload = () => window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Receipt scanner failed to load.'));
    s.onerror = () => reject(new Error("Couldn't load the receipt scanner — check your connection and try again."));
    document.head.appendChild(s);
  }).catch(err => { _tesseractLoadPromise = null; throw err; });   // let a retry try again
  return _tesseractLoadPromise;
}
// Downscaled JPEG data URL — receipts saved with a transaction (Bonus:
// "attach a receipt photo") go straight into localStorage as part of the
// transaction record, so a full-resolution phone photo (several MB) would
// blow the ~5-10MB origin quota after a handful of scans. Capped to a
// longest-side of 900px / JPEG q=0.6, which is still plenty legible for a
// receipt viewed later and typically lands well under 100KB.
function fileToReceiptDataURL(file, maxDim=900, quality=0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const c = canvas.getContext('2d');
      c.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

// $-amount tokens anywhere in the OCR text, e.g. "12.99" or "$1,204.50".
const RECEIPT_AMOUNT_RE = /\$?\s?(\d{1,3}(?:,\d{3})*\.\d{2}|\d+\.\d{2})/g;
function parseReceiptText(text) {
  const raw   = String(text || '');
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const grabAmount = line => {
    const matches = [...line.matchAll(RECEIPT_AMOUNT_RE)];
    if (!matches.length) return null;
    return parseFloat(matches[matches.length-1][1].replace(/,/g, ''));
  };
  // Merchant: the first line with real letters that isn't an obvious label.
  const merchant = lines.find(l => /[a-zA-Z]{3,}/.test(l) && !/^(receipt|invoice|order|thank you)/i.test(l)) || '';
  // Total: prefer a line literally saying "total" (but not "subtotal"),
  // otherwise fall back to the largest dollar amount on the receipt.
  let amount = null;
  const totalLine = lines.find(l => /\btotal\b/i.test(l) && !/subtotal/i.test(l));
  if (totalLine) amount = grabAmount(totalLine);
  if (amount == null) {
    const all = [...raw.matchAll(RECEIPT_AMOUNT_RE)].map(m => parseFloat(m[1].replace(/,/g,'')));
    if (all.length) amount = Math.max(...all);
  }
  // Tax
  let tax = null;
  const taxLine = lines.find(l => /\btax\b/i.test(l));
  if (taxLine) tax = grabAmount(taxLine);
  // Date — MM/DD/YYYY, MM-DD-YY, etc.
  let date = null;
  const dm = raw.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (dm) {
    let [, mm, dd, yy] = dm;
    if (yy.length === 2) yy = (+yy > 70 ? '19' : '20') + yy;
    const d = new Date(+yy, +mm-1, +dd);
    if (!isNaN(d.getTime())) date = ymd(d);
  }
  return { merchant: merchant.slice(0,60), amount, tax, date };
}
function suggestCategoryFromMerchant(merchant) {
  const name  = normalizeMerchantName(merchant);
  const brand = MERCHANT_BRANDS[name.toLowerCase()];
  if (brand) {
    if (brand.icon === 'coffee' || brand.icon === 'fork') return 'dining';
    if (brand.icon === 'cart')  return 'groceries';
    if (brand.icon === 'fuel')  return 'gas';
    if (brand.icon === 'plane') return 'travel';
  }
  const s = name.toLowerCase();
  if (/coffee|cafe|restaurant|grill|kitchen|pizza|taco|sushi|diner|bar\b|eat/.test(s)) return 'dining';
  if (/market|grocery|foods|mart|supermarket/.test(s)) return 'groceries';
  if (/gas|fuel|petrol/.test(s)) return 'gas';
  if (/airlines|hotel|air|flight|resort/.test(s)) return 'travel';
  return 'shopping';
}
function suggestPaymentMethodFromReceiptText(text) {
  const s = String(text || '').toLowerCase();
  if (/visa|mastercard|amex|american express|discover|credit/.test(s)) return 'Credit Card';
  if (/debit/.test(s)) return 'Debit Card';
  if (/\bcash\b/.test(s)) return 'Cash';
  return 'Debit Card';
}

// ── Selectors ─────────────────────────────────────────────────────────
// All of them take the transaction list explicitly and return fresh objects,
// so there is no hidden cache to go stale.
function getFilteredTransactions(transactions, filters) {
  const f = filters || {};
  const list = Array.isArray(transactions) ? transactions : [];
  const q = (f.search || '').trim().toLowerCase();
  // safeNum only accepts actual numbers (by design, elsewhere it's guarding
  // against NaN/undefined reaching the UI) — these two are the one spot that
  // needs a string→number parse first, since they come straight off inputs.
  const min = f.minAmount !== '' && f.minAmount != null ? safeNum(parseFloat(f.minAmount)) : null;
  const max = f.maxAmount !== '' && f.maxAmount != null ? safeNum(parseFloat(f.maxAmount)) : null;
  return list.filter((t, i) => {
    const k = txDateKey(t);
    if (!isValidDateKey(k)) return false;
    if (f.month && monthKeyOf(k) !== f.month) return false;
    if (f.from && k < f.from) return false;
    if (f.to   && k > f.to)   return false;
    if (f.category && f.category !== 'all' && categoryOf(t) !== f.category) return false;
    if (f.account  && f.account  !== 'all' && accountOf(t)  !== f.account)  return false;
    if (f.merchant && f.merchant !== 'all' && normalizeMerchantName(t.description) !== f.merchant) return false;
    if (f.status === 'pending'   && !t.pending) return false;
    if (f.status === 'completed' &&  t.pending) return false;
    // 'recurring' is a pseudo-type — matches how logRecurringTransaction tags
    // its own transactions (paymentMethod:'Recurring'), not t.type.
    if (f.type && f.type !== 'all') {
      if (f.type === 'recurring' ? t.paymentMethod !== 'Recurring' : t.type !== f.type) return false;
    }
    if (f.paymentMethod && f.paymentMethod !== 'all' && (t.paymentMethod||'') !== f.paymentMethod) return false;
    if (f.tag && f.tag !== 'all' && !(t.tags||[]).some(tg => tg.toLowerCase() === f.tag.toLowerCase())) return false;
    if (min != null && safeNum(t.amount) < min) return false;
    if (max != null && safeNum(t.amount) > max) return false;
    if (q) {
      const hay = [t.description, t.merchant, t.notes, catLabel(categoryOf(t)), accountOf(t), t.toAccount, ...(t.tags||[]).map(tg=>'#'+tg)]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (f.excludeDuplicates !== false && isDuplicateTransaction(t, list, list.indexOf(t))) return false;
    return true;
  });
}
// Spending rows only, with refunds retained so aggregators can net them out.
function spendingRows(transactions) {
  const all = Array.isArray(transactions) ? transactions : [];
  return all
    .map((t, i) => ({ t, delta: spendingDelta(t, all, all.indexOf(t)) }))
    .filter(r => r.delta !== 0);
}
function getTransactionsForDate(transactions, key) {
  return (transactions || []).filter(t => txDateKey(t) === key);
}
function getTransactionsForMonth(transactions, year, month) {
  const mk = `${year}-${String(month+1).padStart(2,'0')}`;
  return (transactions || []).filter(t => monthKeyOf(txDateKey(t)) === mk);
}
function getDailySpendingTotals(transactions) {
  const out = {};
  for (const { t, delta } of spendingRows(transactions)) {
    const k = txDateKey(t);
    if (!out[k]) out[k] = { total: 0, count: 0 };
    out[k].total += delta;
    if (delta > 0) out[k].count += 1;
  }
  for (const k of Object.keys(out)) out[k].total = round2(out[k].total);
  return out;
}
function getMonthlySpendingTotals(transactions) {
  const out = {};
  for (const { t, delta } of spendingRows(transactions)) {
    const mk = monthKeyOf(txDateKey(t));
    out[mk] = round2((out[mk] || 0) + delta);
  }
  return out;
}
function getCategorySpendingTotals(transactions) {
  const out = {};
  for (const { t, delta } of spendingRows(transactions)) {
    const c = categoryOf(t);
    if (!out[c]) out[c] = { total: 0, count: 0, largest: 0 };
    out[c].total += delta;
    if (delta > 0) { out[c].count += 1; out[c].largest = Math.max(out[c].largest, delta); }
  }
  for (const c of Object.keys(out)) {
    out[c].total = round2(out[c].total);
    out[c].avg   = out[c].count > 0 ? round2(out[c].total / out[c].count) : 0;
  }
  return out;
}
// HYSA / Roth IRA contributions can arrive two ways: money withheld straight
// out of a logged paycheck (kind:'paycheck', tracked per-key on
// t.allocations) or a transaction someone logged directly against that
// category (type:'expense', category:'hysa'/'rothIRA' — however its kind
// happens to be tagged). Every page reporting "how much went to HYSA/Roth
// this month" needs BOTH sources, or it silently misses the majority of
// real contributions — paychecks fund these lines automatically every
// payday, on top of anything manually logged.
function monthlyContributionAmount(monthTxAll, allocationKey, category) {
  let total = 0;
  for (const t of (monthTxAll || [])) {
    if (t.kind === 'paycheck' && t.allocations && t.allocations[allocationKey] != null) {
      total += safeNum(t.allocations[allocationKey]);
    } else if (t.type === 'expense' && t.category === category) {
      total += safeNum(t.amount);
    }
  }
  return round2(total);
}
// rankingMode: 'spend' | 'largest' | 'frequency'
function merchantStats(transactions) {
  const m = {};
  for (const { t, delta } of spendingRows(transactions)) {
    const name = normalizeMerchantName(t.description);
    if (!m[name]) m[name] = { name, total: 0, count: 0, largest: 0, categories: {} };
    m[name].total += delta;
    if (delta > 0) {
      m[name].count += 1;
      m[name].largest = Math.max(m[name].largest, delta);
      const c = categoryOf(t);
      m[name].categories[c] = round2((m[name].categories[c] || 0) + delta);
    }
  }
  return Object.values(m).map(x => {
    const topCat = Object.entries(x.categories).sort((a,b)=>b[1]-a[1])[0];
    return { ...x, total: round2(x.total), avg: x.count ? round2(x.total/x.count) : 0,
             topCategory: topCat ? topCat[0] : 'uncategorized' };
  });
}
const RANK_SORT = {
  spend:     (a,b) => b.total - a.total,
  largest:   (a,b) => b.largest - a.largest,
  frequency: (a,b) => b.count - a.count || b.total - a.total,
};
function getTopMerchants(transactions, rankingMode = 'spend', limit = 5) {
  return merchantStats(transactions)
    .filter(m => m.total > 0)
    .sort(RANK_SORT[rankingMode] || RANK_SORT.spend)
    .slice(0, limit);
}
function getTopMerchantByCategory(transactions, category, rankingMode = 'spend') {
  const rows = (transactions || []).filter(t => categoryOf(t) === category);
  return getTopMerchants(rows, rankingMode, 1)[0] || null;
}
function getLargestTransactionByCategory(transactions, category) {
  let best = null;
  for (const { t, delta } of spendingRows(transactions)) {
    if (categoryOf(t) !== category || delta <= 0) continue;
    if (!best || delta > best.amount) best = { amount: delta, description: t.description, date: txDateKey(t) };
  }
  return best;
}
function getMostFrequentMerchantByCategory(transactions, category) {
  const rows = (transactions || []).filter(t => categoryOf(t) === category);
  return getTopMerchants(rows, 'frequency', 1)[0] || null;
}
// Only categories that actually HAVE a budget appear here — a category without
// one is never rendered as "over budget".
function getBudgetVsActual(transactions, budgets) {
  const actuals = getCategorySpendingTotals(transactions);
  return Object.entries(budgets || {})
    .filter(([, limit]) => safeNum(limit) > 0)
    .map(([cat, limit]) => {
      const actual = safeNum((actuals[cat] || {}).total);
      const pctUsed = safePct(actual, limit);
      return {
        category: cat, budget: safeNum(limit), actual,
        remaining: round2(safeNum(limit) - actual), pctUsed,
        status: pctUsed > 100 ? 'over' : pctUsed >= 80 ? 'near' : 'under',
      };
    })
    .sort((a, b) => b.pctUsed - a.pctUsed);

// One composite 0-100 read of "how's this month going", combining the same
// numbers the rest of the app already tracks — budget adherence, savings
// rate, the worst credit utilization across any card, and overdue bills.
// Never a black box: healthReasons() below traces every point lost here to
// a specific, visible number elsewhere in the app.
//
// `dayProgress` (0-1, elapsed days / days in month) makes budget adherence
// PACE-aware rather than a flat end-of-month percentage — without it, a
// score computed on the 3rd of the month sees "12% of budget used" and
// reports a flawless 100 even if that 12% was blown through in the first
// 3 days (a pace that will land 10x over budget by month-end); it also
// meant a genuinely bad pace never dinged the score until the total
// crossed 90-100% absolute, by which point the month was already lost.
// Omitting dayProgress (or passing a full month) falls back to the
// original flat-percentage behavior.
function financialHealthScore({ budgetPctUsed, savingsRate, maxUtilization, overdueBillsCount, dayProgress }) {
  let score = 100;
  const dp = (typeof dayProgress === 'number' && dayProgress > 0) ? Math.min(dayProgress, 1) : 1;
  const expectedPct = dp * 100;
  const paceOver = budgetPctUsed - expectedPct;
  if (budgetPctUsed > 100) score -= Math.min((budgetPctUsed - 100) * 0.7, 35);
  else if (paceOver > 15) score -= Math.min((paceOver - 15) * 0.5, 20);
  else if (budgetPctUsed > 90) score -= 6;
  if (savingsRate < 10) score -= Math.min((10 - savingsRate) * 1.5, 20);
  else if (savingsRate >= 20) score += 5;
  if (maxUtilization > 30) score -= Math.min((maxUtilization - 30) * 0.4, 20);
  score -= Math.min((overdueBillsCount||0) * 8, 24);
  return Math.max(0, Math.min(100, Math.round(score)));
}
// Plain-language reasons behind financialHealthScore's number above — the
// same inputs, read back out as sentences, so the score is never a black
// box (PRD: "The score should explain why it changed").
function healthReasons({ budgetPctUsed, savingsRate, maxUtilization, overdueBillsCount, dayProgress }) {
  const reasons = [];
  const dp = (typeof dayProgress === 'number' && dayProgress > 0) ? Math.min(dayProgress, 1) : 1;
  const expectedPct = dp * 100;
  const paceOver = budgetPctUsed - expectedPct;
  if (budgetPctUsed > 100)
    reasons.push(`${(budgetPctUsed-100).toFixed(0)}% over your total budget this month.`);
  else if (paceOver > 15)
    reasons.push(`Spending is ahead of pace — ${budgetPctUsed.toFixed(0)}% of budget used with only ${expectedPct.toFixed(0)}% of the month gone.`);
  else if (budgetPctUsed > 90)
    reasons.push(`Budget is nearly used up (${budgetPctUsed.toFixed(0)}%).`);
  else if (dp < 1 && budgetPctUsed > 0)
    reasons.push(`Spending is on pace — ${budgetPctUsed.toFixed(0)}% of budget used, ${expectedPct.toFixed(0)}% of the month elapsed.`);
  if (savingsRate < 10) reasons.push(`Savings rate is low (${savingsRate.toFixed(0)}%).`);
  else if (savingsRate >= 20) reasons.push(`Savings rate is strong (${savingsRate.toFixed(0)}%).`);
  if (maxUtilization > 30) reasons.push(`A credit card is elevated at ${maxUtilization.toFixed(0)}% utilization.`);
  if (overdueBillsCount > 0) reasons.push(`${overdueBillsCount} bill${overdueBillsCount===1?'':'s'} overdue.`);
  else reasons.push('No bills are overdue.');
  return reasons.slice(0, 4);
}
function healthLabel(score) {
  if (score >= 90) return { label:'Excellent',       color:'#00C805' };
  if (score >= 80) return { label:'On Track',        color:'#00C805' };
  if (score >= 70) return { label:'Fair',             color:'#F5A623' };
  if (score >= 60) return { label:'Needs Attention',  color:'#f97316' };
  return                  { label:'At Risk',          color:'#FF5000' };
}

// ── Monthly Review (Priority 9) ─────────────────────────────────────────
// Letter grade off the same % of budget used every other budget view
// already computes — never a separate, competing definition of "on track".
function budgetGrade(pctUsed) {
  if (pctUsed <= 0)   return { grade:'—', color:'var(--t3)' };
  if (pctUsed <= 70)  return { grade:'A', color:'#00C805' };
  if (pctUsed <= 90)  return { grade:'B', color:'#00C805' };
  if (pctUsed <= 100) return { grade:'C', color:'#F5A623' };
  if (pctUsed <= 115) return { grade:'D', color:'#f97316' };
  return                     { grade:'F', color:'#FF5000' };
}
// Splits the month into 7-day chunks and finds the one with the best net
// cash flow (income minus real spending) — "Best Saving Week".
function bestSavingWeek(monthTx, year, month) {
  const daysIn = new Date(year, month+1, 0).getDate();
  const weeks = [];
  for (let start=1; start<=daysIn; start+=7) weeks.push({ start, end:Math.min(start+6,daysIn), net:0 });
  for (const { t, delta } of spendingRows(monthTx)) {
    const day = +txDateKey(t).slice(8,10);
    const w = weeks.find(w => day>=w.start && day<=w.end);
    if (w) w.net -= delta;
  }
  for (const t of monthTx) {
    if (!isIncomeTransaction(t)) continue;
    const day = +txDateKey(t).slice(8,10);
    const w = weeks.find(w => day>=w.start && day<=w.end);
    if (w) w.net += safeNum(t.amount);
  }
  return weeks.reduce((best,w) => (!best || w.net>best.net) ? w : best, null);
}
// Reads off the SAME saved snapshots the Net Worth page's own month-over-
// month delta uses — never a second, reconstructed estimate. Returns null
// (not a number) when no snapshot covers this month, rather than guessing.
function netWorthChangeForMonth(netWorth, monthKey) {
  const hist = (netWorth && netWorth.history) || [];
  const cur  = hist.find(h => h.month === monthKey);
  if (!cur) return null;
  const prev = [...hist].filter(h => h.month < monthKey).sort((a,b) => a.month.localeCompare(b.month)).slice(-1)[0];
  return prev ? { hasPrev:true, value: round2(cur.netWorth - prev.netWorth) } : { hasPrev:false, value:null };
}
// Year in Review (Bonus) — latest snapshot IN the year vs. the latest
// snapshot before it (year-end vs. prior year-end), same "read off saved
// snapshots, never reconstruct" rule as the monthly version above.
function netWorthChangeForYear(netWorth, year) {
  const hist = (netWorth && netWorth.history) || [];
  const inYear = [...hist].filter(h => h.month && h.month.startsWith(String(year))).sort((a,b)=>a.month.localeCompare(b.month));
  const cur = inYear[inYear.length-1];
  if (!cur) return null;
  const prev = [...hist].filter(h => h.month < `${year}-01`).sort((a,b)=>a.month.localeCompare(b.month)).slice(-1)[0];
  return prev ? { hasPrev:true, value: round2(cur.netWorth - prev.netWorth) } : { hasPrev:false, value:null };
}

// ── Achievements (Bonus) — every badge is DERIVED, never its own stored
// "unlocked" flag, so there's nothing to get out of sync: reopen the app a
// year later and the same badges recompute from the same underlying data.
const ACHIEVEMENT_DEFS = [
  { id:'nw1k',      label:'First $1,000',        icon:'trending',   group:'Net Worth', desc:'Reach $1,000 in net worth.' },
  { id:'nw10k',     label:'First $10,000',       icon:'trending',   group:'Net Worth', desc:'Reach $10,000 in net worth.' },
  { id:'nw100k',    label:'Six Figures',          icon:'trending',   group:'Net Worth', desc:'Reach $100,000 in net worth.' },
  { id:'debtfree',  label:'Debt-Free',            icon:'shield',     group:'Net Worth', desc:'Zero liabilities with a positive net worth.' },
  { id:'efund',     label:'Emergency Fund Funded',icon:'piggy',      group:'Savings',   desc:'Hit your HYSA goal.' },
  { id:'firstpay',  label:'First Paycheck',       icon:'dollar',     group:'Habits',    desc:'Log your first income transaction.' },
  { id:'tx100',     label:'100 Transactions',     icon:'receipt',    group:'Habits',    desc:'Log 100 transactions.' },
  { id:'streak6',   label:'6-Month Streak',       icon:'zap',        group:'Habits',    desc:'Log at least one transaction every month for 6 months straight.' },
  { id:'budget3',   label:'3 Months Under Budget',icon:'target',     group:'Budgeting', desc:'Stay at or under your total budget for 3 months in a row.' },
  { id:'goalDone',  label:'Goal Achieved',        icon:'check',      group:'Goals',     desc:'Fully fund a custom goal.' },
];
function computeAchievements({ transactions, netWorth, goals, settings, customGoals, accounts }) {
  const tx = transactions || [];
  const hist = (netWorth && netWorth.history) || [];
  const snap = getNetWorthSnapshot((netWorth||{}).accounts, goals, accounts, { settings, goals, netWorth });
  const bestNW = Math.max(snap.netWorth, ...hist.map(h=>safeNum(h.netWorth)), -Infinity);

  const hasIncome = tx.some(isIncomeTransaction);
  const txCount = tx.length;

  // Month-key helpers, reused by both streak checks below.
  const now = new Date();
  const monthKeyOffset = n => { const d = new Date(now.getFullYear(), now.getMonth()-n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
  const txMonths = new Set(tx.map(t => (t.date||'').slice(0,7)));
  const streak6 = Array.from({length:6}, (_,i)=>monthKeyOffset(i)).every(k => txMonths.has(k));

  const budget3 = Array.from({length:3}, (_,i)=>i).every(i => {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const phase = getPhaseInfo(settings.startDate, d);
    const isRentFree = phase.isEarly || phase.isPreEmployment;
    const bud = isRentFree ? settings.earlyBudget : settings.laterBudget;
    const total = Object.values(bud||{}).reduce((s,v)=>s+(safeNum(v)),0);
    const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const spent = tx.filter(t=>t.type==='expense' && (t.date||'').startsWith(ms)).reduce((s,t)=>s+safeNum(t.amount),0);
    return total > 0 && spent <= total;
  });

  const goalCtxForAch = { settings, goals, accounts, netWorth };
  const goalDone = (customGoals||[]).some(g => goalProgress(g, goalCtxForAch).complete);

  const checks = {
    nw1k: bestNW >= 1000, nw10k: bestNW >= 10000, nw100k: bestNW >= 100000,
    debtfree: snap.liabilities === 0 && snap.assets > 0,
    efund: (settings.hysaGoal||0) > 0 && (goals.hysaBalance||0) >= settings.hysaGoal,
    firstpay: hasIncome, tx100: txCount >= 100, streak6, budget3, goalDone,
  };
  return ACHIEVEMENT_DEFS.map(d => ({ ...d, achieved: !!checks[d.id] }));
}

// Net worth from STORED BALANCES only. Contribution history explains how a
// balance grew; adding it on top would double-count, so it is never summed
// here. `dynamicAccounts` (optional, the fd_accounts registry) folds in
// anything a user has created beyond the six original linked accounts —
// Cash, Brokerage, Crypto, a second credit card — so a custom account is
// never invisible to net worth. Accounts with a `linked` field are skipped
// here since they already flow through `accounts`/`goals` above; counting
// them again would double them.
function getNetWorthSnapshot(accounts, goals, dynamicAccounts, ctx) {
  const a = accounts || {}, g = goals || {};
  const cash       = safeNum(a.checking) + safeNum(g.hysaBalance);
  const k401       = safeNum(g.k401Employee) + safeNum(g.k401Employer) || safeNum(g.ira401kBalance);
  const retirement = safeNum(g.rothIRAOverride) + k401;
  let other        = safeNum(a.brokerage);
  let liabilities  = safeNum(a.creditCard) + safeNum(a.loans);
  if (dynamicAccounts && ctx) {
    for (const acct of dynamicAccounts.filter(x => !x.archived && !x.linked)) {
      const bal = accountBalance(acct, ctx);
      if (isLiabilityType(acct.type)) liabilities += bal; else other += bal;
    }
  }
  const assets     = cash + retirement + other;
  return {
    cash: round2(cash), retirement: round2(retirement), other: round2(other),
    k401Employee: round2(safeNum(g.k401Employee)), k401Employer: round2(safeNum(g.k401Employer)),
    assets: round2(assets), liabilities: round2(liabilities),
    netWorth: round2(assets - liabilities),
  };
}

// ACCOUNTS — dynamic, user-extensible account registry (fd_accounts).
// Nothing in this app is allowed to hardcode an institution, account name,
// or credit card — every screen renders off this list. The six starter
// rows below are seeded once, the first time the app runs with none saved;
// after that they are ordinary rows a user can rename, recolor, reorder,
// hide, archive, or delete exactly like an account created later.

const ACCOUNT_TYPES = [

const accountTypeInfo   = id => ACCOUNT_TYPES.find(t => t.id === id) || ACCOUNT_TYPES[ACCOUNT_TYPES.length-1];
const isLiabilityType   = id => !!accountTypeInfo(id).liability;
const ACCOUNT_COLORS    = ['#00C805','#3b82f6','#7B74FF','#F5A623','#06b6d4','#FF5000','#ec4899','#84cc16','#94a3b8','#f97316'];

const REWARD_BUCKETS = ['dining','groceries','entertainment','streaming','other'];
const zeroRewardBuckets = () => Object.fromEntries(REWARD_BUCKETS.map(k => [k,0]));

function defaultCardFields(overrides) {
  return {
    network:'Visa', creditLimit:0, apr:0,
    statementCloseDay:1, dueDay:20,
    minPaymentFlat:35, minPaymentPct:2,
    autopay:false, statementBalance:0,
    // 'cashback' | 'miles' | 'points' — the RATE math is identical (percent
    // of the purchase, earned in whatever unit this card pays out); only the
    // display unit and the estimated-dollar-value conversion change.
    rewardType: 'cashback', pointValueCents: 1,   // 1¢/point is a common miles/points estimate
    rewards:{ dining:0, groceries:0, entertainment:0, streaming:0, other:1 },  // % earn rate
    cashbackLifetime:0, cashbackMonth:0, cashbackMonthKey:'',
    // Same totals, broken out by category — powers the Rewards Dashboard.
    rewardsEarnedMonth: zeroRewardBuckets(), rewardsEarnedLifetime: zeroRewardBuckets(),
    // { 'YYYY-MM': amount } — powers Rewards by Month, both per-card and app-wide.
    rewardsByMonth: {},
    ...overrides,
  };
}
// Type-aware display for a raw reward-unit amount already stored on the card.
function formatRewardAmount(card, amount) {
  const n = safeNum(amount);
  if (!card || card.rewardType === 'cashback') return currency(n, 2);
  const rounded = Math.round(n);
  return `${rounded.toLocaleString()} ${card.rewardType === 'miles' ? 'mi' : 'pts'}`;
}
// Dollar-equivalent estimate for miles/points, using the card's own
// point-value assumption — cash back is already a dollar amount.
function estimatedRewardValue(card, amount) {
  if (!card || card.rewardType === 'cashback') return safeNum(amount);
  return round2(safeNum(amount) * (safeNum(card.pointValueCents) / 100));
}
// Last N months of a card's reward history, oldest first — powers both the
// per-card trend and the app-wide "Rewards by Month" rollup.
function rewardsMonthSeries(card, months=6) {
  const now = new Date();
  const keys = Array.from({length:months}, (_,i) => {
    const d = new Date(now.getFullYear(), now.getMonth()-(months-1-i), 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });
  const byMonth = (card && card.rewardsByMonth) || {};
  return {
    labels: keys.map(k => { const [y,m] = k.split('-'); return `${MONTH_NAMES[+m-1].slice(0,3)} '${y.slice(2)}`; }),
    points: keys.map(k => safeNum(byMonth[k])),
  };
}

// Seeded exactly once — reads fine even after a user edits/deletes/renames
// every field. `linked` ties an account to the pre-existing single source

function seedAccounts() {

      order:2, hidden:false, archived:false, notes:'', linked:'creditCard', manualBalance:0, createdAt:now,
      card: defaultCardFields({ network:'Mastercard', creditLimit:5000, apr:24.99, statementCloseDay:24, dueDay:18,
