// ── Commission ─────────────────────────────────────────────────────────
function Commission({ settings, commissions, setCommissions, setGoals }) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:new Date().toISOString().split('T')[0],amount:'',taxes:'',note:''});
  const hysaPct=settings.commissionHYSAPct/100;
  const personalPct=settings.commissionPersonalPct/100;
  // Estimated taxes are optional and withheld BEFORE the split — the HYSA/
  // Personal percentages apply to what's actually left to allocate, never
  // to the pre-tax gross (PRD §11: "Log gross commission, optionally log
  // estimated taxes, show net commission, show where each dollar is
  // allocated").
  const grossAmt = parseFloat(form.amount);
  const taxAmt   = form.taxes ? Math.max(parseFloat(form.taxes)||0, 0) : 0;
  const netAmt   = !isNaN(grossAmt) ? Math.max(round2(grossAmt - taxAmt), 0) : null;
  const preview  = netAmt!=null ? {hysa:netAmt*hysaPct, personal:netAmt*personalPct} : null;

  const handleAdd=e=>{
    e.preventDefault();const amt=parseFloat(form.amount);
    if(!amt||isNaN(amt))return;
    const tax = form.taxes ? Math.max(parseFloat(form.taxes)||0, 0) : 0;
    const net = Math.max(round2(amt-tax), 0);
    const hysaAdd=+(net*hysaPct).toFixed(2);
    setCommissions(prev=>[{id:String(Date.now()),date:form.date,amount:amt,estimatedTaxes:tax,netAmount:net,note:form.note.trim(),hysaPortion:hysaAdd,personalPortion:+(net*personalPct).toFixed(2)},...prev]);
    // 60% HYSA split flows into the Emergency Fund balance (syncs Goals + Net Worth)
    setGoals(g=>({...g,hysaBalance:+(((g.hysaBalance||0)+hysaAdd)).toFixed(2)}));
    setForm(f=>({...f,amount:'',taxes:'',note:''}));setShowForm(false);
  };
  const del=id=>{
    if(!window.confirm('Delete this commission?'))return;
    const c=commissions.find(x=>x.id===id);
    setCommissions(p=>p.filter(t=>t.id!==id));
    if(c) setGoals(g=>({...g,hysaBalance:+(Math.max((g.hysaBalance||0)-(c.hysaPortion||0),0)).toFixed(2)}));
  };
  const sorted=[...commissions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=commissions.reduce((s,c)=>s+c.amount,0);
  const totHYSA=commissions.reduce((s,c)=>s+c.hysaPortion,0);
  const totPers=commissions.reduce((s,c)=>s+c.personalPortion,0);

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Commission</h2>
          <div className="page-sub">Log and split your commissions</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'Cancel':'+ Log'}</button>
      </div>

      <div className="split-banner">
        <div className="split-pill split-hysa">{settings.commissionHYSAPct}% HYSA</div>
        <div className="split-div">+</div>
        <div className="split-pill split-personal">{settings.commissionPersonalPct}% Personal</div>
        <div style={{marginLeft:'auto',fontSize:'.68rem',color:'var(--t3)'}}>Auto-split on every payment</div>
      </div>

      <div className="g3">
        <div className="stat">
          <div className="stat-label">Total Earned</div>
          <div className="stat-val">{currency(total)}</div>
          <div className="stat-sub">{commissions.length} payments</div>
        </div>
        <div className="stat stat-green">
          <div className="stat-label">To HYSA</div>
          <div className="stat-val">{currency(totHYSA)}</div>
          <div className="stat-sub">{settings.commissionHYSAPct}%</div>
        </div>
        <div className="stat stat-blue">
          <div className="stat-label">Personal</div>
          <div className="stat-val">{currency(totPers)}</div>
          <div className="stat-sub">{settings.commissionPersonalPct}%</div>
        </div>
      </div>

      {showForm&&(
        <div className="card form-card">
          <div className="card-label">New Payment</div>
          <form onSubmit={handleAdd}>
            <div className="fgrid">
              <div className="fg"><label>Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} required /></div>
              <div className="fg"><label>Gross Amount</label><input type="number" step="0.01" min="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} required /></div>
              <div className="fg"><label>Estimated Taxes (optional)</label><input type="number" step="0.01" min="0" placeholder="0.00" value={form.taxes} onChange={e=>setForm(f=>({...f,taxes:e.target.value}))} /></div>
              <div className="fg"><label>Net Commission</label>
                <div style={{padding:'8px 12px',border:'1px solid var(--border2)',borderRadius:'var(--r-s)',background:'var(--s2)',color:'var(--t1)',fontSize:'.84rem',fontVariantNumeric:'tabular-nums'}}>
                  {netAmt!=null ? currency(netAmt,2) : '—'}
                </div>
              </div>
              <div className="fg fspan"><label>Note</label><input type="text" placeholder="Deal name, pay period…" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} /></div>
              {preview&&(
                <div className="fspan" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  <span className="badge badge-green">HYSA +{currency(preview.hysa,2)}</span>
                  <span className="badge badge-blue">Personal +{currency(preview.personal,2)}</span>
                  {taxAmt>0 && <span className="badge badge-yellow">Taxes −{currency(taxAmt,2)}</span>}
                </div>
              )}
              <div className="factions">
                <button type="button" className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      )}

      <div>
        <div className="slabel">History ({commissions.length})</div>
        <div className="card" style={{padding:'4px 24px 8px'}}>
          {sorted.length===0?<p className="empty">No commissions logged yet.</p>:sorted.map(c=>(
            <div key={c.id} className="comm-row">
              <div style={{flex:1}}>
                <div className="comm-amt">{currency(c.amount,2)}</div>
                {c.estimatedTaxes>0 && (
                  <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:1}}>
                    −{currency(c.estimatedTaxes,2)} est. taxes · {currency(c.netAmount ?? c.amount,2)} net
                  </div>
                )}
                {c.note?<div className="comm-note">{c.note}</div>:<div className="comm-note" style={{color:'var(--t4)'}}>No note</div>}
                <div className="comm-date">{new Date(c.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
              </div>
              <div className="comm-splits">
                <span className="comm-s comm-s-green">+{currency(c.hysaPortion,2)} HYSA</span>
                <span className="comm-s comm-s-blue">+{currency(c.personalPortion,2)} Personal</span>
              </div>
              <button className="btn-icon btn-icon-del" onClick={()=>del(c.id)} aria-label={`Delete ${currency(c.amount,2)} commission from ${c.date}`}>×</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Settings ───────────────────────────────────────────────────────────

// Isolated input: holds its own string state so typing never re-renders
// the parent Settings component (stops mobile keyboard from dismissing).
function SettingsInput({ value, onCommit, type='number', prefix, extraStyle, id, name }) {
  const [str, setStr] = useState(String(value ?? ''));
  // Sync if the committed value changes underneath us (e.g. Reset button)
  useEffect(() => { setStr(String(value ?? '')); }, [value]);
  // Commit the input's OWN value, not `str`. setStr from onChange is async, so
  // if a keystroke and the blur land in the same tick (paste, or tapping Save
  // right after typing) `str` is still the previous value and the edit is lost.
  const commit = e => onCommit(e && e.target ? e.target.value : str);
  return (
    <div style={{position:'relative'}}>
      {prefix && (
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
          color:'var(--t3)',fontSize:'.78rem',pointerEvents:'none'}}>{prefix}</span>
      )}
      <input
        id={id}
        name={name}
        type={type==='number' ? 'text' : type}
        inputMode={type==='number' ? 'decimal' : undefined}
        value={str}
        style={{...(prefix ? {paddingLeft:22} : {}), ...extraStyle}}
        onChange={e => setStr(e.target.value)}
        onBlur={commit}
        onKeyDown={e => e.key==='Enter' && e.target.blur()}
      />
    </div>
  );
}

// Declared at module scope ON PURPOSE. When this lived inside Settings() it was
// a brand-new component type on every render, so React unmounted and remounted
// every input after each commit — which dropped the edit you were part-way
// through and bounced focus. Keeping the type stable keeps each field's state
// (and the caret) intact. `name` is unique per scenario+key, so the two
// scenarios' Roth/HYSA inputs are distinct controls.
function SettingField({ label, name, val, type='number', prefix='$', onCommit, hint }) {
  return (
    <div className="settings-group">
      <label htmlFor={name}>{label}</label>
      <SettingsInput
        id={name} name={name} value={val} type={type} prefix={prefix} onCommit={onCommit}
      />
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

// Read-only derived figure — shown so the schedule math is visible but not
// editable (it is computed from the per-paycheck amount).
function SettingDerived({ label, value, hint }) {
  return (
    <div className="settings-group">
      <label>{label}</label>
      <div style={{padding:'9px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-s)',
        background:'var(--wash-1)',color:'var(--t2)',fontSize:'.82rem',
        fontVariantNumeric:'tabular-nums'}}>{value}</div>
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

function Settings({ settings, setSettings, accounts, setAccounts, goals, setGoals, netWorth, setNetWorth, transactions, setTransactions, recurring, setRecurring, customCategories, setCustomCategories, goTo }) {
  const [local,setLocal]=useState(settings);
  const [saved,setSaved]=useState(false);
  const [importMsg,setImportMsg]=useState(null);   // {type:'error'|'ok', text}
  const fileInputRef=useRef(null);
  const csvInputRef=useRef(null);
  const [csvMsg,setCsvMsg]=useState(null);
  const [newCatLabel,setNewCatLabel]=useState('');
  const [newCatColor,setNewCatColor]=useState(CUSTOM_CATEGORY_COLORS[0]);
  const handleImportFile=e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value='';   // reset so picking the same file again still fires onChange
    if(!file) return;
    readBackupFile(file, res=>{
      if(!res.ok){ setImportMsg({type:'error',text:res.error}); return; }
      if(!window.confirm('Import this backup? It will replace all data on THIS device — settings, transactions, goals, net worth, and commissions. This cannot be undone.')) return;
      applyBackup(res.data);
      location.reload();
    });
  };
  const handleImportCSV=e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const { rows, errors } = parseTransactionsCSV(String(reader.result), accounts);
      if (!rows.length) { setCsvMsg({type:'error',text:errors[0]||'No valid rows found in that file.'}); return; }
      const proceed = window.confirm(
        `Import ${rows.length} transaction${rows.length===1?'':'s'} from this CSV`
        + (errors.length ? ` (${errors.length} row${errors.length===1?'':'s'} skipped)` : '')
        + '?\n\nThese are added as transaction records for spending history & reports — they do NOT change any account balance. Update balances in Net Worth / Accounts separately if this CSV reflects new money.'
      );
      if (!proceed) return;
      setTransactions(prev => [...rows, ...prev]);
      setCsvMsg({type:'ok', text:`Imported ${rows.length} transaction${rows.length===1?'':'s'}.`+(errors.length?` ${errors.length} row${errors.length===1?'':'s'} skipped — ${errors.slice(0,3).join(' ')}`:'')});
    };
    reader.onerror=()=>setCsvMsg({type:'error',text:'Could not read that file.'});
    reader.readAsText(file);
  };
  const addCustomCategory=()=>{
    const label=newCatLabel.trim();
    if(!label) return;
    const id='custom_'+label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')+'_'+Date.now().toString(36).slice(-4);
    const abbr=label.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'CAT';
    setCustomCategories(list=>[...(list||[]), { id, label, abbr, color:newCatColor }]);
    setNewCatLabel('');
  };
  const removeCustomCategory=id=>{
    if(!window.confirm('Remove this category? Past transactions keep it, but it will no longer show up when adding new ones.')) return;
    setCustomCategories(list=>(list||[]).filter(c=>c.id!==id));
  };
  // Mirrors `local` SYNCHRONOUSLY. Tapping Save blurs the field you were in, so
  // its commit and the click land in the same tick — reading `local` there would
  // save the value from the previous render and silently drop that last edit.
  const localRef=useRef(settings);
  useEffect(()=>{setLocal(settings);localRef.current=settings;},[settings]);

  const commitLocal=next=>{localRef.current=next;setLocal(next);};
  // Immutable updates off the ref, so consecutive edits compose instead of
  // clobbering each other. Writing one scenario always preserves the other.
  const set   =(k,v)=>commitLocal({...localRef.current,[k]:typeof v==='string'?parseFloat(v)||0:v});
  const setStr=(k,v)=>commitLocal({...localRef.current,[k]:v});
  const setBud=(p,k,v)=>commitLocal({
    ...localRef.current,
    [p]:{...localRef.current[p],[k]:parseFloat(v)||0},
  });
  const setNotif=(k,v)=>commitLocal({
    ...localRef.current,
    notifPrefs:{...(localRef.current.notifPrefs||{}),[k]:v},
  });

  const handleSave=e=>{e.preventDefault();setSettings(localRef.current);setSaved(true);setTimeout(()=>setSaved(false),2500);};
  // Clone — handing out DEFAULT_SETTINGS itself would let later edits mutate
  // the module-level defaults that every scenario is seeded from.
  const handleReset=()=>{if(window.confirm('Reset all settings to defaults?'))commitLocal(cloneDeep(DEFAULT_SETTINGS));};

  const eb=local.earlyBudget||{};
  const lb=local.laterBudget||{};

  // Props builders. These return plain props for the stable <SettingField>;
  // they must NOT define a component (see the note on SettingField).
  const fld    = (sk,label,extra={}) => ({ label, name:sk, val:local[sk], onCommit:v=>(extra.type==='date'?setStr(sk,v):set(sk,v)), ...extra });
  // Scenario field — `name` is namespaced so "earlyBudget.rothIRA" and
  // "laterBudget.rothIRA" are separate controls writing separate state.
  const budFld = (phase,sk,label,extra={}) => ({
    label, name:`${phase}.${sk}`,
    val:(phase==='earlyBudget'?eb:lb)[sk],
    onCommit:v=>setBud(phase,sk,v), ...extra,
  });
  const earlyTotal=(eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0);
  const laterTotal=(lb.rentAndFee||0)+(lb.utilities||0)+(lb.rentersInsurance||0)+(lb.rothIRA||0)+(lb.hysa||0)+(lb.groceries||0)+(lb.gas||0)+(lb.funTravel||0)+(lb.outToEat||0)+(lb.shopping||0);
  const localNet=monthlyNetIncome(local);
  const earlyRem=localNet-earlyTotal;
  const laterRem=localNet-laterTotal;

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Settings</h2>
          <div className="page-sub">Income, budgets, and limits</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {saved&&<span className="badge badge-green">Saved</span>}
          <button type="button" className="btn btn-ghost" onClick={handleReset}>Reset</button>
        </div>
      </div>

      {/* Quick links — Accounts/Bills/Goals already have their own full
          pages (and their own tabs), so this is discoverability, not a
          second copy of that UI. */}
      <div className="card" style={{padding:'10px 14px'}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[
            ['accounts',  'wallet',  'Accounts & Cards'],
            ['bills',     'receipt', 'Recurring Bills'],
            ['goals',     'target',  'Goals'],
          ].map(([id,icon,label]) => (
            <button key={id} type="button" className="btn btn-ghost btn-sm" onClick={()=>goTo&&goTo(id)}>
              <Icon name={icon} size={13}/>{label} →
            </button>
          ))}
        </div>
      </div>

      <RecurringSection recurring={recurring} setRecurring={setRecurring} accounts={accounts}
        ctxBase={{ settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions }}/>

      {/* ── Personalization (Priority 18) ── accent color + light/dark theme,
          applied via CSS custom properties on <html> once Saved below. */}
      <div className="card">
        <div className="card-label">Personalization</div>
        <div className="settings-group" style={{marginBottom:14}}>
          <label>Accent Color</label>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:6}}>
            {['#00C805','#3987e5','#7B74FF','#F5A623','#FF5000','#06b6d4','#d95181','#e66767'].map(c => (
              <button key={c} type="button" aria-label={c}
                onClick={()=>setStr('accentColor',c)}
                style={{
                  width:30,height:30,borderRadius:'50%',background:c,cursor:'pointer',
                  border:(local.accentColor||'#00C805').toLowerCase()===c.toLowerCase() ? '2px solid var(--t1)' : '2px solid transparent',
                  boxShadow:(local.accentColor||'#00C805').toLowerCase()===c.toLowerCase() ? '0 0 0 2px var(--bg)' : 'none',
                }}/>
            ))}
          </div>
        </div>
        <div className="settings-group">
          <label>Appearance</label>
          <div className="seg" role="group" aria-label="Appearance" style={{marginTop:6,width:'fit-content'}}>
            <button type="button" className={local.theme!=='light'?'on':''} onClick={()=>setStr('theme','dark')}>Dark</button>
            <button type="button" className={local.theme==='light'?'on':''} onClick={()=>setStr('theme','light')}>Light</button>
          </div>
        </div>
      </div>

      {/* ── Categories (Priority 18) ── built-ins are fixed (budget scenario
          fields and the AI coach are wired to their ids by name); custom
          categories are additive and show up everywhere CATEGORIES does —
          Add Transaction, Budget, Spending, Insights. */}
      <div className="card">
        <div className="card-label">Categories</div>
        <div style={{fontSize:'.66rem',color:'var(--t4)',marginBottom:8}}>
          Check "Tax" for any category you write off — Year in Review totals it up for filing.
        </div>
        <div className="card-flush" style={{marginBottom:16}}>
          {[...BUILTIN_CATEGORIES.filter(c=>c.id!=='hysa'&&c.id!=='rothIRA'&&c.id!=='other'), ...(customCategories||[])].map(c => {
            const isTax = (local.taxDeductibleCategories||[]).includes(c.id);
            const isCustom = (customCategories||[]).some(x=>x.id===c.id);
            return (
              <div key={c.id} className="v-row">
                <div className="v-row-left">
                  <div className="v-row-icon" style={{background:c.color+'22'}}>
                    <span style={{width:9,height:9,borderRadius:'50%',background:c.color,display:'block'}}/>
                  </div>
                  <div className="v-row-name">{c.label}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:12}}>

                    <input type="checkbox" checked={isTax} onChange={e=>{
                      const on = e.target.checked;
                      commitLocal({ ...localRef.current, taxDeductibleCategories:
                        on ? [...(localRef.current.taxDeductibleCategories||[]), c.id]
                           : (localRef.current.taxDeductibleCategories||[]).filter(id=>id!==c.id) });
                    }}/>

                  {isCustom && (
                    <button type="button" className="btn-icon" aria-label={`Remove ${c.label}`} onClick={()=>removeCustomCategory(c.id)}>

              </div>
            );
          })}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <input type="text" placeholder="New category name" value={newCatLabel}
            onChange={e=>setNewCatLabel(e.target.value)}
            onKeyDown={e=>e.key==='Enter' && addCustomCategory()}

          <div style={{display:'flex',gap:5}}>
            {CUSTOM_CATEGORY_COLORS.slice(0,6).map(c => (
              <button key={c} type="button" aria-label={c} onClick={()=>setNewCatColor(c)}
                style={{width:22,height:22,borderRadius:'50%',background:c,
                  border:newCatColor===c?'2px solid var(--t1)':'2px solid transparent'}}/>
            ))}
          </div>
          <button type="button" className="btn btn-primary btn-sm" disabled={!newCatLabel.trim()} onClick={addCustomCategory}>Add</button>

      </div>

      {/* ── Notifications (Priority 18) ── toggles what already computes
          elsewhere (the per-card Notifications feed on Account Detail, the
          Dashboard's due-soon reminders); it doesn't invent new alert types
          since this is a PWA with no push-notification backend. */}
      <div className="card">
        <div className="card-label">Notifications</div>
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          {[
            ['creditCardAlerts', 'Credit card alerts', 'Statement closing, payment due, utilization on each card'],
            ['billReminders',    'Bill reminders',      'Due-soon cards on Dashboard and Bills'],
            ['budgetAlerts',     'Budget alerts',        'Over-budget callouts on Spending and Dashboard'],

              <div>
                <div className="toggle-row-lbl">{label}</div>
                <div className="toggle-row-sub">{sub}</div>
              </div>
              <input type="checkbox" className="switch" checked={(local.notifPrefs||{})[k]!==false}
                onChange={e=>setNotif(k, e.target.checked)}/>

          ))}
        </div>
      </div>

      {/* This app has no account or server — each device holds a fully
          separate copy of everything. Export/import is the manual bridge:
          download one file here, then import that exact file on another
          device to copy this data over. */}
      <div className="card">
        <div className="card-label">Backup &amp; Transfer</div>
        <p style={{fontSize:'.72rem',color:'var(--t3)',margin:'0 0 12px',lineHeight:1.5}}>
          This app has no cloud sync — your phone and laptop each keep a separate copy.
          Export a backup here, then import that same file on the other device to copy
          your data over. Exports whatever is currently saved, so hit Save below first
          if you have unsaved edits.
        </p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <button type="button" className="btn btn-primary" onClick={exportBackup}>Export Backup</button>
          <button type="button" className="btn btn-ghost" onClick={()=>fileInputRef.current&&fileInputRef.current.click()}>Import Backup</button>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={handleImportFile} />
        </div>
        {importMsg && (
          <div style={{marginTop:10,fontSize:'.72rem',color:importMsg.type==='error'?'var(--red)':'var(--accent)'}}>
            {importMsg.text}
          </div>
        )}
        <div style={{height:1,background:'var(--border)',margin:'14px 0'}}/>
        <p style={{fontSize:'.72rem',color:'var(--t3)',margin:'0 0 12px',lineHeight:1.5}}>
          Or work with just the transaction ledger as a spreadsheet — CSV export for
          Excel/Sheets, or CSV import to bring in a bank's transaction history.
          Importing adds transaction records only; it never changes an account balance.
        </p>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <button type="button" className="btn btn-primary" onClick={()=>exportTransactionsCSV(transactions)}>Export CSV</button>
          <button type="button" className="btn btn-ghost" onClick={()=>csvInputRef.current&&csvInputRef.current.click()}>Import CSV</button>
          <input ref={csvInputRef} type="file" accept="text/csv,.csv" style={{display:'none'}} onChange={handleImportCSV} />
        </div>
        {csvMsg && (
          <div style={{marginTop:10,fontSize:'.72rem',color:csvMsg.type==='error'?'var(--red)':'var(--accent)'}}>
            {csvMsg.text}
          </div>
        )}
      </div>

      <form onSubmit={handleSave} style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="card">
          <div className="card-label">Income &amp; Paycheck Schedule</div>
          <div className="settings-grid">
            <SettingField {...fld('netPerPaycheck','Net per Paycheck')}
              hint="Take-home, already net of the 401(k) deduction" />
            <SettingField {...fld('paychecksPerMonth','Paychecks / Month')} prefix="" />
            <SettingField {...fld('paychecksPerYear','Paychecks / Year')} prefix="" />
            <SettingDerived label="Monthly Take-Home"
              value={currency(monthlyNetIncome(local),2)}
              hint={`${checksPerMonth(local)} × ${currency(netPerCheck(local),2)} · 1st & 3rd Thursday`} />
            <SettingDerived label="Annual Take-Home"
              value={currency(annualNetIncome(local),2)}
              hint={`${checksPerYear(local)} paychecks / year`} />
            <SettingField {...fld('grossBase','Base Monthly (gross)')} />
            <SettingField {...fld('grossOTE','OTE Monthly (gross)')} />
            <SettingField {...fld('federalTax','Tax + FICA / mo')} />
            <SettingField {...fld('startDate','Start Date',{type:'date',prefix:''})} />
          </div>
        </div>

        <div className="card">
          <div className="card-label">401(k)</div>
          <div className="settings-grid">
            <SettingField {...fld('employee401kPerPaycheck','Employee / Paycheck')}
              hint="Withheld before your net paycheck — not deducted again" />
            <SettingDerived label="Employee / Month"
              value={currency(round2(employee401kPerCheck(local)*checksPerMonth(local)),2)} />
            <SettingDerived label="Employee / Year"
              value={currency(round2(employee401kPerCheck(local)*checksPerYear(local)),2)} />
            <SettingField {...fld('employerMatchRate','Employer Match Rate')} prefix="×"
              hint="0.5 = employer matches 50% of your contribution" />
            <SettingField {...fld('employerMatchPct','Match Applies To First')} prefix="%" />
            <SettingField {...fld('employerMatchAnnualCap','Employer Annual Cap')}
              hint="Hard ceiling per calendar year; resets Jan 1" />
            <SettingDerived label="Employer / Paycheck"
              value={currency(employerMatchForPaycheck(local, employee401kPerCheck(local), 0),2)} />
            <SettingDerived label="Projected Match / Year"
              value={currency(Math.min(
                round2(employerMatchForPaycheck(local, employee401kPerCheck(local), 0)*checksPerYear(local)),
                local.employerMatchAnnualCap || Infinity),2)}
              hint={`Capped at ${currency(local.employerMatchAnnualCap||0)}`} />
            <SettingField {...fld('contribution401kStart','Contributions Start',{type:'date',prefix:''})} />
          </div>
        </div>

        <div className="card">
          <div className="card-label">Commission Split</div>
          <div className="settings-grid">
            <SettingField {...fld('commissionHYSAPct','HYSA %')} prefix="%" />
            <SettingField {...fld('commissionPersonalPct','Personal %')} prefix="%" />
          </div>
          {/* PRD §16: allocation percentages must total 100% — the two
              fields above are independent inputs, so nothing else stops
              them from summing to something else and silently losing (or
              double-counting) part of every future commission payment. */}
          {round2(safeNum(local.commissionHYSAPct)+safeNum(local.commissionPersonalPct)) !== 100 && (
            <div style={{fontSize:'.72rem',color:'var(--red)',marginTop:10}}>
              HYSA % + Personal % = {round2(safeNum(local.commissionHYSAPct)+safeNum(local.commissionPersonalPct))}% — should total 100% so every commission dollar is accounted for.
            </div>
          )}
        </div>

        <div className="card">
          <label className="toggle-row" style={{padding:0,border:0}}>
            <div>
              <div className="toggle-row-lbl">Budget Rollover</div>
              <div className="toggle-row-sub">Unspent budget in a category carries into next month; overspending borrows from it</div>
            </div>
            <input type="checkbox" className="switch" checked={!!local.budgetRollover}
              onChange={e=>setStr('budgetRollover', e.target.checked)}/>
          </label>
        </div>

        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div className="card-label" style={{margin:0}}>Without Rent</div>
            <span className={'settings-remaining '+(earlyRem>=0?'rem-ok':'rem-over')}>{currency(earlyRem)} {earlyRem>=0?'remaining':'over'}</span>
          </div>
          <div style={{fontSize:'.66rem',color:'var(--t4)',marginTop:-8,marginBottom:12}}>
            Independent of the With Rent scenario — editing these never changes those.
          </div>
          <div className="settings-grid">
            <SettingField {...budFld('earlyBudget','utilitiesAndFee','Utilities & Fee')} />
            <SettingField {...budFld('earlyBudget','rentersInsurance','Renters Insurance')} />
            <SettingField {...budFld('earlyBudget','rothIRA','Roth IRA')} hint="Retirement investments" />
            <SettingField {...budFld('earlyBudget','hysa','HYSA')} hint="Cash savings" />
            <SettingField {...budFld('earlyBudget','groceries','Groceries')} />
            <SettingField {...budFld('earlyBudget','gas','Gas')} />
            <SettingField {...budFld('earlyBudget','funTravel','Travel')} />
            <SettingField {...budFld('earlyBudget','outToEat','Dining')} />
            <SettingField {...budFld('earlyBudget','shopping','Shopping')} />
          </div>
        </div>

        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div className="card-label" style={{margin:0}}>With Rent</div>
            <span className={'settings-remaining '+(laterRem>=0?'rem-ok':'rem-over')}>{currency(laterRem)} {laterRem>=0?'remaining':'over'}</span>
          </div>
          <div style={{fontSize:'.66rem',color:'var(--t4)',marginTop:-8,marginBottom:12}}>
            Independent of the Without Rent scenario — editing these never changes those.
          </div>
          <div className="settings-grid">
            <SettingField {...budFld('laterBudget','rentAndFee','Rent & Fee')} />
            <SettingField {...budFld('laterBudget','utilities','Utilities')} />
            <SettingField {...budFld('laterBudget','rentersInsurance','Renters Insurance')} />
            <SettingField {...budFld('laterBudget','rothIRA','Roth IRA')} hint="Retirement investments" />
            <SettingField {...budFld('laterBudget','hysa','HYSA')} hint="Cash savings" />
            <SettingField {...budFld('laterBudget','groceries','Groceries')} />
            <SettingField {...budFld('laterBudget','gas','Gas')} />
            <SettingField {...budFld('laterBudget','funTravel','Travel')} />
            <SettingField {...budFld('laterBudget','outToEat','Dining')} />
            <SettingField {...budFld('laterBudget','shopping','Shopping')} />
          </div>
        </div>

        <div className="card">
          <div className="card-label">Goals &amp; IRS Limits</div>
          <div className="settings-grid">
            <SettingField {...fld('hysaGoal','HYSA Goal')} />
            <SettingField {...fld('rothIRAYearlyLimit','Roth IRA Yearly Limit')} />
            <SettingField {...fld('ira401kYearlyMax','401(k) IRS Yearly Max')} />
          </div>
        </div>

        <button type="submit" className="btn btn-primary btn-full">Save Settings</button>
      </form>
    </div>
  );
}
