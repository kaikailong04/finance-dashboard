function BillsPage({ bills, setBills, accounts, transactions, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions, openAddTx, goToAccount }) {
  const ctx = { accounts, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions, transactions, bills, setBills };
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [showRecurring, setShowRecurring] = useState(false);
  const today = new Date();

  const userRows = (bills||[]).map(b => ({
    key:b.id, name:b.name, icon:billCategoryInfo(b.category).icon, color:'var(--t2)',
    sub: b.recurring ? `${billCategoryInfo(b.category).label} · due day ${b.dueDay}` : `${billCategoryInfo(b.category).label} · due ${b.dueDate}`,
    amount:b.amount, status:billStatus(b, today), recurring:b.recurring, raw:b,
  }));
  const ccRows = creditCardBills(accounts, ctx).map(cc => ({
    key:cc.id, name:cc.name, icon:cc.icon, color:cc.color,
    sub:`Credit Card · min payment · due day ${cc.dueDay}`,
    amount:cc.amount, status: cc.paid ? 'paid' : billStatus({recurring:true,dueDay:cc.dueDay}, today),
    recurring:true, raw:cc, isCreditCardBill:true,
  }));
  const allRows = [...userRows, ...ccRows];

  const overdue  = allRows.filter(r=>r.status==='overdue').sort((a,b)=>a.raw.dueDay-b.raw.dueDay || a.name.localeCompare(b.name));
  const upcoming = allRows.filter(r=>r.status==='upcoming').sort((a,b)=>(a.raw.dueDay||0)-(b.raw.dueDay||0));
  const paid     = allRows.filter(r=>r.status==='paid');
  const recurringRows = allRows.filter(r=>r.recurring);

  const totalDue = [...overdue, ...upcoming].reduce((s,r)=>s+safeNum(r.amount),0);

  // Subscription reminders (Bonus) — no cancellation workflow is possible
  // without a real merchant/billing integration, but "here's everything
  // renewing and what it costs you" is the useful, honest version of this:
  // an audit, not an auto-cancel button.
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const subscriptions = (bills||[]).filter(b => b.category === 'subscription' && b.recurring);
  const subsMonthlyTotal = subscriptions.reduce((s,b)=>s+safeNum(b.amount),0);
  const renewingSoon = subscriptions
    .map(b => ({ b, days: Math.round((billDueDateThisPeriod(b, today) - todayMidnight) / 86400000) }))
    .filter(({ b, days }) => days >= 0 && days <= 7 && billStatus(b, today) !== 'paid')
    .sort((a,b) => a.days - b.days);

  const handlePay = row => {
    if (row.isCreditCardBill) {
      // A card payment is a transfer, not a plain expense — hand off to the
      // same Payment Center flow the Credit Card Dashboard uses.
      const source = defaultPaymentSourceAccount(accounts, row.raw.accountRef);
      if (source) openAddTx(source.id, { type:'transfer', amount: row.amount, toAccountId: row.raw.accountRef.id });
      else goToAccount && goToAccount(row.raw.accountRef.id);
      return;
    }
    markBillPaid(row.raw, ctx);
  };

  const Section = ({ title, rows, emptyMsg }) => (
    <div>
      <div className="eyebrow" style={{marginBottom:12}}>{title}{rows.length>0 && <span style={{color:'var(--t4)',marginLeft:6}}>({rows.length})</span>}</div>
      <div className="card-flush">
        {rows.length===0 ? <p className="empty">{emptyMsg}</p> : rows.map(r => (
          <BillRow key={r.key} icon={r.icon} color={r.color} name={r.name} sub={r.sub} amount={r.amount}
            status={r.status} recurring={r.recurring}
            payLabel={r.isCreditCardBill ? 'Pay' : 'Mark Paid'}
            onPay={()=>handlePay(r)}
            onEdit={r.isCreditCardBill ? (goToAccount ? ()=>goToAccount(r.raw.accountRef.id) : null) : ()=>setEditing(r.raw)}/>
        ))}
      </div>
    </div>
  );

  return (
    <div className="page">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>Due This Period</div>
          <div className="mega" style={{color:overdue.length>0?'var(--red)':'var(--t1)'}}>{currency(totalDue)}</div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8}}>
            {overdue.length>0 ? `${overdue.length} overdue` : 'nothing overdue'} · {upcoming.length} upcoming
          </div>
        </div>
        <button className="add-btn" onClick={()=>setShowAdd(true)}><Icon name="plus" size={14} color="#000" strokeWidth={2.5}/>Add Bill</button>
      </div>

      {subscriptions.length > 0 && (
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:renewingSoon.length?12:0}}>
            <div className="card-label" style={{margin:0}}>Subscriptions</div>
            <span style={{fontSize:'.78rem',fontWeight:700,color:'var(--t1)'}}>{currency(subsMonthlyTotal,2)}<span style={{fontSize:'.62rem',fontWeight:600,color:'var(--t3)'}}>/mo · {subscriptions.length}</span></span>
          </div>
          {renewingSoon.length > 0 && (
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {renewingSoon.map(({ b, days }) => (
                <div key={b.id} className="v-row" style={{padding:'8px 10px',background:'var(--yellow-lt)',borderRadius:'var(--r-s)'}}>
                  <div className="v-row-left">
                    <div className="v-row-icon" style={{background:'var(--yellow-lt)'}}><Icon name="receipt" size={15} color="var(--yellow)"/></div>
                    <div>
                      <div className="v-row-name">{b.name}</div>
                      <div style={{fontSize:'.64rem',color:'var(--t3)'}}>Renews in {days===0?'today':`${days} day${days===1?'':'s'}`} · {currency(b.amount,2)}</div>
                    </div>
                  </div>
                  <button type="button" className="btn btn-ghost btn-sm" onClick={()=>setEditing(b)}>Review</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <Section title="Overdue" rows={overdue} emptyMsg="Nothing overdue."/>
      <Section title="Upcoming" rows={upcoming} emptyMsg="No bills due soon."/>
      <Section title="Paid This Period" rows={paid} emptyMsg="Nothing marked paid yet this period."/>

      <div>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowRecurring(s=>!s)}>
          <Icon name={showRecurring?'chevronUp':'chevronDown'} size={13}/>
          {showRecurring?'Hide':'Manage'} Recurring Bills ({recurringRows.length})
        </button>
        <Collapse open={showRecurring}>
          <div className="card-flush" style={{marginTop:12}}>
            {recurringRows.length===0 ? <p className="empty">No recurring bills yet.</p> : recurringRows.map(r => (
              <BillRow key={r.key} icon={r.icon} color={r.color} name={r.name} sub={r.sub} amount={r.amount}
                status={r.status} recurring={false}
                payLabel={r.isCreditCardBill ? 'Pay' : 'Mark Paid'}
                onPay={r.status!=='paid' ? ()=>handlePay(r) : null}
                onEdit={r.isCreditCardBill ? (goToAccount ? ()=>goToAccount(r.raw.accountRef.id) : null) : ()=>setEditing(r.raw)}/>
            ))}
          </div>
        </Collapse>
      </div>

      {showAdd && (
        <AddBillModal accounts={accounts} onClose={()=>setShowAdd(false)}
          onSave={bill => setBills(list => [...list, bill])}/>
      )}
      {editing && (
        <AddBillModal accounts={accounts} bill={editing} onClose={()=>setEditing(null)}
          onSave={bill => setBills(list => list.map(b => b.id===bill.id ? bill : b))}
          onDelete={id => setBills(list => list.filter(b => b.id!==id))}/>
      )}
    </div>
  );
}

function App() {
  const [tab,setTab]           = useState('dashboard');
  // Collapsing header — a subtle compact state past a small scroll
  // threshold (not a hide/reveal animation, which risks the "jump or
  // flicker" the header must avoid). Same passive listener also minimizes
  // the FAB while actively scrolling down, so it can't ride over a row the
  // user is mid-read/mid-tap on; it snaps back the instant scrolling stops
  // or reverses, so it's never actually unreachable.
  const [headerScrolled, setHeaderScrolled] = useState(false);
  const [fabMinimized, setFabMinimized] = useState(false);
  useEffect(() => {
    let lastY = window.scrollY, settleTimer = null;
    const onScroll = () => {
      const y = window.scrollY;
      setHeaderScrolled(y > 8);
      setFabMinimized(y > 40 && y > lastY);
      lastY = y;
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => setFabMinimized(false), 500);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); clearTimeout(settleTimer); };
  }, []);
  const [settings,setSettings] = usePersist('fd_settings',    DEFAULT_SETTINGS, migrateSettings);
  const [transactions,setTx]   = usePersist('fd_transactions', []);
  const [goals,setGoals]       = usePersist('fd_goals',        DEFAULT_GOALS,    migrateGoals);
  const [commissions,setComm]  = usePersist('fd_commissions',  []);
  const [nwData,setNwData]     = usePersist('fd_networth',     DEFAULT_NETWORTH);
  // Dynamic account registry — seeded once on first run (see seedAccounts);
  // every screen below renders off this list, never a hardcoded name.
  const [accounts,setAccounts] = usePersist('fd_accounts',     seedAccounts());
  const [bills,setBills]       = usePersist('fd_bills',        []);
  const [recurring,setRecurring] = usePersist('fd_recurring',  []);
  const [customGoals,setCustomGoals] = usePersist('fd_customgoals', []);
  const [customCategories,setCustomCategories] = usePersist('fd_customcategories', []);
  // Reassigns the module-level CATEGORIES binding every render (see its
  // definition) — synchronous, not an effect, so the very first paint
  // already has custom categories in every CATEGORIES.map/filter(...) call
  // site across the app, not just renders after the initial mount.
  setModuleCustomCategories(customCategories);

  // ── Phase 1: transaction `kind` migration ───────────────────────────
  // One-time backfill of the new classification field onto every
  // transaction that predates it. Run as an effect (not inside
  // usePersist's own migrate hook) because classifying a credit-card
  // purchase vs. payment correctly needs the accounts list for context,
  // and usePersist's migrate() only ever sees the one key it's loading.
  // Idempotent: migrateTransactionKinds() reports `changed:false` (and
  // this skips the setTransactions call entirely) once every row already
  // has a valid kind, so this costs one pass over the array on every
  // render but only ever writes back once per device.
  useEffect(() => {
    const { transactions: next, changed } = FinCalc.migrateTransactionKinds(transactions, accounts);
    if (changed) setTx(next);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [transactions, accounts]);

  // ── Personalization (Priority 18) — accent color + light/dark theme are
  // applied as CSS custom properties on the root element, so every existing
  // var(--accent)/var(--bg)/etc. consumer (including inline SVG fill/stroke
  // attributes, which resolve var() the same way) repaints for free.
  useEffect(() => {
    const root = document.documentElement;
    const accent = settings.accentColor || '#00C805';
    root.style.setProperty('--accent', accent);
    // --accent-dk (hover states) and --accent-lt (wash backgrounds) are
    // themselves derived from --accent everywhere in the CSS, but they're
    // separate custom properties, not computed from it — a custom accent
    // color needs its own hover/wash shades too, or hover states would stay
    // pinned to the default green no matter what color the user picks.
    root.style.setProperty('--accent-dk', `color-mix(in srgb, ${accent} 82%, black)`);
    root.style.setProperty('--accent-lt', `color-mix(in srgb, ${accent} 9%, transparent)`);
    root.setAttribute('data-theme', settings.theme === 'light' ? 'light' : 'dark');
  }, [settings.accentColor, settings.theme]);

  // ── Add Transaction (v2) — a single global sheet every page opens ──────
  const [addTxOpen, setAddTxOpen]           = useState(false);
  const [addTxDefaultAccount, setAddTxDefaultAccount] = useState(null);
  const [addTxPreset, setAddTxPreset]       = useState(null);
  const [acctDeepLink, setAcctDeepLink]     = useState(null);
  const openAddTx = useCallback((accountId, preset) => {
    setAddTxDefaultAccount(accountId || null);
    setAddTxPreset(preset || null);
    setAddTxOpen(true);
  }, []);
  const goToAccount = useCallback(id => { setAcctDeepLink(id); setTab('accounts'); }, []);

  // ── Quick Add (Priority 11) — long-press the FAB for a shortcut menu ───
  const [quickMenuOpen, setQuickMenuOpen] = useState(false);
  const fabPressTimer = useRef(null);
  const fabLongPressed = useRef(false);
  const armFabLongPress = () => {
    fabLongPressed.current = false;
    fabPressTimer.current = setTimeout(() => {
      fabLongPressed.current = true;
      if (navigator.vibrate) navigator.vibrate(10);
      setQuickMenuOpen(true);
    }, 480);
  };
  const disarmFabLongPress = () => { if (fabPressTimer.current) clearTimeout(fabPressTimer.current); };
  const handleFabClick = () => {
    if (fabLongPressed.current) { fabLongPressed.current = false; return; }   // the long-press already opened the menu
    openAddTx(null, null);
  };
  const runQuickAction = item => {
    setQuickMenuOpen(false);
    if (item.preset.isCardPayment) {
      const card = (accounts||[]).find(a => a.type==='credit' && !a.archived);
      const source = defaultPaymentSourceAccount(accounts, card);
      if (card && source) { openAddTx(source.id, { type:'transfer', toAccountId:card.id }); return; }
    }
    openAddTx(null, item.preset);
  };

  // ── App-wide goal-ETA tracking ────────────────────────────────────────
  // Runs on ANY balance change (paycheck, commission split, manual update).
  // Records each goal's precise days-to-target and, when the ETA moves sooner,
  // writes a session-scoped "moved up X" highlight the Goals tab reads.
  useEffect(() => {
    let prev = {}; try { prev = JSON.parse(localStorage.getItem('fd_eta_prev')||'{}'); } catch {}
    let hl = {};   try { hl   = JSON.parse(sessionStorage.getItem('fd_eta_hl')||'{}'); } catch {}
    const next = { ...prev };
    // Blended across BOTH scenarios — never read one scenario's figure as if
    // it applied to the other (that is what made the two look linked).
    const hysaRate = blendedRate(settings, 'hysa');
    const rothRate = blendedRate(settings, 'rothIRA');
    const hysaBal  = goals.hysaBalance || 0;
    // This year's contributions, matching the Goals page's own ETA — using
    // the raw account balance here would compute a "days to target" the
    // Goals page's displayed ETA no longer agrees with (PRD §15).
    const rothYTD  = ytdRothContributions(transactions, new Date().getFullYear());
    const track = (key, rem, rate, done) => {
      if (done) { next[key] = 0; delete hl[key]; return; }
      if (!(rate > 0)) return;
      const days = rem > 0 ? (rem / rate) * 30.44 : 0;
      if (prev[key] == null) { next[key] = days; return; }          // baseline only
      if (days < prev[key] - 2) { hl[key] = { days: prev[key]-days }; next[key] = days; }
      else if (days > prev[key] + 2) { next[key] = days; delete hl[key]; }
    };
    track('hysa', Math.max(settings.hysaGoal - hysaBal, 0), hysaRate, hysaBal >= settings.hysaGoal);
    track('roth', Math.max(settings.rothIRAYearlyLimit - rothYTD, 0), rothRate, rothYTD >= settings.rothIRAYearlyLimit);
    localStorage.setItem('fd_eta_prev', JSON.stringify(next));
    try { sessionStorage.setItem('fd_eta_hl', JSON.stringify(hl)); } catch {}
  }, [goals, settings, transactions]);

  const pages = {
    dashboard:  <Dashboard  settings={settings} transactions={transactions} goals={goals} commissions={commissions} setGoals={setGoals} setTransactions={setTx} goTo={setTab}
                  accounts={accounts} setAccounts={setAccounts} netWorth={nwData} setNetWorth={setNwData} recurring={recurring} setRecurring={setRecurring} bills={bills} openAddTx={openAddTx} />,
    accounts:   <AccountsPage accounts={accounts} setAccounts={setAccounts} transactions={transactions} settings={settings} goals={goals}
                  netWorth={nwData} setGoals={setGoals} setNetWorth={setNwData} setTransactions={setTx}
                  openAddTx={openAddTx} deepLinkAccountId={acctDeepLink} onConsumeDeepLink={()=>setAcctDeepLink(null)} />,
    bills:      <BillsPage   bills={bills} setBills={setBills} accounts={accounts} transactions={transactions} settings={settings} goals={goals}
                  netWorth={nwData} setGoals={setGoals} setNetWorth={setNwData} setAccounts={setAccounts} setTransactions={setTx}
                  openAddTx={openAddTx} goToAccount={goToAccount} />,
    budget:     <Budget     settings={settings} transactions={transactions} />,
    spending:   <Spending   settings={settings} transactions={transactions} setTransactions={setTx} goals={goals} setGoals={setGoals}
                  accounts={accounts} setAccounts={setAccounts} netWorth={nwData} setNetWorth={setNwData} openAddTx={openAddTx} />,
    insights:   <SpendingInsights settings={settings} transactions={transactions} setTransactions={setTx} goTo={setTab}
                  accounts={accounts} netWorth={nwData} goals={goals} bills={bills} />,
    goals:      <Goals      settings={settings} goals={goals} setGoals={setGoals} commissions={commissions} transactions={transactions}
                  accounts={accounts} netWorth={nwData} customGoals={customGoals} setCustomGoals={setCustomGoals} />,
    commission: <Commission settings={settings} commissions={commissions} setCommissions={setComm} setGoals={setGoals} />,
    networth:   <NetWorth   netWorth={nwData} setNetWorth={setNwData} transactions={transactions} goals={goals} setGoals={setGoals} settings={settings} accounts={accounts} />,
    settings:   <Settings   settings={settings} setSettings={useCallback(s=>setSettings(s),[])}
                  accounts={accounts} setAccounts={setAccounts} goals={goals} setGoals={setGoals}
                  netWorth={nwData} setNetWorth={setNwData} transactions={transactions} setTransactions={setTx}
                  recurring={recurring} setRecurring={setRecurring}
                  customCategories={customCategories} setCustomCategories={setCustomCategories} goTo={setTab} />,
  };

  // Which of the 5 nav groups the current real page belongs to, and — for a
  // group with more than one page — the pill row that switches between them.
  const activeGroup = groupForTab(tab);
  const goToGroup = g => setTab(g.tabs.includes(tab) ? tab : g.tabs[0]);

  return (
    <div className="app">
      <header className={'header'+(headerScrolled?' header-scrolled':'')}>
        <div className="header-inner">
          <div className="logo"><div className="logo-dot" />Finance</div>
          <nav className="nav" aria-label="Primary">
            {NAV_GROUPS.map(g=>(
              <button key={g.id} className={'nav-btn'+(activeGroup.id===g.id?' active':'')} onClick={()=>goToGroup(g)}
                aria-current={activeGroup.id===g.id ? 'page' : undefined}>
                {g.label}
              </button>
            ))}
          </nav>
        </div>
      </header>
      {activeGroup.tabs.length > 1 && (
        <div style={{maxWidth:1040,margin:'0 auto',width:'100%',padding:'16px 28px 0',boxSizing:'border-box'}}>
          <div className="subnav-row" role="tablist" aria-label={`${activeGroup.label} sections`}>
            {activeGroup.tabs.map(id => {
              const t = TABS.find(x=>x.id===id);
              return (
                <button key={id} className={'subnav-pill '+(tab===id?'subnav-pill-on':'subnav-pill-off')} onClick={()=>setTab(id)}
                  role="tab" aria-selected={tab===id}>
                  {t.label}
                </button>
              );
            })}
          </div>
        </div>
      )}
      <main className="main">{pages[tab]}</main>
      <nav className="mobile-nav" aria-label="Primary">
        {NAV_GROUPS.map(g=>(
          <button key={g.id} className={'mnav-btn'+(activeGroup.id===g.id?' active':'')} onClick={()=>goToGroup(g)}
            aria-label={g.label} aria-current={activeGroup.id===g.id ? 'page' : undefined}>
            <NavIcon name={g.icon} active={activeGroup.id===g.id} />
            {activeGroup.id===g.id && <div className="nav-pip" />}
          </button>
        ))}
      </nav>

      {/* Persistent entry point to the redesigned Add Transaction sheet —
          reachable from every tab EXCEPT the ones that already have their
          own page-level add action (PRD §5 — never two add controls for
          the same action on one screen). Long-press for the Quick Add
          shortcut menu. */}
      {!FAB_HIDDEN_ON.includes(tab) && (
        <button className={'fab'+(fabMinimized?' fab-minimized':'')} onClick={handleFabClick}
          onPointerDown={armFabLongPress} onPointerUp={disarmFabLongPress} onPointerLeave={disarmFabLongPress}
          onContextMenu={e=>e.preventDefault()}
          aria-label="Add transaction — long-press for quick actions">
          <Icon name="plus" size={24} color="#000" strokeWidth={2.5}/>
        </button>
      )}
      {!FAB_HIDDEN_ON.includes(tab) && quickMenuOpen && (
        <>
          <div className="quick-menu-overlay" onClick={()=>setQuickMenuOpen(false)}/>
          <div className="quick-menu" role="menu" aria-label="Quick add">
            {QUICK_ADD_MENU.map(item => (
              <button key={item.label} type="button" className="quick-menu-item" role="menuitem" onClick={()=>runQuickAction(item)}>
                <span className="quick-menu-icon"><Icon name={item.icon} size={15} color="var(--t2)"/></span>
                {item.label}
              </button>
            ))}
          </div>
        </>
      )}
      {addTxOpen && (
        <AddTransactionModal
          accounts={accounts} transactions={transactions} settings={settings} goals={goals} netWorth={nwData}
          setGoals={setGoals} setNetWorth={setNwData} setAccounts={setAccounts} setTransactions={setTx}
          defaultAccountId={addTxDefaultAccount} preset={addTxPreset}
          onClose={()=>setAddTxOpen(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  function run(){
    var src=document.getElementById('app-src').textContent;
    var compiled=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
    eval(compiled);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
// Register service worker for PWA / offline support.
// A new sw.js can finish installing and activating (skipWaiting +
// clients.claim() in sw.js) WHILE this page is still showing content from
// the worker that was active when the page loaded — the browser doesn't
// re-render an already-open page just because control changed underneath
// it. Without the reload below, a phone that visited before a deploy can
// sit on stale content indefinitely, only ever catching up on some later,
// unrelated navigation. `controllerchange` fires the instant the new
// worker takes over; reloading then means the update is visible on THIS
// visit, not "eventually, next time."
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update().catch(function(){});
    }).catch(function(){});
  });
  var swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
</script>
</body>
</html>
