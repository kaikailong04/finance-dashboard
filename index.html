    { label:'Roth IRA', bal:rothYTD,  goal:settings.rothIRAYearlyLimit, pct:rothPct, color:'var(--purple)' },
    { label:'401(k)',   bal:k401EmpYTD, goal:settings.ira401kYearlyMax, pct:k401Pct, color:'var(--yellow)' },
  ];
  return (
    <div>
      <div className="cal-head">
        <div className="section-head" style={{padding:0,marginBottom:0}}>Savings Goals</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>goTo('goals')}>View All →</button>
      </div>
      <div className="card">
        {rows.map((r,i) => (
          <div key={r.label} style={{marginBottom:i<rows.length-1?14:0}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.78rem',marginBottom:6}}>
              <span style={{color:'var(--t2)'}}>{r.label}</span>
              <span style={{color:'var(--t1)',fontWeight:600}}>{currency(r.bal)} / {currency(r.goal)}</span>
            </div>
            <div className="track"><div className="fill" style={{width:`${r.pct}%`,background:r.color}}/></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// Combines a budget read, the top spending category, and the worst credit
// utilization into 2-3 sentences — the same never-shaming, plain-language
// style as the Credit Card Dashboard's insights.
function DashboardAIInsights({ settings, accounts, goals, netWorth, byCategory, totalSpent, totalBudgeted, dayProgress }) {
  const ctx = { settings, goals, netWorth };
  const lines = [];
  if (totalBudgeted > 0) {
    const usedPct = safePct(totalSpent, totalBudgeted);
    const dp = (typeof dayProgress === 'number' && dayProgress > 0) ? Math.min(dayProgress, 1) : 1;
    if (usedPct > 100) {
      lines.push(`You're ${currency(totalSpent-totalBudgeted)} over your total budget this month.`);
    } else if (dp < 1 && dp > 0.03) {
      // Predictive, pace-based read (PRD §8) rather than a flat percentage:
      // project the CURRENT daily burn rate out across the rest of the
      // month and say what it implies, instead of just restating "X% used".
      const projected = totalSpent / dp;
      const overBy = round2(projected - totalBudgeted);
      lines.push(overBy > 0
        ? `You've used ${usedPct.toFixed(0)}% of this month's budget with ${(100-dp*100).toFixed(0)}% of the month remaining. At your current pace, you may exceed budget by ${currency(overBy)}.`
        : `You've used ${usedPct.toFixed(0)}% of this month's budget with ${(100-dp*100).toFixed(0)}% of the month remaining — on pace to stay within budget.`);
    } else {
      lines.push(`You've used ${usedPct.toFixed(0)}% of this month's budget.`);
    }
  }
  const topCat = Object.entries(byCategory||{}).filter(([k,v]) => k!=='__401k__' && v>0).sort((a,b) => b[1]-a[1])[0];
  if (topCat) lines.push(`${catLabel(topCat[0])} is your top spending category this month at ${currency(topCat[1])}.`);
  const worstCard = (accounts||[]).filter(a => a.type==='credit' && !a.archived)
    .map(a => ({ a, util: creditUtilization(accountBalance(a,ctx), (a.card||defaultCardFields()).creditLimit) }))
    .sort((x,y) => y.util-x.util)[0];
  if (worstCard && worstCard.util > 30) lines.push(`${worstCard.a.name} is at ${worstCard.util.toFixed(0)}% utilization — worth an early payment before applying for new credit.`);
  if (!lines.length) lines.push('Everything looks steady — no alerts today.');
  return (
    <div>
      {/* Deterministic, rule-based read of the same numbers already shown
          elsewhere on this page — labeled "Smart," not "AI," since it
          isn't calling any model (PRD §7: "Do not call simple rule-based
          text 'AI' unless the project actually uses an AI model"). */}
      <div className="section-head" style={{padding:'0 0 10px'}}>Smart Insights</div>
      <div className="card" style={{borderColor:'rgba(0,200,5,.2)',background:'rgba(0,200,5,.03)'}}>
        {lines.map((l,i) => <div key={i} className="insight-row">{l}</div>)}
      </div>
    </div>
  );
}

function CashFlowForecast({ settings, accounts, bills, recurring, transactions, goals, netWorth }) {
  const [days, setDays] = useState(30);
  const acctCtx = { settings, goals, netWorth };
  const start  = useMemo(() => currentBucketBalances(accounts, acctCtx), [accounts, settings, goals, netWorth]);
  const events = useMemo(() => buildForecastEvents({ settings, accounts, bills, recurring, transactions, goals, netWorth }, days),
    [settings, accounts, bills, recurring, transactions, goals, netWorth, days]);
  const series = useMemo(() => projectBalances(events, start, days), [events, start, days]);

  const endChecking = series.checking[series.checking.length-1] || 0;
  const endCredit   = series.credit[series.credit.length-1] || 0;
  const endSavings  = series.savings[series.savings.length-1] || 0;

  return (
    <div>
      <div className="cal-head">
        <div className="section-head" style={{padding:0,marginBottom:0}}>Cash Flow Forecast</div>
        <div className="seg" role="group" aria-label="Forecast range">
          {[[30,'30D'],[60,'60D'],[90,'90D']].map(([v,l]) => (
            <button key={l} className={days===v?'on':''} onClick={()=>setDays(v)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="card">
        <div className="ins-cards" style={{marginBottom:16}}>
          <div className="ins-card">
            <span className="ins-card-lbl">Projected Checking</span>
            <span className="ins-card-val" style={{color:endChecking<0?'var(--red)':'var(--t1)'}}>{currency(endChecking)}</span>
            <span className="ins-card-sub">in {days} days</span>
          </div>
          <div className="ins-card">
            <span className="ins-card-lbl">Projected Credit Card Balance</span>
            <span className="ins-card-val" style={{color:endCredit>0?'var(--red)':'var(--t1)'}}>{currency(endCredit)}</span>
            <span className="ins-card-sub">in {days} days</span>
          </div>
          <div className="ins-card">
            <span className="ins-card-lbl">Projected Savings</span>
            <span className="ins-card-val" style={{color:'var(--accent)'}}>{currency(endSavings)}</span>
            <span className="ins-card-sub">in {days} days</span>
          </div>
        </div>
        {events.length === 0
          ? <VizEmpty message="No upcoming bills, paychecks, or recurring transactions to project." hint="Add a bill or recurring transaction to see a forecast."/>
          : <LineTrendChart labels={series.labels} formatY={v=>currency(v)}
              series={[
                { key:'checking', label:'Checking',    color:VIZ_SERIES[0], points:series.checking },
                { key:'credit',   label:'Credit Card',  color:'#FF5000',     points:series.credit   },
                { key:'savings',  label:'Savings',      color:VIZ_SERIES[2], points:series.savings  },
              ]}/>}
        {endChecking < 0 && (
          <div style={{marginTop:12,padding:'10px 12px',background:'rgba(255,80,0,.08)',border:'1px solid rgba(255,80,0,.25)',borderRadius:'var(--r-s)',fontSize:'.76rem',color:'var(--t1)'}}>
            Checking is projected to go negative within {days} days based on known upcoming bills and paychecks.
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ settings, transactions, goals, commissions, setGoals, setTransactions, goTo, accounts, setAccounts, netWorth, setNetWorth, recurring, setRecurring, bills, openAddTx }) {
  const phase = getPhaseInfo(settings.startDate);
  const now   = new Date();

  const budget     = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const eb         = settings.earlyBudget;
  const netMonthly = monthlyNetIncome(settings);   // 2 × net paycheck
  // Savings rate = HYSA + Roth IRA out of take-home. The 401(k) is already
  // deducted before the paycheck lands, so it is NOT subtracted again here.
  const monthlyContrib = (budget.hysa||0) + (budget.rothIRA||0);
  const savingsRate    = netMonthly > 0 ? (monthlyContrib / netMonthly) * 100 : 0;

  const totalBudgeted = phase.isEarly || phase.isPreEmployment
    ? (eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0)
    : (budget.rentAndFee||0)+(budget.utilities||0)+(budget.rentersInsurance||0)+(budget.rothIRA||0)+(budget.hysa||0)+(budget.groceries||0)+(budget.gas||0)+(budget.funTravel||0)+(budget.outToEat||0)+(budget.shopping||0);
  const surplus = netMonthly - totalBudgeted;

  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  // Spending totals come from the same shared classifier every other page
  // uses (getFilteredTransactions + getCategorySpendingTotals), so this
  // widget can never disagree with the Financial Health card, Spending page,
  // or Spending Insights for the same month.
  const monthTxAllForSpend = getFilteredTransactions(transactions, { month: monthStr });
  const catTotalsForSpend  = getCategorySpendingTotals(monthTxAllForSpend);
  const totalSpent = round2(Object.values(catTotalsForSpend).reduce((s,c)=>s+c.total,0));
  const byCategory = {};
  for (const [cat, v] of Object.entries(catTotalsForSpend)) byCategory[cat] = v.total;
  // HYSA and Roth IRA are contribution lines, not spending — the shared
  // classifier above (same one the Financial Health card uses) deliberately
  // excludes them from totalSpent, same as every "how much did I spend"
  // number elsewhere. Their own "This Month" row needs BOTH any hysa/rothIRA-
  // categorized transaction logged this month AND whatever this month's
  // logged paychecks already withheld via allocations — same shared helper
  // the Budget and Spending pages read from, so this can never disagree.
  byCategory.hysa    = monthlyContributionAmount(monthTxAllForSpend, 'hysa', 'hysa');
  byCategory.rothIRA = monthlyContributionAmount(monthTxAllForSpend, 'rothIRA', 'rothIRA');
  const recentTx = [...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  // ── Paycheck logging — 1st & 3rd Thursday, exactly 2 per month ──────
  const perMonth    = checksPerMonth(settings);
  const payDates    = paycheckDatesForMonth(now.getFullYear(), now.getMonth());
  const paychecksThisMonth = transactions.filter(t=>t.kind==='paycheck' && t.date && t.date.startsWith(monthStr));
  const checkCount  = Math.min(paychecksThisMonth.length, perMonth);
  // 401(k) isn't a category any transaction is tagged with — it's withheld
  // automatically per logged paycheck — so its "actual" for the This Month
  // list below is synthesized from paychecksThisMonth rather than read out
  // of byCategory like every other row.
  byCategory['__401k__'] = round2(paychecksThisMonth.reduce((s,p)=>s+(p.employee401k||0), 0));
  const monthName   = now.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const baseDeposit = netPerCheck(settings);          // $1,713 take-home
  const nextPayDate = payDates[Math.min(checkCount, perMonth-1)];
  const [payOpen, setPayOpen] = useState(false);
  const [payAmt,  setPayAmt]  = useState(baseDeposit);
  const baseAlloc   = perCheckAllocations(settings);   // ordered [{key,label,amount}] for this month
  // Every allocation for THIS check — HYSA/Roth/budget categories AND the
  // 401(k) withholding below — scales with whatever amount was actually
  // typed in, not just the configured default. A real paycheck rarely lands
  // at exactly the expected figure (overtime, a short week, PTO payout),
  // and since the 401(k) election is itself a percentage of gross pay, it
  // moves with the check the same way every other allocation already does.
  const payScale    = baseDeposit>0 ? (parseFloat(payAmt)||0)/baseDeposit : 1;
  const scaledAlloc = baseAlloc.map(a => ({ ...a, amount: +(a.amount*payScale).toFixed(2) }));
  const allocOf     = key => (scaledAlloc.find(a=>a.key===key)||{}).amount || 0;
  const allocSum    = +scaledAlloc.reduce((s,a)=>s+a.amount,0).toFixed(2);
  // 401(k): employee amount is a fixed per-check baseline from Settings,
  // scaled by the same payScale ratio as every other allocation above —
  // employer match is then 50% of THIS check's scaled employee
  // contribution, capped for the calendar year (never exceeds
  // employerMatchAnnualCap).
  const baseEmpContrib = k401Active(settings, nextPayDate) ? employee401kPerCheck(settings) : 0;
  const empContrib  = round2(baseEmpContrib * payScale);
  const matchYTD    = ytdEmployerMatch(transactions, now.getFullYear());
  const emprContrib = employerMatchForPaycheck(settings, empContrib, matchYTD);
  // "Funded this month" — how much of each monthly budget line the logged
  // paychecks have covered so far (each check funds ~half; two checks = 100%).
  const fundedByKey = {};
  for (const p of paychecksThisMonth)
    for (const [k,v] of Object.entries(p.allocations||{})) fundedByKey[k] = (fundedByKey[k]||0) + v;
  const fundedRows  = baseAlloc.map(a => ({
    key:a.key, label:a.label,
    target: round2(a.amount*perMonth),         // full monthly budget line (per-check × 2)
    funded: round2(fundedByKey[a.key]||0),
  }));
  const fundedTotal = +fundedRows.reduce((s,r)=>s+r.funded,0).toFixed(2);
  const targetTotal = +fundedRows.reduce((s,r)=>s+r.target,0).toFixed(2);
  const openPay = () => { setPayAmt(baseDeposit); setPayOpen(true); };
  const confirmPay = () => {
    const amt = round2(parseFloat(payAmt)||0);
    if (!(amt>0)) return;
    const checkNo  = checkCount+1;
    const payDate  = payDates[Math.min(checkNo-1, perMonth-1)];   // 1st / 3rd Thursday
    const dateStr  = ymd(payDate);
    const allocObj = Object.fromEntries(scaledAlloc.map(a=>[a.key,a.amount]));
    setTransactions(prev=>[{
      id:String(Date.now()), date:dateStr, type:'income', kind:'paycheck', category:'income',
      description:`Paycheck ${checkNo} of ${perMonth}`, amount:amt, allocations:allocObj, month:monthStr,
      // 401(k) is withheld BEFORE this deposit — recorded, never subtracted from `amount`
      employee401k: empContrib, employer401k: emprContrib,
    }, ...prev]);
    // Add this check's savings to the goals (auto-syncs to Net Worth).
    // Employer match is retirement-only — never added to cash/checking.
    setGoals(g=>({
      ...g,
      hysaBalance:     round2((g.hysaBalance||0) + allocOf('hysa')),
      rothIRAOverride: round2(currentRothBal(settings,g) + allocOf('rothIRA')),
      k401Employee:    round2((g.k401Employee||0) + empContrib),
      k401Employer:    round2((g.k401Employer||0) + emprContrib),
      ira401kBalance:  round2((g.ira401kBalance||0) + empContrib + emprContrib),
    }));
    setPayOpen(false);
  };

  // ── Financial Health inputs ──
  // Spending comes from the shared classifier, so this card and the Spending
  // Insights page can never report different totals for the same month.
  const health = useMemo(() => {
    const monthTxAll = getFilteredTransactions(transactions, { month: monthStr });
    const catTotals  = getCategorySpendingTotals(monthTxAll);
    const spent      = round2(Object.values(catTotals).reduce((s,c)=>s+c.total,0));
    const daily      = getDailySpendingTotals(monthTxAll);
    const nwSnap     = getNetWorthSnapshot((netWorth||{}).accounts, goals, accounts, { settings, goals, netWorth });
    // Next payday: the next 1st/3rd Thursday at or after today, rolling into
    // next month once this month's two have passed.
    const upcoming = [
      ...paycheckDatesForMonth(now.getFullYear(), now.getMonth()),
      ...paycheckDatesForMonth(now.getFullYear(), now.getMonth()+1),
    ].filter(d => d >= new Date(now.getFullYear(), now.getMonth(), now.getDate()));
    const nextPay = upcoming[0] || null;
    return {
      spent,
      spendCount: Object.values(daily).reduce((s,d)=>s+d.count,0),
      budgetLeft: round2(totalBudgeted - spent),
      topCat: Object.entries(catTotals).filter(([,c])=>c.total>0).sort((a,b)=>b[1].total-a[1].total)[0] || null,
      nw: nwSnap.netWorth, cash: nwSnap.cash, retirement: nwSnap.retirement,
      nextPay,
      daysToPay: nextPay ? Math.round((nextPay - new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000) : null,
    };
  }, [transactions, goals, monthStr, totalBudgeted, now.getFullYear(), now.getMonth(), now.getDate(), netWorth, accounts, settings]);

  // ── Financial Health score (PRD §8) — the same composite score, label,
  // and "why" reasons Spending Insights computes, surfaced here too since
  // Home is where a financial-health headline actually belongs. Pace-aware
  // via dayProgress, so it can't read as a false "100" just because it's
  // early in the month and the absolute totals still look small.
  const acctCtxForHealth = { settings, goals, netWorth };
  const daysInMonth  = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayProgress  = now.getDate() / daysInMonth;
  const budgetPctUsedForHealth = totalBudgeted > 0 ? safePct(health.spent, totalBudgeted) : 0;
  const maxUtilizationForHealth = (accounts||[]).filter(a=>a.type==='credit' && !a.archived).reduce((max,a) => {
    const card = a.card || defaultCardFields();
    return Math.max(max, creditUtilization(accountBalance(a, acctCtxForHealth), card.creditLimit));
  }, 0);
  const overdueBillsCountForHealth = useMemo(() => {
    const billsCtx = { accounts, settings, goals, netWorth, transactions };
    const ccOverdue   = creditCardBills(accounts, billsCtx).filter(cc => !cc.paid && billStatus({recurring:true,dueDay:cc.dueDay})==='overdue').length;
    const userOverdue = (bills||[]).filter(b => billStatus(b)==='overdue').length;
    return ccOverdue + userOverdue;
  }, [accounts, bills, settings, goals, netWorth, transactions]);
  const healthScoreInputs = { budgetPctUsed: budgetPctUsedForHealth, savingsRate, maxUtilization: maxUtilizationForHealth, overdueBillsCount: overdueBillsCountForHealth, dayProgress };
  const healthScore = financialHealthScore(healthScoreInputs);
  const healthInfo   = healthLabel(healthScore);
  const healthWhy    = useMemo(() => healthReasons(healthScoreInputs), [budgetPctUsedForHealth, savingsRate, maxUtilizationForHealth, overdueBillsCountForHealth, dayProgress]);

  // Paycheck breakdown — built around the actual net paycheck. The 401(k) rows
  // are informational (already withheld); they are NOT deducted from take-home.
  const empMonthly  = round2(empContrib  * perMonth);
  const emprMonthly = round2(emprContrib * perMonth);
  const paycheckRows = [
    { icon:'check',  iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Net Paycheck',         sub:`1st & 3rd Thursday · ${perMonth}× / mo`,                       val:currency(baseDeposit,2),   vc:'var(--green)' },
    { icon:'dollar', iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Monthly Take-Home',    sub:currency(annualNetIncome(settings))+' / yr · '+checksPerYear(settings)+' checks', val:currency(netMonthly,2), vc:'var(--t1)' },
    { icon:'bank',   iconBg:'rgba(245,166,35,.1)', iconClr:'#F5A623', name:'401(k) — You',         sub:`${currency(empContrib,2)}/check · already withheld`,           val:currency(empMonthly,2),    vc:'var(--yellow)'},
    { icon:'shield', iconBg:'rgba(123,116,255,.12)',iconClr:'#7B74FF',name:'401(k) — Employer',    sub:`${currency(emprContrib,2)}/check · not spendable`,             val:currency(emprMonthly,2),   vc:'var(--purple)'},
  ];

  // Category bars for "This Month" (only show if transactions exist)
  // HYSA, Roth IRA and 401(k) are separate account categories — never
  // combined into one "Savings" row — matching how Spending Insights and the
  // Net Worth page already keep them distinct.
  const catSpendRows = phase.isEarly || phase.isPreEmployment ? [
    { label:'Utilities',  cat:'utilities', budget:budget.utilitiesAndFee },
    { label:'HYSA',       cat:'hysa',      budget:budget.hysa||0 },
    { label:'Roth IRA',   cat:'rothIRA',   budget:budget.rothIRA||0 },
    { label:'401(k)',     cat:'__401k__',  budget:empMonthly },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ] : [
    { label:'Housing',    cat:'housing',   budget:budget.rentAndFee },
    { label:'Utilities',  cat:'utilities', budget:budget.utilities },
    { label:'HYSA',       cat:'hysa',      budget:budget.hysa||0 },
    { label:'Roth IRA',   cat:'rothIRA',   budget:budget.rothIRA||0 },
    { label:'401(k)',     cat:'__401k__',  budget:empMonthly },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ];

  let phaseBadge;
  if (phase.isPreEmployment)   phaseBadge = <span className="badge badge-purple">Pre-Employment</span>;
  else if (phase.isRentFree)   phaseBadge = <span className="badge badge-green">Rent-Free Month</span>;
  else                         phaseBadge = <span className="badge badge-blue">Rent Month</span>;

  return (
    <div className="page">

      {/* Hero ─ take-home */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Monthly Take-Home</div>
        <div className="mega" style={{color:'var(--t1)'}}><CountUp value={netMonthly} format={v=>currency(v)}/></div>
        <div style={{fontSize:'.85rem',color:'var(--accent)',marginTop:10,fontWeight:500,display:'flex',alignItems:'center',gap:5}}>
          <Icon name="trendUp" size={14} color="var(--accent)" strokeWidth={2}/>
          {currency(settings.grossOTE*12-settings.grossBase*12)} OTE upside / yr
        </div>
      </div>

      <QuickActionsRow openAddTx={openAddTx} goTo={goTo} accounts={accounts}/>

      <div className="g2">
        <NetWorthMiniCard netWorth={netWorth} goals={goals} goTo={goTo} accounts={accounts} settings={settings}/>
        <AccountsStrip accounts={accounts} settings={settings} goals={goals} netWorth={netWorth} goTo={goTo}/>
      </div>

      <DueRecurringCard recurring={recurring} accounts={accounts}
        ctxBase={{ settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions, setRecurring }}/>

      <CashFlowForecast settings={settings} accounts={accounts} bills={bills} recurring={recurring} transactions={transactions} goals={goals} netWorth={netWorth}/>

      {/* Projected Net Worth chart */}
      <ProjectedChart settings={settings} />

      {/* Stat strip */}
      <div style={{display:'flex',gap:0}}>
        {[
          { lbl:'Base',         val:currency(settings.grossBase), sub:currency(settings.grossBase*12)+'/yr', c:'var(--t1)' },
          { lbl:'OTE',          val:currency(settings.grossOTE),  sub:currency(settings.grossOTE*12)+'/yr',  c:'var(--accent)' },
          { lbl:'Savings Rate', val:pct(savingsRate,0),           sub:currency(monthlyContrib)+'/mo saved',   c:'var(--accent)' },
        ].map((s,i,arr) => (
          <div key={s.lbl} style={{
            flex:1, paddingRight:i<arr.length-1?16:0, marginRight:i<arr.length-1?16:0,
            borderRight: i<arr.length-1 ? '1px solid var(--border)' : 'none',
          }}>
            <div style={{fontSize:'.6rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:5}}>{s.lbl}</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums',color:s.c}}>{s.val}</div>
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:2}}>{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="g2">
        <CreditUtilizationMini accounts={accounts} settings={settings} goals={goals} netWorth={netWorth} goTo={goTo}/>
        <UpcomingBillsMini accounts={accounts} bills={bills} transactions={transactions} settings={settings} goals={goals} netWorth={netWorth} goTo={goTo}/>
      </div>

      <SavingsGoalsMini settings={settings} goals={goals} transactions={transactions} goTo={goTo}/>

      {/* Paycheck Breakdown */}
      <div>
        <div className="section-head">Paycheck Breakdown</div>
        <div className="card-flush">
          {paycheckRows.map(r => (
            <div key={r.name} className="v-row">
              <div className="v-row-left">
                <div className="v-row-icon" style={{background:r.iconBg}}>
                  <Icon name={r.icon} size={16} color={r.iconClr} strokeWidth={1.7}/>
                </div>
                <div>
                  <div className="v-row-name">{r.name}</div>
                  <div className="v-row-sub">{r.sub}</div>
                </div>
              </div>
              <div className="v-row-val" style={{color:r.vc}}>{r.val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Monthly surplus */}
      {!phase.isPreEmployment && (
        <div style={{
          background:surplus>=0?'var(--accent-lt)':'rgba(255,80,0,.08)',
          border:'1px solid '+(surplus>=0?'rgba(0,200,5,.2)':'rgba(255,80,0,.2)'),
          borderRadius:'var(--r)', padding:'18px 20px',
          display:'flex', alignItems:'center', justifyContent:'space-between',
        }}>
          <div>
            <div className="eyebrow" style={{marginBottom:6}}>Monthly Surplus</div>
            <div style={{fontSize:'1.75rem',fontWeight:800,letterSpacing:'-.04em',fontVariantNumeric:'tabular-nums',
              color:surplus>=0?'var(--green)':'var(--red)',lineHeight:1}}>
              {surplus>=0?'+':''}{currency(surplus)}
            </div>
            <div style={{fontSize:'.72rem',color:'var(--t3)',marginTop:5}}>
              {currency(netMonthly)} − {currency(totalBudgeted)} budgeted
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            {phaseBadge}
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:6}}>
              {phase.isEarly ? 'No rent — HYSA accelerated' : 'Rent due this month'}
            </div>
          </div>
        </div>
      )}

      {/* Log Paycheck */}
      <div>
        {checkCount>=2
          ? <button className="btn btn-ghost btn-full" disabled style={{opacity:.55,cursor:'default'}}>
              ✓ Paychecks logged for {monthName}
            </button>
          : <button className="btn btn-primary btn-full" onClick={openPay}>
              Log Paycheck {checkCount+1} of 2
            </button>}
        {checkCount===1 && (
          <div style={{fontSize:'.68rem',color:'var(--t3)',textAlign:'center',marginTop:6}}>
            Check 1 logged · {currency(paychecksThisMonth[0].amount,2)} deposited · 1 more to fully fund {now.toLocaleDateString('en-US',{month:'long'})}
          </div>
        )}
      </div>

      {/* ── Financial Health ── */}
      {/* Reuses the corrected income + 401(k) logic: savings rate is out of
          net take-home (the 401(k) is already withheld and is NOT subtracted
          again), and the employer match is reported separately from cash. */}
      <div>
        <div className="section-head">Financial Health</div>
        <div className="card" style={{marginBottom:12,display:'flex',alignItems:'center',gap:16}}>
          <div className="grade-badge" style={{width:56,height:56,fontSize:'1.3rem',borderColor:healthInfo.color,color:healthInfo.color,flexShrink:0}}>
            {healthScore}
          </div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:'.95rem',fontWeight:700,color:healthInfo.color}}>{healthInfo.label}</div>
            <div style={{fontSize:'.76rem',color:'var(--t3)',marginTop:2,lineHeight:1.5}}>{healthWhy.join(' · ')}</div>
          </div>
        </div>
        <div className="ins-cards">
          <button type="button" className="ins-card" onClick={()=>goTo&&goTo('insights')}>
            <span className="ins-card-lbl">Spent This Month</span>
            <span className="ins-card-val">{money2(health.spent)}</span>
            <span className="ins-card-sub">{health.spendCount} purchase{health.spendCount===1?'':'s'}</span>
            <span className="ins-card-link">Spending Insights →</span>
          </button>
          <button type="button" className="ins-card" onClick={()=>goTo&&goTo('budget')}>
            <span className="ins-card-lbl">Budget Remaining</span>
            <span className="ins-card-val" style={{color:health.budgetLeft>=0?'var(--accent)':'var(--red)'}}>
              {health.budgetLeft>=0?'':'−'}{money2(Math.abs(health.budgetLeft))}
            </span>
            <span className="ins-card-sub">
              {totalBudgeted>0?`of ${money0(totalBudgeted)} budgeted`:'no budget set'}
            </span>
            <span className="ins-card-link">View budget →</span>
          </button>
          <div className="ins-card">
            <span className="ins-card-lbl">Savings Rate</span>
            <span className="ins-card-val" style={{color:'var(--accent)'}}>{pct(savingsRate,0)}</span>
            <span className="ins-card-sub">{money0(monthlyContrib)}/mo of {money0(netMonthly)} take-home</span>
          </div>
          <button type="button" className="ins-card" onClick={()=>goTo&&goTo('networth')}>
            <span className="ins-card-lbl">Net Worth</span>
            <span className="ins-card-val" style={{color:health.nw>=0?'var(--t1)':'var(--red)'}}>{money2(health.nw)}</span>
            <span className="ins-card-sub">{money0(health.cash)} liquid · {money0(health.retirement)} retirement</span>
            <span className="ins-card-link">Net Worth →</span>
          </button>
          {health.topCat ? (
            <button type="button" className="ins-card" onClick={()=>goTo&&goTo('insights')}>
              <span className="ins-card-lbl">Top Category</span>
              <span className="ins-card-val">{catLabel(health.topCat[0])}</span>
              <span className="ins-card-sub">{money2(health.topCat[1].total)} this month</span>
              <span className="ins-card-link">Drill down →</span>
            </button>
          ) : (
            <div className="ins-card">
              <span className="ins-card-lbl">Top Category</span>
              <span className="ins-card-val">—</span>
              <span className="ins-card-sub">no spending recorded yet</span>
            </div>
          )}
          <div className="ins-card">
            <span className="ins-card-lbl">Next Paycheck</span>
            <span className="ins-card-val">{money2(baseDeposit)}</span>
            <span className="ins-card-sub">
              {health.nextPay
                ? `${health.nextPay.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} · ${health.daysToPay===0?'today':health.daysToPay===1?'tomorrow':`in ${health.daysToPay} days`}`
                : '1st & 3rd Thursday'}
            </span>
          </div>
        </div>
      </div>

      {/* Funded This Month — fills as each paycheck half lands */}
      {!phase.isPreEmployment && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
            <div className="section-head" style={{padding:0,marginBottom:0}}>Funded This Month</div>
            <div style={{fontSize:'.72rem',color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
              {currency(fundedTotal)} / {currency(targetTotal)} · {checkCount} of 2 checks
            </div>
          </div>
          <div className="card-flush">
            {fundedRows.map(r => {
              const p_  = r.target>0 ? Math.min((r.funded/r.target)*100,100) : 0;
              const done = p_>=100;
              return (
                <div key={r.key} className="sp-cat">
                  <div className="sp-top">
                    <span className="sp-name">{r.label}{done && <span style={{color:'var(--accent)',marginLeft:6}}>✓</span>}</span>
                    <span className="sp-nums">
                      <span className="sp-spent">{currency(r.funded)}</span>
                      <span className="sp-bgt"> / {currency(r.target)}</span>
                    </span>
                  </div>
                  <div className="bar" role="progressbar" aria-label={`${r.label} funded`} aria-valuenow={r.funded} aria-valuemin={0} aria-valuemax={r.target}>
                    <div className="bar-in" style={{width:`${p_}%`}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* This Month — a one-line total, not a second copy of the full
          9-category breakdown Budget and Spending already show in more
          detail (with the Rent-Free/With Rent split and "By Category"
          list, respectively). Home links to the detail instead of
          repeating it (PRD §7: "Home may link to detailed pages but
          should not duplicate their entire contents"). */}
      {!phase.isPreEmployment && (
        <button type="button" className="ins-card" style={{width:'100%',textAlign:'left'}} onClick={()=>goTo&&goTo('budget')}>
          <span className="ins-card-lbl">This Month</span>
          <span className="ins-card-val">{currency(totalSpent)} spent</span>
          <span className="ins-card-sub">
            {catSpendRows.filter(r=>r.budget>0).length} budgeted categories
          </span>
          <span className="ins-card-link">View Budget →</span>
        </button>
      )}

      {/* Pre-employment placeholder */}
      {phase.isPreEmployment && (
        <div className="card" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--t1)',marginBottom:8}}>Pre-Employment Setup</div>
          <div style={{color:'var(--t3)',fontSize:'.8rem',maxWidth:360,margin:'0 auto',lineHeight:1.6}}>
            Financial tracking starts July 2026. Use this time to configure your settings, open your HYSA, and set up your Roth IRA.
          </div>
        </div>
      )}

      {/* Recent activity */}
      {recentTx.length > 0 && (
        <div>
          <div className="section-head">Recent Activity</div>
          <div className="card-flush">
            <div className="tx-list">
              {recentTx.map(t => {
                const cat = CATEGORIES.find(c=>c.id===t.category);
                return (
                  <div key={t.id} className="tx-row">
                    {t.kind==='paycheck' ? <div className="tx-icon">PAY</div>
                      : t.type==='transfer' ? <div className="tx-icon"><Icon name="swap" size={14} color="var(--blue)"/></div>
                      : <MerchantLogo description={t.description}/>}
                    <div className="tx-body">
                      <div className="tx-desc">{t.description}</div>
                      <div className="tx-meta">{(t.kind==='paycheck' ? 'Paycheck' : (cat?.label||'Other'))} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                    </div>
                    <div className="tx-amt" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>
                      {t.type==='income'?'+':'-'}{currency(t.amount)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <DashboardAIInsights settings={settings} accounts={accounts} goals={goals} netWorth={netWorth}
        byCategory={byCategory} totalSpent={totalSpent} totalBudgeted={totalBudgeted} dayProgress={dayProgress}/>

      {/* Paycheck confirmation modal */}
      {payOpen && (
        <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) setPayOpen(false); }}>
          <div className="modal-card">
            <div style={{padding:'20px 22px',borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:'1.05rem',fontWeight:700,color:'var(--t1)'}}>Log Paycheck {checkCount+1} of 2</div>
              <div style={{fontSize:'.72rem',color:'var(--t3)',marginTop:3}}>{monthName} · semi-monthly deposit</div>
            </div>
            <div style={{padding:'18px 22px'}}>
              <div className="eyebrow" style={{marginBottom:8}}>Deposit Amount</div>
              <div style={{position:'relative',marginBottom:6}}>
                <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'var(--t3)',fontSize:'1.15rem',fontWeight:600}}>$</span>
                <input type="number" step="0.01" min="0" value={payAmt} onChange={e=>setPayAmt(e.target.value)}
                  style={{width:'100%',background:'var(--s2)',border:'1px solid var(--border2)',borderRadius:'var(--r-s)',color:'var(--t1)',padding:'12px 12px 12px 32px',fontSize:'1.35rem',fontWeight:700,outline:'none',fontVariantNumeric:'tabular-nums'}} />
              </div>
              <div style={{fontSize:'.68rem',color:'var(--t4)',marginBottom:16}}>Default {currency(baseDeposit,2)} · edit to scale all allocations proportionally</div>

              {empContrib > 0 && (
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--s2)',border:'1px solid var(--border2)',borderRadius:'var(--r-s)',padding:'10px 12px',marginBottom:16}}>
                  <div>
                    <div style={{fontSize:'.72rem',fontWeight:600,color:'var(--t2)'}}>401(k) this check</div>
                    <div style={{fontSize:'.66rem',color:'var(--t4)'}}>pre-tax · already withheld, scales with the amount above</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:'.82rem',fontWeight:700,color:'var(--purple)',fontVariantNumeric:'tabular-nums'}}>{currency(empContrib,2)}</div>
                    <div style={{fontSize:'.66rem',color:'var(--t4)'}}>+{currency(emprContrib,2)} match</div>
                  </div>
                </div>
              )}

              <div className="eyebrow" style={{marginBottom:4}}>This Check's Allocation</div>
              {scaledAlloc.map(a=>(
                <div key={a.key} className="alloc-row">
                  <span className="alloc-name">{a.label}</span>
                  <span className="alloc-val" style={{color:(a.key==='hysa'||a.key==='rothIRA')?'var(--accent)':'var(--t1)'}}>{currency(a.amount,2)}</span>
                </div>
              ))}
              {((parseFloat(payAmt)||0) - allocSum) > 0.005 && (
                <div className="alloc-row" style={{borderTop:'1px solid var(--border2)'}}>
                  <span className="alloc-name" style={{color:'var(--t3)'}}>Surplus → Checking</span>
                  <span className="alloc-val" style={{color:'var(--green)'}}>{currency((parseFloat(payAmt)||0)-allocSum,2)}</span>
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',marginTop:12,fontSize:'.82rem',fontWeight:700}}>
                <span style={{color:'var(--t2)'}}>Total Deposit</span>
                <span style={{color:'var(--green)',fontVariantNumeric:'tabular-nums'}}>{currency(parseFloat(payAmt)||0,2)}</span>
              </div>
            </div>
            <div style={{display:'flex',gap:10,padding:'0 22px 20px'}}>
              <button className="btn btn-ghost" style={{flex:1,justifyContent:'center'}} onClick={()=>setPayOpen(false)}>Cancel</button>
              <button className="btn btn-primary" style={{flex:1,justifyContent:'center'}} onClick={confirmPay}>Confirm Deposit</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Budget Tab ─────────────────────────────────────────────────────────
function Budget({ settings, transactions }) {
  const phase = getPhaseInfo(settings.startDate);
  // Default the toggle to whichever phase is currently active
  const [sel, setSel] = useState(phase.isFull ? 1 : 0);

  const now      = new Date();
  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  // Real spending categories route through the same shared classifier the
  // Financial Health card and Spending page use (refunds netted, duplicates
  // excluded, savings/retirement transfers never counted as spending), so
  // this page can never show a different "spent" figure for the same month.
  const monthTxAllForSpend = getFilteredTransactions(transactions, { month: monthStr });
  const catTotalsForSpend  = getCategorySpendingTotals(monthTxAllForSpend);
  const spent = {};
  for (const [cat, v] of Object.entries(catTotalsForSpend)) spent[cat] = v.total;
  // HYSA and Roth IRA are contribution lines, not spending, so the shared
  // classifier above always reports 0 for them (by design). Their "spent"
  // here is any hysa/rothIRA-categorized transaction logged this month PLUS
  // whatever this month's logged paychecks already withheld via allocations
  // — each reads its OWN key, not a shared 'savings' bucket, so a Roth IRA
  // contribution never shows up as HYSA spending or vice versa.
  spent.hysa    = monthlyContributionAmount(monthTxAllForSpend, 'hysa', 'hysa');
  spent.rothIRA = monthlyContributionAmount(monthTxAllForSpend, 'rothIRA', 'rothIRA');

  const eb = settings.earlyBudget;
  const lb = settings.laterBudget;

  // Split into two clearly separate sections — true expenses vs. saving &
  // investing — instead of one undifferentiated list. This is a render-only
  // grouping of the SAME per-category limits Spending/Insights already
  // read from settings.earlyBudget/laterBudget, so the two never disagree.
  const earlySpendRows = [
    { label:'Utilities & Fee',   limit:eb.utilitiesAndFee,  cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:eb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:eb.groceries,        cat:'groceries', icon:'cart',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Gas',               limit:eb.gas,              cat:'gas',       icon:'fuel',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Travel',            limit:eb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Dining',            limit:eb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Shopping',          limit:eb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'var(--wash-2)',iconClr:'#666'            },
  ];
  const earlySaveRows = [
    { label:'Roth IRA',          limit:eb.rothIRA,          cat:'rothIRA',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:eb.hysa,             cat:'hysa',      icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
  ];
  const laterSpendRows = [
    { label:'Rent & Fee',        limit:lb.rentAndFee,       cat:'housing',   icon:'home',    iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Utilities',         limit:lb.utilities,        cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:lb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:lb.groceries,        cat:'groceries', icon:'cart',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Gas',               limit:lb.gas,              cat:'gas',       icon:'fuel',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Travel',            limit:lb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Dining',            limit:lb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'var(--wash-2)',iconClr:'#666'            },
    { label:'Shopping',          limit:lb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'var(--wash-2)',iconClr:'#666'            },
  ];
  const laterSaveRows = [
    { label:'Roth IRA',          limit:lb.rothIRA,          cat:'rothIRA',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:lb.hysa,             cat:'hysa',      icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
  ];

  const spendRows = sel === 0 ? earlySpendRows : laterSpendRows;
  const saveRows  = sel === 0 ? earlySaveRows  : laterSaveRows;
  const expenseTotal  = spendRows.reduce((s,r)=>s+r.limit, 0);
  const savingsTotal  = saveRows.reduce((s,r)=>s+r.limit, 0);
  const total    = expenseTotal + savingsTotal;
  const takeHome = monthlyNetIncome(settings);
  const unallocated = round2(takeHome - total);
  const savingsRateForBudget = takeHome > 0 ? safePct(savingsTotal, takeHome) : 0;

  const isEarlyActive = phase.isEarly || phase.isPreEmployment;
  const isLaterActive = phase.isFull;
  const currentlyActive = sel===0 ? isEarlyActive : isLaterActive;

  // One row renderer shared by both sections — `kind` only changes the
  // wording ("spent"/"left"/"over" for real expenses vs. "contributed"/
  // "remaining" for saving & investing, which is never framed as "over
  // budget" since contributing more than planned isn't a problem).
  const budgetRow = (row, kind) => {
    const s   = spent[row.cat]||0;
    const rem = round2(row.limit - s);
    const over = kind==='spend' && rem < 0;
    return (
      <div key={row.label} className="b-row">
        <div className="b-left">
          <div className="b-icon" style={{background:row.iconBg}}>
            <Icon name={row.icon} size={16} color={row.iconClr} strokeWidth={1.7}/>
          </div>
          <div>
            <div className="b-name">{row.label}</div>
            {s > 0 && (
              <div style={{fontSize:'.68rem',marginTop:2,color:over?'var(--red)':'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
                {kind==='spend'
                  ? <>{currency(s)} spent · {over ? currency(Math.abs(rem))+' over' : currency(rem)+' left'}</>
                  : <>{currency(s)} contributed · {currency(Math.max(rem,0))} remaining</>}
              </div>
            )}
          </div>
        </div>
        <span className="b-amt">{currency(row.limit)}</span>
      </div>
    );
  };

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Budget</h2>
          <div className="page-sub">
            {sel===0 ? 'Rent-free months · Aug, Oct, Dec — HYSA accelerated' : 'Rent months · Jul, Sep, Nov'}
          </div>
        </div>
        {currentlyActive && <span className="badge badge-green">Active</span>}
      </div>

      {/* Phase toggle */}
      <div className="phase-pill-row">
        <button
          className={'phase-pill '+(sel===0?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(0)}
        >
          Rent-Free
          {isEarlyActive && sel!==0 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
        <button
          className={'phase-pill '+(sel===1?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(1)}
        >
          With Rent
          {isLaterActive && sel!==1 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
      </div>

      {/* Spending — true expenses only */}
      <div>
        <div className="section-head" style={{padding:0,marginBottom:10}}>Spending</div>
        <div className="card-flush">
          {spendRows.map(row => budgetRow(row, 'spend'))}
          <div className="b-total-row">
            <div className="b-total-lbl">Expense Budget</div>
            <div className="large-num" style={{color:'var(--t1)'}}>{currency(expenseTotal)}</div>
          </div>
        </div>
      </div>

      {/* Saving & Investing — contributions, never framed as "spending" */}
      <div>
        <div className="section-head" style={{padding:0,marginBottom:10}}>Saving &amp; Investing</div>
        <div className="card-flush">
          {saveRows.map(row => budgetRow(row, 'save'))}
          <div className="b-total-row">
            <div className="b-total-lbl">Saving &amp; Investing Total</div>
            <div className="large-num" style={{color:'var(--accent)'}}>{currency(savingsTotal)}</div>
          </div>
        </div>
      </div>

      {/* Monthly allocation summary — one authoritative total, unambiguous
          about what "assigned" means (expenses + saving & investing, out of
          take-home), instead of a bare "Monthly Total" that read like it
          might mean only expenses. */}
      <div className="card">
        <div className="card-label">Monthly Allocation</div>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:4}}>
          <div className="large-num" style={{color:'var(--t1)'}}>{currency(total)}</div>
          <div style={{fontSize:'.76rem',color:'var(--t3)'}}>of {currency(takeHome)} take-home</div>
        </div>
        {unallocated >= 0
          ? <div className="b-surplus">{currency(unallocated)} unallocated</div>
          : <div style={{fontSize:'.78rem',color:'var(--red)',fontWeight:600}}>{currency(Math.abs(unallocated))} over take-home</div>
        }
        <div className="g3" style={{marginTop:16}}>
          <div className="stat"><div className="stat-label">Expenses</div><div className="stat-val" style={{fontSize:'1.1rem'}}>{currency(expenseTotal)}</div></div>
          <div className="stat"><div className="stat-label">Saving &amp; Investing</div><div className="stat-val" style={{fontSize:'1.1rem',color:'var(--accent)'}}>{currency(savingsTotal)}</div></div>
          <div className="stat"><div className="stat-label">Savings Rate</div><div className="stat-val" style={{fontSize:'1.1rem',color:'var(--accent)'}}>{pct(savingsRateForBudget,0)}</div></div>
        </div>
      </div>

      {/* Quick info note */}
      <div style={{fontSize:'.72rem',color:'var(--t3)',textAlign:'center',marginTop:-8}}>
        {currency(takeHome)} take-home ({checksPerMonth(settings)} × {currency(netPerCheck(settings),2)}) · edit amounts in Settings
      </div>
    </div>
  );
}

// ── Spending ──────────────────────────────────────────────────────────
function Spending({ settings, transactions, setTransactions, goals, setGoals, accounts, setAccounts, netWorth, setNetWorth, openAddTx }) {
  const now   = new Date();
  const [viewMonth, setViewMonth] = useState({y:now.getFullYear(),m:now.getMonth()});
  const ctx = { accounts, settings, goals, netWorth, setGoals, setNetWorth, setAccounts, setTransactions };

  // ── Undo delete (Bonus) — deleting no longer needs a confirm() dialog;
  // it happens immediately and reversibly, with a few seconds to undo
  // before the toast clears and it's gone for real.
  const [undoTx, setUndoTx]     = useState(null);   // the just-deleted transaction, or null
  const undoTimerRef            = useRef(null);
  const dismissUndo = () => { clearTimeout(undoTimerRef.current); setUndoTx(null); };
  const handleUndo   = () => {
    if (!undoTx) return;
    restoreDeletedTransaction(undoTx, ctx);
    dismissUndo();
  };
  useEffect(() => () => clearTimeout(undoTimerRef.current), []);   // clear on unmount

  const monthStr  = `${viewMonth.y}-${String(viewMonth.m+1).padStart(2,'0')}`;
  const monthTx   = transactions.filter(t=>t.date.startsWith(monthStr));
  // Spending totals route through the same shared classifier (refunds
  // netted, duplicates excluded, savings/retirement/cc-payment transfers
  // never counted as spending) that the Financial Health card, Dashboard,
  // and Budget page all use — this page can never disagree with them.
  const monthTxAllForSpend = getFilteredTransactions(transactions, { month: monthStr });
  const catTotalsForSpend  = getCategorySpendingTotals(monthTxAllForSpend);
  const totalSpent = round2(Object.values(catTotalsForSpend).reduce((s,c)=>s+c.total,0));
  // "Spent" alone was ambiguous about what it did and didn't include — this
  // page now clearly distinguishes three separate things happening to the
  // user's money this month, matching what Home/Budget already track.
  // Saved & Invested = HYSA + Roth IRA contributions this month, counting
  // BOTH manually-logged hysa/rothIRA transactions AND whatever this
  // month's logged paychecks already withheld via allocations — the same
  // shared helper Home and Budget use, so this can never disagree with them.
  const hysaContribThisMonth = monthlyContributionAmount(monthTxAllForSpend, 'hysa', 'hysa');
  const rothContribThisMonth = monthlyContributionAmount(monthTxAllForSpend, 'rothIRA', 'rothIRA');
  const savedInvestedTotal = round2(hysaContribThisMonth + rothContribThisMonth);
  const incomeTotal = round2(monthTxAllForSpend
    .filter(isIncomeTransaction)
    .reduce((s,t) => s+safeNum(t.amount), 0));
  // Phase is based on the MONTH BEING VIEWED, not today — so each month is
  // compared against the right budget. Rent-free = pre-employment + Months 1-3
  // (with Start Date = Jul 1 2026 that is Jun/Jul/Aug/Sep 2026); rest = Month 4-12.
  const phase     = getPhaseInfo(settings.startDate, new Date(viewMonth.y, viewMonth.m, 1));
  const isRentFree= phase.isEarly || phase.isPreEmployment;
  const budget    = isRentFree ? settings.earlyBudget : settings.laterBudget;

  const byCategory = {};
  for (const [cat, v] of Object.entries(catTotalsForSpend)) byCategory[cat] = v.total;
  // HYSA and Roth IRA are contribution lines, not spending, so the shared
  // classifier above always reports 0 for them — reuse the same figures
  // savedInvestedTotal above already computed (manual contributions +
  // paycheck allocations), so this list can't disagree with that summary.
  byCategory.hysa    = hysaContribThisMonth;
  byCategory.rothIRA = rothContribThisMonth;

  // HYSA and Roth IRA are tracked as separate budget lines and separate
  // categories — never combined into one "Savings" bucket. Legacy 'savings'-
  // tagged transactions get no budget line here (lim=0 hides the bar) but
  // stay visible in the category list below via CATEGORIES' catch-all entry.
  const catBudget = isRentFree ? {
    housing:   budget.utilitiesAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilitiesAndFee||0,
    hysa:      budget.hysa||0,   rothIRA: budget.rothIRA||0, other:0,
  } : {
    housing:   budget.rentAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilities||0,
    hysa:      budget.hysa||0,   rothIRA: budget.rothIRA||0, other:0,
  };

  // Budget Rollover (Bonus) — walk back through however many prior months
  // have data (capped at 12, so a long-lived account doesn't scan its whole
  // history every render) and carry each category's (budget − spent) into
  // this month. Can go negative — overspending one month borrows from the
  // next, same as an envelope budget — but only for categories that
  // actually HAVE a budget line (lim=0 categories never accrue rollover).
  const rolloverByCat = useMemo(() => {
    if (!settings.budgetRollover) return {};
    const out = {};
    for (let back=1; back<=12; back++) {
      const d = new Date(viewMonth.y, viewMonth.m - back, 1);
      const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const mTx = transactions.filter(t=>t.date.startsWith(ms) && t.type==='expense');
      const mByCat = {};
      for (const t of mTx) mByCat[t.category] = (mByCat[t.category]||0) + safeNum(t.amount);
      const mPhase = getPhaseInfo(settings.startDate, d);
      const mIsRentFree = mPhase.isEarly || mPhase.isPreEmployment;
      const mBud = mIsRentFree ? settings.earlyBudget : settings.laterBudget;
      const mCatBudget = mIsRentFree ? {
        housing:mBud.utilitiesAndFee||0, groceries:mBud.groceries, gas:mBud.gas, dining:mBud.outToEat,
        shopping:mBud.shopping, travel:mBud.funTravel, utilities:mBud.utilitiesAndFee||0, other:0,
      } : {
        housing:mBud.rentAndFee||0, groceries:mBud.groceries, gas:mBud.gas, dining:mBud.outToEat,
        shopping:mBud.shopping, travel:mBud.funTravel, utilities:mBud.utilities||0, other:0,
      };
      for (const cat of Object.keys(mCatBudget)) {
        if (!mCatBudget[cat]) continue;
        out[cat] = round2((out[cat]||0) + mCatBudget[cat] - (mByCat[cat]||0));
      }
    }
    return out;
  }, [settings, transactions, viewMonth.y, viewMonth.m]);
  const effectiveCatBudget = settings.budgetRollover
    ? Object.fromEntries(Object.entries(catBudget).map(([k,v]) => [k, v>0 ? round2(v + (rolloverByCat[k]||0)) : v]))
    : catBudget;

  const totalBudget = Object.values(effectiveCatBudget).reduce((s,v)=>s+v, 0);
  // The header's "of $X budget" line must compare like with like — totalSpent
  // never includes HYSA/Roth IRA (they're not spending), so the budget total
  // it's measured against can't either, or "97% of budget used" would be
  // comparing a numerator that excludes savings to a denominator that
  // includes it.
  const expenseBudgetTotal = round2(Object.entries(effectiveCatBudget)
    .filter(([cat]) => cat!=='hysa' && cat!=='rothIRA')
    .reduce((s,[,v])=>s+v, 0));

  // Logging a HYSA or Roth IRA transaction here is a real contribution, so it
  // syncs the same goals balance the paycheck flow and Commission tracker
  // write to — one balance, fed from every place money can enter it. Paycheck
  // rows are category:'income' (never 'hysa'/'rothIRA'), so this never
  // double-counts the automatic per-paycheck allocation.
  const syncSavings = (category, amt, sign) => {
    if (category === 'hysa') {
      setGoals(g => ({ ...g, hysaBalance: round2(Math.max((g.hysaBalance||0) + sign*amt, 0)) }));
    } else if (category === 'rothIRA') {
      setGoals(g => ({ ...g, rothIRAOverride: round2(Math.max(currentRothBal(settings,g) + sign*amt, 0)) }));
    }
  };

  // Deleting reverses whichever bookkeeping added the transaction in the
  // first place — the new account-aware engine for anything logged through
  // the redesigned Add Transaction sheet (accountId present), or the legacy
  // HYSA/Roth sync for anything logged before that existed.
  const del = id => {
    const t = transactions.find(x=>x.id===id);
    if (!t) return;
    if (t.accountId) {
      deleteAccountAwareTransaction(t, ctx);
    } else {
      setTransactions(p=>p.filter(x=>x.id!==id));
      if (t.type === 'expense') syncSavings(t.category, safeNum(t.amount), -1);
    }
    // Only account-aware deletes can be undone (restoreDeletedTransaction
    // replays the same balance math) — legacy no-accountId rows still
    // delete instantly, same as before.
    if (t.accountId) {
      clearTimeout(undoTimerRef.current);
      setUndoTx(t);
      undoTimerRef.current = setTimeout(() => setUndoTx(null), 6000);
    }
  };
  const sorted = [...monthTx].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const monthLabel = new Date(viewMonth.y,viewMonth.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Categories that have either spending or a budget allocation — HYSA and
  // Roth IRA are excluded here on purpose: they're contribution lines, not
  // spending, and the Budget page already owns their "contributed/
  // remaining" progress with the right framing. Showing them again here,
  // in a list literally headed "By Category" spending, would either
  // re-introduce the "HYSA is your top spending category" bug or just
  // duplicate what Budget already shows.
  const activeCats = CATEGORIES.filter(c=>c.id!=='hysa' && c.id!=='rothIRA' && (byCategory[c.id]>0||effectiveCatBudget[c.id]>0));

  return (
    <div className="page">

      {undoTx && (
        <div className="undo-toast" role="status">
          <span>Deleted "{undoTx.description || catLabel(categoryOf(undoTx))}"</span>
          <button type="button" onClick={handleUndo}>Undo</button>
          <button type="button" className="undo-toast-x" aria-label="Dismiss" onClick={dismissUndo}><Icon name="x" size={13}/></button>
        </div>
      )}

      {/* Hero header — Spent stays primary (this page is about spending),
          but Saved & Invested and Income sit right beside it so the three
          are never confused for one number, matching Home/Budget. */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>Spent This Month</div>
          <div className="mega" style={{color:totalSpent>expenseBudgetTotal&&expenseBudgetTotal>0?'var(--red)':'var(--t1)'}}>
            {currency(totalSpent)}
          </div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {expenseBudgetTotal>0 ? `of ${currency(expenseBudgetTotal)} budget` : 'no budget yet'}
          </div>
        </div>
        <button className="add-btn" onClick={()=>openAddTx(null,null)}>
          <Icon name="plus" size={14} color="#000" strokeWidth={2.5}/>Add
        </button>
      </div>

      <div className="g2">
        <div className="stat">
          <div className="stat-label">Saved &amp; Invested</div>
          <div className="stat-val" style={{fontSize:'1.2rem',color:'var(--accent)'}}>{currency(savedInvestedTotal)}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Income</div>
          <div className="stat-val" style={{fontSize:'1.2rem'}}>{currency(incomeTotal)}</div>
        </div>
      </div>

      {/* Month nav */}
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})}>
          <Icon name="chevronLeft" size={14} color="var(--t2)"/>
        </button>
        <div className="month-name">{monthLabel}</div>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1})}>
          <Icon name="chevronRight" size={14} color="var(--t2)"/>
        </button>
      </div>

      {/* Category bars */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>By Category</div>
        <div className="card-flush">
          {activeCats.length === 0
            ? <p className="empty">No expenses logged yet.</p>
            : activeCats.map(cat => {
                const s    = byCategory[cat.id]||0;
                const lim  = effectiveCatBudget[cat.id]||0;
                const roll = settings.budgetRollover ? (rolloverByCat[cat.id]||0) : 0;
                const p_  = lim>0 ? Math.min((s/lim)*100,100) : 0;
                const cls = p_>=100?'over':p_>=80?'warn':'';
                return (
                  <div key={cat.id} className="sp-cat">
                    <div className="sp-top">
                      <span className="sp-name">
                        {cat.label}
                        {roll !== 0 && <span style={{fontSize:'.6rem',fontWeight:600,marginLeft:6,color:roll>0?'var(--accent)':'var(--red)'}}>{roll>0?'+':'−'}{currency(Math.abs(roll))} rolled</span>}
                      </span>
                      <span className="sp-nums">
                        <span className="sp-spent">{currency(s)}</span>
                        {lim>0 && <span className="sp-bgt"> / {currency(lim)}</span>}
                      </span>
                    </div>
                    {lim>0 && (
                      <div className="bar" role="progressbar" aria-label={`${cat.label} spent`} aria-valuenow={s} aria-valuemin={0} aria-valuemax={lim}>
                        <div className={`bar-in ${cls}`} style={{width:`${p_||0}%`}}/>
                      </div>
                    )}
                  </div>
                );
              })
          }
        </div>
      </div>

      {/* Transaction list */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>
          Transactions {sorted.length>0 && <span style={{color:'var(--t4)',marginLeft:6}}>({sorted.length})</span>}
        </div>
        <div className="card-flush">
          {sorted.length===0
            ? <p className="empty">No transactions this month.</p>
            : <div className="tx-list">
                {sorted.map(t=>{
                  // Every row's icon, amount color, and type label come from
                  // one shared read of the transaction's kind — a savings or
                  // investment contribution (or an internal transfer) is
                  // never colored the same red as a real expense just
                  // because money left the account (PRD §10).
                  const info = txKindInfo(t);
                  return (
                    <SwipeableRow key={t.id} onDelete={()=>del(t.id)} deleteLabel={`Delete ${t.description||'transaction'}`}>
                      <div className="tx-row">
                        {info.icon
                          ? <div className="tx-icon"><Icon name={info.icon} size={14} color={info.color}/></div>
                          : <MerchantLogo description={t.description}/>}
                        <div className="tx-body">
                          <div className="tx-desc">
                            {t.description}
                            {t.receiptImage && <Icon name="receipt" size={11} color="var(--t4)"/>}
                          </div>
                          <div className="tx-meta">
                            {catLabel(t.category)} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
                            {info.label!=='Expense' && <> · <span style={{color:info.color}}>{info.label}</span></>}
                            {t.splitGroupId && ` · split ${t.splitIndex+1}/${t.splitCount}`}
                          </div>
                          {t.tags && t.tags.length > 0 && (
                            <div className="tx-tags">{t.tags.map(tg => <span key={tg} className="tx-tag">#{tg}</span>)}</div>
                          )}
                        </div>
                        <div className="tx-amt" style={{color:info.color}}>
                          {info.sign}{currency(t.amount)}
                        </div>
                        <button className="tx-del btn-icon-del" onClick={()=>del(t.id)} aria-label={`Delete ${t.description||'transaction'}`}>×</button>
                      </div>
                    </SwipeableRow>
                  );
                })}
              </div>
          }
        </div>
      </div>

    </div>
  );
}

// ── Goals ─────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════
// CUSTOM GOALS (Priority 16) — Emergency Fund, Vacation, Car, House,
// Wedding, Investments, Debt Payoff, or anything else, alongside the
// built-in HYSA/Roth/401(k) cards above. Either tracked by hand or linked
// to a real account balance (never a second number competing with it).
// ══════════════════════════════════════════════════════════════════════
const GOAL_CATEGORIES = [
  { id:'emergency',  label:'Emergency Fund', icon:'shield',     color:'#00C805' },
  { id:'vacation',   label:'Vacation',       icon:'plane',      color:'#06b6d4' },
  { id:'car',        label:'Car',            icon:'car',        color:'#F5A623' },
  { id:'house',      label:'House',          icon:'bank',       color:'#7B74FF' },
  { id:'wedding',    label:'Wedding',        icon:'zap',        color:'#ec4899' },
  { id:'investment', label:'Investments',    icon:'trending',   color:'#3b82f6' },
  { id:'debt',       label:'Debt Payoff',    icon:'creditCard', color:'#FF5000' },
  { id:'other',      label:'Other',          icon:'target',     color:'#94a3b8' },
];
const goalCategoryInfo = id => GOAL_CATEGORIES.find(c => c.id===id) || GOAL_CATEGORIES[GOAL_CATEGORIES.length-1];
function defaultCustomGoalFields() {
  return { id:'', name:'', category:'other', targetAmount:0, currentAmount:0, accountId:null,
    monthlyContribution:0, targetDate:'', notes:'', createdAt:Date.now(), celebrated:false };
}
function goalProgress(goal, ctx) {
  const linkedAcct = goal.accountId ? (ctx.accounts||[]).find(a => a.id===goal.accountId) : null;
  const current = linkedAcct ? accountBalance(linkedAcct, ctx) : safeNum(goal.currentAmount);
  const target  = safeNum(goal.targetAmount);
  const pct     = target > 0 ? Math.min((current/target)*100, 100) : 0;
  const remaining = Math.max(round2(target-current), 0);
  const rate = safeNum(goal.monthlyContribution);
  const monthsLeft = rate > 0 && remaining > 0 ? Math.ceil(remaining/rate) : null;
  let projectedDate = null;
  if (monthsLeft != null) { projectedDate = new Date(); projectedDate.setMonth(projectedDate.getMonth()+monthsLeft); }
  return { current, target, pct, remaining, monthsLeft, projectedDate, complete: target > 0 && current >= target, linkedAcct };
}
// Straight-line projection from today's balance at the current monthly
// contribution rate — the same "keep doing what you're doing" forecast
// the Cash Flow Forecast uses, just for one goal instead of three buckets.
function goalForecastSeries(goal, ctx, months=12) {
  const { current, target } = goalProgress(goal, ctx);
  const rate = safeNum(goal.monthlyContribution);
  const labels = [], points = [];
  const today = new Date();
  for (let i=0; i<=months; i++) {
    const d = new Date(today.getFullYear(), today.getMonth()+i, 1);
    labels.push(`${MONTH_NAMES[d.getMonth()].slice(0,3)} '${String(d.getFullYear()).slice(2)}`);
    points.push(Math.min(round2(current + rate*i), target > 0 ? target : Infinity));
  }
  return { labels, points };
}
function Confetti() {
  const pieces = useMemo(() => Array.from({length:26}, (_,i) => ({
    id:i, left: Math.random()*100, delay: Math.random()*0.35, color: VIZ_SERIES[i % VIZ_SERIES.length],
  })), []);
  return (
    <div className="confetti" aria-hidden="true">
      {pieces.map(p => <span key={p.id} className="confetti-piece" style={{ left:`${p.left}%`, background:p.color, animationDelay:`${p.delay}s` }}/>)}
    </div>
  );
}
function GoalFormModal({ onClose, onSave, onDelete, accounts, goal }) {
  const g = goal || defaultCustomGoalFields();
  const [name, setName]       = useState(g.name);
  const [category, setCategory] = useState(g.category);
  const [targetAmount, setTargetAmount] = useState(g.targetAmount ? String(g.targetAmount) : '');
  const [currentAmount, setCurrentAmount] = useState(g.currentAmount ? String(g.currentAmount) : '');
  const [accountId, setAccountId] = useState(g.accountId || '');
  const [monthlyContribution, setMonthlyContribution] = useState(g.monthlyContribution ? String(g.monthlyContribution) : '');
  const [targetDate, setTargetDate] = useState(g.targetDate || '');
  const [notes, setNotes]     = useState(g.notes || '');

  const linkable = (accounts||[]).filter(a => !a.archived && a.type !== 'credit');
  const valid = name.trim() && parseFloat(targetAmount) > 0;

  const save = () => {
    if (!valid) return;
    onSave({
      ...g, id: g.id || ('goal_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      name: name.trim(), category, targetAmount: round2(parseFloat(targetAmount)||0),
      currentAmount: round2(parseFloat(currentAmount)||0), accountId: accountId || null,
      monthlyContribution: round2(parseFloat(monthlyContribution)||0), targetDate, notes: notes.trim(),
      celebrated: g.celebrated || false,
    });
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">{goal ? 'Edit Goal' : 'Add Goal'}</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          <div className="fgrid">
            <div className="fg fspan"><label>Goal Name</label>
              <input type="text" placeholder="e.g. Hawaii Trip, New Car, Payoff Student Loan" value={name} onChange={e=>setName(e.target.value)} autoFocus/>
            </div>
            <div className="fg"><label>Category</label>
              <select value={category} onChange={e=>setCategory(e.target.value)}>
                {GOAL_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </div>
            <div className="fg"><label>Target Amount</label>
              <input type="number" min="0" step="1" placeholder="0.00" value={targetAmount} onChange={e=>setTargetAmount(e.target.value)}/>
            </div>
            <div className="fg"><label>Link to Account (optional)</label>
              <select value={accountId} onChange={e=>setAccountId(e.target.value)}>
                <option value="">Track manually</option>
                {linkable.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            {!accountId && (
              <div className="fg"><label>Current Amount</label>
                <input type="number" min="0" step="1" placeholder="0.00" value={currentAmount} onChange={e=>setCurrentAmount(e.target.value)}/>
              </div>
            )}
            <div className="fg"><label>Monthly Contribution</label>
              <input type="number" min="0" step="1" placeholder="0.00" value={monthlyContribution} onChange={e=>setMonthlyContribution(e.target.value)}/>
            </div>
            <div className="fg"><label>Target Date (optional)</label>
              <input type="date" value={targetDate} onChange={e=>setTargetDate(e.target.value)}/>
            </div>
            <div className="fg fspan"><label>Notes</label>
              <input type="text" placeholder="Optional" value={notes} onChange={e=>setNotes(e.target.value)}/>
            </div>
          </div>
          <button className="btn btn-primary btn-full" disabled={!valid} onClick={save}>{goal ? 'Save Changes' : 'Add Goal'}</button>
          {goal && onDelete && (
            <button className="btn btn-ghost btn-full" style={{color:'var(--red)'}}
              onClick={()=>{ if(window.confirm(`Delete "${g.name}"?`)){ onDelete(g.id); onClose(); } }}>
              Delete Goal
            </button>
          )}
        </div>
      </div>
    </div>
  );
}
function CustomGoalCard({ goal, ctx, onEdit, onContribute }) {
  const info = goalCategoryInfo(goal.category);
  const progress = goalProgress(goal, ctx);
  const [showCelebrate, setShowCelebrate] = useState(false);
  const wasComplete = useRef(goal.celebrated);
  useEffect(() => {
    if (progress.complete && !wasComplete.current) {
      setShowCelebrate(true);
      wasComplete.current = true;
      onContribute && onContribute({ ...goal, celebrated:true }, true);   // stamp so it never replays
      const t = setTimeout(()=>setShowCelebrate(false), 1800);
      return () => clearTimeout(t);
    }
    if (!progress.complete) wasComplete.current = false;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [progress.complete]);

  const forecast = goalForecastSeries(goal, ctx, 12);
  const [showForecast, setShowForecast] = useState(false);

  return (
    <div className="gc gc-relative">
      {showCelebrate && <Confetti/>}
      <div className="gc-head">
        <div>
          <div className="gc-name" style={{display:'flex',alignItems:'center',gap:8}}>
            <Icon name={info.icon} size={15} color={info.color}/>{goal.name}
          </div>
          <div className="gc-sub">{info.label}{progress.linkedAcct ? ` · ${progress.linkedAcct.name}` : ''}</div>
        </div>
        <div>
          <div className="gc-pct" style={{color:info.color}}>{pct(progress.pct,0)}</div>
          <div className="gc-of">{currency(progress.current)} of {currency(progress.target)}</div>
        </div>
      </div>
      <div className="gc-bar"><div className="gc-fill" style={{width:`${progress.pct}%`,background:info.color}}/></div>
      <div className="gc-foot">
        <span className="gc-rate">{progress.remaining>0 ? `${currency(progress.remaining)} remaining` : 'Fully funded'}</span>
        <span className="gc-date">
          {progress.complete ? '🎉 Goal reached!'
            : progress.projectedDate ? `${progress.projectedDate.toLocaleDateString('en-US',{month:'short',year:'numeric'})} · ${progress.monthsLeft}mo`
            : 'Set a monthly contribution to project'}
        </span>
      </div>
      <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
        {!progress.linkedAcct && (
          <button className="btn btn-ghost btn-sm" onClick={()=>{
            const v = window.prompt('Add a contribution amount:', '');
            const amt = parseFloat(v);
            if (amt > 0) onContribute({ ...goal, currentAmount: round2(safeNum(goal.currentAmount)+amt) });
          }}>+ Add Contribution</button>
        )}
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowForecast(s=>!s)}>{showForecast?'Hide':'Show'} Forecast</button>
        <button className="btn btn-ghost btn-sm" onClick={onEdit}><Icon name="edit" size={12}/> Edit</button>
      </div>
      <Collapse open={showForecast}>
        <div style={{marginTop:14}}>
          {progress.monthsLeft==null ? <VizEmpty message="Set a monthly contribution to see a forecast." /> :
            <LineTrendChart labels={forecast.labels} formatY={v=>currency(v)}
              series={[{ key:'g', label:goal.name, color:info.color, points:forecast.points }]}/>}
        </div>
      </Collapse>
    </div>
  );
}
