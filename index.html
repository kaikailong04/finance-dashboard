// ── Commission ─────────────────────────────────────────────────────────
function Commission({ settings, commissions, setCommissions, setGoals }) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:new Date().toISOString().split('T')[0],amount:'',note:''});
  const hysaPct=settings.commissionHYSAPct/100;
  const personalPct=settings.commissionPersonalPct/100;
  const preview=form.amount&&!isNaN(parseFloat(form.amount))?{hysa:parseFloat(form.amount)*hysaPct,personal:parseFloat(form.amount)*personalPct}:null;

  const handleAdd=e=>{
    e.preventDefault();const amt=parseFloat(form.amount);
    if(!amt||isNaN(amt))return;
    const hysaAdd=+(amt*hysaPct).toFixed(2);
    setCommissions(prev=>[{id:String(Date.now()),date:form.date,amount:amt,note:form.note.trim(),hysaPortion:hysaAdd,personalPortion:+(amt*personalPct).toFixed(2)},...prev]);
    // 60% HYSA split flows into the Emergency Fund balance (syncs Goals + Net Worth)
    setGoals(g=>({...g,hysaBalance:+(((g.hysaBalance||0)+hysaAdd)).toFixed(2)}));
    setForm(f=>({...f,amount:'',note:''}));setShowForm(false);
  };
  const del=id=>{
    if(!window.confirm('Delete this commission?'))return;
    const c=commissions.find(x=>x.id===id);
    setCommissions(p=>p.filter(t=>t.id!==id));
    if(c) setGoals(g=>({...g,hysaBalance:+(Math.max((g.hysaBalance||0)-(c.hysaPortion||0),0)).toFixed(2)}));
  };
  const sorted=[...commissions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=commissions.reduce((s,c)=>s+c.amount,0);
  const totHYSA=commissions.reduce((s,c)=>s+c.hysaPortion,0);
  const totPers=commissions.reduce((s,c)=>s+c.personalPortion,0);

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Commission</h2>
          <div className="page-sub">Log and split your commissions</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'Cancel':'+ Log'}</button>
      </div>

      <div className="split-banner">
        <div className="split-pill split-hysa">{settings.commissionHYSAPct}% HYSA</div>
        <div className="split-div">+</div>
        <div className="split-pill split-personal">{settings.commissionPersonalPct}% Personal</div>
        <div style={{marginLeft:'auto',fontSize:'.68rem',color:'var(--t3)'}}>Auto-split on every payment</div>
      </div>

      <div className="g3">
        <div className="stat">
          <div className="stat-label">Total Earned</div>
          <div className="stat-val">{currency(total)}</div>
          <div className="stat-sub">{commissions.length} payments</div>
        </div>
        <div className="stat stat-green">
          <div className="stat-label">To HYSA</div>
          <div className="stat-val">{currency(totHYSA)}</div>
          <div className="stat-sub">{settings.commissionHYSAPct}%</div>
        </div>
        <div className="stat stat-blue">
          <div className="stat-label">Personal</div>
          <div className="stat-val">{currency(totPers)}</div>
          <div className="stat-sub">{settings.commissionPersonalPct}%</div>
        </div>
      </div>

      {showForm&&(
        <div className="card form-card">
          <div className="card-label">New Payment</div>
          <form onSubmit={handleAdd}>
            <div className="fgrid">
              <div className="fg"><label>Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} required /></div>
              <div className="fg"><label>Gross Amount</label><input type="number" step="0.01" min="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} required /></div>
              <div className="fg fspan"><label>Note</label><input type="text" placeholder="Deal name, pay period…" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} /></div>
              {preview&&(
                <div className="fspan" style={{display:'flex',gap:8}}>
                  <span className="badge badge-green">HYSA +{currency(preview.hysa,2)}</span>
                  <span className="badge badge-blue">Personal +{currency(preview.personal,2)}</span>
                </div>
              )}
              <div className="factions">
                <button type="button" className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      )}

      <div>
        <div className="slabel">History ({commissions.length})</div>
        <div className="card" style={{padding:'4px 24px 8px'}}>
          {sorted.length===0?<p className="empty">No commissions logged yet.</p>:sorted.map(c=>(
            <div key={c.id} className="comm-row">
              <div style={{flex:1}}>
                <div className="comm-amt">{currency(c.amount,2)}</div>
                {c.note?<div className="comm-note">{c.note}</div>:<div className="comm-note" style={{color:'var(--t4)'}}>No note</div>}
                <div className="comm-date">{new Date(c.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
              </div>
              <div className="comm-splits">
                <span className="comm-s comm-s-green">+{currency(c.hysaPortion,2)} HYSA</span>
                <span className="comm-s comm-s-blue">+{currency(c.personalPortion,2)} Personal</span>
              </div>
              <button className="btn-icon btn-icon-del" onClick={()=>del(c.id)}>×</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Isolated input: holds its own string state so typing never re-renders
// the parent Settings component (stops mobile keyboard from dismissing).
function SettingsInput({ value, onCommit, type='number', prefix, extraStyle, id, name }) {
  const [str, setStr] = useState(String(value ?? ''));
  // Sync if the committed value changes underneath us (e.g. Reset button)
  useEffect(() => { setStr(String(value ?? '')); }, [value]);
  // Commit the input's OWN value, not `str`. setStr from onChange is async, so
  // if a keystroke and the blur land in the same tick (paste, or tapping Save
  // right after typing) `str` is still the previous value and the edit is lost.
  const commit = e => onCommit(e && e.target ? e.target.value : str);
  return (
    <div style={{position:'relative'}}>
      {prefix && (
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
          color:'var(--t3)',fontSize:'.78rem',pointerEvents:'none'}}>{prefix}</span>
      )}
      <input
        id={id}
        name={name}
        type={type==='number' ? 'text' : type}
        inputMode={type==='number' ? 'decimal' : undefined}
        value={str}
        style={{...(prefix ? {paddingLeft:22} : {}), ...extraStyle}}
        onChange={e => setStr(e.target.value)}
        onBlur={commit}
        onKeyDown={e => e.key==='Enter' && e.target.blur()}
      />
    </div>
  );
}

// Declared at module scope ON PURPOSE. When this lived inside Settings() it was
// a brand-new component type on every render, so React unmounted and remounted
// every input after each commit — which dropped the edit you were part-way
// through and bounced focus. Keeping the type stable keeps each field's state
// (and the caret) intact. `name` is unique per scenario+key, so the two
// scenarios' Roth/HYSA inputs are distinct controls.
function SettingField({ label, name, val, type='number', prefix='$', onCommit, hint }) {
  return (
    <div className="settings-group">
      <label htmlFor={name}>{label}</label>
      <SettingsInput
        id={name} name={name} value={val} type={type} prefix={prefix} onCommit={onCommit}
      />
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

// Read-only derived figure — shown so the schedule math is visible but not
// editable (it is computed from the per-paycheck amount).
function SettingDerived({ label, value, hint }) {
  return (
    <div className="settings-group">
      <label>{label}</label>
      <div style={{padding:'9px 12px',border:'1px solid var(--border)',borderRadius:'var(--r-s)',
        background:'rgba(255,255,255,.02)',color:'var(--t2)',fontSize:'.82rem',
        fontVariantNumeric:'tabular-nums'}}>{value}</div>
      {hint && <div style={{fontSize:'.62rem',color:'var(--t4)',marginTop:4}}>{hint}</div>}
    </div>
  );
}

function Settings({ settings, setSettings }) {
  const [local,setLocal]=useState(settings);
  const [saved,setSaved]=useState(false);
  // Mirrors `local` SYNCHRONOUSLY. Tapping Save blurs the field you were in, so
  // its commit and the click land in the same tick — reading `local` there would
  // save the value from the previous render and silently drop that last edit.
  const localRef=useRef(settings);
  useEffect(()=>{setLocal(settings);localRef.current=settings;},[settings]);

  const commitLocal=next=>{localRef.current=next;setLocal(next);};
  // Immutable updates off the ref, so consecutive edits compose instead of
  // clobbering each other. Writing one scenario always preserves the other.
  const set   =(k,v)=>commitLocal({...localRef.current,[k]:typeof v==='string'?parseFloat(v)||0:v});
  const setStr=(k,v)=>commitLocal({...localRef.current,[k]:v});
  const setBud=(p,k,v)=>commitLocal({
    ...localRef.current,
    [p]:{...localRef.current[p],[k]:parseFloat(v)||0},
  });

  const handleSave=e=>{e.preventDefault();setSettings(localRef.current);setSaved(true);setTimeout(()=>setSaved(false),2500);};
  // Clone — handing out DEFAULT_SETTINGS itself would let later edits mutate
  // the module-level defaults that every scenario is seeded from.
  const handleReset=()=>{if(window.confirm('Reset all settings to defaults?'))commitLocal(cloneDeep(DEFAULT_SETTINGS));};

  const eb=local.earlyBudget||{};
  const lb=local.laterBudget||{};

  // Props builders. These return plain props for the stable <SettingField>;
  // they must NOT define a component (see the note on SettingField).
  const fld    = (sk,label,extra={}) => ({ label, name:sk, val:local[sk], onCommit:v=>(extra.type==='date'?setStr(sk,v):set(sk,v)), ...extra });
  // Scenario field — `name` is namespaced so "earlyBudget.rothIRA" and
  // "laterBudget.rothIRA" are separate controls writing separate state.
  const budFld = (phase,sk,label,extra={}) => ({
    label, name:`${phase}.${sk}`,
    val:(phase==='earlyBudget'?eb:lb)[sk],
    onCommit:v=>setBud(phase,sk,v), ...extra,
  });
  const earlyTotal=(eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0);
  const laterTotal=(lb.rentAndFee||0)+(lb.utilities||0)+(lb.rentersInsurance||0)+(lb.rothIRA||0)+(lb.hysa||0)+(lb.groceries||0)+(lb.gas||0)+(lb.funTravel||0)+(lb.outToEat||0)+(lb.shopping||0);
  const localNet=monthlyNetIncome(local);
  const earlyRem=localNet-earlyTotal;
  const laterRem=localNet-laterTotal;

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Settings</h2>
          <div className="page-sub">Income, budgets, and limits</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {saved&&<span className="badge badge-green">Saved</span>}
          <button type="button" className="btn btn-ghost" onClick={handleReset}>Reset</button>
        </div>
      </div>

      <form onSubmit={handleSave} style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="card">
          <div className="card-label">Income &amp; Paycheck Schedule</div>
          <div className="settings-grid">
            <SettingField {...fld('netPerPaycheck','Net per Paycheck')}
              hint="Take-home, already net of the 401(k) deduction" />
            <SettingField {...fld('paychecksPerMonth','Paychecks / Month')} prefix="" />
            <SettingField {...fld('paychecksPerYear','Paychecks / Year')} prefix="" />
            <SettingDerived label="Monthly Take-Home"
              value={currency(monthlyNetIncome(local),2)}
              hint={`${checksPerMonth(local)} × ${currency(netPerCheck(local),2)} · 1st & 3rd Thursday`} />
            <SettingDerived label="Annual Take-Home"
              value={currency(annualNetIncome(local),2)}
              hint={`${checksPerYear(local)} paychecks / year`} />
            <SettingField {...fld('grossBase','Base Monthly (gross)')} />
            <SettingField {...fld('grossOTE','OTE Monthly (gross)')} />
            <SettingField {...fld('federalTax','Tax + FICA / mo')} />
            <SettingField {...fld('startDate','Start Date',{type:'date',prefix:''})} />
          </div>
        </div>

        <div className="card">
          <div className="card-label">401(k)</div>
          <div className="settings-grid">
            <SettingField {...fld('employee401kPerPaycheck','Employee / Paycheck')}
              hint="Withheld before your net paycheck — not deducted again" />
            <SettingDerived label="Employee / Month"
              value={currency(round2(employee401kPerCheck(local)*checksPerMonth(local)),2)} />
            <SettingDerived label="Employee / Year"
              value={currency(round2(employee401kPerCheck(local)*checksPerYear(local)),2)} />
            <SettingField {...fld('employerMatchRate','Employer Match Rate')} prefix="×"
              hint="0.5 = employer matches 50% of your contribution" />
            <SettingField {...fld('employerMatchPct','Match Applies To First')} prefix="%" />
            <SettingField {...fld('employerMatchAnnualCap','Employer Annual Cap')}
              hint="Hard ceiling per calendar year; resets Jan 1" />
            <SettingDerived label="Employer / Paycheck"
              value={currency(employerMatchForPaycheck(local, employee401kPerCheck(local), 0),2)} />
            <SettingDerived label="Projected Match / Year"
              value={currency(Math.min(
                round2(employerMatchForPaycheck(local, employee401kPerCheck(local), 0)*checksPerYear(local)),
                local.employerMatchAnnualCap || Infinity),2)}
              hint={`Capped at ${currency(local.employerMatchAnnualCap||0)}`} />
            <SettingField {...fld('contribution401kStart','Contributions Start',{type:'date',prefix:''})} />
          </div>
        </div>

        <div className="card">
          <div className="card-label">Commission Split</div>
          <div className="settings-grid">
            <SettingField {...fld('commissionHYSAPct','HYSA %')} prefix="%" />

        </div>

        <div className="card">

            <SettingField {...budFld('earlyBudget','utilitiesAndFee','Utilities & Fee')} />

            <SettingField {...budFld('earlyBudget','hysa','HYSA')} hint="Cash savings" />
            <SettingField {...budFld('earlyBudget','groceries','Groceries')} />
            <SettingField {...budFld('earlyBudget','gas','Gas')} />
            <SettingField {...budFld('earlyBudget','funTravel','Travel')} />

          </div>
          <div style={{fontSize:'.66rem',color:'var(--t4)',marginTop:-8,marginBottom:12}}>

          <div className="settings-grid">

function HBar({ label, value, max, color }) {
  const w = max > 0 ? Math.min((value/max)*100,100) : 0;
  return (
    <div className="hbar-row">
      <div className="hbar-label">{label}</div>
      <div className="hbar-track"><div className="hbar-fill" style={{width:`${w}%`,background:color}} /></div>
      <div className="hbar-val">{currency(value)}</div>
    </div>
  );
}

function SvgLine({ history }) {
  if (history.length < 2) return (
    <div className="chart-wrap" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:100}}>
      <span style={{color:'var(--t3)',fontSize:'.75rem'}}>Save 2+ monthly snapshots to see the trend</span>
    </div>
  );

  // Layout constants
  const VW=560, VH=160, PL=58, PR=10, PT=10, PB=32;
  const IW = VW-PL-PR, IH = VH-PT-PB;

  const vals = history.map(h=>h.netWorth);
  const rawMin = Math.min(...vals);
  const rawMax = Math.max(...vals);
  // Always include 0 so the zero line is visible
  const minV = Math.min(rawMin, 0);
  const maxV = Math.max(rawMax, 0) || 1;
  const range = maxV - minV || 1;

  const toX = i  => PL + (history.length > 1 ? (i/(history.length-1)) : 0.5) * IW;
  const toY = v  => PT + IH - ((v - minV) / range) * IH;

  const pts = history.map((h,i) => ({ x:toX(i), y:toY(h.netWorth), month:h.month, val:h.netWorth }));
  const lineStr  = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const fillStr  = `${pts[0].x},${toY(0)} ${lineStr} ${pts[pts.length-1].x},${toY(0)}`;

  const up = vals[vals.length-1] >= vals[0];
  const stroke   = up ? '#22c55e' : '#ef4444';
  const fillClr  = up ? 'rgba(34,197,94,.08)' : 'rgba(239,68,68,.08)';

  // Y-axis: 3 evenly spaced labels
  const yTicks = [maxV, (maxV+minV)/2, minV];
  const fmtY = v => {
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1000000) return `${sign}$${(abs/1000000).toFixed(1)}M`;
    if (abs >= 1000)    return `${sign}$${(abs/1000).toFixed(0)}k`;
    return `${sign}$${abs.toFixed(0)}`;
  };

  // X-axis labels — skip every other if crowded
  const fmtX = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short'})+" '"+String(+y).slice(2);
  };

  // Zero line (only if range spans positive and negative)
  const showZero = minV < 0 && maxV > 0;

  return (
    <div className="chart-wrap">
      <svg viewBox={`0 0 ${VW} ${VH}`} style={{width:'100%',display:'block'}}>
        {/* Horizontal grid lines at each y-tick */}
        {yTicks.map((v,i) => (
          <line key={i} x1={PL} y1={toY(v)} x2={VW-PR} y2={toY(v)}
            stroke="#222" strokeWidth="1" strokeDasharray="3,5" />
        ))}
        {/* Zero line (bolder when range crosses zero) */}
        {showZero && (
          <line x1={PL} y1={toY(0)} x2={VW-PR} y2={toY(0)}
            stroke="#3f3f46" strokeWidth="1.5" />
        )}
        {/* Y-axis labels */}
        {yTicks.map((v,i) => (
          <text key={i} x={PL-6} y={toY(v)+5} textAnchor="end"
            fill="#52525b" fontSize="17" fontFamily="Inter,system-ui,sans-serif">
            {fmtY(v)}
          </text>
        ))}
        {/* Fill area */}
        <polygon points={fillStr} fill={fillClr} />
        {/* Line */}
        <polyline points={lineStr} fill="none" stroke={stroke} strokeWidth="2" />
        {/* Dots */}
        {pts.map((p,i) => (
          <circle key={i} cx={p.x} cy={p.y} r="4.5" fill={stroke} />
        ))}
        {/* X-axis labels */}
        {pts.map((p,i) => {
          if (history.length > 8 && i % 2 !== 0) return null;
          const anchor = i===0 ? 'start' : i===pts.length-1 ? 'end' : 'middle';
          return (
            <text key={i} x={p.x} y={VH-4} textAnchor={anchor}
              fill="#52525b" fontSize="17" fontFamily="Inter,system-ui,sans-serif">
              {fmtX(p.month)}
            </text>
          );
        })}
      </svg>
    </div>
  );
}

function NetWorth({ netWorth, setNetWorth, transactions, goals, setGoals, settings }) {
  const acc  = netWorth.accounts || {};
  const hist = netWorth.history  || [];

  // Balances — HYSA / Roth / 401k come from fd_goals (single source of truth).
  // Each account stays its own category: HYSA is cash savings, Roth is
  // retirement investments, and the 401(k) is split employee vs employer.
  const hysaBal  = goals.hysaBalance   || 0;
  const rothBal  = goals.rothIRAOverride != null ? goals.rothIRAOverride : 0;
  const k401Emp  = goals.k401Employee  || 0;
  const k401Empr = goals.k401Employer  || 0;
  const k401Bal  = round2(k401Emp + k401Empr);          // derived, not editable

  const setHYSA = v => setGoals(g => ({ ...g, hysaBalance:     v }));
  const setRoth = v => setGoals(g => ({ ...g, rothIRAOverride: v }));
  const set401kEmp  = v => setGoals(g => ({ ...g, k401Employee: v, ira401kBalance: round2(v + (g.k401Employer||0)) }));
  const set401kEmpr = v => setGoals(g => ({ ...g, k401Employer: v, ira401kBalance: round2((g.k401Employee||0) + v) }));
  const setAcc  = (key, val) => setNetWorth(s => ({ ...s, accounts: { ...s.accounts, [key]: val } }));

  // Net worth is computed from STORED BALANCES ONLY. Contribution history
  // (paycheck 401(k) rows, HYSA allocations) explains how these balances grew —
  // adding it on top of the balances would double-count, so it never is.
  const snap        = getNetWorthSnapshot(acc, goals);
  const totalAssets = snap.assets;
  const totalLiab   = snap.liabilities;
  const nw          = snap.netWorth;
  const isPos       = nw >= 0;

  // Snapshot logic
  const now      = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const hasMonth = hist.some(h => h.month === monthKey);
  const [nwRange, setNwRange] = useState(12);

  const saveSnapshot = () => {
    // Records the composition too, so the trend can show cash vs retirement.
    const entry = {
      month:monthKey, netWorth:nw, assets:totalAssets, liabilities:totalLiab,
      cash:snap.cash, retirement:snap.retirement, other:snap.other,
    };
    setNetWorth(s => ({
      ...s,
      history: [...(s.history||[]).filter(h=>h.month!==monthKey), entry]
        .sort((a,b) => a.month.localeCompare(b.month)),
    }));
  };
  const delSnapshot = m => setNetWorth(s => ({ ...s, history: (s.history||[]).filter(h=>h.month!==m) }));

  // Older snapshots stored only {netWorth, assets, liabilities}. Read them
  // defensively rather than rewriting them — migrating in place would invent
  // a cash/retirement split that was never actually recorded.
  const histSorted = [...hist].filter(h => h && h.month).sort((a,b)=>a.month.localeCompare(b.month));
  const prevSnap   = histSorted.filter(h => h.month < monthKey).slice(-1)[0] || null;
  const yearStart  = histSorted.filter(h => h.month <= `${now.getFullYear()}-01`).slice(-1)[0]
                     || histSorted.find(h => h.month.startsWith(String(now.getFullYear()))) || null;

  const deltaMonth   = prevSnap ? round2(nw - safeNum(prevSnap.netWorth)) : null;
  const deltaMonthPct= prevSnap && safeNum(prevSnap.netWorth) !== 0
    ? (nw - safeNum(prevSnap.netWorth)) / Math.abs(safeNum(prevSnap.netWorth)) * 100 : null;
  const deltaYTD     = yearStart ? round2(nw - safeNum(yearStart.netWorth)) : null;
  const deltaYTDPct  = yearStart && safeNum(yearStart.netWorth) !== 0
    ? (nw - safeNum(yearStart.netWorth)) / Math.abs(safeNum(yearStart.netWorth)) * 100 : null;

  // Trend series. Current (unsaved) month is appended so the chart always
  // reflects what the page is showing.
  const nwTrend = (() => {
    const rows = [...histSorted.filter(h => h.month !== monthKey),
                  { month:monthKey, netWorth:nw, cash:snap.cash, retirement:snap.retirement }];
    const cut = nwRange === 'all' ? rows
      : nwRange === 'ytd' ? rows.filter(h => h.month.startsWith(String(now.getFullYear())))
      : rows.slice(-nwRange);
    return {
      labels: cut.map(h => {
        const [y,m] = h.month.split('-');
        return `${MONTH_NAMES[+m-1].slice(0,3)} '${y.slice(2)}`;
      }),
      net:   cut.map(h => safeNum(h.netWorth)),
      cash:  cut.map(h => safeNum(h.cash)),
      ret:   cut.map(h => safeNum(h.retirement)),
      hasComposition: cut.some(h => h.cash != null || h.retirement != null),
      count: cut.length,
    };
  })();

  const prevOf = key => prevSnap && prevSnap[key] != null ? safeNum(prevSnap[key]) : null;

  // Spending by category (all-time)
  const catSpend = {};
  for (const t of transactions.filter(t=>t.type==='expense'))
    catSpend[t.category] = (catSpend[t.category]||0) + t.amount;
  const topCats     = Object.entries(catSpend).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCatSpend = topCats[0]?.[1] || 1;
  const CAT_COLOR   = {
    housing:'var(--accent)',groceries:'var(--accent)',gas:'var(--yellow)',
    dining:'#f97316',shopping:'var(--purple)',travel:'#06b6d4',
    utilities:'var(--yellow)',savings:'var(--accent)',other:'var(--t3)',
  };

  // History deltas
  const histWithDelta = hist.map((h,i) => {
    const prev     = hist[i-1];
    const delta    = prev ? h.netWorth - prev.netWorth : null;
    const deltaPct = prev && prev.netWorth !== 0 ? (delta/Math.abs(prev.netWorth))*100 : null;
    return { ...h, delta, deltaPct };
  });

  const fmtMonth = m => {
    const [y,mo] = m.split('-');
    return new Date(+y,+mo-1,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
  };

  // Asset rows for display
  const assetRows = [
    { label:'Checking',              color:'var(--accent)', val:acc.checking||0,   onChange:v=>setAcc('checking',v),   synced:false },
    { label:'HYSA / Emergency Fund', color:'var(--accent)', val:hysaBal,            onChange:setHYSA,                   synced:true  },
    { label:'Roth IRA',              color:'var(--purple)', val:rothBal,            onChange:setRoth,                   synced:true  },
    { label:'401(k) — Employee',     color:'var(--yellow)', val:k401Emp,            onChange:set401kEmp,                synced:true  },
    { label:'401(k) — Employer',     color:'var(--purple)', val:k401Empr,           onChange:set401kEmpr,               synced:true  },
    { label:'Taxable Brokerage',     color:'#06b6d4',       val:acc.brokerage||0,  onChange:v=>setAcc('brokerage',v),  synced:false },
  ];
  const liabRows = [
    { label:'Credit Card',        color:'var(--red)',  val:acc.creditCard||0, onChange:v=>setAcc('creditCard',v) },
    { label:'Loans / Other Debt', color:'#f97316',    val:acc.loans||0,      onChange:v=>setAcc('loans',v)      },
  ];

  return (
    <div className="page">

      {/* Hero */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>
            Net Worth · {now.toLocaleDateString('en-US',{month:'long',year:'numeric'})}
          </div>
          <div className="mega" style={{color:isPos?'var(--accent)':'var(--red)'}}>{currency(nw)}</div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {currency(totalAssets)} assets — {currency(totalLiab)} liabilities
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={saveSnapshot}>
          {hasMonth ? 'Update' : 'Snapshot'}
        </button>
      </div>

      {/* Composition + change cards */}
      <div className="ins-cards">
        <div className="ins-card">
          <span className="ins-card-lbl">Cash</span>
          <span className="ins-card-val">{money2(snap.cash)}</span>
          <span className="ins-card-sub">checking + HYSA · spendable</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Retirement</span>
          <span className="ins-card-val" style={{color:'var(--purple)'}}>{money2(snap.retirement)}</span>
          <span className="ins-card-sub">Roth + 401(k) · not spendable</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Other Investments</span>
          <span className="ins-card-val">{money2(snap.other)}</span>
          <span className="ins-card-sub">taxable brokerage</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Liabilities</span>
          <span className="ins-card-val" style={{color:totalLiab>0?'var(--red)':'var(--t1)'}}>{money2(totalLiab)}</span>
          <span className="ins-card-sub">cards + loans</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Change vs. Last Month</span>
          <span className="ins-card-val" style={{color:deltaMonth==null?'var(--t1)':deltaMonth>=0?'var(--accent)':'var(--red)'}}>
            {deltaMonth==null?'—':`${deltaMonth>=0?'+':'−'}${money2(Math.abs(deltaMonth))}`}
          </span>
          <span className="ins-card-sub">
            {deltaMonth==null ? 'no earlier snapshot yet'
              : deltaMonthPct==null ? `was ${money2(prevSnap.netWorth)}`
              : `${deltaMonthPct>=0?'+':''}${deltaMonthPct.toFixed(1)}% · was ${money2(prevSnap.netWorth)}`}
          </span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Change YTD</span>
          <span className="ins-card-val" style={{color:deltaYTD==null?'var(--t1)':deltaYTD>=0?'var(--accent)':'var(--red)'}}>
            {deltaYTD==null?'—':`${deltaYTD>=0?'+':'−'}${money2(Math.abs(deltaYTD))}`}
          </span>
          <span className="ins-card-sub">
            {deltaYTD==null ? 'no snapshot this year yet'

      {/* Net worth trend */}

          <div className="seg" role="group" aria-label="Net worth range">

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>

          )}
        </div>
        <SvgLine history={hist} />
        {hist.length > 0 && (
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
            {[...hist].reverse().slice(0,6).map(h => (
              <div key={h.month} style={{
                background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'var(--r-s)',
                padding:'7px 12px',flex:'1',minWidth:72,
              }}>
                <div style={{fontSize:'.58rem',color:'var(--t3)',fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',marginBottom:3}}>
                  {fmtMonth(h.month)}
                </div>
                <div style={{fontSize:'.88rem',fontWeight:700,fontVariantNumeric:'tabular-nums',
                  color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                  {currency(h.netWorth)}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Asset breakdown (bar chart) */}
      {totalAssets > 0 && (
        <div className="card">
          <div className="card-label">Asset Breakdown</div>
          {assetRows.filter(a=>a.val>0).map(a => (
            <HBar key={a.label} label={a.label} value={a.val} max={totalAssets} color={a.color}/>
          ))}
        </div>
      )}

      {/* Goal progress */}
      <div className="card">
        <div className="card-label">Goal Progress</div>
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          {[
            { label:`HYSA — ${currency(hysaBal)} / ${currency(settings.hysaGoal)}`,              val:hysaBal, max:settings.hysaGoal,          color:'var(--accent)' },
            { label:`Roth IRA — ${currency(rothBal)} / ${currency(settings.rothIRAYearlyLimit)}`, val:rothBal, max:settings.rothIRAYearlyLimit, color:'var(--purple)' },
            { label:`401(k) — ${currency(k401Bal)} / ${currency(settings.ira401kYearlyMax)}`,     val:k401Bal, max:settings.ira401kYearlyMax,   color:'var(--yellow)' },
          ].map(g => (
            <div key={g.label}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}>
                <span style={{fontSize:'.78rem',color:'var(--t2)'}}>{g.label}</span>
                <span style={{fontSize:'.78rem',fontWeight:600,color:g.color}}>
                  {g.max>0 ? pct(Math.min((g.val/g.max)*100,100)) : '0.0%'}
                </span>
              </div>
              <Bar value={g.val} max={g.max} color={g.color} lg/>
            </div>
          ))}
        </div>
      </div>

      {/* Spending by category */}
      {topCats.length > 0 && (
        <div className="card">
          <div className="card-label">All-Time Spending</div>
          {topCats.map(([cat,amt]) => (
            <HBar key={cat} label={cat.charAt(0).toUpperCase()+cat.slice(1)}
              value={amt} max={maxCatSpend} color={CAT_COLOR[cat]||'var(--t3)'}/>
          ))}
        </div>
      )}

      {/* Monthly history table */}
      {histWithDelta.length > 0 && (
        <div className="card">
          <div className="card-label">Monthly History</div>
          <div className="hist-row" style={{paddingBottom:8}}>
            <span className="hist-head">Month</span>
            <span className="hist-head" style={{textAlign:'right'}}>Net Worth</span>
            <span className="hist-head" style={{textAlign:'right'}}>Change</span>
            <span/>
          </div>
          {[...histWithDelta].reverse().map(h => (
            <div key={h.month} className="hist-row">
              <span style={{fontSize:'.8rem',fontWeight:500,color:'var(--t1)'}}>{fmtMonth(h.month)}</span>
              <span className="hist-mono" style={{textAlign:'right',color:h.netWorth>=0?'var(--accent)':'var(--red)'}}>
                {currency(h.netWorth)}
              </span>
              <span className="hist-mono" style={{textAlign:'right',fontSize:'.72rem',
                color:h.delta==null?'var(--t3)':h.delta>=0?'var(--accent)':'var(--red)'}}>
                {h.delta==null ? '—' : `${h.delta>=0?'+':''}${currency(h.delta)}`}
                {h.deltaPct!=null && (
                  <span style={{color:'var(--t3)',marginLeft:3}}>
                    ({h.deltaPct>=0?'+':''}{h.deltaPct.toFixed(1)}%)
                  </span>
                )}
              </span>
              <button className="btn-icon btn-icon-del" style={{justifySelf:'end'}}
                onClick={()=>delSnapshot(h.month)} title="Delete">✕</button>
            </div>
          ))}
        </div>
      )}

    </div>
  );
}

function App() {
  const [tab,setTab]           = useState('dashboard');
  const [settings,setSettings] = usePersist('fd_settings',    DEFAULT_SETTINGS, migrateSettings);
  const [transactions,setTx]   = usePersist('fd_transactions', []);
  const [goals,setGoals]       = usePersist('fd_goals',        DEFAULT_GOALS,    migrateGoals);
  const [commissions,setComm]  = usePersist('fd_commissions',  []);
  const [nwData,setNwData]     = usePersist('fd_networth',     DEFAULT_NETWORTH);

  // ── App-wide goal-ETA tracking ────────────────────────────────────────
  // Runs on ANY balance change (paycheck, commission split, manual update).
  // Records each goal's precise days-to-target and, when the ETA moves sooner,
  // writes a session-scoped "moved up X" highlight the Goals tab reads.
  useEffect(() => {
    let prev = {}; try { prev = JSON.parse(localStorage.getItem('fd_eta_prev')||'{}'); } catch {}
    let hl = {};   try { hl   = JSON.parse(sessionStorage.getItem('fd_eta_hl')||'{}'); } catch {}
    const next = { ...prev };
    // Blended across BOTH scenarios — never read one scenario's figure as if
    // it applied to the other (that is what made the two look linked).
    const hysaRate = blendedRate(settings, 'hysa');
    const rothRate = blendedRate(settings, 'rothIRA');
    const hysaBal  = goals.hysaBalance || 0;
    const rothBal  = currentRothBal(settings, goals);
    const track = (key, rem, rate, done) => {
      if (done) { next[key] = 0; delete hl[key]; return; }
      if (!(rate > 0)) return;
      const days = rem > 0 ? (rem / rate) * 30.44 : 0;
      if (prev[key] == null) { next[key] = days; return; }          // baseline only
      if (days < prev[key] - 2) { hl[key] = { days: prev[key]-days }; next[key] = days; }
      else if (days > prev[key] + 2) { next[key] = days; delete hl[key]; }
    };
    track('hysa', Math.max(settings.hysaGoal - hysaBal, 0), hysaRate, hysaBal >= settings.hysaGoal);
    track('roth', Math.max(settings.rothIRAYearlyLimit - rothBal, 0), rothRate, rothBal >= settings.rothIRAYearlyLimit);
    localStorage.setItem('fd_eta_prev', JSON.stringify(next));
    try { sessionStorage.setItem('fd_eta_hl', JSON.stringify(hl)); } catch {}
  }, [goals, settings]);

  const pages = {
    dashboard:  <Dashboard  settings={settings} transactions={transactions} goals={goals} commissions={commissions} setGoals={setGoals} setTransactions={setTx} goTo={setTab} />,
    budget:     <Budget     settings={settings} transactions={transactions} />,
    spending:   <Spending   settings={settings} transactions={transactions} setTransactions={setTx} />,
    insights:   <SpendingInsights settings={settings} transactions={transactions} setTransactions={setTx} goTo={setTab} />,
    goals:      <Goals      settings={settings} goals={goals} setGoals={setGoals} commissions={commissions} transactions={transactions} />,
    commission: <Commission settings={settings} commissions={commissions} setCommissions={setComm} setGoals={setGoals} />,
    networth:   <NetWorth   netWorth={nwData} setNetWorth={setNwData} transactions={transactions} goals={goals} setGoals={setGoals} settings={settings} />,
    settings:   <Settings   settings={settings} setSettings={useCallback(s=>setSettings(s),[])} />,
  };

  return (
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <div className="logo"><div className="logo-dot" />Finance</div>
          <nav className="nav">
            {TABS.map(t=>(
              <button key={t.id} className={'nav-btn'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
                {t.label}
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="main">{pages[tab]}</main>
      <nav className="mobile-nav">
        {TABS.map(t=>(
          <button key={t.id} className={'mnav-btn'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
            <NavIcon name={t.icon} active={tab===t.id} />
            {tab===t.id && <div className="nav-pip" />}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(function(){
  function run(){
    var src=document.getElementById('app-src').textContent;
    var compiled=Babel.transform(src,{presets:[['react',{runtime:'classic'}]]}).code;
    eval(compiled);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',run);}
  else{run();}
})();
// Register service worker for PWA / offline support
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
