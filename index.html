function Goals({ settings, goals, setGoals, commissions, transactions, accounts, netWorth, customGoals, setCustomGoals }) {
  const now   = new Date();
  const phase = getPhaseInfo(settings.startDate);
  const goalCtx = { settings, goals, accounts, netWorth };
  const [showAddGoal, setShowAddGoal] = useState(false);
  const [editingGoal, setEditingGoal] = useState(null);

  // ── HYSA ──────────────────────────────────────────────────────────────
  const hysaBal    = goals.hysaBalance || 0;
  const hysaPct_   = settings.hysaGoal > 0 ? Math.min((hysaBal / settings.hysaGoal) * 100, 100) : 0;
  const hysaRem    = Math.max(settings.hysaGoal - hysaBal, 0);
  // HYSA alternates ($1,800 rent-free months, $500 rent months) — blended avg for the ETA
  const hysaRate   = blendedRate(settings, 'hysa');
  const hysaMonths = hysaRate > 0 && hysaRem > 0 ? Math.ceil(hysaRem / hysaRate) : 0;
  const hysaETA    = hysaMonths ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + hysaMonths);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── Roth IRA (counts only logged contributions — no month-based auto-fill) ──
  // Blended across both scenarios for the long-range ETA. With Rent and
  // Without Rent hold their own rothIRA value — neither is read as the other's.
  const rothRate    = blendedRate(settings, 'rothIRA');
  const rothBal   = goals.rothIRAOverride != null ? goals.rothIRAOverride : 0;
  // The IRS annual limit is measured against THIS YEAR's contributions —
  // never the account's total balance, which inflates with every prior
  // year's contributions plus any investment growth (PRD §15: "Do not use
  // total account value as the annual contribution amount").
  const rothYTD   = ytdRothContributions(transactions, now.getFullYear());
  const rothPct_  = settings.rothIRAYearlyLimit > 0 ? Math.min((rothYTD / settings.rothIRAYearlyLimit) * 100, 100) : 0;
  const rothRem   = Math.max(settings.rothIRAYearlyLimit - rothYTD, 0);
  const rothMonthsLeft = rothRate > 0 && rothRem > 0
    ? Math.ceil(rothRem / rothRate) : 0;
  const rothETA   = rothMonthsLeft ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + rothMonthsLeft);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── 401(k) — employee and employer tracked separately ─────────────────
  const k401Emp   = goals.k401Employee || 0;
  const k401Empr  = goals.k401Employer || 0;
  // Combined is DERIVED from the two sources — never an independently editable
  // number, so the split and the total can never disagree.
  const k401Bal   = round2(k401Emp + k401Empr);
  // Same fix as Roth above: the IRS employee deferral limit resets every
  // January 1 — measure progress against this year's employee
  // contributions, not the all-time cumulative total k401Emp holds.
  const k401EmpYTD = ytd401kEmployeeContributions(transactions, now.getFullYear());
  const k401Pct_ = settings.ira401kYearlyMax > 0 ? Math.min((k401EmpYTD / settings.ira401kYearlyMax) * 100, 100) : 0;
  const k401Rem  = Math.max(settings.ira401kYearlyMax - k401EmpYTD, 0);
  const matchCap    = settings.employerMatchAnnualCap != null ? settings.employerMatchAnnualCap : 0;
  const matchUsed   = ytdEmployerMatch(transactions, now.getFullYear());
  const matchCapped = matchCap > 0 && matchUsed >= matchCap;
  const empPerCheck   = k401Active(settings) ? employee401kPerCheck(settings) : 0;
  const matchPerCheck = employerMatchForPaycheck(settings, empPerCheck, matchUsed);
  const k401Started   = !settings.contribution401kStart || new Date() >= parseLocalDate(settings.contribution401kStart);
  const k401StartLabel = settings.contribution401kStart
    ? parseLocalDate(settings.contribution401kStart).toLocaleDateString('en-US',{month:'short',year:'numeric'}) : '';

  // ── Savings rate ──────────────────────────────────────────────────────
  // Only HYSA + Roth IRA count — 401k is pre-tax and deducted before take-home
  const activeBudget   = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const monthlyContrib = (activeBudget.hysa||0) + (activeBudget.rothIRA||0);
  const savingsRate    = monthlyNetIncome(settings) > 0 ? (monthlyContrib / monthlyNetIncome(settings)) * 100 : 0;
  const totalComm      = commissions.reduce((s,c) => s+c.amount, 0);

  // ── Form state ────────────────────────────────────────────────────────
  const [hysaIn, setHysaIn]   = useState('');
  const [k401EmpIn,  setK401EmpIn]  = useState('');
  const [k401EmprIn, setK401EmprIn] = useState('');
  const [rothIn, setRothIn] = useState('');

  const updHYSA = e => { e.preventDefault(); const v=parseFloat(hysaIn); if(!isNaN(v)) setGoals(g=>({...g,hysaBalance:v})); setHysaIn(''); };
  // Each source is corrected on its own; `ira401kBalance` is kept in step purely
  // as the back-compat mirror of the derived combined figure.
  const upd401kEmp = e => { e.preventDefault(); const v=parseFloat(k401EmpIn);
    if(!isNaN(v)) setGoals(g=>({...g,k401Employee:v,ira401kBalance:round2(v+(g.k401Employer||0))}));
    setK401EmpIn(''); };
  const upd401kEmpr = e => { e.preventDefault(); const v=parseFloat(k401EmprIn);
    if(!isNaN(v)) setGoals(g=>({...g,k401Employer:v,ira401kBalance:round2((g.k401Employee||0)+v)}));
    setK401EmprIn(''); };
  const updRoth = e => { e.preventDefault(); const v=parseFloat(rothIn); setGoals(g=>({...g,rothIRAOverride:isNaN(v)?null:v})); setRothIn(''); };

  // "Moved up" highlights are detected app-wide (see App); just read them here.
  const [etaHl] = useState(() => loadSess('fd_eta_hl', {}));

  return (
    <div className="page">

      {/* Hero — savings rate */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Savings Rate</div>
        <div className="mega" style={{color:'var(--accent)'}}>{pct(savingsRate, 0)}</div>
        <div style={{fontSize:'.85rem',color:'var(--t3)',marginTop:10,fontVariantNumeric:'tabular-nums'}}>
          {currency(monthlyContrib)}/mo this month
          {phase.isRentFree && <span style={{color:'var(--t4)'}}> · rent-free, HYSA accelerated</span>}
          {phase.isRentMonth && <span style={{color:'var(--t4)'}}> · rent month</span>}
        </div>
      </div>

      {/* Commission earned pill */}
      {totalComm > 0 && (
        <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'var(--accent-lt)',border:'1px solid rgba(0,200,5,.2)',borderRadius:'var(--r-s)',padding:'8px 14px'}}>
          <Icon name="dollar" size={14} color="var(--accent)" strokeWidth={2}/>
          <span style={{fontSize:'.78rem',fontWeight:600,color:'var(--accent)'}}>{currency(totalComm)} commission earned</span>
        </div>
      )}

      <div className="eyebrow" style={{marginBottom:4}}>Active Goals</div>

      {/* ── HYSA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Emergency Fund</div>
            <div className="gc-sub">HYSA · alternating · ~{currency(hysaRate)}/mo avg</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--accent)'}}>{pct(hysaPct_, 0)}</div>
            <div className="gc-of">{currency(hysaBal)} of {currency(settings.hysaGoal)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${hysaPct_}%`, background:'linear-gradient(90deg,#00C805,#00ff08)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(hysaRem)} remaining</span>
          <span className="gc-date">
            {etaHl.hysa && hysaBal < settings.hysaGoal && (
              <span className="eta-up">↑ Moved up {fmtImprove(etaHl.hysa.days)}</span>
            )}
            {hysaBal >= settings.hysaGoal ? '🎉 Goal reached!'
              : hysaETA ? `${hysaETA} · ${hysaMonths}mo` : '—'}
          </span>
        </div>
        <form onSubmit={updHYSA} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(hysaBal)})`}
            value={hysaIn} onChange={e=>setHysaIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      {/* ── Roth IRA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Roth IRA</div>
            <div className="gc-sub">{now.getFullYear()} limit · resets Jan 1</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--purple)'}}>{pct(rothPct_, 0)}</div>
            {/* This year's contributions vs. the IRS limit — NOT the account
                balance, which includes every prior year's contributions
                plus investment growth and would make this percentage
                meaningless (PRD §15). */}
            <div className="gc-of">{currency(rothYTD)} of {currency(settings.rothIRAYearlyLimit)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${rothPct_}%`, background:'linear-gradient(90deg,#7B74FF,#9C94FF)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(rothRate)}/mo · from paychecks</span>
          <span className="gc-date">
            {etaHl.roth && rothYTD < settings.rothIRAYearlyLimit && (
              <span className="eta-up">↑ Moved up {fmtImprove(etaHl.roth.days)}</span>
            )}
            {rothYTD >= settings.rothIRAYearlyLimit ? '🎉 Maxed out!'
              : rothETA ? `${rothETA} · ${rothMonthsLeft}mo` : '—'}
          </span>
        </div>
        {/* Account balance — a distinct number from the contribution
            progress above, shown once so the two are never confused. */}
        <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:8}}>
          Account balance: <span style={{color:'var(--t2)',fontWeight:600}}>{currency(rothBal)}</span>
        </div>
        <form onSubmit={updRoth} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(rothBal)})`}
            value={rothIn} onChange={e=>setRothIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      {/* ── 401(k) Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">401(k)</div>
            <div className="gc-sub">Pre-tax · IRS max {now.getFullYear()}: {currency(settings.ira401kYearlyMax)}</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--yellow)'}}>
              {pct(k401Pct_, 0)}
            </div>
            {/* This year's EMPLOYEE contributions vs. the IRS deferral
                limit — not the combined all-time balance (PRD §15). */}
            <div className="gc-of">{currency(k401EmpYTD)} of {currency(settings.ira401kYearlyMax)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${k401Pct_}%`, background:'linear-gradient(90deg,#F5A623,#FFD27A)'}}/>
        </div>
        {/* Employee vs employer — tracked and shown as distinct sources.
            The combined figure above is their sum, never a merged balance. */}
        <div style={{display:'flex',gap:0,marginTop:14,marginBottom:2}}>
          {[
            { lbl:'You (employee)', val:k401Emp,  c:'var(--yellow)',
              sub:`${currency(empPerCheck,2)}/check` },
            { lbl:'Employer match', val:k401Empr, c:'var(--purple)',
              sub:matchCapped ? 'annual cap reached'
                              : `${currency(matchPerCheck,2)}/check` },
            { lbl:'Combined',       val:k401Bal,  c:'var(--t1)',
              sub:`${currency(k401Rem)} to IRS max` },
          ].map((x,i,arr)=>(
            <div key={x.lbl} style={{
              flex:1, paddingRight:i<arr.length-1?14:0, marginRight:i<arr.length-1?14:0,
              borderRight:i<arr.length-1?'1px solid var(--border)':'none',
            }}>
              <div style={{fontSize:'.58rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>{x.lbl}</div>
              <div style={{fontSize:'.95rem',fontWeight:700,color:x.c,fontVariantNumeric:'tabular-nums'}}>{currency(x.val,2)}</div>
              <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:2}}>{x.sub}</div>
            </div>
          ))}
        </div>

        {/* Employer annual allowance — the cap that bounds the match */}
        {matchCap > 0 && (
          <div style={{marginTop:12}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.62rem',color:'var(--t3)',marginBottom:5}}>
              <span>Employer match used · {now.getFullYear()}</span>
              <span style={{fontVariantNumeric:'tabular-nums',color:matchCapped?'var(--yellow)':'var(--t3)'}}>
                {currency(matchUsed,2)} / {currency(matchCap)}{matchCapped && ' · capped'}
              </span>
            </div>
            <div className="track">
              <div className="fill" style={{width:`${Math.min((matchUsed/matchCap)*100,100)}%`,background:'var(--purple)'}}/>
            </div>
          </div>
        )}

        <div className="gc-foot">
          <span className="gc-rate">{currency(empPerCheck,2)} + {currency(matchPerCheck,2)} employer / check</span>
          <span className="gc-date">
            {!k401Started ? `Starts ${k401StartLabel}`
              : k401Bal > 0 ? `${currency(k401Rem)} to IRS max` : 'Capturing employer match'}
          </span>
        </div>
        <form onSubmit={upd401kEmp} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Employee balance (${currency(k401Emp)})`}
            value={k401EmpIn} onChange={e=>setK401EmpIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
        <form onSubmit={upd401kEmpr} className="goal-update" style={{marginTop:8}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Employer balance (${currency(k401Empr)})`}
            value={k401EmprIn} onChange={e=>setK401EmprIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      <div style={{fontSize:'.68rem',color:'var(--t4)',textAlign:'center'}}>
        HYSA &amp; Roth IRA balances sync with Net Worth page
      </div>

      {/* ── Custom Goals (Priority 16) ── */}
      <div>
        <div className="cal-head">
          <div className="section-head" style={{padding:0,marginBottom:0}}>Custom Goals</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowAddGoal(true)}><Icon name="plus" size={13}/>Add Goal</button>
        </div>
        {(customGoals||[]).length === 0 ? (
          <div className="empty">Emergency Fund, Vacation, Car, House, Wedding, Investments, Debt Payoff — add your first custom goal.</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            {(customGoals||[]).map(g => (
              <CustomGoalCard key={g.id} goal={g} ctx={goalCtx}
                onEdit={()=>setEditingGoal(g)}
                onContribute={updated => setCustomGoals(list => list.map(x => x.id===updated.id ? { ...x, ...updated } : x))}/>
            ))}
          </div>
        )}
      </div>

      <AchievementsGrid achievements={computeAchievements({ transactions, netWorth, goals, settings, customGoals, accounts })}/>

      {showAddGoal && (
        <GoalFormModal accounts={accounts} onClose={()=>setShowAddGoal(false)}
          onSave={g => setCustomGoals(list => [...(list||[]), g])}/>
      )}
      {editingGoal && (
        <GoalFormModal accounts={accounts} goal={editingGoal} onClose={()=>setEditingGoal(null)}
          onSave={g => setCustomGoals(list => list.map(x => x.id===g.id ? g : x))}
          onDelete={id => setCustomGoals(list => list.filter(x => x.id!==id))}/>
      )}

    </div>
  );
}

// SPENDING INSIGHTS
// Reads the SAME fd_transactions store as every other page — there is no
// second transaction database. One `filtered` array feeds the calendar,
// the cards, the charts and the drill-down, so they can never disagree.
// ══════════════════════════════════════════════════════════════════════
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const RANK_LABEL = { spend:'Top spend', largest:'Largest single', frequency:'Most frequent' };

// Category budgets for a month, derived from whichever budget scenario that
// month uses. Reuses the existing scenario resolver so "With Rent" and
// "Without Rent" stay independent.
function categoryBudgetsFor(settings, ref) {
  const b = budgetForRef(settings, ref) || {};
  const ph = getPhaseInfo(settings.startDate, ref);
  return {
    housing:   ph.isRentMonth ? (b.rentAndFee||0) : 0,
    groceries: b.groceries||0,
    gas:       b.gas||0,
    dining:    b.outToEat||0,
    shopping:  b.shopping||0,
    travel:    b.funTravel||0,
    utilities: (ph.isRentMonth ? b.utilities : b.utilitiesAndFee)||0,
  };
}

function MonthlyReviewModal({ onClose, monthLabel, monthKey, year, month, income, totalSpend, largestTx, topCatEnt, monthBudgetTotal, netWorth, accounts, monthTx }) {
  const savings = round2(income - totalSpend);
  const budgetPctUsed = monthBudgetTotal > 0 ? safePct(totalSpend, monthBudgetTotal) : 0;
  const grade = budgetGrade(budgetPctUsed);
  const nwChange = netWorthChangeForMonth(netWorth, monthKey);
  const cashback = round2((accounts||[]).filter(a=>a.type==='credit').reduce((s,a) => {
    const card = a.card || defaultCardFields();
    return s + estimatedRewardValue(card, (card.rewardsByMonth||{})[monthKey]);
  }, 0));
  const bestWeek = bestSavingWeek(monthTx, year, month);
  const maxBar = Math.max(income, totalSpend, Math.abs(savings), 1);

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">Monthly Review · {monthLabel}</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',alignItems:'center',gap:18}}>
            <div className="grade-badge" style={{color:grade.color}}>{grade.grade}</div>
            <div>
              <div style={{fontSize:'.7rem',color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Budget Grade</div>
              <div style={{fontSize:'.84rem',color:'var(--t2)'}}>{monthBudgetTotal>0 ? `${budgetPctUsed.toFixed(0)}% of ${currency(monthBudgetTotal)} budget used` : 'No budget set for this scenario'}</div>
            </div>
          </div>

          <div className="mr-bars">
            <div className="mr-bar-row"><div className="mr-bar-lbl">Income</div><div className="mr-bar-track"><div className="mr-bar-fill" style={{width:`${Math.min(safePct(income,maxBar),100)}%`,background:'var(--accent)'}}/></div><div className="mr-bar-val">{currency(income)}</div></div>
            <div className="mr-bar-row"><div className="mr-bar-lbl">Expenses</div><div className="mr-bar-track"><div className="mr-bar-fill" style={{width:`${Math.min(safePct(totalSpend,maxBar),100)}%`,background:'var(--red)'}}/></div><div className="mr-bar-val">{currency(totalSpend)}</div></div>
            <div className="mr-bar-row"><div className="mr-bar-lbl">Savings</div><div className="mr-bar-track"><div className="mr-bar-fill" style={{width:`${Math.min(safePct(Math.abs(savings),maxBar),100)}%`,background:savings>=0?'var(--blue)':'var(--red)'}}/></div><div className="mr-bar-val" style={{color:savings>=0?'var(--t1)':'var(--red)'}}>{savings>=0?'':'−'}{currency(Math.abs(savings))}</div></div>
          </div>

          <div className="ins-cards" style={{marginTop:18}}>
            <div className="ins-card">
              <span className="ins-card-lbl">Net Worth Change</span>
              <span className="ins-card-val" style={{color: nwChange && nwChange.hasPrev ? (nwChange.value>=0?'var(--accent)':'var(--red)') : 'var(--t3)'}}>
                {nwChange && nwChange.hasPrev ? `${nwChange.value>=0?'+':'−'}${currency(Math.abs(nwChange.value))}` : '—'}
              </span>
              <span className="ins-card-sub">{nwChange ? (nwChange.hasPrev ? 'vs prior snapshot' : 'no earlier snapshot yet') : 'no Net Worth snapshot saved this month'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Cashback / Rewards Earned</span>
              <span className="ins-card-val" style={{color:'var(--accent)'}}>{currency(cashback,2)}</span>
              <span className="ins-card-sub">across all cards, est. $</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Largest Purchase</span>
              <span className="ins-card-val">{largestTx ? money2(largestTx.amount) : '—'}</span>
              <span className="ins-card-sub">{largestTx ? (largestTx.description||'Uncategorized') : 'None this month'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Top Category</span>
              <span className="ins-card-val">{topCatEnt ? catLabel(topCatEnt[0]) : '—'}</span>
              <span className="ins-card-sub">{topCatEnt ? money2(topCatEnt[1].total) : 'No spending logged'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Best Saving Week</span>
              <span className="ins-card-val" style={{color:bestWeek && bestWeek.net>0 ? 'var(--accent)' : 'var(--t1)'}}>{bestWeek ? `Days ${bestWeek.start}–${bestWeek.end}` : '—'}</span>
              <span className="ins-card-sub">{bestWeek ? `${bestWeek.net>=0?'+':'−'}${currency(Math.abs(bestWeek.net))} net` : ''}</span>
            </div>

        </div>
      </div>
    </div>
  );
}

// ── Year in Review (Bonus) — same shape as Monthly Review, one level up:
// totals, top category, and a month-by-month spending trend for the whole
// calendar year, all derived from transactions/netWorth already in memory
// (no new stored aggregate — a year is just twelve months' worth of the
// same numbers Monthly Review already computes one at a time).
function YearlyReviewModal({ onClose, year, transactions, netWorth, accounts, settings }) {
  const yearTx    = useMemo(() => (transactions||[]).filter(t => txDateKey(t).startsWith(String(year))), [transactions, year]);
  const income    = useMemo(() => yearTx.filter(isIncomeTransaction).reduce((s,t)=>s+safeNum(t.amount),0), [yearTx]);
  const spendRows = useMemo(() => spendingRows(yearTx), [yearTx]);
  const totalSpend= spendRows.reduce((s,r)=>s+r.delta,0);
  const savings   = round2(income - totalSpend);
  const savingsRate = income > 0 ? safePct(savings, income) : 0;

  const byCat = useMemo(() => {
    const m = {};
    for (const { t, delta } of spendRows) { const c = categoryOf(t); m[c] = (m[c]||0) + delta; }
    return m;
  }, [spendRows]);
  const topCatEnt = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0] || null;

  const largestTx = useMemo(() => {
    let best = null;
    for (const { t, delta } of spendRows) if (delta > 0 && (!best || delta > best.amount)) best = { amount:delta, description:t.description, date:txDateKey(t) };
    return best;
  }, [spendRows]);

  // Month-by-month net (income − spend) for the trend line.
  const monthly = useMemo(() => {
    const rows = Array.from({length:12}, (_,m) => ({ key:`${year}-${String(m+1).padStart(2,'0')}`, income:0, spend:0 }));
    for (const t of yearTx) {
      const m = +txDateKey(t).slice(5,7) - 1;
      if (m<0||m>11) continue;
      if (isIncomeTransaction(t)) rows[m].income += safeNum(t.amount);
    }
    for (const { t, delta } of spendRows) {
      const m = +txDateKey(t).slice(5,7) - 1;
      if (m>=0 && m<=11) rows[m].spend += delta;
    }
    return rows;
  }, [yearTx, spendRows, year]);
  const bestMonth = monthly.reduce((best,r) => {
    const net = round2(r.income - r.spend);
    return (!best || net > best.net) ? { ...r, net } : best;
  }, null);

  // Tax Categories (Bonus) — total of every deductible-flagged category
  // (Settings → Categories → "Tax"), for filing season.
  const taxCatIds = (settings && settings.taxDeductibleCategories) || [];
  const taxRows = useMemo(() => {
    if (!taxCatIds.length) return [];
    const m = {};
    for (const { t, delta } of spendRows) {
      const c = categoryOf(t);
      if (taxCatIds.includes(c)) m[c] = (m[c]||0) + delta;
    }
    return Object.entries(m).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  }, [spendRows, taxCatIds]);
  const taxTotal = taxRows.reduce((s,[,v])=>s+v, 0);
  const exportTaxCSV = () => {
    const taxTx = yearTx.filter(t => t.type==='expense' && taxCatIds.includes(categoryOf(t)));
    exportTransactionsCSV(taxTx, `tax-deductible-${year}.csv`);
  };

  const nwChange = netWorthChangeForYear(netWorth, year);
  const cashback = round2((accounts||[]).filter(a=>a.type==='credit').reduce((s,a) => {
    const card = a.card || defaultCardFields();
    const byMonth = card.rewardsByMonth || {};
    let total = 0;
    for (const k of Object.keys(byMonth)) if (k.startsWith(String(year))) total += estimatedRewardValue(card, byMonth[k]);
    return s + total;
  }, 0));

  return (
    <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card modal-card-lg">
        <div className="modal-hd">
          <div className="modal-title">Year in Review · {year}</div>
          <button className="btn-icon" onClick={onClose} aria-label="Close"><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',alignItems:'center',gap:18}}>
            <div className="grade-badge" style={{color: income<=0?'var(--t3)':savingsRate>=20?'#00C805':savingsRate>=0?'#F5A623':'#FF5000'}}>
              {income<=0?'—':savingsRate>=20?'A':savingsRate>=0?'B':'C'}
            </div>
            <div>
              <div style={{fontSize:'.7rem',color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Savings Rate</div>
              <div style={{fontSize:'.84rem',color:'var(--t2)'}}>{income>0?`${savingsRate.toFixed(0)}% of ${currency(income)} income saved`:'No income logged this year'}</div>
            </div>
          </div>

          <div style={{marginTop:18}}>
            <LineTrendChart
              labels={monthly.map(r=>new Date(+r.key.slice(0,4),+r.key.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'short'}))}
              series={[
                { key:'income', label:'Income',   color:VIZ_SERIES[2], points:monthly.map(r=>r.income) },
                { key:'spend',  label:'Spending',  color:VIZ_SERIES[1], points:monthly.map(r=>r.spend) },
              ]}
              emptyMsg="No activity logged yet this year."/>
          </div>

          <div className="ins-cards" style={{marginTop:18}}>
            <div className="ins-card">
              <span className="ins-card-lbl">Net Savings</span>
              <span className="ins-card-val" style={{color:savings>=0?'var(--accent)':'var(--red)'}}>{savings>=0?'':'−'}{currency(Math.abs(savings))}</span>
              <span className="ins-card-sub">{currency(income)} in · {currency(totalSpend)} out</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Net Worth Change</span>
              <span className="ins-card-val" style={{color: nwChange && nwChange.hasPrev ? (nwChange.value>=0?'var(--accent)':'var(--red)') : 'var(--t3)'}}>
                {nwChange && nwChange.hasPrev ? `${nwChange.value>=0?'+':'−'}${currency(Math.abs(nwChange.value))}` : '—'}
              </span>
              <span className="ins-card-sub">{nwChange ? (nwChange.hasPrev ? 'vs. prior year-end' : 'no earlier snapshot yet') : 'no Net Worth snapshot saved this year'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Cashback / Rewards Earned</span>
              <span className="ins-card-val" style={{color:'var(--accent)'}}>{currency(cashback,2)}</span>
              <span className="ins-card-sub">across all cards, est. $</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Largest Purchase</span>
              <span className="ins-card-val">{largestTx?money2(largestTx.amount):'—'}</span>
              <span className="ins-card-sub">{largestTx?(largestTx.description||'Uncategorized'):'None this year'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Top Category</span>
              <span className="ins-card-val">{topCatEnt?catLabel(topCatEnt[0]):'—'}</span>
              <span className="ins-card-sub">{topCatEnt?money2(topCatEnt[1]):'No spending logged'}</span>
            </div>
            <div className="ins-card">
              <span className="ins-card-lbl">Best Month</span>
              <span className="ins-card-val" style={{color:bestMonth && bestMonth.net>0 ? 'var(--accent)' : 'var(--t1)'}}>
                {bestMonth && (bestMonth.income||bestMonth.spend) ? new Date(+bestMonth.key.slice(0,4),+bestMonth.key.slice(5,7)-1,1).toLocaleDateString('en-US',{month:'long'}) : '—'}
              </span>
              <span className="ins-card-sub">{bestMonth ? `${bestMonth.net>=0?'+':'−'}${currency(Math.abs(bestMonth.net))} net` : ''}</span>
            </div>
          </div>

          {taxCatIds.length > 0 && (
            <div style={{marginTop:18}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <div className="eyebrow" style={{marginBottom:0}}>Tax Deductible — {year}</div>
                <button type="button" className="btn btn-ghost btn-sm" onClick={exportTaxCSV} disabled={!taxRows.length}>Export CSV</button>
              </div>
              <div className="card-flush">
                {taxRows.length===0 ? (
                  <p className="empty">No deductible-category spending logged this year.</p>
                ) : taxRows.map(([cat,val]) => (
                  <div key={cat} className="v-row">
                    <div className="v-row-name">{catLabel(cat)}</div>
                    <div className="v-row-val">{currency(val,2)}</div>
                  </div>
                ))}
                {taxRows.length > 0 && (
                  <div className="v-row" style={{fontWeight:700}}>
                    <div className="v-row-name">Total</div>
                    <div className="v-row-val" style={{color:'var(--accent)'}}>{currency(taxTotal,2)}</div>
                  </div>
                )}
              </div>
              <div style={{fontSize:'.6rem',color:'var(--t4)',marginTop:8}}>
                Categories marked "Tax" in Settings → Categories. Not tax advice — check with a professional before filing.
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SpendingInsights({ settings, transactions, setTransactions, goTo, accounts, netWorth, goals, bills }) {
  const today = new Date();
  const [cursor, setCursor] = useState(() => ({ y: today.getFullYear(), m: today.getMonth() }));
  const [selDate, setSelDate]   = useState(null);
  const [drillCat, setDrillCat] = useState(null);
  const [sortBy, setSortBy]     = useState('amount-desc');
  const [trendRange, setTrendRange] = useState(6);
  const [rankMode, setRankMode] = useState('spend');
  const [topN, setTopN]         = useState(5);
  const [useRange, setUseRange] = useState(false);
  const [filters, setFilters]   = useState({ from:'', to:'', category:'all', merchant:'all', account:'all', status:'all', search:'', minAmount:'', maxAmount:'', paymentMethod:'all', type:'all' });
  const [showReview, setShowReview] = useState(false);
  const [showYearReview, setShowYearReview] = useState(false);
  // Compact filter bar (PRD §12) — the ~10 advanced fields (everything
  // except Search, which stays inline) live in this sheet instead of an
  // always-expanded bar; active ones surface as removable chips underneath.
  const [filterSheetOpen, setFilterSheetOpen] = useState(false);

  const monthKey = `${cursor.y}-${String(cursor.m+1).padStart(2,'0')}`;
  const setF = (k,v) => setFilters(f => ({ ...f, [k]: v }));
  const resetFilters = () => {
    setFilters({ from:'', to:'', category:'all', merchant:'all', account:'all', status:'all', search:'', minAmount:'', maxAmount:'', paymentMethod:'all', type:'all' });
    setUseRange(false); setSelDate(null); setDrillCat(null);
    setCursor({ y: today.getFullYear(), m: today.getMonth() });
  };
  // One chip per non-default advanced filter (Search, Month/Year navigation
  // and the Period toggle stay outside the sheet as everyday controls, not
  // "advanced" filters, so they don't get a chip/count of their own).
  const activeFilterChips = [
    filters.category!=='all'      && { key:'category',      label:`Category: ${catLabel(filters.category)}`,                clear:()=>setF('category','all') },
    filters.merchant!=='all'      && { key:'merchant',       label:`Merchant: ${filters.merchant}`,                          clear:()=>setF('merchant','all') },
    filters.account!=='all'       && { key:'account',        label:`Account: ${filters.account}`,                            clear:()=>setF('account','all') },
    filters.status!=='all'        && { key:'status',         label:`Status: ${filters.status}`,                              clear:()=>setF('status','all') },
    filters.type!=='all'          && { key:'type',           label:`Type: ${filters.type}`,                                  clear:()=>setF('type','all') },
    filters.paymentMethod!=='all' && { key:'paymentMethod',  label:`Payment: ${filters.paymentMethod}`,                      clear:()=>setF('paymentMethod','all') },
    filters.minAmount!==''        && { key:'minAmount',      label:`Min $${filters.minAmount}`,                              clear:()=>setF('minAmount','') },
    filters.maxAmount!==''        && { key:'maxAmount',      label:`Max $${filters.maxAmount}`,                              clear:()=>setF('maxAmount','') },
    useRange && filters.from      && { key:'from',           label:`From ${filters.from}`,                                   clear:()=>setF('from','') },
    useRange && filters.to        && { key:'to',             label:`To ${filters.to}`,                                       clear:()=>setF('to','') },
  ].filter(Boolean);

  // ── THE filtered set. Everything below derives from this one array. ──
  const activeFilters = useMemo(() => ({
    ...filters,
    month: useRange ? null : monthKey,
    from:  useRange ? filters.from : '',
    to:    useRange ? filters.to   : '',
  }), [filters, useRange, monthKey]);
  const filtered = useMemo(
    () => getFilteredTransactions(transactions, activeFilters),
    [transactions, activeFilters]);

  const daily      = useMemo(() => getDailySpendingTotals(filtered), [filtered]);
  const byCat      = useMemo(() => getCategorySpendingTotals(filtered), [filtered]);
  const merchants  = useMemo(() => getTopMerchants(filtered, rankMode, topN), [filtered, rankMode, topN]);
  const totalSpend = useMemo(() => round2(Object.values(byCat).reduce((s,c)=>s+c.total,0)), [byCat]);
  const income     = useMemo(() => round2(filtered.filter(isIncomeTransaction).reduce((s,t)=>s+safeNum(t.amount),0)), [filtered]);
  const spendCount = useMemo(() => Object.values(daily).reduce((s,d)=>s+d.count,0), [daily]);

  // Option lists come from ALL transactions so a filter never hides its own
  // escape route (e.g. picking a merchant then being unable to pick another).
  const allMerchants = useMemo(() => {
    const s = new Set((transactions||[]).filter(t=>t.type==='expense').map(t=>normalizeMerchantName(t.description)));
    return [...s].sort();
  }, [transactions]);
  const allAccounts = useMemo(() => {
    const s = new Set((transactions||[]).map(accountOf));
    return [...s].sort();
  }, [transactions]);

  // ── Summary stats ──
  const dayEntries = Object.entries(daily).filter(([,d]) => d.total > 0);
  const peakDay    = dayEntries.sort((a,b)=>b[1].total-a[1].total)[0] || null;
  const topCatEnt  = Object.entries(byCat).filter(([,c])=>c.total>0).sort((a,b)=>b[1].total-a[1].total)[0] || null;
  const largestTx  = useMemo(() => {
    let best = null;
    for (const { t, delta } of spendingRows(filtered))
      if (delta > 0 && (!best || delta > best.amount))
        best = { amount: delta, description: t.description, date: txDateKey(t) };
    return best;
  }, [filtered]);
  const daysElapsed = useRange
    ? Math.max(dayEntries.length, 1)
    : (cursor.y===today.getFullYear() && cursor.m===today.getMonth())
      ? today.getDate()
      : new Date(cursor.y, cursor.m+1, 0).getDate();
  const avgDaily = round2(totalSpend / Math.max(daysElapsed,1));

  // ── Calendar grid ──
  const firstDow  = new Date(cursor.y, cursor.m, 1).getDay();
  const daysIn    = new Date(cursor.y, cursor.m+1, 0).getDate();
  const todayKey  = dateKey(today);
  const peakKey   = peakDay ? peakDay[0] : null;
  // Heat map (Bonus) — each day's spending relative to the month's own
  // peak day, not some fixed dollar scale, so a light month and a heavy
  // month both show real contrast instead of one being all-pale or
  // all-saturated.
  const maxDayTotal = peakDay ? peakDay[1].total : 0;
  const heatOf = total => maxDayTotal > 0 ? Math.min(total / maxDayTotal, 1) : 0;
  const cells = [
    ...Array.from({length:firstDow}, (_,i) => ({ key:`e${i}`, empty:true })),
    ...Array.from({length:daysIn}, (_,i) => {
      const k = `${cursor.y}-${String(cursor.m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
      return { key:k, day:i+1, ...(daily[k] || { total:0, count:0 }) };
    }),
  ];

  // ── Trend ──
  const trend = useMemo(() => {
    const months = [];
    if (trendRange === 'ytd') {
      for (let m=0; m<=today.getMonth(); m++) months.push({ y:today.getFullYear(), m });
    } else {
      for (let i=trendRange-1; i>=0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
        months.push({ y:d.getFullYear(), m:d.getMonth() });
      }
    }
    // Trend always spans real months, so it ignores the month filter but keeps
    // the dimension filters (category / merchant / account / status).
    const base = getFilteredTransactions(transactions, { ...filters, month:null, from:'', to:'' });
    const totals = getMonthlySpendingTotals(base);
    return {
      labels: months.map(({y,m}) => `${MONTH_NAMES[m].slice(0,3)} '${String(y).slice(2)}`),
      points: months.map(({y,m}) => safeNum(totals[`${y}-${String(m+1).padStart(2,'0')}`])),
    };
  }, [transactions, filters, trendRange, today.getFullYear(), today.getMonth()]);

  // ── Budget vs actual ──
  const budgets = useMemo(() => categoryBudgetsFor(settings, new Date(cursor.y, cursor.m, 1)), [settings, cursor]);
  const bva     = useMemo(() => getBudgetVsActual(filtered, budgets), [filtered, budgets]);
  const monthBudgetTotal = Object.values(budgets).reduce((s,v)=>s+safeNum(v),0);

  // ══════════════════════════════════════════════════════════════════
  // AI SPENDING COACH (Priority 6) — every figure here is derived from
  // the exact same `filtered`/`byCat`/`budgets` this page already
  // computes, plus one month-back comparison, so nothing can disagree
  // with the numbers shown elsewhere on this page.
  // ══════════════════════════════════════════════════════════════════
  const prevMonthDate = new Date(cursor.y, cursor.m-1, 1);
  const prevMonthKey  = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth()+1).padStart(2,'0')}`;
  const prevByCat = useMemo(
    () => getCategorySpendingTotals(getFilteredTransactions(transactions, { month: prevMonthKey })),
    [transactions, prevMonthKey]);
  // Biggest month-over-month mover among categories with real spend in both
  // months — "Dining is down 12%" reads directly off this.
  const biggestMove = useMemo(() => {
    const moves = Object.keys(byCat)
      .map(id => {
        const cur = safeNum(byCat[id]?.total), prev = safeNum(prevByCat[id]?.total);
        return { id, cur, prev, pct: prev>0 ? round2(((cur-prev)/prev)*100) : null };
      })
      .filter(m => m.prev > 0 && m.cur > 0);
    return moves.sort((a,b) => Math.abs(b.pct) - Math.abs(a.pct))[0] || null;
  }, [byCat, prevByCat]);

  const weekendTotals = useMemo(() => {
    let we = 0, wd = 0;
    for (const { t, delta } of spendingRows(filtered)) {
      const day = parseLocalDate(txDateKey(t)).getDay();
      if (day===0 || day===6) we += delta; else wd += delta;
    }
    return { we: round2(we), wd: round2(wd) };
  }, [filtered]);
  const prevWeekendTotal = useMemo(() => {
    let we = 0;
    for (const { t, delta } of spendingRows(getFilteredTransactions(transactions, { month: prevMonthKey })))
      if ([0,6].includes(parseLocalDate(txDateKey(t)).getDay())) we += delta;
    return round2(we);
  }, [transactions, prevMonthKey]);
  const weekendChangePct = prevWeekendTotal > 0 ? round2(((weekendTotals.we - prevWeekendTotal)/prevWeekendTotal)*100) : null;

  const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const weekdayTotals = useMemo(() => {
    const totals = [0,0,0,0,0,0,0];
    for (const { t, delta } of spendingRows(filtered)) totals[parseLocalDate(txDateKey(t)).getDay()] += delta;
    return totals;
  }, [filtered]);
  const maxWeekdayIdx = weekdayTotals.reduce((best,v,i) => v > weekdayTotals[best] ? i : best, 0);

  const diningLimit     = safeNum(budgets.dining);
  const diningSpent     = safeNum(byCat.dining?.total);
  const diningRemaining = round2(diningLimit - diningSpent);

  // Health score inputs — savings rate mirrors the Dashboard's own
  // definition (HYSA + Roth out of take-home) so the two never disagree.
  const budgetPctUsed = monthBudgetTotal > 0 ? safePct(totalSpend, monthBudgetTotal) : 0;
  const netMonthlyIncome = monthlyNetIncome(settings);
  const activeBudget     = activeBudgetFor(settings);
  const savingsRate      = netMonthlyIncome > 0 ? safePct(safeNum(activeBudget.hysa)+safeNum(activeBudget.rothIRA), netMonthlyIncome) : 0;
  const acctCtx = { settings, goals, netWorth };
  const maxUtilization = (accounts||[]).filter(a=>a.type==='credit' && !a.archived).reduce((max,a) => {
    const card = a.card || defaultCardFields();
    return Math.max(max, creditUtilization(accountBalance(a, acctCtx), card.creditLimit));
  }, 0);
  const overdueBillsCount = useMemo(() => {
    const billsCtx = { accounts, settings, goals, netWorth, transactions };
    const ccOverdue   = creditCardBills(accounts, billsCtx).filter(cc => !cc.paid && billStatus({recurring:true,dueDay:cc.dueDay})==='overdue').length;
    const userOverdue = (bills||[]).filter(b => billStatus(b)==='overdue').length;
    return ccOverdue + userOverdue;
  }, [accounts, bills, settings, goals, netWorth, transactions]);
  const dayProgress   = daysElapsed / Math.max(daysIn, 1);
  const healthScore   = financialHealthScore({ budgetPctUsed, savingsRate, maxUtilization, overdueBillsCount, dayProgress });
  const healthInfo    = healthLabel(healthScore);
  const healthWhyList = useMemo(() => healthReasons({ budgetPctUsed, savingsRate, maxUtilization, overdueBillsCount, dayProgress }),
    [budgetPctUsed, savingsRate, maxUtilization, overdueBillsCount, dayProgress]);

  const recommendations = useMemo(() => {
    const out = [];
    if (biggestMove && biggestMove.pct <= -10)
      out.push(`${catLabel(biggestMove.id)} is down ${Math.abs(biggestMove.pct).toFixed(0)}% from last month — nice work.`);
    if (biggestMove && biggestMove.pct >= 15)
      out.push(`${catLabel(biggestMove.id)} is up ${biggestMove.pct.toFixed(0)}% from last month — worth a look if that wasn't planned.`);
    if (diningLimit > 0) {
      out.push(diningRemaining < 0
        ? `Dining is ${currency(Math.abs(diningRemaining))} over budget this month.`
        : `You have ${currency(diningRemaining)} left in your dining budget this month.`);
    }
    if (weekendChangePct != null && weekendChangePct > 15)
      out.push(`Weekend spending is up ${weekendChangePct.toFixed(0)}% from last month.`);
    if (overdueBillsCount > 0)
      out.push(`${overdueBillsCount} bill${overdueBillsCount===1?'':'s'} overdue — check the Bills tab.`);
    if (maxUtilization > 30)
      out.push(`A credit card is above 30% utilization — an early payment could help before you apply for anything new.`);
    if (!out.length) out.push('Nothing stands out this month — spending looks steady.');
    return out;
  }, [biggestMove, diningLimit, diningRemaining, weekendChangePct, overdueBillsCount, maxUtilization]);

  // ── Day detail ──
  const dayTx = useMemo(() => {
    if (!selDate) return [];
    const rows = getTransactionsForDate(filtered, selDate);
    const cmp = {
      'amount-desc': (a,b)=>safeNum(b.amount)-safeNum(a.amount),
      'amount-asc':  (a,b)=>safeNum(a.amount)-safeNum(b.amount),
      'category':    (a,b)=>catLabel(categoryOf(a)).localeCompare(catLabel(categoryOf(b))),
      'merchant':    (a,b)=>normalizeMerchantName(a.description).localeCompare(normalizeMerchantName(b.description)),
      'time':        (a,b)=>String(a.time||'').localeCompare(String(b.time||'')),
    }[sortBy] || (()=>0);
    return [...rows].sort(cmp);
  }, [filtered, selDate, sortBy]);
  const dayTotal = selDate ? safeNum((daily[selDate]||{}).total) : 0;
  const dayCount = selDate ? safeNum((daily[selDate]||{}).count) : 0;

  // ── Category drill-down (vs previous month) ──
  const drill = useMemo(() => {
    if (!drillCat) return null;
    const cur = byCat[drillCat] || { total:0, count:0, avg:0, largest:0 };
    const prevD = new Date(cursor.y, cursor.m-1, 1);
    const prevTx = getFilteredTransactions(transactions, {
      ...filters, month:`${prevD.getFullYear()}-${String(prevD.getMonth()+1).padStart(2,'0')}`, from:'', to:'',
    });
    const prevTotal = safeNum((getCategorySpendingTotals(prevTx)[drillCat]||{}).total);
    const limit = safeNum(budgets[drillCat]);
    const pctUsed = safePct(cur.total, limit);
    const catTx = filtered.filter(t => categoryOf(t) === drillCat);
    const byDate = getDailySpendingTotals(catTx);
    return {
      ...cur, limit, prevTotal,
      hasBudget: limit > 0,
      remaining: round2(limit - cur.total),
      pctUsed,
      status: limit > 0 ? (pctUsed > 100 ? 'over' : pctUsed >= 80 ? 'near' : 'under') : null,
      delta: round2(cur.total - prevTotal),
      deltaPct: prevTotal > 0 ? safePct(cur.total - prevTotal, prevTotal) : null,
      merchants: getTopMerchants(catTx, rankMode, 8),
      largestTx: getLargestTransactionByCategory(filtered, drillCat),
      dates: Object.entries(byDate).filter(([,d])=>d.total>0).sort((a,b)=>a[0].localeCompare(b[0])),
    };
  }, [drillCat, byCat, filtered, transactions, filters, cursor, budgets, rankMode]);

  // Donut auto-falls back to ranked bars when there are too many categories.
  const catRows = Object.entries(byCat).filter(([,c])=>c.total>0)
    .map(([id,c]) => ({ key:id, label:catLabel(id), value:c.total, color:vizColor(id) }));
  const tooManySlices = catRows.length > MAX_SLICES + 2;

  const periodLabel = useRange
    ? (filters.from||filters.to ? `${filters.from||'start'} → ${filters.to||'today'}` : 'All time')
    : `${MONTH_NAMES[cursor.m]} ${cursor.y}`;
  const shiftMonth = d => setCursor(c => {
    const n = new Date(c.y, c.m+d, 1);
    return { y:n.getFullYear(), m:n.getMonth() };
  });

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Spending Insights</h2>
          <div className="page-sub">{periodLabel} · {spendCount} purchase{spendCount===1?'':'s'}</div>
        </div>
        {!useRange && (
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowReview(true)}><Icon name="receipt" size={13}/>Monthly Review</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setShowYearReview(true)}><Icon name="archive" size={13}/>Year in Review</button>
          </div>
        )}
      </div>

      {showReview && (
        <MonthlyReviewModal onClose={()=>setShowReview(false)}
          monthLabel={`${MONTH_NAMES[cursor.m]} ${cursor.y}`} monthKey={monthKey} year={cursor.y} month={cursor.m}
          income={income} totalSpend={totalSpend} largestTx={largestTx} topCatEnt={topCatEnt}
          monthBudgetTotal={monthBudgetTotal} netWorth={netWorth} accounts={accounts} monthTx={filtered}/>
      )}
      {showYearReview && (
        <YearlyReviewModal onClose={()=>setShowYearReview(false)} year={cursor.y}
          transactions={transactions} netWorth={netWorth} accounts={accounts} settings={settings}/>
      )}

      {/* ── Smart Spending Coach — deterministic, rule-based (PRD §7) ── */}
      <div>
        <div className="section-head" style={{padding:'0 0 10px'}}>Smart Spending Coach</div>
        <div className="ins-cards">
          <div className="ins-card">
            <span className="ins-card-lbl">Financial Health</span>
            <span className="ins-card-val" style={{color:healthInfo.color}}>{healthScore} · {healthInfo.label}</span>
            <span className="ins-card-sub">{healthWhyList[0]}</span>
          </div>
          <div className="ins-card">
            <span className="ins-card-lbl">Avg Spend / Day</span>
            <span className="ins-card-val">{money2(avgDaily)}</span>
            <span className="ins-card-sub">{daysElapsed} day{daysElapsed===1?'':'s'} this period</span>
          </div>
          <div className="ins-card">
            {/* Distinct from "Highest-Spend Date" below — this aggregates
                every occurrence of a weekday across the period ("Sundays
                tend to be worst"), not one specific calendar day. */}
            <span className="ins-card-lbl">Priciest Weekday</span>
            <span className="ins-card-val">{weekdayTotals[maxWeekdayIdx]>0 ? WEEKDAY_NAMES[maxWeekdayIdx] : '—'}</span>
            <span className="ins-card-sub">{money2(weekdayTotals[maxWeekdayIdx])} total this period</span>
          </div>
          <div className="ins-card">
            <span className="ins-card-lbl">Weekend Spending</span>
            <span className="ins-card-val">{money2(weekendTotals.we)}</span>
            <span className="ins-card-sub">{weekendChangePct==null ? 'no prior month to compare' : `${weekendChangePct>=0?'+':''}${weekendChangePct.toFixed(0)}% vs last month`}</span>
          </div>
          {merchants[0] && (
            <div className="ins-card">
              <span className="ins-card-lbl">Top Merchant</span>
              <span className="ins-card-val">{money2(merchants[0].total)}</span>
              <span className="ins-card-sub">at {merchants[0].name}</span>
            </div>
          )}
          {largestTx && (
            <div className="ins-card">
              <span className="ins-card-lbl">Largest Purchase</span>
              <span className="ins-card-val">{money2(largestTx.amount)}</span>
              <span className="ins-card-sub">{largestTx.description || 'Uncategorized'}</span>
            </div>
          )}
          {diningLimit > 0 && (
            <div className="ins-card">
              <span className="ins-card-lbl">Dining Budget Left</span>
              <span className="ins-card-val" style={{color:diningRemaining<0?'var(--red)':'var(--t1)'}}>{diningRemaining<0?'−':''}{money2(Math.abs(diningRemaining))}</span>
              <span className="ins-card-sub">of {money2(diningLimit)} budgeted</span>
            </div>
          )}
          {biggestMove && (
            <div className="ins-card">
              <span className="ins-card-lbl">{catLabel(biggestMove.id)} Trend</span>
              <span className="ins-card-val" style={{color:biggestMove.pct<0?'var(--accent)':'var(--red)'}}>{biggestMove.pct>=0?'+':''}{biggestMove.pct.toFixed(0)}%</span>
              <span className="ins-card-sub">vs last month</span>
            </div>
          )}
        </div>
        <div className="card" style={{borderColor:'rgba(0,200,5,.2)',background:'rgba(0,200,5,.03)',marginTop:12}}>
          <div className="card-label">Recommendations</div>
          {recommendations.map((r,i) => <div key={i} className="insight-row">{r}</div>)}
        </div>
      </div>

      {/* ── Filters (PRD §12) — search stays inline; everything else lives
          in a sheet behind a Filter button, not an always-expanded bar. ── */}
      <div className="card">
        <div className="fg" style={{marginBottom:12}}>
          <label htmlFor="f-search">Search</label>
          <input id="f-search" type="text" placeholder="Merchant, category, account, notes…"
            value={filters.search} onChange={e=>setF('search',e.target.value)}/>
        </div>
        <div className="filter-summary-row">
          <button type="button" className="filter-btn" onClick={()=>setFilterSheetOpen(true)}>
            <Icon name="chart" size={14}/> Filter
            {activeFilterChips.length>0 && <span className="filter-btn-count">{activeFilterChips.length}</span>}
          </button>
          <span style={{fontSize:'.76rem',color:'var(--t3)'}}>
            {useRange ? `${filters.from||'…'} – ${filters.to||'…'}` : new Date(cursor.y,cursor.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
          </span>
        </div>
        {activeFilterChips.length>0 && (
          <div className="filter-chips" style={{marginTop:10}}>
            {activeFilterChips.map(c => (
              <button key={c.key} type="button" className="filter-chip" onClick={c.clear}>
                {c.label}
                <span className="filter-chip-x"><Icon name="x" size={9}/></span>
              </button>
            ))}
            <button type="button" className="filter-clear-all" onClick={resetFilters}>Clear all</button>
          </div>
        )}
      </div>

      {filterSheetOpen && (
        <div className="modal-overlay" onClick={e=>{ if(e.target===e.currentTarget) setFilterSheetOpen(false); }}>
          <div className="modal-card modal-card-lg">
            <div className="modal-hd">
              <div className="modal-title">Filters</div>
              <button className="btn-icon" onClick={()=>setFilterSheetOpen(false)} aria-label="Close"><Icon name="x" size={18}/></button>
            </div>
            <div className="modal-body">
              <div className="flt-bar">
                <div className="flt-field">
                  <label htmlFor="f-period">Period</label>
                  <select id="f-period" value={useRange?'range':'month'} onChange={e=>setUseRange(e.target.value==='range')}>
                    <option value="month">By month</option>
                    <option value="range">Custom range</option>
                  </select>
                </div>
                {useRange ? (
                  <>
                    <div className="flt-field">
                      <label htmlFor="f-from">From</label>
                      <input id="f-from" type="date" value={filters.from} onChange={e=>setF('from',e.target.value)}/>
                    </div>
                    <div className="flt-field">
                      <label htmlFor="f-to">To</label>
                      <input id="f-to" type="date" value={filters.to} onChange={e=>setF('to',e.target.value)}/>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="flt-field">
                      <label htmlFor="f-month">Month</label>
                      <select id="f-month" value={cursor.m} onChange={e=>setCursor(c=>({...c,m:+e.target.value}))}>
                        {MONTH_NAMES.map((n,i) => <option key={n} value={i}>{n}</option>)}
                      </select>
                    </div>
                    <div className="flt-field">
                      <label htmlFor="f-year">Year</label>
                      <select id="f-year" value={cursor.y} onChange={e=>setCursor(c=>({...c,y:+e.target.value}))}>
                        {[...Array(7)].map((_,i) => {
                          const y = today.getFullYear()-3+i;
                          return <option key={y} value={y}>{y}</option>;
                        })}
                      </select>
                    </div>
                  </>
                )}
                <div className="flt-field">
                  <label htmlFor="f-cat">Category</label>
                  <select id="f-cat" value={filters.category} onChange={e=>setF('category',e.target.value)}>
                    <option value="all">All categories</option>
                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                    <option value="uncategorized">Uncategorized</option>
                  </select>
                </div>
                <div className="flt-field">
                  <label htmlFor="f-merch">Merchant</label>
                  <select id="f-merch" value={filters.merchant} onChange={e=>setF('merchant',e.target.value)}>
                    <option value="all">All merchants</option>
                    {allMerchants.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div className="flt-field">
                  <label htmlFor="f-acct">Account</label>
                  <select id="f-acct" value={filters.account} onChange={e=>setF('account',e.target.value)}>
                    <option value="all">All accounts</option>
                    {allAccounts.map(a => <option key={a} value={a}>{a}</option>)}
                  </select>
                </div>
                <div className="flt-field">
                  <label htmlFor="f-status">Status</label>
                  <select id="f-status" value={filters.status} onChange={e=>setF('status',e.target.value)}>
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                  </select>
                </div>
                <div className="flt-field">
                  <label htmlFor="f-type">Type</label>
                  <select id="f-type" value={filters.type} onChange={e=>setF('type',e.target.value)}>
                    <option value="all">All</option>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                    <option value="transfer">Transfer</option>
                    <option value="recurring">Recurring</option>
                  </select>
                </div>
                <div className="flt-field">
                  <label htmlFor="f-pm">Payment Method</label>
                  <select id="f-pm" value={filters.paymentMethod} onChange={e=>setF('paymentMethod',e.target.value)}>
                    <option value="all">All methods</option>
                    {PAYMENT_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                    <option value="Transfer">Transfer</option>
                    <option value="Recurring">Recurring</option>
                  </select>
                </div>
                <div className="flt-field" style={{flex:'1 1 90px'}}>
                  <label htmlFor="f-min">Min Amount</label>
                  <input id="f-min" type="number" min="0" step="1" placeholder="$0" value={filters.minAmount} onChange={e=>setF('minAmount',e.target.value)}/>
                </div>
                <div className="flt-field" style={{flex:'1 1 90px'}}>
                  <label htmlFor="f-max">Max Amount</label>
                  <input id="f-max" type="number" min="0" step="1" placeholder="Any" value={filters.maxAmount} onChange={e=>setF('maxAmount',e.target.value)}/>
                </div>
              </div>
              <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                <button type="button" className="btn btn-ghost" onClick={resetFilters}>Reset Filters</button>
                <button type="button" className="btn btn-primary" onClick={()=>setFilterSheetOpen(false)}>Done</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Summary cards ── */}
      <div className="ins-cards">
        <div className="ins-card">
          <span className="ins-card-lbl">Total Spending</span>
          <span className="ins-card-val">{money2(totalSpend)}</span>
          <span className="ins-card-sub">{spendCount} transaction{spendCount===1?'':'s'}</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Total Income</span>
          <span className="ins-card-val" style={{color:'var(--accent)'}}>{money2(income)}</span>
          <span className="ins-card-sub">paychecks &amp; other income</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Net Cash Flow</span>
          <span className="ins-card-val" style={{color:income-totalSpend>=0?'var(--accent)':'var(--red)'}}>
            {income-totalSpend>=0?'+':'−'}{money2(Math.abs(income-totalSpend))}
          </span>
          <span className="ins-card-sub">income − spending</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Avg / Day</span>
          <span className="ins-card-val">{money2(avgDaily)}</span>
          <span className="ins-card-sub">over {daysElapsed} day{daysElapsed===1?'':'s'}</span>
        </div>
        {topCatEnt ? (
          <button type="button" className="ins-card" onClick={()=>setDrillCat(topCatEnt[0])}>
            <span className="ins-card-lbl">Top Category</span>
            <span className="ins-card-val">{catLabel(topCatEnt[0])}</span>
            <span className="ins-card-sub">{money2(topCatEnt[1].total)}</span>
            <span className="ins-card-link">View breakdown →</span>
          </button>
        ) : (
          <div className="ins-card"><span className="ins-card-lbl">Top Category</span>
            <span className="ins-card-val">—</span><span className="ins-card-sub">no spending yet</span></div>
        )}
        {peakDay ? (
          <button type="button" className="ins-card" onClick={()=>setSelDate(peakDay[0])}>
            <span className="ins-card-lbl">Highest-Spend Date</span>
            <span className="ins-card-val">{money2(peakDay[1].total)}</span>
            <span className="ins-card-sub">
              {parseLocalDate(peakDay[0]).toLocaleDateString('en-US',{month:'long',day:'numeric'})}
            </span>
            <span className="ins-card-link">See the day →</span>
          </button>
        ) : (
          <div className="ins-card"><span className="ins-card-lbl">Highest-Spend Date</span>
            <span className="ins-card-val">—</span><span className="ins-card-sub">no spending yet</span></div>
        )}
        <div className="ins-card">
          <span className="ins-card-lbl">Largest Purchase</span>
          <span className="ins-card-val">{largestTx?money2(largestTx.amount):'—'}</span>
          <span className="ins-card-sub">{largestTx?largestTx.description:'no spending yet'}</span>
        </div>
        <div className="ins-card">
          <span className="ins-card-lbl">Budget Used</span>
          <span className="ins-card-val">{monthBudgetTotal>0?pct(safePct(totalSpend,monthBudgetTotal),0):'—'}</span>
          <span className="ins-card-sub">
            {monthBudgetTotal>0?`of ${money0(monthBudgetTotal)} budgeted`:'no budget for this month'}
          </span>
        </div>
      </div>

      {/* ── Calendar ── */}
      <div>
        <div className="cal-head">
          <div className="cal-nav">
            <button className="cal-btn" onClick={()=>shiftMonth(-1)} aria-label="Previous month">
              <Icon name="chevronLeft" size={15}/>
            </button>
            <button className="cal-btn" onClick={()=>setCursor({y:today.getFullYear(),m:today.getMonth()})}>Today</button>
            <button className="cal-btn" onClick={()=>shiftMonth(1)} aria-label="Next month">
              <Icon name="chevronRight" size={15}/>
            </button>
          </div>
          <div className="cal-title">{MONTH_NAMES[cursor.m]} {cursor.y}</div>
          <div style={{fontSize:'.7rem',color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
            {money0(Object.values(daily).reduce((s,d)=>s+d.total,0))} this month
          </div>
        </div>
        {useRange && (
          <div style={{fontSize:'.66rem',color:'var(--t3)',marginBottom:8}}>
            Calendar follows the month above; cards and charts follow your custom range.
          </div>
        )}
        <div className="cal-grid" role="grid" aria-label="Monthly spending calendar">
          {DOW.map(d => <div key={d} className="cal-dow" role="columnheader">{d}</div>)}
          {cells.map(c => {
            if (c.empty) return <div key={c.key} className="cal-cell cal-cell-empty" aria-hidden="true"/>;
            const has = c.total > 0;
            const heat = has ? heatOf(c.total) : 0;
            const cls = ['cal-cell', !has&&'cal-cell-quiet', c.key===todayKey&&'cal-cell-today',
                         c.key===selDate&&'cal-cell-sel', has&&c.key===peakKey&&'cal-cell-peak']
                        .filter(Boolean).join(' ');
            return (
              <button key={c.key} className={cls} onClick={()=>setSelDate(s=>s===c.key?null:c.key)}
                aria-pressed={c.key===selDate}
                style={has ? { background:`color-mix(in srgb, var(--red) ${(8+heat*42).toFixed(0)}%, transparent)` } : undefined}
                aria-label={`${parseLocalDate(c.key).toLocaleDateString('en-US',{month:'long',day:'numeric'})}: ${has?`${money2(c.total)} across ${c.count} transaction${c.count===1?'':'s'}`:'no spending'}${c.key===peakKey&&has?' — highest spending day':''}`}>
                <span className="cal-daynum">{c.day}</span>
                {has && <span className="cal-dot" aria-hidden="true"/>}
                {has && <span className="cal-amt">{money0(c.total)}</span>}
                {has && <span className="cal-cnt">{c.count} tx</span>}
                {has && c.key===peakKey && <span className="cal-peak-tag" aria-hidden="true">peak</span>}
              </button>
            );
          })}
        </div>
      </div>

      {/* ── Day detail ── */}
      {selDate && (
        <div className="day-panel">
