<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / theme -->
  <meta name="theme-color" content="#060606" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Generate apple-touch-icon as PNG via canvas (iOS requires PNG) -->
  <script>
  (function(){
    try {
      var sz = 180, r = 40;
      var c = document.createElement('canvas');
      c.width = c.height = sz;
      var x = c.getContext('2d');
      x.fillStyle = '#111111';
      x.beginPath();
      x.moveTo(r,0); x.lineTo(sz-r,0);
      x.quadraticCurveTo(sz,0,sz,r);
      x.lineTo(sz,sz-r);
      x.quadraticCurveTo(sz,sz,sz-r,sz);
      x.lineTo(r,sz);
      x.quadraticCurveTo(0,sz,0,sz-r);
      x.lineTo(0,r);
      x.quadraticCurveTo(0,0,r,0);
      x.closePath();
      x.fill();
      x.fillStyle = '#00C805';
      x.font = 'bold 112px -apple-system,Helvetica Neue,sans-serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText('$', sz/2, sz/2 + 4);
      var l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.sizes = '180x180';
      l.href = c.toDataURL('image/png');
      document.head.appendChild(l);
    } catch(e){}
  })();
  </script>

  <title>Finance</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:      #060606;
  --s1:      #0d0d0d;
  --s2:      #111111;
  --s3:      #171717;
  --border:  rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);

  /* Primary accent — Robinhood green */
  --accent:    #00C805;
  --accent-dk: #00a004;
  --accent-lt: rgba(0,200,5,.08);

  /* Blue kept only for form focus rings */
  --blue:    #3b82f6;
  --blue-dk: #2563eb;
  --blue-lt: rgba(59,130,246,.1);

  --green:    #00C805;
  --green-lt: rgba(0,200,5,.08);
  --red:      #FF5000;
  --red-lt:   rgba(255,80,0,.1);
  --yellow:   #F5A623;
  --yellow-lt:rgba(245,166,35,.1);
  --purple:   #7B74FF;
  --purple-lt:rgba(123,116,255,.12);

  --t1: #ffffff;
  --t2: #c0c0c0;
  --t3: #484848;
  --t4: #2a2a2a;

  --r:   14px;
  --r-s: 10px;

  --shadow: 0 0 0 1px var(--border);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv01','cv02','ss01','cv11';
}
button{cursor:pointer;font-family:inherit;transition:background .1s,color .1s,opacity .1s,transform .08s}
input,select,textarea{font-family:inherit}
/* Remove iOS blue tap flash */
button,a,input,select{-webkit-tap-highlight-color:transparent}
/* Prevent iOS text-size adjustment on rotate */
html{-webkit-text-size-adjust:100%}

/* ── Shell ──────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100dvh}

.header{
  position:sticky;top:0;z-index:100;
  background:rgba(6,6,6,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  /* Extend into the notch / Dynamic Island area */
  padding-top:env(safe-area-inset-top);
}
.header-inner{
  max-width:1040px;margin:0 auto;padding:0 28px;
  height:50px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.logo{
  font-size:.875rem;font-weight:700;letter-spacing:-.03em;color:var(--t1);
  white-space:nowrap;user-select:none;display:flex;align-items:center;gap:7px;
}
.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);flex-shrink:0;
}

/* Nav — underline style like Robinhood */
.nav{display:flex;align-items:center;gap:0;border-bottom:none}
.nav-btn{
  background:none;border:none;
  padding:0 14px;height:50px;
  font-size:.775rem;font-weight:500;color:var(--t3);
  white-space:nowrap;letter-spacing:.01em;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
  position:relative;top:1px;
}
.nav-btn:hover{color:var(--t2)}
.nav-btn.active{color:var(--t1);font-weight:600;border-bottom-color:var(--accent)}

.main{flex:1;padding-bottom:64px}

.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:rgba(6,6,6,.98);
  border-top:1px solid var(--border);z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.mnav-btn{
  flex:1;background:none;border:none;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--t3);transition:color .12s;
}
.mnav-btn.active{color:var(--accent)}
.nav-pip{width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* ── Page ───────────────────────────────────────────────────────────── */
.page{
  max-width:1040px;margin:0 auto;
  padding:36px 28px 56px;
  display:flex;flex-direction:column;gap:24px;
}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{font-size:1.25rem;font-weight:700;letter-spacing:-.035em;color:var(--t1);line-height:1.1}
.page-sub{font-size:.72rem;color:var(--t3);margin-top:4px;letter-spacing:.01em}

/* ── Badges ─────────────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:var(--r-s);
  font-size:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.badge-blue  {background:var(--blue-lt);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.badge-green {background:var(--green-lt);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge-yellow{background:var(--yellow-lt);color:var(--yellow);border:1px solid rgba(234,179,8,.2)}
.badge-purple{background:var(--purple-lt);color:var(--purple);border:1px solid rgba(167,139,250,.2)}
.badge-red   {background:var(--red-lt);color:var(--red);border:1px solid rgba(239,68,68,.2)}

/* ── Section label ──────────────────────────────────────────────────── */
.slabel{
  font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);
  padding-bottom:12px;display:flex;align-items:center;gap:10px;
}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Cards ──────────────────────────────────────────────────────────── */
.card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 24px;
}
.card-label{
  font-size:.6rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);margin-bottom:14px;
}

/* ── Grids ───────────────────────────────────────────────────────────── */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

/* ── Stat cards ──────────────────────────────────────────────────────── */
.stat{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 22px;
}
.stat-label{
  font-size:.58rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);margin-bottom:10px;
}
.stat-val{
  font-size:1.85rem;font-weight:700;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;color:var(--t1);line-height:1;
}
.stat-sub{font-size:.68rem;color:var(--t3);margin-top:6px}
.stat-blue  .stat-val{color:var(--blue)}
.stat-green .stat-val{color:var(--green)}
.stat-red   .stat-val{color:var(--red)}

/* ── Income equation ─────────────────────────────────────────────────── */
.income-eq{
  display:flex;align-items:stretch;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
}
.eq-item{flex:1;padding:20px 20px 18px;border-right:1px solid var(--border)}
.eq-item:last-child{border-right:none;background:var(--accent-lt)}
.eq-label{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.eq-num{font-size:1.5rem;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.eq-note{font-size:.62rem;color:var(--t3);margin-top:5px;line-height:1.4}
.eq-op{
  display:flex;align-items:center;justify-content:center;
  padding:0 2px;color:var(--t4);font-size:.9rem;flex-shrink:0;
}
.c-blue  {color:var(--blue)}
.c-green {color:var(--green)}
.c-red   {color:var(--red)}
.c-yellow{color:var(--yellow)}
.c-muted {color:var(--t3)}

/* ── Surplus ─────────────────────────────────────────────────────────── */
.surplus{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;
}
.surplus-ok {border-color:rgba(34,197,94,.25);background:rgba(34,197,94,.04)}
.surplus-over{border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.04)}
.surplus-label{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.surplus-num{font-size:2.5rem;font-weight:700;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:1}
.surplus-eq{font-size:.68rem;color:var(--t3);margin-top:6px}
.surplus-right{text-align:right}
.surplus-phase{font-size:.68rem;color:var(--t3);margin-top:6px}

/* ── Budget rows ─────────────────────────────────────────────────────── */
.brow{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:.84rem;
}
.brow:last-child{border-bottom:none}
.brow-label{color:var(--t2);font-weight:400}
.brow-val{font-weight:600;font-variant-numeric:tabular-nums;color:var(--t1)}
.brow-full{padding:12px 0;border-bottom:1px solid var(--border)}
.brow-full:last-child{border-bottom:none}
.brow-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.84rem}

/* ── Progress ────────────────────────────────────────────────────────── */
.track{height:3px;background:var(--s3);border-radius:99px;overflow:hidden}
.track-lg{height:6px}
.fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── Buttons ─────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--r-s);
  font-size:.775rem;font-weight:600;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent-dk)}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-sm{padding:5px 11px;font-size:.72rem}
.btn-full{width:100%;padding:11px;font-size:.85rem;justify-content:center;margin-top:6px}
.btn-ghost{background:transparent;color:var(--t2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--s2);color:var(--t1)}
.btn-icon{background:none;border:none;color:var(--t3);padding:5px;border-radius:var(--r-s);font-size:.8rem}
.btn-icon:hover{background:var(--s3);color:var(--t2)}
.btn-icon-del:hover{background:var(--red-lt);color:var(--red)}
.btn-link{background:none;border:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0}

/* ── Month nav ───────────────────────────────────────────────────────── */
.month-nav{display:flex;align-items:center;justify-content:center;gap:14px}
.month-arrow{
  background:var(--s1);border:1px solid var(--border);color:var(--t2);
  width:30px;height:30px;border-radius:var(--r-s);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;
}
.month-arrow:hover{border-color:var(--border2);color:var(--t1)}
.month-name{font-size:.875rem;font-weight:600;letter-spacing:-.02em;min-width:160px;text-align:center;color:var(--t1)}

/* ── Forms ───────────────────────────────────────────────────────────── */
.form-card{border-color:rgba(59,130,246,.2)!important;background:rgba(59,130,246,.04)!important}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fspan{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.fg input,.fg select,.fg textarea{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:8px 12px;font-size:.84rem;
  outline:none;width:100%;transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15);
}
.fg select{appearance:none;cursor:pointer}
.factions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;padding-top:4px}

/* ── Transaction rows ─────────────────────────────────────────────────── */
.tx-list{display:flex;flex-direction:column}
.tx-row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--border)}
.tx-row:last-child{border-bottom:none}
.tx-icon{
  width:32px;height:32px;border-radius:var(--r-s);
  background:var(--s3);display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;color:var(--t2);flex-shrink:0;letter-spacing:.04em;
}
.tx-body{flex:1;min-width:0}
.tx-desc{font-size:.84rem;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:.68rem;color:var(--t3);margin-top:2px}
.tx-amt{font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-del{background:none;border:none;color:var(--t4);padding:4px;border-radius:var(--r-s);cursor:pointer}
.tx-del:hover{background:var(--red-lt);color:var(--red)}

/* ── Commission ──────────────────────────────────────────────────────── */
.split-banner{
  display:flex;align-items:center;gap:12px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;
}
.split-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--r-s);font-size:.75rem;font-weight:600;
}
.split-hysa    {background:var(--green-lt);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.split-personal{background:var(--blue-lt);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.split-div{color:var(--t4);font-size:.85rem}

.comm-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
.comm-row:last-child{border-bottom:none}
.comm-amt{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.comm-note{font-size:.72rem;color:var(--t2);margin-top:2px}
.comm-date{font-size:.68rem;color:var(--t3);margin-top:2px}
.comm-splits{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.comm-s{font-size:.68rem;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:var(--r-s)}
.comm-s-green{background:var(--green-lt);color:var(--green)}
.comm-s-blue {background:var(--blue-lt);color:var(--blue)}

/* ── Goals ───────────────────────────────────────────────────────────── */
.goal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.goal-title{font-size:.95rem;font-weight:600;letter-spacing:-.02em;color:var(--t1)}
.goal-sub{font-size:.68rem;color:var(--t3);margin-top:3px}
.goal-amounts{text-align:right;flex-shrink:0}
.goal-curr{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.goal-max{font-size:.68rem;color:var(--t3);margin-top:3px}
.goal-stats{display:flex;justify-content:space-between;font-size:.68rem;color:var(--t3);margin-top:8px}
.goal-proj{font-size:.7rem;color:var(--t3);margin-top:10px;padding:9px 12px;background:var(--s2);border-radius:var(--r-s);line-height:1.5}
.goal-update{display:flex;gap:8px;margin-top:14px}
.goal-update input{
  flex:1;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:7px 11px;font-size:.78rem;outline:none;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.goal-update input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* ── Net Worth ───────────────────────────────────────────────────────── */
.nw-bar-wrap{margin:12px 0}
.nw-bar{height:5px;border-radius:99px;background:var(--s3);overflow:hidden;display:flex}
.nw-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Account input rows */
.nw-row{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border)}
.nw-row:last-child{border-bottom:none}
.nw-row-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.nw-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nw-label{font-size:.84rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-input{
  width:120px;background:var(--s2);border:1px solid var(--border2);
  border-radius:var(--r-s);color:var(--t1);padding:5px 9px;
  font-size:.84rem;text-align:right;outline:none;flex-shrink:0;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.nw-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* Horizontal bar chart */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar-row:last-child{margin-bottom:0}
.hbar-label{width:110px;flex-shrink:0;color:var(--t2);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{flex:1;height:5px;background:var(--s3);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:3px}
.hbar-val{width:72px;text-align:right;flex-shrink:0;color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums;font-size:.75rem}

/* SVG line chart */
.chart-wrap{background:var(--s2);border-radius:var(--r-s);padding:14px 10px 6px;overflow:hidden}
.chart-empty{height:80px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.75rem}

/* History table */
.hist-row{
  display:grid;grid-template-columns:58px 1fr 1fr 28px;
  padding:9px 0;border-bottom:1px solid var(--border);align-items:center;
}
.hist-row:last-child{border-bottom:none}
.hist-head{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.hist-mono{font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:500}

/* ── Settings ────────────────────────────────────────────────────────── */
.settings-group{display:flex;flex-direction:column;gap:5px}
.settings-group label{font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.settings-group input{
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r-s);
  color:var(--t1);padding:8px 12px;font-size:.84rem;outline:none;width:100%;
  transition:border-color .15s,box-shadow .15s;font-feature-settings:'tnum';
}
.settings-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.settings-remaining{padding:8px 12px;border-radius:var(--r-s);font-size:.72rem;font-weight:600}
.rem-ok  {background:var(--green-lt);color:var(--green)}
.rem-over{background:var(--red-lt);color:var(--red)}

/* ── Budget tab ──────────────────────────────────────────────────────── */
.budget-col-header{

/* ── Responsive ──────────────────────────────────────────────────────── */
@media(max-width:700px){
  .header-inner{padding:0 18px}

  .mobile-nav{display:flex}
  .page{
    gap:18px;
    padding-top:20px;
    padding-left:max(18px,env(safe-area-inset-left));
    padding-right:max(18px,env(safe-area-inset-right));
    /* Nav bar (~60px) + safe area inset so last item clears the bar */
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
  }
  .g3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .income-eq{flex-direction:column}

  .settings-grid{grid-template-columns:1fr}

  .btn{min-height:44px;padding-left:18px;padding-right:18px}

<script id="app-src" type="text/jsx-source">

// ── Helpers ────────────────────────────────────────────────────────────
function parseLocalDate(str) {
  if (!str) return new Date();
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
const currency = (n, dec=0) =>
  new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:dec}).format(n||0);
const pct = (n,d=1) => (n||0).toFixed(d)+'%';

function getPhaseInfo(startDateStr) {
  const start = parseLocalDate(startDateStr);
  const now   = new Date();
  const idx   = (now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())+1;
  return {
    idx,
    isPreEmployment: idx <= 0,
    isEarly:         idx >= 1 && idx <= 3,
    isFull:          idx >= 4,
  };
}

function deepMerge(def, stored) {
  if (Array.isArray(def)) return Array.isArray(stored) ? stored : def;
  if (!stored || typeof stored !== 'object') return def;
  const out = { ...def };
  for (const k of Object.keys(def)) {
    if (k in stored) {
      if (Array.isArray(def[k])) {
        out[k] = Array.isArray(stored[k]) ? stored[k] : def[k];
      } else if (stored[k] && typeof stored[k] === 'object') {
        out[k] = deepMerge(def[k], stored[k]);
      } else {
        out[k] = stored[k];
      }
    }
  }
  return out;
}

function usePersist(key, def) {
  const [val, setVal] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return def;
      return deepMerge(def, JSON.parse(raw));
    } catch { return def; }
  });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
  return [val, setVal];
}

// ── Sparkline (decorative upward trend) ───────────────────────────
function Sparkline() {
  const pts = [42,40,44,39,46,43,48,44,50,46,54,49,57,52,60,55,62,57,65,60,67,62,70,64,72,67,75,70,78,73,80,76,82];
  const w = 560, h = 80;
  const min = Math.min(...pts), max = Math.max(...pts);
  const coords = pts.map((v,i) => {
    const x = (i/(pts.length-1))*w;
    const y = h - ((v-min)/(max-min))*(h*0.72) - h*0.1;
    return [x,y];
  });
  const line = 'M ' + coords.map(([x,y]) => `${x},${y}`).join(' L ');
  const area = line + ` L ${w},${h} L 0,${h} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{display:'block',overflow:'visible'}}>
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#00C805" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#00C805" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill="url(#sg)"/>
      <path d={line} fill="none" stroke="#00C805" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={coords[coords.length-1][0]} cy={coords[coords.length-1][1]} r="3.5" fill="#00C805"/>
      <circle cx={coords[coords.length-1][0]} cy={coords[coords.length-1][1]} r="7" fill="#00C805" opacity="0.15"/>
    </svg>
  );
}

  { id:'goals',     label:'Goals',      short:'Goals',  icon:'goals'  },
  { id:'commission',label:'Commission', short:'Comm',   icon:'comm'   },
  { id:'networth',  label:'Net Worth',  short:'Worth',  icon:'worth'  },
  { id:'settings',  label:'Settings',   short:'More',   icon:'more'   },
];

const CATEGORIES = [
  { id:'housing',   label:'Housing',          abbr:'HSG', color:'var(--blue)'  },
  { id:'groceries', label:'Groceries',         abbr:'GRC', color:'var(--green)' },
  { id:'gas',       label:'Gas',               abbr:'GAS', color:'var(--yellow)'},
  { id:'dining',    label:'Dining',            abbr:'DIN', color:'#f97316'      },
  { id:'shopping',  label:'Shopping',          abbr:'SHP', color:'var(--purple)'},
  { id:'travel',    label:'Travel',            abbr:'TRV', color:'#06b6d4'      },
  { id:'utilities', label:'Utilities',         abbr:'UTL', color:'var(--yellow)'},
  { id:'savings',   label:'Savings',           abbr:'SAV', color:'var(--green)' },
  { id:'other',     label:'Other',             abbr:'OTH', color:'var(--t3)'    },
];

// ── Dashboard ─────────────────────────────────────────────────────────
function Dashboard({ settings, transactions, goals, commissions }) {
  const phase = getPhaseInfo(settings.startDate);
  const now   = new Date();

  const budget     = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const eb         = settings.earlyBudget;
  // Savings rate = HYSA + Roth IRA from take-home (401k already deducted pre-tax before take-home)
  const monthlyContrib = (budget.hysa||0) + (budget.rothIRA||0);
  const savingsRate    = settings.takeHome > 0 ? (monthlyContrib / settings.takeHome) * 100 : 0;

  const totalBudgeted = phase.isEarly || phase.isPreEmployment
    ? (eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0)
    : (budget.rentAndFee||0)+(budget.utilities||0)+(budget.rentersInsurance||0)+(budget.rothIRA||0)+(budget.hysa||0)+(budget.groceries||0)+(budget.gas||0)+(budget.funTravel||0)+(budget.outToEat||0)+(budget.shopping||0);
  const surplus = settings.takeHome - totalBudgeted;

  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthTx  = transactions.filter(t=>t.date.startsWith(monthStr)&&t.type==='expense');
  const totalSpent = monthTx.reduce((s,t)=>s+t.amount, 0);
  const byCategory = {};
  for (const t of monthTx) byCategory[t.category]=(byCategory[t.category]||0)+t.amount;
  const recentTx = [...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  // Paycheck breakdown rows
  const paycheckRows = [
    { icon:'dollar', iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Gross Monthly',   sub:currency(settings.grossBase*12)+' / yr base',     val:currency(settings.grossBase),          vc:'var(--t1)'    },
    { icon:'receipt',iconBg:'rgba(255,80,0,.1)',   iconClr:'#FF5000', name:'Tax & FICA',       sub:'Federal + GA + FICA',                             val:'−'+currency(settings.federalTax),     vc:'var(--red)'   },
    { icon:'bank',   iconBg:'rgba(245,166,35,.1)', iconClr:'#F5A623', name:'401(k) Pre-Tax',   sub:pct(settings.contribution401k/settings.grossBase*100,0)+' contribution',val:'−'+currency(settings.contribution401k),vc:'var(--yellow)'},
    { icon:'check',  iconBg:'rgba(0,200,5,.08)',   iconClr:'#00C805', name:'Take-Home',        sub:'Hits your account',                               val:currency(settings.takeHome),           vc:'var(--green)' },
  ];

  // Category bars for "This Month" (only show if transactions exist)
  const catSpendRows = phase.isEarly || phase.isPreEmployment ? [
    { label:'Utilities',  cat:'utilities', budget:budget.utilitiesAndFee },
    { label:'Savings',    cat:'savings',   budget:(budget.rothIRA||0)+(budget.hysa||0) },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ] : [
    { label:'Housing',    cat:'housing',   budget:budget.rentAndFee },
    { label:'Utilities',  cat:'utilities', budget:budget.utilities },
    { label:'Savings',    cat:'savings',   budget:(budget.rothIRA||0)+(budget.hysa||0) },
    { label:'Groceries',  cat:'groceries', budget:budget.groceries },
    { label:'Gas',        cat:'gas',       budget:budget.gas },
    { label:'Dining',     cat:'dining',    budget:budget.outToEat },
    { label:'Shopping',   cat:'shopping',  budget:budget.shopping },
    { label:'Travel',     cat:'travel',    budget:budget.funTravel },
  ];

  let phaseBadge;
  if (phase.isPreEmployment)   phaseBadge = <span className="badge badge-purple">Pre-Employment</span>;
  else if (phase.isEarly)      phaseBadge = <span className="badge badge-green">Month {phase.idx} · Rent-Free</span>;
  else                         phaseBadge = <span className="badge badge-blue">Month {phase.idx} · Full Budget</span>;

  return (
    <div className="page">

      {/* Hero ─ take-home */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Monthly Take-Home</div>
        <div className="mega" style={{color:'var(--t1)'}}>{currency(settings.takeHome)}</div>
        <div style={{fontSize:'.85rem',color:'var(--accent)',marginTop:10,fontWeight:500,display:'flex',alignItems:'center',gap:5}}>
          <Icon name="trendUp" size={14} color="var(--accent)" strokeWidth={2}/>
          {currency(settings.grossOTE*12-settings.grossBase*12)} OTE upside / yr
        </div>
      </div>

      {/* Sparkline */}
      <div style={{marginTop:4,marginBottom:4}}>
        <Sparkline />
      </div>

      {/* Stat strip */}
      <div style={{display:'flex',gap:0}}>
        {[
          { lbl:'Base',         val:currency(settings.grossBase), sub:currency(settings.grossBase*12)+'/yr', c:'var(--t1)' },
          { lbl:'OTE',          val:currency(settings.grossOTE),  sub:currency(settings.grossOTE*12)+'/yr',  c:'var(--accent)' },
          { lbl:'Savings Rate', val:pct(savingsRate,0),           sub:currency(monthlyContrib)+'/mo saved',   c:'var(--accent)' },
        ].map((s,i,arr) => (
          <div key={s.lbl} style={{
            flex:1, paddingRight:i<arr.length-1?16:0, marginRight:i<arr.length-1?16:0,
            borderRight: i<arr.length-1 ? '1px solid var(--border)' : 'none',
          }}>
            <div style={{fontSize:'.6rem',fontWeight:600,color:'var(--t3)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:5}}>{s.lbl}</div>
            <div style={{fontSize:'1.1rem',fontWeight:700,letterSpacing:'-.02em',fontVariantNumeric:'tabular-nums',color:s.c}}>{s.val}</div>
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:2}}>{s.sub}</div>
          </div>
        ))}
      </div>

      {/* Paycheck Breakdown */}
      <div>
        <div className="section-head">Paycheck Breakdown</div>
        <div className="card-flush">
          {paycheckRows.map(r => (
            <div key={r.name} className="v-row">
              <div className="v-row-left">
                <div className="v-row-icon" style={{background:r.iconBg}}>
                  <Icon name={r.icon} size={16} color={r.iconClr} strokeWidth={1.7}/>
                </div>
                <div>
                  <div className="v-row-name">{r.name}</div>
                  <div className="v-row-sub">{r.sub}</div>
                </div>
              </div>
              <div className="v-row-val" style={{color:r.vc}}>{r.val}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Monthly surplus */}
      {!phase.isPreEmployment && (
        <div style={{
          background:surplus>=0?'var(--accent-lt)':'rgba(255,80,0,.08)',
          border:'1px solid '+(surplus>=0?'rgba(0,200,5,.2)':'rgba(255,80,0,.2)'),
          borderRadius:'var(--r)', padding:'18px 20px',
          display:'flex', alignItems:'center', justifyContent:'space-between',
        }}>
          <div>
            <div className="eyebrow" style={{marginBottom:6}}>Monthly Surplus</div>
            <div style={{fontSize:'1.75rem',fontWeight:800,letterSpacing:'-.04em',fontVariantNumeric:'tabular-nums',
              color:surplus>=0?'var(--green)':'var(--red)',lineHeight:1}}>
              {surplus>=0?'+':''}{currency(surplus)}
            </div>
            <div style={{fontSize:'.72rem',color:'var(--t3)',marginTop:5}}>
              {currency(settings.takeHome)} − {currency(totalBudgeted)} budgeted
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            {phaseBadge}
            <div style={{fontSize:'.68rem',color:'var(--t3)',marginTop:6}}>
              {phase.isEarly ? 'Rent-free thru Month 3' : 'Full budget active'}
            </div>
          </div>
        </div>
      )}

      {/* This Month spending bars */}
      {!phase.isPreEmployment && (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
            <div className="section-head" style={{padding:0,marginBottom:0}}>This Month</div>
            <div style={{fontSize:'.78rem',color:'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
              {currency(totalSpent)} spent
            </div>
          </div>
          <div className="card-flush">
            {catSpendRows.filter(r=>r.budget>0).map(r => {
              const s = byCategory[r.cat]||0;
              const p_ = r.budget>0 ? Math.min((s/r.budget)*100,100) : 0;
              const cls = p_>=100?'over':p_>=80?'warn':'';
              return (
                <div key={r.cat} className="sp-cat">
                  <div className="sp-top">
                    <span className="sp-name">{r.label}</span>
                    <span className="sp-nums">
                      <span className="sp-spent">{currency(s)}</span>
                      <span className="sp-bgt"> / {currency(r.budget)}</span>
                    </span>
                  </div>
                  <div className="bar"><div className={`bar-in ${cls}`} style={{width:`${p_||0}%`}}/></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Pre-employment placeholder */}
      {phase.isPreEmployment && (
        <div className="card" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{fontSize:'1.1rem',fontWeight:700,color:'var(--t1)',marginBottom:8}}>Pre-Employment Setup</div>
          <div style={{color:'var(--t3)',fontSize:'.8rem',maxWidth:360,margin:'0 auto',lineHeight:1.6}}>
            Financial tracking starts July 2026. Use this time to configure your settings, open your HYSA, and set up your Roth IRA.
          </div>
        </div>
      )}

      {/* Recent activity */}
      {recentTx.length > 0 && (
        <div>
          <div className="section-head">Recent Activity</div>
          <div className="card-flush">
            <div className="tx-list">
              {recentTx.map(t => {
                const cat = CATEGORIES.find(c=>c.id===t.category);
                return (
                  <div key={t.id} className="tx-row">
                    <div className="tx-icon">{cat?.abbr||'OTH'}</div>
                    <div className="tx-body">
                      <div className="tx-desc">{t.description}</div>
                      <div className="tx-meta">{cat?.label} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                    </div>
                    <div className="tx-amt" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>
                      {t.type==='income'?'+':'-'}{currency(t.amount)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Budget Tab ─────────────────────────────────────────────────────────
function Budget({ settings, transactions }) {
  const phase = getPhaseInfo(settings.startDate);
  // Default the toggle to whichever phase is currently active
  const [sel, setSel] = useState(phase.isFull ? 1 : 0);

  const now      = new Date();
  const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monthTx  = transactions.filter(t=>t.date.startsWith(monthStr)&&t.type==='expense');
  const spent = {};
  for (const t of monthTx) spent[t.category]=(spent[t.category]||0)+t.amount;

  const eb = settings.earlyBudget;
  const lb = settings.laterBudget;

  const earlyRows = [
    { label:'Utilities & Fee',   limit:eb.utilitiesAndFee,  cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:eb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Roth IRA',          limit:eb.rothIRA,          cat:'savings',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:eb.hysa,             cat:'savings',   icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:eb.groceries,        cat:'groceries', icon:'cart',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Gas',               limit:eb.gas,              cat:'gas',       icon:'fuel',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Travel',            limit:eb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Dining',            limit:eb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Shopping',          limit:eb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
  ];
  const laterRows = [
    { label:'Rent & Fee',        limit:lb.rentAndFee,       cat:'housing',   icon:'home',    iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Utilities',         limit:lb.utilities,        cat:'utilities', icon:'zap',     iconBg:'rgba(245,166,35,.1)',  iconClr:'#F5A623'         },
    { label:'Renters Insurance', limit:lb.rentersInsurance, cat:'other',     icon:'shield',  iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Roth IRA',          limit:lb.rothIRA,          cat:'savings',   icon:'trendUp', iconBg:'var(--purple-lt)',     iconClr:'var(--purple)'   },
    { label:'HYSA',              limit:lb.hysa,             cat:'savings',   icon:'piggy',   iconBg:'var(--accent-lt)',     iconClr:'var(--accent)'   },
    { label:'Groceries',         limit:lb.groceries,        cat:'groceries', icon:'cart',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Gas',               limit:lb.gas,              cat:'gas',       icon:'fuel',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Travel',            limit:lb.funTravel,        cat:'travel',    icon:'plane',   iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Dining',            limit:lb.outToEat,         cat:'dining',    icon:'fork',    iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
    { label:'Shopping',          limit:lb.shopping,         cat:'shopping',  icon:'bag',     iconBg:'rgba(255,255,255,.05)',iconClr:'#666'            },
  ];

  const rows    = sel === 0 ? earlyRows : laterRows;
  const total   = rows.reduce((s,r)=>s+r.limit, 0);
  const surplus = settings.takeHome - total;

  const isEarlyActive = phase.isEarly || phase.isPreEmployment;
  const isLaterActive = phase.isFull;
  const currentlyActive = sel===0 ? isEarlyActive : isLaterActive;

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Budget</h2>
          <div className="page-sub">
            {sel===0 ? 'Rent-free · July – September 2026' : 'Paying rent · October 2026 onward'}
          </div>
        </div>
        {currentlyActive && <span className="badge badge-green">Active</span>}
      </div>

      {/* Phase toggle */}
      <div className="phase-pill-row">
        <button
          className={'phase-pill '+(sel===0?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(0)}
        >
          Months 1–3
          {isEarlyActive && sel!==0 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
        <button
          className={'phase-pill '+(sel===1?'phase-pill-on':'phase-pill-off')}
          onClick={()=>setSel(1)}
        >
          Months 4–12
          {isLaterActive && sel!==1 && <span style={{marginLeft:6,fontSize:'.65rem',opacity:.7}}>●</span>}
        </button>
      </div>

      {/* Budget rows */}
      <div className="card-flush">
        {rows.map(row => {
          const s   = spent[row.cat]||0;
          const rem = row.limit - s;
          const over = rem < 0;
          return (
            <div key={row.label} className="b-row">
              <div className="b-left">
                <div className="b-icon" style={{background:row.iconBg}}>
                  <Icon name={row.icon} size={16} color={row.iconClr} strokeWidth={1.7}/>
                </div>
                <div>
                  <div className="b-name">{row.label}</div>
                  {s > 0 && (
                    <div style={{fontSize:'.68rem',marginTop:2,color:over?'var(--red)':'var(--t3)',fontVariantNumeric:'tabular-nums'}}>
                      {currency(s)} spent · {over ? currency(Math.abs(rem))+' over' : currency(rem)+' left'}
                    </div>
                  )}
                </div>
              </div>
              <span className="b-amt">{currency(row.limit)}</span>
            </div>
          );
        })}

        {/* Total + surplus footer */}
        <div className="b-total-row">
          <div>
            <div className="b-total-lbl">Monthly Total</div>
            {surplus >= 0
              ? <div className="b-surplus">+{currency(surplus)} surplus</div>
              : <div style={{fontSize:'.78rem',color:'var(--red)',fontWeight:600}}>{currency(Math.abs(surplus))} over budget</div>
            }
          </div>
          <div className="large-num" style={{color:'var(--t1)'}}>{currency(total)}</div>
        </div>
      </div>

      {/* Quick info note */}
      <div style={{fontSize:'.72rem',color:'var(--t3)',textAlign:'center',marginTop:-8}}>
        {currency(settings.takeHome)} take-home · edit amounts in Settings
      </div>
    </div>
  );
}

// ── Spending ──────────────────────────────────────────────────────────
function Spending({ settings, transactions, setTransactions }) {
  const now   = new Date();
  const [viewMonth, setViewMonth] = useState({y:now.getFullYear(),m:now.getMonth()});
  const [showForm, setShowForm]   = useState(false);
  const [form, setForm]           = useState({
    date:now.toISOString().split('T')[0], description:'', amount:'', category:'groceries', type:'expense',
  });

  const monthStr  = `${viewMonth.y}-${String(viewMonth.m+1).padStart(2,'0')}`;
  const monthTx   = transactions.filter(t=>t.date.startsWith(monthStr));
  const expenses  = monthTx.filter(t=>t.type==='expense');
  const totalSpent= expenses.reduce((s,t)=>s+t.amount, 0);
  const phase     = getPhaseInfo(settings.startDate);
  const budget    = phase.isEarly ? settings.earlyBudget : settings.laterBudget;

  const byCategory = {};
  for (const t of expenses) byCategory[t.category]=(byCategory[t.category]||0)+t.amount;

  const catBudget = phase.isEarly || phase.isPreEmployment ? {
    housing:   budget.utilitiesAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilitiesAndFee||0,
    savings:   (budget.rothIRA||0)+(budget.hysa||0), other:0,
  } : {
    housing:   budget.rentAndFee||0,
    groceries: budget.groceries, gas:budget.gas, dining:budget.outToEat,
    shopping:  budget.shopping,  travel:budget.funTravel, utilities:budget.utilities||0,
    savings:   (budget.rothIRA||0)+(budget.hysa||0), other:0,
  };

  const totalBudget = Object.values(catBudget).reduce((s,v)=>s+v, 0);

  const handleAdd = e => {
    e.preventDefault();
    const amt = parseFloat(form.amount);
    if (!amt||isNaN(amt)) return;
    setTransactions(prev=>[{
      id:String(Date.now()), date:form.date,
      description:form.description.trim()||form.category,
      amount:amt, category:form.category, type:form.type,
    },...prev]);
    setForm(f=>({...f,description:'',amount:''}));
    setShowForm(false);
  };

  const del    = id => { if(window.confirm('Delete this transaction?')) setTransactions(p=>p.filter(t=>t.id!==id)); };
  const sorted = [...monthTx].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const monthLabel = new Date(viewMonth.y,viewMonth.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Categories that have either spending or a budget allocation
  const activeCats = CATEGORIES.filter(c=>byCategory[c.id]>0||catBudget[c.id]>0);

  return (
    <div className="page">

      {/* Hero header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>Spent This Month</div>
          <div className="mega" style={{color:totalSpent>totalBudget&&totalBudget>0?'var(--red)':'var(--t1)'}}>
            {currency(totalSpent)}
          </div>
          <div style={{fontSize:'.8rem',color:'var(--t3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
            {totalBudget>0 ? `of ${currency(totalBudget)} budget` : 'no budget yet'}
          </div>
        </div>
        <button className="add-btn" onClick={()=>setShowForm(s=>!s)}>
          {showForm
            ? <><Icon name="chevronLeft" size={14} color="#000" strokeWidth={2.5}/>Cancel</>
            : <><Icon name="plus"        size={14} color="#000" strokeWidth={2.5}/>Add</>
          }
        </button>
      </div>

      {/* Month nav */}
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})}>
          <Icon name="chevronLeft" size={14} color="var(--t2)"/>
        </button>
        <div className="month-name">{monthLabel}</div>
        <button className="month-arrow btn" onClick={()=>setViewMonth(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1})}>
          <Icon name="chevronRight" size={14} color="var(--t2)"/>
        </button>
      </div>

      {/* Add transaction form */}
      {showForm && (
        <div className="card" style={{borderColor:'rgba(0,200,5,.2)',background:'rgba(0,200,5,.03)'}}>
          <div className="card-label">New Transaction</div>
          <form onSubmit={handleAdd}>
            <div className="fgrid">
              <div className="fg"><label>Date</label>
                <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} required />
              </div>
              <div className="fg"><label>Type</label>
                <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
              <div className="fg fspan"><label>Description</label>
                <input type="text" placeholder="What was it?" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} />
              </div>
              <div className="fg"><label>Amount</label>
                <input type="number" step="0.01" min="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} required />
              </div>
              <div className="fg"><label>Category</label>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                  {CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
              <div className="factions">
                <button type="button" className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      )}

      {/* Category bars */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>By Category</div>
        <div className="card-flush">
          {activeCats.length === 0
            ? <p className="empty">No expenses logged yet.</p>
            : activeCats.map(cat => {
                const s   = byCategory[cat.id]||0;
                const lim = catBudget[cat.id]||0;
                const p_  = lim>0 ? Math.min((s/lim)*100,100) : 0;
                const cls = p_>=100?'over':p_>=80?'warn':'';
                return (
                  <div key={cat.id} className="sp-cat">
                    <div className="sp-top">
                      <span className="sp-name">{cat.label}</span>
                      <span className="sp-nums">
                        <span className="sp-spent">{currency(s)}</span>
                        {lim>0 && <span className="sp-bgt"> / {currency(lim)}</span>}
                      </span>
                    </div>
                    {lim>0 && <div className="bar"><div className={`bar-in ${cls}`} style={{width:`${p_||0}%`}}/></div>}
                  </div>
                );
              })
          }
        </div>
      </div>

      {/* Transaction list */}
      <div>
        <div className="eyebrow" style={{marginBottom:12}}>
          Transactions {sorted.length>0 && <span style={{color:'var(--t4)',marginLeft:6}}>({sorted.length})</span>}
        </div>
        <div className="card-flush">
          {sorted.length===0
            ? <p className="empty">No transactions this month.</p>
            : <div className="tx-list">
                {sorted.map(t=>{
                  const cat=CATEGORIES.find(c=>c.id===t.category);
                  return (
                    <div key={t.id} className="tx-row">
                      <div className="tx-icon">{cat?.abbr||'OTH'}</div>
                      <div className="tx-body">
                        <div className="tx-desc">{t.description}</div>
                        <div className="tx-meta">
                          {cat?.label} · {new Date(t.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
                        </div>
                      </div>
                      <div className="tx-amt" style={{color:t.type==='income'?'var(--green)':'var(--red)'}}>
                        {t.type==='income'?'+':'-'}{currency(t.amount)}
                      </div>
                      <button className="tx-del btn-icon-del" onClick={()=>del(t.id)}>×</button>
                    </div>
                  );
                })}
              </div>
          }
        </div>
      </div>

    </div>
  );
}

// ── Goals ─────────────────────────────────────────────────────────────
function Goals({ settings, goals, setGoals, commissions }) {
  const now   = new Date();
  const phase = getPhaseInfo(settings.startDate);

  // ── HYSA ──────────────────────────────────────────────────────────────
  const hysaBal    = goals.hysaBalance || 0;
  const hysaPct_   = settings.hysaGoal > 0 ? Math.min((hysaBal / settings.hysaGoal) * 100, 100) : 0;
  const hysaRem    = Math.max(settings.hysaGoal - hysaBal, 0);
  const hysaRate   = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget.hysa : settings.laterBudget.hysa;
  const hysaMonths = hysaRate > 0 && hysaRem > 0 ? Math.ceil(hysaRem / hysaRate) : 0;
  const hysaETA    = hysaMonths ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + hysaMonths);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── Roth IRA ──────────────────────────────────────────────────────────
  const yearStart  = new Date(now.getFullYear(), 0, 1);
  const finStart   = parseLocalDate(settings.startDate);
  const rothStart  = finStart > yearStart ? finStart : yearStart;
  const rothMonths = Math.max(
    (now.getFullYear()-rothStart.getFullYear())*12 + (now.getMonth()-rothStart.getMonth()), 0
  );
  const rothAuto  = Math.min(rothMonths * settings.earlyBudget.rothIRA, settings.rothIRAYearlyLimit);
  const rothBal   = goals.rothIRAOverride != null ? goals.rothIRAOverride : rothAuto;
  const rothPct_  = settings.rothIRAYearlyLimit > 0 ? Math.min((rothBal / settings.rothIRAYearlyLimit) * 100, 100) : 0;
  const rothRem   = Math.max(settings.rothIRAYearlyLimit - rothBal, 0);
  const rothMonthsLeft = settings.earlyBudget.rothIRA > 0 && rothRem > 0
    ? Math.ceil(rothRem / settings.earlyBudget.rothIRA) : 0;
  const rothETA   = rothMonthsLeft ? (() => {
    const d = new Date(now); d.setMonth(d.getMonth() + rothMonthsLeft);
    return d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  })() : null;

  // ── 401(k) ────────────────────────────────────────────────────────────
  const k401Bal  = goals.ira401kBalance || 0;
  const k401Pct_ = settings.ira401kYearlyMax > 0 ? Math.min((k401Bal / settings.ira401kYearlyMax) * 100, 100) : 0;
  const k401Rem  = Math.max(settings.ira401kYearlyMax - k401Bal, 0);

  // ── Savings rate ──────────────────────────────────────────────────────
  // Only HYSA + Roth IRA count — 401k is pre-tax and deducted before take-home
  const activeBudget   = phase.isEarly || phase.isPreEmployment ? settings.earlyBudget : settings.laterBudget;
  const monthlyContrib = (activeBudget.hysa||0) + (activeBudget.rothIRA||0);
  const savingsRate    = settings.takeHome > 0 ? (monthlyContrib / settings.takeHome) * 100 : 0;
  const totalComm      = commissions.reduce((s,c) => s+c.amount, 0);

  // ── Form state ────────────────────────────────────────────────────────
  const [hysaIn, setHysaIn] = useState('');
  const [k401In, setK401In] = useState('');
  const [rothIn, setRothIn] = useState('');

  const updHYSA = e => { e.preventDefault(); const v=parseFloat(hysaIn); if(!isNaN(v)) setGoals(g=>({...g,hysaBalance:v})); setHysaIn(''); };
  const upd401k = e => { e.preventDefault(); const v=parseFloat(k401In); if(!isNaN(v)) setGoals(g=>({...g,ira401kBalance:v})); setK401In(''); };
  const updRoth = e => { e.preventDefault(); const v=parseFloat(rothIn); setGoals(g=>({...g,rothIRAOverride:isNaN(v)?null:v})); setRothIn(''); };

  return (
    <div className="page">

      {/* Hero — savings rate */}
      <div>
        <div className="eyebrow" style={{marginBottom:8}}>Savings Rate</div>
        <div className="mega" style={{color:'var(--accent)'}}>{pct(savingsRate, 0)}</div>
        <div style={{fontSize:'.85rem',color:'var(--t3)',marginTop:10,fontVariantNumeric:'tabular-nums'}}>
          {currency(monthlyContrib)}/mo
          {phase.isEarly && <span style={{color:'var(--t4)'}}> · drops to {pct((((settings.laterBudget.hysa||0)+(settings.laterBudget.rothIRA||0))/settings.takeHome)*100,0)} in Month 4</span>}
        </div>
      </div>

      {/* Commission earned pill */}
      {totalComm > 0 && (
        <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'var(--accent-lt)',border:'1px solid rgba(0,200,5,.2)',borderRadius:'var(--r-s)',padding:'8px 14px'}}>
          <Icon name="dollar" size={14} color="var(--accent)" strokeWidth={2}/>
          <span style={{fontSize:'.78rem',fontWeight:600,color:'var(--accent)'}}>{currency(totalComm)} commission earned</span>
        </div>
      )}

      <div className="eyebrow" style={{marginBottom:4}}>Active Goals</div>

      {/* ── HYSA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Emergency Fund</div>
            <div className="gc-sub">HYSA · {hysaRate > 800 ? 'Accelerated' : 'Standard'} · {currency(hysaRate)}/mo</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--accent)'}}>{pct(hysaPct_, 0)}</div>
            <div className="gc-of">{currency(hysaBal)} of {currency(settings.hysaGoal)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${hysaPct_}%`, background:'linear-gradient(90deg,#00C805,#00ff08)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(hysaRem)} remaining</span>
          <span className="gc-date">
            {hysaBal >= settings.hysaGoal ? '🎉 Goal reached!'
              : hysaETA ? `${hysaETA} · ${hysaMonths}mo` : '—'}
          </span>
        </div>
        <form onSubmit={updHYSA} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(hysaBal)})`}
            value={hysaIn} onChange={e=>setHysaIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      {/* ── Roth IRA Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">Roth IRA</div>
            <div className="gc-sub">{now.getFullYear()} limit · resets Jan 1</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--purple)'}}>{pct(rothPct_, 0)}</div>
            <div className="gc-of">{currency(rothBal)} of {currency(settings.rothIRAYearlyLimit)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${rothPct_}%`, background:'linear-gradient(90deg,#7B74FF,#9C94FF)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">
            {goals.rothIRAOverride != null
              ? <button className="btn-link" style={{fontSize:'.72rem'}} onClick={()=>setGoals(g=>({...g,rothIRAOverride:null}))}>reset to auto-track</button>
              : `${currency(settings.earlyBudget.rothIRA)}/mo · auto`
            }
          </span>
          <span className="gc-date">
            {rothBal >= settings.rothIRAYearlyLimit ? '🎉 Maxed out!'
              : rothETA ? `${rothETA} · ${rothMonthsLeft}mo` : '—'}
          </span>
        </div>
        <form onSubmit={updRoth} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder="Override balance (blank = auto)"
            value={rothIn} onChange={e=>setRothIn(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Override</button>
        </form>
      </div>

      {/* ── 401(k) Card ── */}
      <div className="gc">
        <div className="gc-head">
          <div>
            <div className="gc-name">401(k)</div>
            <div className="gc-sub">Pre-tax · IRS max {now.getFullYear()}: {currency(settings.ira401kYearlyMax)}</div>
          </div>
          <div>
            <div className="gc-pct" style={{color:'var(--yellow)'}}>
              {pct(k401Pct_, 0)}
            </div>
            <div className="gc-of">{currency(k401Bal)} of {currency(settings.ira401kYearlyMax)}</div>
          </div>
        </div>
        <div className="gc-bar">
          <div className="gc-fill" style={{width:`${k401Pct_}%`, background:'linear-gradient(90deg,#F5A623,#FFD27A)'}}/>
        </div>
        <div className="gc-foot">
          <span className="gc-rate">{currency(settings.contribution401k)}/mo pre-tax</span>
          <span className="gc-date">
            {k401Bal > 0 ? `${currency(k401Rem)} to IRS max` : 'Capturing employer match'}
          </span>
        </div>
        <form onSubmit={upd401k} className="goal-update" style={{marginTop:14}}>
          <input type="number" step="0.01" min="0"
            placeholder={`Balance (${currency(k401Bal)})`}
            value={k401In} onChange={e=>setK401In(e.target.value)} />
          <button type="submit" className="btn btn-primary btn-sm">Update</button>
        </form>
      </div>

      <div style={{fontSize:'.68rem',color:'var(--t4)',textAlign:'center'}}>
        HYSA &amp; Roth IRA balances sync with Net Worth page
      </div>

    </div>
  );
}

// ── Commission ─────────────────────────────────────────────────────────
function Commission({ settings, commissions, setCommissions }) {
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({date:new Date().toISOString().split('T')[0],amount:'',note:''});
  const hysaPct=settings.commissionHYSAPct/100;
  const personalPct=settings.commissionPersonalPct/100;
  const preview=form.amount&&!isNaN(parseFloat(form.amount))?{hysa:parseFloat(form.amount)*hysaPct,personal:parseFloat(form.amount)*personalPct}:null;

  const handleAdd=e=>{
    e.preventDefault();const amt=parseFloat(form.amount);
    setCommissions(prev=>[{id:String(Date.now()),date:form.date,amount:amt,note:form.note.trim(),hysaPortion:+(amt*hysaPct).toFixed(2),personalPortion:+(amt*personalPct).toFixed(2)},...prev]);
    setForm(f=>({...f,amount:'',note:''}));setShowForm(false);
  };
  const del=id=>{if(window.confirm('Delete this commission?'))setCommissions(p=>p.filter(c=>c.id!==id));};
  const sorted=[...commissions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=commissions.reduce((s,c)=>s+c.amount,0);
  const totHYSA=commissions.reduce((s,c)=>s+c.hysaPortion,0);
  const totPers=commissions.reduce((s,c)=>s+c.personalPortion,0);

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Commission</h2>
          <div className="page-sub">Log and split your commissions</div>
        </div>
        <button className="btn btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'Cancel':'+ Log'}</button>
      </div>

      <div className="split-banner">
        <div className="split-pill split-hysa">{settings.commissionHYSAPct}% HYSA</div>
        <div className="split-div">+</div>
        <div className="split-pill split-personal">{settings.commissionPersonalPct}% Personal</div>
        <div style={{marginLeft:'auto',fontSize:'.68rem',color:'var(--t3)'}}>Auto-split on every payment</div>
      </div>

      <div className="g3">
        <div className="stat">
          <div className="stat-label">Total Earned</div>
          <div className="stat-val">{currency(total)}</div>
          <div className="stat-sub">{commissions.length} payments</div>
        </div>
        <div className="stat stat-green">
          <div className="stat-label">To HYSA</div>
          <div className="stat-val">{currency(totHYSA)}</div>
          <div className="stat-sub">{settings.commissionHYSAPct}%</div>
        </div>
        <div className="stat stat-blue">
          <div className="stat-label">Personal</div>
          <div className="stat-val">{currency(totPers)}</div>
          <div className="stat-sub">{settings.commissionPersonalPct}%</div>
        </div>
      </div>

      {showForm&&(
        <div className="card form-card">
          <div className="card-label">New Payment</div>
          <form onSubmit={handleAdd}>
            <div className="fgrid">
              <div className="fg"><label>Date</label><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} required /></div>
              <div className="fg"><label>Gross Amount</label><input type="number" step="0.01" min="0.01" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} required /></div>
              <div className="fg fspan"><label>Note</label><input type="text" placeholder="Deal name, pay period…" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} /></div>
              {preview&&(
                <div className="fspan" style={{display:'flex',gap:8}}>
                  <span className="badge badge-green">HYSA +{currency(preview.hysa,2)}</span>
                  <span className="badge badge-blue">Personal +{currency(preview.personal,2)}</span>
                </div>
              )}
              <div className="factions">
                <button type="button" className="btn btn-ghost" onClick={()=>setShowForm(false)}>Cancel</button>
                <button type="submit" className="btn btn-primary">Save</button>
              </div>
            </div>
          </form>
        </div>
      )}

      <div>
        <div className="slabel">History ({commissions.length})</div>
        <div className="card" style={{padding:'4px 24px 8px'}}>
          {sorted.length===0?<p className="empty">No commissions logged yet.</p>:sorted.map(c=>(
            <div key={c.id} className="comm-row">
              <div style={{flex:1}}>
                <div className="comm-amt">{currency(c.amount,2)}</div>
                {c.note?<div className="comm-note">{c.note}</div>:<div className="comm-note" style={{color:'var(--t4)'}}>No note</div>}
                <div className="comm-date">{new Date(c.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
              </div>
              <div className="comm-splits">
                <span className="comm-s comm-s-green">+{currency(c.hysaPortion,2)} HYSA</span>
                <span className="comm-s comm-s-blue">+{currency(c.personalPortion,2)} Personal</span>
              </div>
              <button className="btn-icon btn-icon-del" onClick={()=>del(c.id)}>×</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Settings ───────────────────────────────────────────────────────────

// Isolated input: holds its own string state so typing never re-renders
// the parent Settings component (stops mobile keyboard from dismissing).
function SettingsInput({ value, onCommit, type='number', prefix, extraStyle }) {
  const [str, setStr] = useState(String(value ?? ''));
  // Sync if parent resets (e.g. Reset button)
  useEffect(() => { setStr(String(value ?? '')); }, [value]);
  const commit = () => onCommit(str);
  return (
    <div style={{position:'relative'}}>
      {prefix && (
        <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',
          color:'var(--t3)',fontSize:'.78rem',pointerEvents:'none'}}>{prefix}</span>
      )}
      <input
        type={type==='number' ? 'text' : type}
        inputMode={type==='number' ? 'decimal' : undefined}
        value={str}
        style={{...(prefix ? {paddingLeft:22} : {}), ...extraStyle}}
        onChange={e => setStr(e.target.value)}
        onBlur={commit}
        onKeyDown={e => e.key==='Enter' && e.target.blur()}
      />
    </div>
  );
}

function Settings({ settings, setSettings }) {
  const [local,setLocal]=useState(settings);
  const [saved,setSaved]=useState(false);
  useEffect(()=>{setLocal(settings);},[settings]);

  const set   =(k,v)=>setLocal(s=>({...s,[k]:typeof v==='string'?parseFloat(v)||0:v}));
  const setStr=(k,v)=>setLocal(s=>({...s,[k]:v}));
  const setBud=(p,k,v)=>setLocal(s=>({...s,[p]:{...s[p],[k]:parseFloat(v)||0}}));

  const handleSave=e=>{e.preventDefault();setSettings(local);setSaved(true);setTimeout(()=>setSaved(false),2500);};
  const handleReset=()=>{if(window.confirm('Reset all settings to defaults?'))setLocal(DEFAULT_SETTINGS);};

  const eb=local.earlyBudget||{};
  const lb=local.laterBudget||{};
  const earlyTotal=(eb.utilitiesAndFee||0)+(eb.rentersInsurance||0)+(eb.rothIRA||0)+(eb.hysa||0)+(eb.groceries||0)+(eb.gas||0)+(eb.funTravel||0)+(eb.outToEat||0)+(eb.shopping||0);
  const laterTotal=(lb.rentAndFee||0)+(lb.utilities||0)+(lb.rentersInsurance||0)+(lb.rothIRA||0)+(lb.hysa||0)+(lb.groceries||0)+(lb.gas||0)+(lb.funTravel||0)+(lb.outToEat||0)+(lb.shopping||0);
  const earlyRem=(local.takeHome||0)-earlyTotal;
  const laterRem=(local.takeHome||0)-laterTotal;

  const F=({label,sk,phase,val,type='number',prefix='$'})=>(
    <div className="settings-group">
      <label>{label}</label>
      <SettingsInput
        value={val}
        type={type}
        prefix={prefix}
        onCommit={v=>phase?setBud(phase,sk,v):type==='date'?setStr(sk,v):set(sk,v)}
      />
    </div>
  );

  return (
    <div className="page">
      <div className="page-top">
        <div>
          <h2 className="page-title">Settings</h2>
          <div className="page-sub">Income, budgets, and limits</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {saved&&<span className="badge badge-green">Saved</span>}
          <button type="button" className="btn btn-ghost" onClick={handleReset}>Reset</button>
        </div>
      </div>

      <form onSubmit={handleSave} style={{display:'flex',flexDirection:'column',gap:14}}>
        <div className="card">
          <div className="card-label">Income & Taxes</div>
          <div className="settings-grid">
            <F label="Base Monthly" sk="grossBase" val={local.grossBase} />
            <F label="OTE Monthly" sk="grossOTE" val={local.grossOTE} />
            <F label="Tax + FICA / mo" sk="federalTax" val={local.federalTax} />
            <F label="401(k) Pre-Tax / mo" sk="contribution401k" val={local.contribution401k} />
            <F label="Monthly Take-Home (Base)" sk="takeHome" val={local.takeHome} />
            <F label="Start Date" sk="startDate" val={local.startDate} type="date" prefix="" />
          </div>
        </div>

        <div className="card">
          <div className="card-label">Commission Split</div>
          <div className="settings-grid">
            <F label="HYSA %" sk="commissionHYSAPct" val={local.commissionHYSAPct} prefix="%" />
            <F label="Personal %" sk="commissionPersonalPct" val={local.commissionPersonalPct} prefix="%" />
          </div>
        </div>

        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <div className="card-label" style={{margin:0}}>Months 1–3 (Rent-Free)</div>
            <span className={'settings-remaining '+(earlyRem>=0?'rem-ok':'rem-over')}>{currency(earlyRem)} {earlyRem>=0?'remaining':'over'}</span>
          </div>
          <div className="settings-grid">
            <F label="Utilities & Fee" sk="utilitiesAndFee" phase="earlyBudget" val={eb.utilitiesAndFee} />
            <F label="Renters Insurance" sk="rentersInsurance" phase="earlyBudget" val={eb.rentersInsurance} />

            <F label="Roth IRA" sk="rothIRA" phase="laterBudget" val={lb.rothIRA} />

        <button type="submit" className="btn btn-primary btn-full">Save Settings</button>

  );
}
